# Dependabot: 依存関係の自動更新（セキュリティ修正を含む）。
# github-actions は技術非依存のため常時有効。使用言語のエコシステムを有効化する。

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # NFR, IADR-0625: 外部の uses: は SHA ＋同じ行の `# vX.Y.Z` で固定している。Dependabot は SHA と注記を対で更新する。
    # CodeQL は同じ workflow 内の codeql-action（init / autobuild / analyze）が同じ版であることを要求するため、1 本の PR にまとめる。
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # NFR, IADR-0609, #1526: Worker 共有イメージ（backend/Dockerfile）の基底イメージは digest で固定している。
  # digest の更新（基底のセキュリティ修正の取り込み）を提案させる。既定は自動マージしない（人手レビュー必須）。
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # NFR, IADR-0625: 使用スタックのエコシステムを有効化する（依存の更新とセキュリティ修正の取り込み）。
  # - nuget: ルートの Directory.Packages.props（Central Package Management）を単一情報源として更新する。
  # - npm:   frontend/（package-lock.json）を更新する。scripts/ と .claude/hooks/ の package.json は依存を持たない。
  # 既定は自動マージしない（人手レビュー必須）。同時に開く PR は各 5 本まで。
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
