blank_issues_enabled: false
contact_links:
  - name: 計画・仕様に関する相談
    url: https://github.com/endazon/project-planning
    about: 要求・ユースケース・ADR など上流工程の内容は計画リポジトリで議論する。
  - name: 実装からの環流（計画書の誤り・不足・新たな制約）
