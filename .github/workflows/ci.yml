# CI（検証ゲート）雛形 — 技術非依存の骨格
#
# このファイルは「例示」であり、そのままでは有効化されない（拡張子が .example.yml のため）。
# 自プロジェクトのスタックに合わせて各ステップを書き換え、ci.yml にリネームして使うこと。
# build / test / coverage / lint ステップは C#/.NET を例示している。
#
# ── スタック別 --allowedTools（claude-coding.example.yml の claude_args 末尾を書き換える） ──
# このファイルの build/test ステップを変更したら、claude-coding.example.yml の claude_args 末尾
# 4 行（スタック別ツール）を使用スタックに合わせて書き換えること。
# .claude/settings.json の permissions.allow にも同じコマンドを追記すること。
#
# スタック別の対応コマンド例:
#   C#/.NET : Bash(dotnet build:*), Bash(dotnet test:*), Bash(dotnet format:*), Bash(dotnet restore:*)
#   Node.js : Bash(npm run:*), Bash(npm ci:*), Bash(npx:*)
#   Python  : Bash(pytest:*), Bash(pip install:*), Bash(ruff:*)
#   Go      : Bash(go build:*), Bash(go test:*), Bash(go vet:*)
#   Java    : Bash(mvn:*) または Bash(gradle:*)
# ─────────────────────────────────────────────────────────────────────────────────
#
# 推奨運用（README「全自動化のための推奨ツール・運用」も参照）:
#   - main へのマージ前に lint → build → test → coverage を必須ステータスチェックにする
#   - ブランチ保護で「マージ前に必須チェックの成功」と「レビュー承認」を要求する
#   これにより AI が作成した PR も、人手の検証なしに最低限の品質を機械で担保できる。

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # コミットメッセージ規約（種別(起点ID): 要約）の機械チェック（再発防止）と、
  # scripts/ の単体テスト（commit-allowlist の実在性・整合を含む）を実行する。
  # PR で追加されるコミット（base..HEAD）のみ検査し、bot・マージ・[skip ci] は除外する。
  # fetch-depth: 0 は base..HEAD の範囲解決と、allowlist の SHA 到達可能性検証（幻 SHA 検出）に必須。
  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check commit messages
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commit-messages.js
      # commit-allowlist.json のエントリが現行履歴に実在・到達可能・非準拠であることを検証する
      # 回帰テストを含む（幻 SHA 再発防止・Issue #47）。fetch-depth: 0 によりフル履歴で判定される。
      - name: Run scripts unit tests
        run: node scripts/scripts.test.js

  # スタック非依存: docs/ 配下 Markdown の相対リンク切れを検査（Issue #59 再発防止）。
  # scripts/check-doc-links.js は Node 標準モジュールのみで動作し、依存インストール不要。
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check doc links
        run: node scripts/check-doc-links.js

  # 実行環境スキャフォールド（docker-compose / appsettings / .env.example）の静的検査（issue #107 / IADR-0048）。
  # fail-safe 既定（base appsettings が挙動中立・機密は空既定）と構成の存在・整合を Docker 起動なしで検証する。
  # 実コンテナ/実 API 疎通は #82 に分離するため、本ジョブは Node 標準のみ（依存・Docker 不要）で完結する。
  runtime-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate runtime scaffold
        run: node scripts/validate-runtime-scaffold.js

  # 宣言的パイプライン構成の検証器（scripts/validate-pipeline-config.js）の自己試験に加え、
  # 取引パイプラインの実宣言（deploy/helm/ai-stock-trading/files/pipeline.json）を検証する
  # （ADR-0001, IADR-0077, #22）。宣言が接続性/循環/構造違反へ退行した時点で CI が止める。
  pipeline-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate pipeline config (self-test)
        run: node scripts/validate-pipeline-config.js --self-test
      - name: Validate trading pipeline config (real file)
        run: node scripts/validate-pipeline-config.js deploy/helm/ai-stock-trading/files/pipeline.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Format check
        run: dotnet format backend/backend.slnx --verify-no-changes

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/backend.slnx
      - name: Build
        run: dotnet build backend/backend.slnx --no-restore --configuration Release
      # 実基盤 E2E（Category=Integration・Docker 依存）は既定 CI から除外し、専用 integration.yml
      # （nightly/dispatch）で実走する（issue #82 / IADR-0049）。既定 CI の安定性・速度を損なわない。
      - name: Test (with coverage)
        run: dotnet test backend/backend.slnx --no-build --configuration Release --filter "Category!=Integration" --collect:"XPlat Code Coverage" --verbosity normal
      # カバレッジ閾値を強制する場合の例（ツールは任意）:
      #   - run: dotnet tool install --global dotnet-reportgenerator-globaltool
      #   - run: reportgenerator -reports:'**/coverage.cobertura.xml' -targetdir:coverage -reporttypes:TextSummary
      #   - run: cat coverage/Summary.txt

      # 参考: 他スタックの例
      # Node.js:
      #   - uses: actions/setup-node@v7
      #     with: { node-version: "20" }
      #   - run: npm ci
      #   - run: npm run lint --if-present
      #   - run: npm run build --if-present
      #   - run: npm test -- --coverage
      # Python:
      #   - uses: actions/setup-python@v5
      #     with: { python-version: "3.12" }
      #   - run: pip install -e .[test]
      #   - run: ruff check .
      #   - run: pytest --cov

  # フロントエンド（frontend/）の型検査・lint・単体/コンポーネントテスト（issue #106 / FR-13,FR-17,UC-06 / IADR-0080）。
  # 単独リポでは @foundation をテスト/型検査用スタブへ解決し、platform 非依存で自己完結する（合成時は platform の
  # src/vitest.config.ts が実 foundation へ解決して同じテストを走らせる）。実ブラウザ E2E（Playwright）・実 BFF/Keycloak
  # 疎通は実基盤依存として後続スライスへ分離するため、本ジョブは Node のみ（Docker 不要）で完結する。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  # フロント3画面（SC-01/02/03）の Playwright E2E（issue #187 / IADR-0087）。実ブラウザ（chromium）で UI フロー
  # （表示・保存の 200/400/409 出し分け・権限外の存在秘匿・縮退）を検証する。BFF 応答はモック（page.route）で、
  # 実 BFF/Keycloak/クラスタ疎通には依存させない（実基盤 live 検証は #82 系／MSP #284 へ分離）。Docker 不要・frontend/ に閉じる。
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npm run e2e:install
      - name: E2E typecheck
        run: npm run e2e:typecheck
      - name: E2E (Playwright)
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
