# CI（検証ゲート）— impl-handoff-kit の ci.example.yml を本リポジトリのスタック（C#/.NET）へ適用したもの。
#
# 技術非依存のジョブ（commit-messages / scripts-tests / doc-links / pipeline-config / ai-workflow-config）は
# キットの雛形と同型に保つ。スタック依存のジョブ（lint / build-and-test）と本リポジトリ固有の
# ジョブ（shell-scripts / runtime-scaffold / consumer-endpoint-names / frontend / frontend-e2e）は
# 本リポジトリ側で維持する。
#
# ── スタック別 --allowedTools（claude-coding / claude-code-review の claude_args を書き換える） ──
# このファイルの build/test ステップを変更したら、claude-coding.example.yml と
# claude-code-review.example.yml の claude_args（スタック別ツール）を使用スタックに合わせて
# 書き換えること。**両方**を同じ内容に保つ（レビュー側から実行系を落とすと、AI レビューは
# 検証できず静的読解へ退行し、毎回「Bash が承認待ちでブロックされた」と報告するだけになる）。
# .claude/settings.json の permissions.allow にも同じコマンドを追記すること（3 系統を揃える）。
# 記法誤りと複製漏れ（レビュー側に一部/全部の実行ツールが無い）は ai-workflow-config ジョブが
# 機械検出する。比較対象はスタック別の実行ツール（dotnet / node・npm / python・pytest / go /
# mvn・gradle）であり、setup-* を書いていないもの（node のようにランナー既定で入るランタイム）も
# 含む。設計上の差（Edit / Write / 書き込み系 git がレビュー側に無いこと）は対象外である。
#
# 注: claude_args の --allowedTools は「二重引用符でくくった 1 引数・カンマ区切り」で書く。
# 1 ツール 1 行に戻すと空白で割れて全指定が無効になる（各ワークフローの記法コメントを参照）。
#
# スタック別の対応コマンド例:
#   C#/.NET : Bash(dotnet build:*), Bash(dotnet test:*), Bash(dotnet format:*), Bash(dotnet restore:*)
#   Node.js : Bash(npm run:*), Bash(npm ci:*), Bash(npx:*)
#   Python  : Bash(pytest:*), Bash(pip install:*), Bash(ruff:*)
#   Go      : Bash(go build:*), Bash(go test:*), Bash(go vet:*)
#   Java    : Bash(mvn:*) または Bash(gradle:*)
# ─────────────────────────────────────────────────────────────────────────────────
#
# 推奨運用（README「全自動化のための推奨ツール・運用」も参照）:
#   - main へのマージ前に lint → build → test → coverage を必須ステータスチェックにする
#   - ブランチ保護で「マージ前に必須チェックの成功」と「レビュー承認」を要求する
#   これにより AI が作成した PR も、人手の検証なしに最低限の品質を機械で担保できる。

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # コミットメッセージ規約（種別(起点ID): 要約）の機械チェック（再発防止）。
  # PR で追加されるコミット（base..HEAD）のみ検査し、bot・マージ・[skip ci] は除外する。
  # fetch-depth: 0 は base..HEAD の範囲解決に必須。
  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check commit messages
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commit-messages.js

  # スタック非依存: scripts/ 配下の単体テスト（外部依存ゼロ・Node 標準 assert のみ）。
  #
  # 個別の検証器（validate-pipeline-config / check-ai-workflow-config）は下のジョブで
  # --self-test を走らせるが、それらは検証器**単体**の試験である。scripts.test.js は
  # 横断的なテストであり、両者は重複しない。
  # 【重要】このジョブが無いと、scripts.test.js は「誰かが手で叩いたときだけ走るテスト」になる。
  # 実際に、CHANGELOG 生成が全面的に壊れる回帰が、PR の CI をすべて green のまま通り抜けた
  # ことがある（changelog.yml は push でしか起動しないため、壊れるのはマージ後）。
  # fetch-depth: 0 は allowlist の到達可能性検査と gen-changelog の実行に必要
  # （浅いクローンでは当該テストが best-effort で skip されるため、検査が実効しない）。
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run scripts unit tests
        # 本リポジトリは固有テスト（scripts/scripts.repo.test.js）を持つため有効化する。
        # companion が消失（誤削除・リネーム・キット同期での上書き）したときに失敗する。
        # 未設定だとテスト件数が静かに減るだけで CI は green のままになる。
        env:
          REQUIRE_REPO_TESTS: "1"
        run: node scripts/scripts.test.js

  # #263, IADR-0109: ローカルデプロイスクリプトの ast-secrets 同期（投入済みの鍵を無言で壊さない）を
  # kubectl スタブで検証する。実クラスタ・実 kubectl・追加パッケージは不要（Bash のみ）。
  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test k8s-local-deploy.sh (ast-secrets sync)
        run: bash scripts/k8s-local-deploy.test.sh
      # #274, IADR-0060 決定3: OpenD entrypoint の RSA 鍵検査（k8s Secret の symlink 越しに実体の
      # パーミッションを見る）を固定する。symlink と chmod が要るため ubuntu-latest で実行する。
      - name: Test opend entrypoint.sh (RSA key permission check)
        run: bash deploy/opend/entrypoint.test.sh

  # スタック非依存: docs/ ・ .ai-context/ 配下 Markdown の相対リンク切れを検査（再発防止）。
  # scripts/check-doc-links.js は Node 標準モジュールのみで動作し、依存インストール不要。
  # NFR / #493 / #496: 相対リンクの実在検査。
  #
  # 資料再編（ADR-0029 決定 2）で本リポジトリは planning への依存を持たない。かつて
  # ここにあった「PR 段階で planning submodule を populate して当該配下も検査する」分岐
  # （submodule 取得・取得用トークンの受け渡し・--require-planning）は、planning
  # 自体が撤去されたため削除した。
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test doc link checker
        run: node scripts/check-doc-links.js --self-test
      - name: Check doc links
        run: node scripts/check-doc-links.js

  # 受け入れ基準 → テスト写像のトレーサビリティ検査（issue #343 / IADR-0127）。
  # 必須範囲 FR（網羅裁定 #211: FR-10/12/15/19/20）にテストと必須仕様書が存在することを機械的に強制する。
  #
  # 資料再編（ADR-0029 決定 2）で本リポジトリは planning への依存を持たない。テストが参照する
  # FR/UC/SC が計画書へ実在するかの突合（旧 --require-planning。取得用トークンの受け渡しも含む）は、
  # 突合先の planning submodule 自体が撤去されたため恒久的に skip へ倒れる（`planIds()` が
  # null を返す。notice で可視化される）。**本ジョブ自体は存続する** —— 必須 FR のテスト・仕様書の
  # 存在チェック（本検査の主眼）は元から planning 非依存であり、引き続き実効する。
  test-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check test traceability
        run: node scripts/check-test-traceability.js

  # trace ブロック検査（project-planning ADR-0029 決定4「trace ブロック規約」の検査の実現手段。
  # 同決定の後続 PR で新設）。docs/**/*.md（.ai-context/ は対象外・凍結記録のため）に置く
  # `<!-- trace: -->` / `<!-- trace-table: -->` の文法・許可キー・値域（FR/UC/SC は
  # `.claude/rules/traceability.repo.md` 宣言レンジ、計画 ADR は同宣言のレンジ、IADR は
  # `.ai-context/adr/` のファイル実在）を検査し、可視本文に計画 ID・IADR・修飾付き issue 参照が
  # 残っていないかも見る。他プロジェクト／他リポジトリの修飾子（`MSP:` 等）は個別名をハードコードせず
  # 「英字+英数字の短縮名 + `:`」という形だけで external とみなす（利用者裁定・ADR-0029 決定9。
  # 実装リポジトリが今後増える前提）。
  trace-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test trace block checker
        run: node scripts/check-trace-blocks.js --self-test
      - name: Check trace blocks
        run: node scripts/check-trace-blocks.js

  # ナレッジグラフ生成（docs/ の trace / trace-table ブロックと .ai-context/{adr,specs}/ の
  # frontmatter〔related_ids / related_specs / plan_refs〕から組み立てる）。生成物はコミットしない
  # （都度標準出力へ書く。--json / --mermaid は成果物確認用、CI では --check のみを走らせる）。
  # --check は in-repo 実在検査（計画 ID・計画 ADR はレンジ、IADR はファイル実在）。修飾付き参照
  # （`planning:` / `MSP:` 等。個別名はハードコードしない）は external として数のみ数え、
  # specs / related_specs の基準名が解決できないものは計画リポジトリ側の文書等を指し得るため
  # 失敗とはしない（標準出力に注記する）。
  knowledge-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test knowledge graph generator
        run: node scripts/gen-knowledge-graph.js --self-test
      - name: Check knowledge graph (in-repo existence)
        run: node scripts/gen-knowledge-graph.js --check

  # 不採用ライブラリ（platform ADR-0030 の棚卸し）の再混入を止める（issue #345 / #351）。
  # 剥がした事実をレビューの記憶に頼ると必ず戻るため、機械的に落とす。移行未完了のものは
  # スクリプトの PENDING に担当 issue 付きで残し、移行完了時に BANNED へ移す。
  banned-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check banned libraries
        run: node scripts/check-banned-libraries.js

  # FR-19, #425, ADR-0025, IADR-0165: 決済済み資金（settled cash）の代替に使ってはならないブローカー値
  # （MaxTrdQtys.MaxCashBuy / Funds.AvlWithdrawalCash / Funds.MaxWithdrawal）のコード参照を止める。
  # とりわけ**現金買付余力は現金口座では未決済の売却代金を含む**のが通例であり、
  # **分母に据えると GFV 回避ガードが GFV を許可する**。コメントでの注意書きだけでは足りず、
  # 「決済済み資金の供給元」を探した実装者の手が最も近い名前へ伸びる経路を機械的に塞ぐ。
  banned-settled-cash-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check banned settled-cash sources
        run: node scripts/check-banned-settled-cash-sources.js

  # NFR / #357 / IADR-0168: Wolverine のテストハーネスの**素の入口** `host.TrackActivity()` を止める。
  # 素の入口は**既定 5 秒の壁時計**で打ち切るため、ソリューション全体の並列実行では
  # スケジューリング遅延だけで超え、flaky failure になる（実測 6 秒・#357）。
  # 131 か所を予算つきの入口へ替えても、**次に書かれるテストは標準 API を素直に呼ぶ**。
  # flake は CI ゲートを構造的に無効化する（確率的な赤が「再実行すればよい」を習慣化し、
  # 本物の退行も同じ反応で流される）ため、コメントではなく機械で止める。
  tracked-session-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check tracked session timeout
        run: node scripts/check-tracked-session-timeout.js

  # NFR / #497: 実装ADR の本文を変更したら .ai-context/adr/README.md の索引行も変更されていること。
  #
  # 同型の事故が連続する 2 PR で 2 回起きた（#491 は自己試験の件数、#495 は解消済みの残余リスク）。
  # いずれも AI レビューが検出し、**CI は緑のまま通した**。運用標準「検査器の追加は同型事故 2 回から」。
  #
  # fetch-depth: 0 が要る —— 差分の範囲（origin/<base>..HEAD）を解決するため。
  # 浅いクローンでは範囲を決められず skip する（その旨を warn で出す）。
  adr-index-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test ADR index sync checker
        run: node scripts/check-adr-index-sync.js --self-test
      - name: Check ADR index sync
        run: node scripts/check-adr-index-sync.js

  # NFR / #524 / IADR-0204 の残余リスクの解消: 必読規約の総量予算をエージェントごとに検査する。
  #
  # 予算値 51,200 の正本は計画リポ運用ガイド §8（planning#364）であり、検査器が持つのは複製である
  # （値の隣に出典を書いてある）。母集合は「そのエージェントが自動で読み込む集合」であり、
  # Claude Code（CLAUDE.md ＋ .claude/rules/*.md）と AGENTS.md 系は**合算しない**（合算は誰も
  # 背負わない量を作る。実測で 2 回誤った）。submodule は要らない（母集合に planning/ は入らない）。
  #
  # 超過で fail・90% で warn。**#519 で配線を後回しにした残余リスク**（「検査器はあるが CI に居ない」）
  # を本ジョブで塞ぐ —— 手で叩いたときだけ走る検査器は、予算を守らせない。
  reading-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test reading budget checker
        run: node scripts/check-reading-budget.js --self-test
      - name: Check reading budget (per agent, not summed)
        run: node scripts/check-reading-budget.js

  # NFR / #477 / IADR-0189: 他プロジェクトの計画 ID が `<PROJ>/<ID>` の形で書かれていることを
  # 検査する（短縮名と ID が空白・TAB 等で離れる形を止める）。検査器は kit 由来である。
  #
  # **ここに違反の実例を書かないこと。** 規約は「意図的な誤例はインラインコードへ入れる」と定めるが、
  # **その除外は Markdown でしか効かない**（YAML のバッククォートはコード記法ではない）。
  # 実際、本コメントの初版が誤例を平文で書いて自分の検査に捕まった。
  #
  # **本ジョブは exit 1 で落とす**（他の一部検査器のような warn ではない）。表記の是正は
  # 人手の判断を伴わず、書式が一意に決まるためである。
  #
  # 【重要】`PLAN_ID_PREFIXES` を落とすと `PROJECT_PREFIXES` が空になり、検査は **skip して緑になる**
  # （fail-open）。これは「他プロジェクトを参照しないリポジトリ」のための正常な挙動であって、
  # 本リポでは設定漏れを意味する。**環境変数を明示的に与える回帰テストが `scripts.repo.test.js`
  # にあり、ここを落としても別経路で赤くなる**（緑だが検査されていない、を避ける）。
  plan-id-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # 判定規則そのものが壊れていれば実データに対する結果は意味を持たない。自己試験を先に走らせる。
      - name: Self-test plan ID qualification checker
        run: node scripts/check-plan-id-qualification.js --self-test
      - name: Check plan ID qualification
        env:
          # AST は自プロジェクトだが、本リポは `AST/` を修飾として実際に使うため含める
          # （修飾を使うと決めた以上、表記が一貫していなければ機械的突合の役に立たない）。
          PLAN_ID_PREFIXES: "MSP,AST"
        run: node scripts/check-plan-id-qualification.js

  # 実行環境スキャフォールド（docker-compose / appsettings / .env.example）の静的検査（issue #107 / IADR-0048）。
  # fail-safe 既定（base appsettings が挙動中立・機密は空既定）と構成の存在・整合を Docker 起動なしで検証する。
  # 実コンテナ/実 API 疎通は #82 に分離するため、本ジョブは Node 標準のみ（依存・Docker 不要）で完結する。
  runtime-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate runtime scaffold
        run: node scripts/validate-runtime-scaffold.js

  # 【任意コンポーネント・本リポジトリは採用】宣言的パイプライン構成のスキーマ検証。
  # 検証器自体の自己試験に加え、取引パイプラインの実宣言を検証する（ADR-0001, IADR-0077, #22）。
  # 宣言が接続性/循環/構造違反へ退行した時点で CI が止める。
  pipeline-config:
    runs-on: ubuntu-latest
    env:
      # 【置換点】キット既定は空（採らないプロジェクトでは自己試験だけが走る）。本リポは取引パイプラインを宣言する。
      PIPELINE_CONFIG: "deploy/helm/ai-stock-trading/files/pipeline.json"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # 検証器自体の試験。構成ファイルの有無に関わらず毎回走らせ、検証ロジックの退行を防ぐ。
      - name: Validate pipeline config (self-test)
        run: node scripts/validate-pipeline-config.js --self-test
      - name: Validate pipeline config
        if: env.PIPELINE_CONFIG != ''
        run: node scripts/validate-pipeline-config.js "$PIPELINE_CONFIG"

  # Claude 系ワークフローのツール許可設定を検査する（安全弁）。
  # claude_args の記法誤りは CI を失敗させずに「AI が検証できない」状態を作るため、
  # 人間にもジョブ結果にも現れない。ここで機械的に止める。
  ai-workflow-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-action-versions の --compare-with-ref が統合ブランチ時点のワークフローを
          # 読むため、履歴が要る（shallow だと当該検査が warn で skip される）。
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check AI workflow config (self-test)
        run: node scripts/check-ai-workflow-config.js --self-test
      # 警告（検査そのものが成立していない状態）は GitHub のアノテーションとして出るため、
      # ジョブログを開かなくても PR の Checks 画面で気付ける。
      #
      # 本リポジトリはファイル名・ワークフロー構成が固まっている（既定名の 2 ファイルが
      # ともに claude_args を解析できる）ため、警告を失敗として扱う（scripts-tests の
      # REQUIRE_REPO_TESTS と同じ opt-in 方式）。キット既定が fail-open なのは、
      # claude-code-action の入力名が変わったときに全リポジトリの CI が検証器の更新まで
      # 一斉に落ちるのを避けるためである。追随できない事態になったら本 env を外す。
      - name: Check AI workflow config
        env:
          STRICT_AI_WORKFLOW_CONFIG: "1"
        run: node scripts/check-ai-workflow-config.js
      # Actions のバージョン退行を止める（キット issue planning#148 / planning#152）。
      #
      # **巻き戻りが実際に起きるのはここ（キットを同期した実装リポ）である。** 配布元
      # （project-planning）にも同じ検査があるが、それが守るのは「テンプレートが取り残されて
      # いないか」であり、実装リポがキットのファイルをコピーした瞬間の退行は守らない。
      # 実測: キット pin 0847687 の時点でキットは upload-artifact@v4・本リポは既に @v7 で、
      # 素直にコピーしていれば 3 メジャー分の退行を持ち込んでいた。
      #
      # 2 つの基準で検査する。
      #   - scripts/action-versions.json の下限（キット既定 ＋ action-versions.repo.json の追記）
      #   - --compare-with-ref: **統合ブランチ時点の同じファイル**より下がっていないか
      # 後者が要るのは、本リポが Dependabot で下限より先へ進んだあとにキットをコピーすると、
      # 本リポにとっては退行なのに表の上では合格してしまうためである。
      #
      # 【置換点】本リポの統合ブランチは develop（キット既定は origin/main）。
      # ref を読めない場合（shallow clone 等）は warn を出して素通りする（fail-open）。
      - name: Check action versions
        run: |
          node scripts/check-action-versions.js \
            --dir .github/workflows \
            --compare-with-ref origin/develop

  # FR-03/FR-10, ADR-0013, IADR-0106, IADR-0129, Issue #258 / #354 再発防止:
  # サービスを跨いで RabbitMQ のキュー名が衝突していないかを機械検査する。
  # #258 では 2 サービスが同一キューを共有し、pub/sub のつもりが competing consumer（取り合い）になって
  # 取引判断が承認・拒否・エラーのいずれにも現れず無言で消えた。
  # Wolverine（#354 で全面移行）はキュー名の導出にハンドラのクラス名を一切使わないため、当時の対策
  #（クラス名をサービス跨ぎで一意にする）は効かない。キュー名は <ServiceName>.<メッセージ型名> であり、
  # 一意性は ServiceName の一意性へ帰着する。よって検査するのは
  #   N1 ServiceName の一意性 / N2 トポロジの直接指定の禁止 / N3 共通ヘルパ経由でのみ Wolverine を配線する
  # ＋ メタ検査（走査したサービス数・Wolverine 配線サービス数の下限＝検査の空振り防止）である。
  # 旧 MassTransit 規則は移行完了に伴い #354 第 3 段階で撤去した（再混入は check-banned-libraries.js が止める）。
  # 外部依存ゼロ（Node のみ）。--self-test で検査器自体も毎回試験する。
  consumer-endpoint-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test consumer endpoint name checker
        run: node scripts/check-consumer-endpoint-names.js --self-test
      - name: Check queue name uniqueness across services
        run: node scripts/check-consumer-endpoint-names.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Format check
        run: dotnet format backend/backend.slnx --verify-no-changes

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # カバレッジ floor 検査（scripts/check-coverage.js）は Node で動く。ランナー既定の Node に
      # 依存せず版を固定する（他ジョブと同じ 20 系）。
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Restore
        run: dotnet restore backend/backend.slnx
      - name: Build
        run: dotnet build backend/backend.slnx --no-restore --configuration Release
      # 実基盤 E2E（Category=Integration・Docker 依存）は既定 CI から除外し、専用 integration.yml
      # （nightly/dispatch）で実走する（issue #82 / IADR-0049）。既定 CI の安定性・速度を損なわない。
      - name: Test (with coverage)
        run: dotnet test backend/backend.slnx --no-build --configuration Release --filter "Category!=Integration" --collect:"XPlat Code Coverage" --verbosity normal
      # カバレッジ floor（下限）の強制（issue #343 / IADR-0127）。閾値は coverage-floor.json。
      # 集計は (ファイル, 行番号) の和集合で行い、複数テストプロジェクトによる重複計上を避ける。
      # 引き上げ（ratchet）は自動では行わない（--suggest が候補値を出すのみ。更新は人手の PR）。
      - name: Check coverage floor
        run: node scripts/check-coverage.js --suggest

      # 参考: 他スタックの例
      # Node.js:
      #   - uses: actions/setup-node@v7
      #     with: { node-version: "20" }
      #   - run: npm ci
      #   - run: npm run lint --if-present
      #   - run: npm run build --if-present
      #   - run: npm test -- --coverage
      # Python:
      #   - uses: actions/setup-python@v7
      #     with: { python-version: "3.12" }
      #   - run: pip install -e .[test]
      #   - run: ruff check .
      #   - run: pytest --cov

  # フロントエンド（frontend/）の型検査・lint・単体/コンポーネントテスト（issue #106 / FR-13,FR-17,UC-06 / IADR-0080）。
  # 単独リポでは @foundation をテスト/型検査用スタブへ解決し、platform 非依存で自己完結する（合成時は platform の
  # src/vitest.config.ts が実 foundation へ解決して同じテストを走らせる）。実ブラウザ E2E（Playwright）・実 BFF/Keycloak
  # 疎通は実基盤依存として後続スライスへ分離するため、本ジョブは Node のみ（Docker 不要）で完結する。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  # フロント3画面（SC-01/02/03）の Playwright E2E（issue #187 / IADR-0087）。実ブラウザ（chromium）で UI フロー
  # （表示・保存の 200/400/409 出し分け・権限外の存在秘匿・縮退）を検証する。BFF 応答はモック（page.route）で、
  # 実 BFF/Keycloak/クラスタ疎通には依存させない（実基盤 live 検証は #82 系／MSP#284 へ分離）。Docker 不要・frontend/ に閉じる。
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npm run e2e:install
      - name: E2E typecheck
        run: npm run e2e:typecheck
      - name: E2E (Playwright)
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
