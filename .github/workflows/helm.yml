# Issue #129, IADR-0058: Helm chart（deploy/helm/ai-stock-trading）の CI ゲート。
#
# 背景: chart（#122）を追加したが helm lint / helm template を回すジョブが無く、chart 破損を
# CI で検出できなかった（microservices-platform#268 と同種の「デプロイ資産が CI 未検証」問題）。
#
# 設計（詳細は docs/adr/IADR-0058_helm-chart-ci-gate.md）:
#   - helm バイナリのみで完結させる。--validate / --dry-run=server は実 API サーバ依存のため使わない
#     （実基盤依存の検査は integration.yml が担う。IADR-0049 / #82 の切り分けを踏襲）。
#   - 既定値だけでなく、既定 disabled のフィーチャフラグを ON にした派生も描画する。既定値の描画では
#     {{- if }} ブロックが評価されず、「CI は緑なのに有効化した瞬間に壊れる」を許してしまうため
#     （実測で確認済み: cronjob テンプレート内部の破壊は既定値の lint/template を素通りする）。
#   - .NET CI（ci.yml）とは独立させる。ci.yml にパスフィルタを置くと全ジョブに効いてしまう。
name: Helm

on:
  push:
    branches: [develop, main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  chart:
    name: Lint and render chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/ai-stock-trading
    steps:
      - uses: actions/checkout@v7
      # バージョンを固定する（ランナー同梱の helm に依存すると、更新で挙動が変わっても気づけない）。
      # v4.2.1 は本ゲートの赤/緑をローカル実証したのと同一バージョン（IADR-0058 の実測表）。
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.1
      - name: helm lint (strict)
        run: helm lint --strict "$CHART"
      # 描画の派生。既定 disabled のフラグを ON にした系も描画し、有効化時に初めて壊れる
      # テンプレート（#121 CronJob / #13 moomoo）を CI で捕まえる（IADR-0058 の核心）。
      - name: helm template (default values / fail-safe 既定)
        run: helm template ast "$CHART" > /dev/null
      - name: helm template (tradingCycle.cronjob.enabled=true)
        run: helm template ast "$CHART" --set tradingCycle.cronjob.enabled=true > /dev/null
      - name: helm template (moomoo.enabled=true)
        run: helm template ast "$CHART" --set moomoo.enabled=true > /dev/null
      # #132 / IADR-0060: OpenD の本番配備（opend.enabled）と秘匿の受け口（externalSecrets）も同様に描画する。
      - name: helm template (opend.enabled=true)
        run: helm template ast "$CHART" --set opend.enabled=true > /dev/null
      # #132: 非 root 化（securityContext ＋ HOME 再調整）のオプトイン経路。**実 OpenD での動作確認は実基盤が要り
      # CI 対象外**（#132 の実測フェーズ）。ここでは描画が壊れないことだけを守る。
      - name: helm template (opend.enabled=true / 非 root オプトイン)
        run: |
          helm template ast "$CHART" \
            --set opend.enabled=true \
            --set opend.home=/home/opend \
            --set opend.securityContext.runAsNonRoot=true \
            --set opend.securityContext.runAsUser=10001 \
            --set opend.podSecurityContext.fsGroup=10001 > /dev/null
      - name: helm template (externalSecrets.enabled=true)
        run: helm template ast "$CHART" --set externalSecrets.enabled=true > /dev/null
      # #24 / IADR-0094: API 鍵群（ast-secrets）の Vault 同期 opt-in。既定描画では評価されないため
      # ON にした派生を描画し、有効化時に初めて壊れるテンプレートを CI で捕まえる（IADR-0058 の核心）。
      - name: helm template (externalSecrets.appSecrets.enabled=true)
        run: |
          helm template ast "$CHART" \
            --set externalSecrets.enabled=true \
            --set externalSecrets.appSecrets.enabled=true > /dev/null
      - name: helm template (all feature flags on)
        run: |
          helm template ast "$CHART" \
            --set tradingCycle.cronjob.enabled=true \
            --set moomoo.enabled=true \
            --set opend.enabled=true \
            --set externalSecrets.enabled=true \
            --set externalSecrets.appSecrets.enabled=true > /dev/null
      # #238 / IADR-0100: 経路B（ローカル SIMULATE）の有効化プロファイル values-local.yaml も描画する。
      # 既定 no-op のキー（MarketData/LlmGateway/KnowledgeBase/Discord）を ON にした派生であり、有効化時に
      # 初めて壊れるテンプレートを CI で捕まえる（IADR-0058 の核心）。
      - name: helm template (values-local / 経路B 有効化)
        run: helm template ast "$CHART" -f "$CHART/values-local.yaml" > /dev/null
      # 描画結果が空（テンプレート消失・条件の取り違え）でも上記は exit 0 になり得るため、
      # 既定値の描画が実際にリソースを産んでいることを確認する（無検査の緑を作らない）。
      - name: Assert default render is non-empty
        run: |
          count="$(helm template ast "$CHART" | grep -c '^kind:' || true)"
          echo "rendered resources: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::既定値の描画でリソースが 1 件も生成されなかった（chart またはテンプレート条件の破綻）。"
            exit 1
          fi
      # #132 / IADR-0060: 既定が no-op（fail-safe）であることを描画で検査する。実弾防止と同じ性質の
      # 「既定で外部へ触らない」保証であり、うっかり既定を反転させたら CI で落とす。
      - name: Assert fail-safe defaults (opend/ExternalSecret 不在・Broker=paper)
        run: |
          out="$(helm template ast "$CHART")"
          for forbidden in 'kind: ExternalSecret' 'name: opend'; do
            if printf '%s' "$out" | grep -q "$forbidden"; then
              echo "::error::既定値の描画に「$forbidden」が現れた（#132 の絶対条件＝既定 no-op に違反）。"
              exit 1
            fi
          done
          # 既定の発注先は paper（IADR-0016 の安全既定）。moomoo になっていたら実発注経路が既定で開く。
          if ! printf '%s' "$out" | grep -A1 'name: Broker__Provider' | grep -q 'value: "paper"'; then
            echo "::error::既定値の Broker__Provider が paper ではない（IADR-0016 の安全既定に違反）。"
            exit 1
          fi
      # #238 / IADR-0100: 本番バイト等価の担保。ArgoCD は values.yaml のみを描画する（valueFiles 無し）ため、
      # 経路B の有効化（values-local.yaml）が既定描画へ漏れていないことを検査する。既定描画に実 LLM/実市況/Discord の
      # 有効化痕跡が現れたら、本番へ漏れたということなので落とす（fail-safe 既定の反転検出）。
      - name: Assert prod default excludes route-B activations (本番バイト等価)
        run: |
          out="$(helm template ast "$CHART")"
          # ① 時価: 既定は EnableMarkToMarket=false・Provider 空（finnhub の実接続なし）。
          if ! printf '%s' "$out" | grep -A1 'name: MarketData__EnableMarkToMarket' | grep -q 'value: "false"'; then
            echo "::error::既定描画の MarketData__EnableMarkToMarket が false でない（本番へ①が漏れた）。"; exit 1
          fi
          for leak in 'value: "finnhub"' 'llmgateway-service' 'document-service.microservices-platform' 'value: "discord-webhook"'; do
            if printf '%s' "$out" | grep -q "$leak"; then
              echo "::error::既定描画に経路B有効化の痕跡「$leak」が現れた（本番 values.yaml へ漏れている）。"; exit 1
            fi
          done
          echo "ok: 既定描画（本番）は経路B有効化を含まない＝バイト等価の担保"
      # #238 / IADR-0100: 経路B の有効化プロファイルが ①②③＋Discord＋価格文脈を実際に ON にし、かつ実弾/危険既定は
      # OFF のまま（Broker=paper・opend/ExternalSecret 不在）であることを描画で検査する。有効化の空振り・過剰有効化を防ぐ。
      - name: Assert values-local activates route-B features (実弾/危険既定は OFF)
        run: |
          out="$(helm template ast "$CHART" -f "$CHART/values-local.yaml")"
          need() { printf '%s' "$out" | grep -q "$2" || { echo "::error::values-local 描画に「$1」が無い（有効化の空振り）。"; exit 1; }; }
          # ① 時価（risk-management は EnableMarkToMarket=true・finnhub）。
          printf '%s' "$out" | grep -A1 'name: MarketData__EnableMarkToMarket' | grep -q 'value: "true"' \
            || { echo "::error::values-local で MarketData__EnableMarkToMarket=true が描画されない（①未有効）。"; exit 1; }
          need "① finnhub 市況" 'value: "finnhub"'
          # ② 実 LLM（MSP LlmGateway・trade-decision/report）。
          need "② LlmGateway BaseUrl" 'llmgateway-service.microservices-platform'
          # ③ 実 KB（MSP DocumentService・information-collection/report）。
          need "③ KnowledgeBase Documents BaseUrl" 'document-service.microservices-platform'
          # Discord 通知（配線恒常化）。
          printf '%s' "$out" | grep -A1 'name: Notifications__Provider' | grep -q 'value: "discord-webhook"' \
            || { echo "::error::values-local で Notifications__Provider=discord-webhook が描画されない（Discord 未配線）。"; exit 1; }
          printf '%s' "$out" | grep -A1 'name: Notifications__Discord__Bot__Enabled' | grep -q 'value: "true"' \
            || { echo "::error::values-local で Bot__Enabled=true が描画されない。"; exit 1; }
          # 価格文脈（#236/IADR-0099・trade-decision の鮮度設定）。
          need "価格文脈 鮮度設定" 'name: MarketData__MaxQuoteStalenessSeconds'
          # 実弾/危険既定は OFF のまま（有効化しても paper・秘匿ストア/OpenD 不在）。
          printf '%s' "$out" | grep -A1 'name: Broker__Provider' | grep -q 'value: "paper"' \
            || { echo "::error::values-local 描画の Broker__Provider が paper でない（実弾 OFF 不変に違反）。"; exit 1; }
          for forbidden in 'kind: ExternalSecret' 'name: opend'; do
            if printf '%s' "$out" | grep -q "$forbidden"; then
              echo "::error::values-local 描画に「$forbidden」が現れた（経路B有効化で危険既定が開いた）。"; exit 1
            fi
          done
          echo "ok: values-local は ①②③＋Discord＋価格文脈を有効化し、実弾/危険既定は OFF のまま"
      # #245 / IADR-0102: Discord Bot の環境固有 ID（非機密）の設定点 discord.bot.*。
      # (a) 値を与えたら notification の env に入る（空振り検出）・snowflake が指数表記に化けない
      # (b) 空指定は既定描画とバイト一致（本番 values.yaml をバイト等価に保つ担保）
      # (c) env は「追加」ではなく「上書き」＝同名 env の二重定義を作らない
      # (d) 上書きは notification-service にのみ効く（他サービスの env を汚さない）
      - name: Assert discord.bot.* overrides notification env (#245)
        run: |
          GUILD=123456789012345678
          CHANNEL=987654321098765432
          USERS='111111111111111111\,222222222222222222'
          MAPPING='111111111111111111:owner\,222222222222222222:ops'
          render() {
            helm template ast "$CHART" "$@" \
              --set-string discord.bot.guildId="$GUILD" \
              --set-string discord.bot.channelId="$CHANNEL" \
              --set-string discord.bot.allowedUserIds="$USERS" \
              --set-string discord.bot.userMapping="$MAPPING"
          }
          check() {
            out="$1"; label="$2"
            printf '%s' "$out" | grep -A1 'name: Notifications__Discord__Bot__GuildId' | grep -q "value: \"$GUILD\"" \
              || { echo "::error::$label: GuildId が描画されない（指数表記化＝--set-string 忘れの可能性も）。"; exit 1; }
            printf '%s' "$out" | grep -A1 'name: Notifications__Discord__Bot__ChannelId' | grep -q "value: \"$CHANNEL\"" \
              || { echo "::error::$label: ChannelId が描画されない。"; exit 1; }
            # カンマ区切り値はエスケープを解いた素の値で入る（helm の --set パーサ経由）。
            printf '%s' "$out" | grep -A1 'name: Notifications__Discord__Bot__AllowedUserIds' \
              | grep -q 'value: "111111111111111111,222222222222222222"' \
              || { echo "::error::$label: AllowedUserIds が描画されない（カンマのエスケープ崩れ）。"; exit 1; }
            printf '%s' "$out" | grep -A1 'name: Notifications__Discord__Bot__UserMapping' \
              | grep -q 'value: "111111111111111111:owner,222222222222222222:ops"' \
              || { echo "::error::$label: UserMapping が描画されない。"; exit 1; }
            # (c) 二重定義しない: 各 env 名の出現は 1 回のみ。
            for key in GuildId ChannelId AllowedUserIds UserMapping; do
              n="$(printf '%s' "$out" | grep -c "name: Notifications__Discord__Bot__$key" || true)"
              if [ "$n" -ne 1 ]; then
                echo "::error::$label: Notifications__Discord__Bot__$key が $n 回描画された（env の二重定義）。"; exit 1
              fi
            done
          }
          # (a) 既定 values（本番形）＋ 値指定。
          check "$(render)" "既定values"
          # (a') 経路B プロファイル（標準手順 k8s-local-deploy.sh と同じ組み合わせ）。
          local_out="$(render -f "$CHART/values-local.yaml")"
          check "$local_out" "values-local"
          # 値を与えても実弾/危険既定は OFF のまま。
          printf '%s' "$local_out" | grep -A1 'name: Broker__Provider' | grep -q 'value: "paper"' \
            || { echo "::error::ID 指定で Broker__Provider が paper でなくなった（実弾 OFF 不変に違反）。"; exit 1; }
          for forbidden in 'kind: ExternalSecret' 'name: opend'; do
            if printf '%s' "$local_out" | grep -q "$forbidden"; then
              echo "::error::ID 指定の描画に「$forbidden」が現れた（危険既定が開いた）。"; exit 1
            fi
          done
          # (d) 上書きが効くのは notification-service の Deployment のみ。
          owner="$(render -s templates/deployment.yaml \
            | awk '/^  name: /{svc=$2} /name: Notifications__Discord__Bot__GuildId/{print svc}')"
          if [ "$owner" != "notification-service" ]; then
            echo "::error::GuildId の上書き先が notification-service ではない（実際: 「$owner」）。"; exit 1
          fi
          echo "ok: discord.bot.* は notification の env を 1 度だけ上書きする"
      - name: Assert empty discord.bot.* is byte-identical to default (本番バイト等価)
        run: |
          # 空指定（= k8s-local-deploy.sh で DISCORD_BOT_* 未設定の場合）が描画を 1 バイトも変えないこと。
          empty_args=(--set-string discord.bot.guildId="" --set-string discord.bot.channelId=""
                      --set-string discord.bot.allowedUserIds="" --set-string discord.bot.userMapping="")
          diff <(helm template ast "$CHART") <(helm template ast "$CHART" "${empty_args[@]}") \
            || { echo "::error::空の discord.bot.* 指定が既定描画を変えた（バイト等価に違反）。"; exit 1; }
          diff <(helm template ast "$CHART" -f "$CHART/values-local.yaml") \
               <(helm template ast "$CHART" -f "$CHART/values-local.yaml" "${empty_args[@]}") \
            || { echo "::error::空の discord.bot.* 指定が values-local 描画を変えた。"; exit 1; }
          # 既定描画では 4 ID が空のまま（IADR-0062 の安全既定＝全拒否）であること。
          out="$(helm template ast "$CHART")"
          for key in GuildId ChannelId AllowedUserIds UserMapping; do
            printf '%s' "$out" | grep -A1 "name: Notifications__Discord__Bot__$key" | grep -q 'value: ""' \
              || { echo "::error::既定描画の Notifications__Discord__Bot__$key が空でない（安全既定の反転）。"; exit 1; }
          done
          echo "ok: 空既定は描画を変えず、4 ID は空（全拒否）のまま"
      # #132 / IADR-0060 決定 1: chart の opend と dev の生 manifest（deploy/opend/k8s/opend.yaml）は
      # 意図的な二重管理である。片方だけが変更されて常駐モデルの前提が崩れるのを防ぐため、既定値の描画が
      # 生 manifest と**同等の不変条件**を満たすことを検査する（バイト等価ではない: chart は HOME 等を明示注入する）。
      - name: Assert opend default render keeps the resident-model invariants
        run: |
          out="$(helm template ast "$CHART" --set opend.enabled=true -s templates/opend.yaml)"
          fail() { echo "::error::opend の既定描画が常駐モデルの前提を満たさない: $1"; exit 1; }
          # 単一セッション前提。複数レプリカ・rolling は OpenD のログインを壊す。
          printf '%s' "$out" | grep -q 'replicas: 1' || fail "replicas: 1 でない"
          printf '%s' "$out" | grep -q 'type: Recreate' || fail "strategy が Recreate でない"
          # 初回の有人デバイス検証（kubectl attach）に要る。
          printf '%s' "$out" | grep -q 'stdin: true' || fail "stdin: true でない"
          printf '%s' "$out" | grep -q 'tty: true' || fail "tty: true でない"
          # liveness による自動再起動は、有人再検証待ちの停止を招くため付けない（IADR-0053）。
          if printf '%s' "$out" | grep -q 'livenessProbe'; then fail "livenessProbe が付いている"; fi
          # 既定は root 実行のまま（非 root 化は未検証のオプトイン・IADR-0060 決定 2）。
          if printf '%s' "$out" | grep -q 'runAsNonRoot'; then fail "既定で非 root になっている（未検証の設定を既定にしない）"; fi
          # デバイス信頼の永続化先は $HOME/.com.moomoo.OpenD。既定 HOME は生 manifest と同じ /root。
          printf '%s' "$out" | grep -q 'value: "/root"' || fail "既定 HOME が /root でない"
          printf '%s' "$out" | grep -q 'mountPath: "/root/.com.moomoo.OpenD"' || fail "デバイス信頼の永続化先が /root/.com.moomoo.OpenD でない"
          echo "ok: opend の既定描画は生 manifest と同等の不変条件を満たす"
      # #132 / IADR-0060: 誤配備を描画時に止めるゲートが**実際に落ちる**ことを検査する（ゲートの空振り防止）。
      - name: Assert misconfiguration gates fail
        run: |
          assert_fail() {
            desc="$1"; shift
            if helm template ast "$CHART" "$@" > /dev/null 2>&1; then
              echo "::error::$desc: 描画が通ってしまった（ゲートが機能していない）。"
              exit 1
            fi
            echo "ok (gate fired): $desc"
          }
          assert_fail "moomoo.enabled=true / host 空" --set moomoo.enabled=true --set moomoo.opend.host=""
          assert_fail "moomoo.enabled=true / rsaSecretName 空" --set moomoo.enabled=true --set moomoo.opend.rsaSecretName=""
          assert_fail "opend.enabled=true / credentialsSecretName 空" --set opend.enabled=true --set opend.credentialsSecretName=""
          assert_fail "opend.enabled=true / rsaSecretName 空" --set opend.enabled=true --set opend.rsaSecretName=""
          assert_fail "opend.enabled=true / home 空" --set opend.enabled=true --set opend.home=""
          assert_fail "externalSecrets.enabled=true / secretStoreRef.name 空" --set externalSecrets.enabled=true --set externalSecrets.secretStoreRef.name=""
          # #24 / IADR-0094: appSecrets 有効化でストア名が空なら描画時に止まる（誤有効化の防止）。
          assert_fail "appSecrets.enabled=true / secretStoreRef.name 空" --set externalSecrets.enabled=true --set externalSecrets.appSecrets.enabled=true --set externalSecrets.secretStoreRef.name=""
