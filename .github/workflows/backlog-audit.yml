# NFR / #439 / IADR-0170 / IADR-0625: バックログの週次監査。
#
# 背景（2026-08-07 のバックログ監査の実測）:
#   issue が増える主因は実装速度ではなく「閉じるより速く増えること」であった
#   （14 日で 起票 111 / クローズ 86 / 純増 +25）。その一部は**定期的に見れば分かる無駄**である
#   ——クローズ漏れ・重複起票・blocked の滞留。**いずれも誰も定期的に見ていなかった。**
#
# 【最重要】本監査は issue を自動でクローズしない（IADR-0170 決定5）。
#   提案の一覧を単一の追跡 issue へ upsert し、判断は人間に残す。
#
# 【IADR-0625】監査は生成 AI を使わない決定的なスクリプト（scripts/backlog-audit.js）で行う。
#   - 数えられる面（Proposed の IADR・動いていない仕様書／文書・blocked の再検証・ラベルと一覧の食い違い・
#     題名の一致する issue・エピックの進捗・ci-failure・古い PR・計画 ID レンジ）は機械で数える。
#   - 判断が要る面（クローズ漏れの判定・blocked の分類の誤り）は、候補を並べて人が判断する。
#   - issue の題名・本文は**データとしてのみ**扱う。シェル・式へは渡さない（スクリプトが GitHub API を
#     fetch で読み、報告へは無害化した題名と番号だけを載せる）。本ファイルの run にイベントの値は出てこない。
#   - 書き込みは issues だけ（追跡 issue と、計画 ID レンジのずれの専用 issue）。AI の資格情報・id-token は持たない。
#
# 再開の手順（2026-11 時点でワークフローは手動で無効化されている。本ファイルの変更では有効化しない。再開は利用者が行う）:
#   1. 本ファイルの変更が develop に入っていることを確かめる（`claude-code-action` を含まないこと）。
#   2. Actions → Backlog Audit → 「Enable workflow」（または `gh workflow enable backlog-audit.yml`）。
#   3. 「Run workflow」で手動実行し、追跡 issue（ラベル backlog-audit）の本文が更新されたこと、
#      ジョブの Summary に同じ報告が出たことを確かめる。以後は週次で動く。
#
# 失敗したら ci-failure-issue.yml が別スレッドの issue を立てる（監査が黙って止まらない）。
name: Backlog Audit

on:
  schedule:
    # 毎週月曜 00:00 UTC（JST 月曜 09:00）。週明けに前週ぶんを棚卸しする。
    - cron: "0 0 * * 1"
  # 手動実行を許す（監査の内容を変えた直後に 1 週間待たないで済むようにする）。
  workflow_dispatch:

concurrency:
  group: backlog-audit
  cancel-in-progress: false

# NFR: ワークフロー単位は読むだけにし、書き込みは要るジョブにだけ置く。
permissions:
  contents: read

jobs:
  backlog-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 追跡 issue・専用 issue の作成と本文の置き換え（issues: write）と、動いていない PR の列挙（pull-requests: read）。
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後段は git を使わない（ファイルを読むだけ）。トークンを作業ツリーへ残さない。
          persist-credentials: false

      # NFR / #711: 「run success なのに issue が更新されていない」を検出するため、run 開始時刻を先頭で記録する。
      - name: Record run start time
        id: run_start
        run: echo "run_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # 集計ロジックの回帰試験。壊れた集計を追跡 issue へ載せない（黙って壊れた監視は、無いより悪い）。
      - name: Self-test
        id: selftest
        run: node scripts/backlog-audit.js --self-test

      # NFR / #717 / #1208 / IADR-0504: 計画 ID レンジ宣言と計画側の実物の突合。ずれ（behind / ahead）を
      # 検知したら専用 issue（ラベル plan-range-lag）を起票・上書きする。計画側に届かなければ exit 0 の
      # unverified で、報告に「未確認」として数える。exit 1 は宣言が読めないときと、ずれを issue へ書けなかったときだけ。
      - name: Resolve planning ADR range
        env:
          PLANNING_REPO_TOKEN: ${{ secrets.PLANNING_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-planning-adr-range.js --out .backlog-audit/planning-adr-range.json --upsert-issue

      - name: Run backlog audit
        id: audit
        # 前段（計画 ID レンジ）が落ちても監査は出す。自己試験が落ちたときだけは出さない。
        if: ${{ !cancelled() && steps.selftest.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/backlog-audit.js --post --plan-range .backlog-audit/planning-adr-range.json --out .backlog-audit/report.md

      - name: Publish the report to the step summary
        if: ${{ !cancelled() }}
        run: |
          if [ -s .backlog-audit/report.md ]; then
            cat .backlog-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::報告ファイルが空である。産出が無いまま success にしない。"
            exit 1
          fi

      # NFR / #711: 追跡 issue の updated_at が本 run の開始時刻より新しいかを、スクリプトとは別に確かめる。
      # 番号は前段が GITHUB_OUTPUT へ書いた値（無ければ既定の #483）。
      - name: Verify backlog audit output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_START_TIME: ${{ steps.run_start.outputs.run_start }}
          ISSUE_NUMBER: ${{ steps.audit.outputs.issue_number }}
        run: node scripts/check-backlog-audit-output.js --issue-number "${ISSUE_NUMBER:-483}"

  report-failure:
    needs: [backlog-audit]
    if: always() && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/ci-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      marker_key: backlog-audit
