# Claude Code — PR の自動 AI レビュー
#
# PR がオープン/更新されたときに、計画書との整合・トレーサビリティの観点で AI レビューを行う。
#
# 位置づけ: reviewer スロット（検証実走付きレビューの実行主体）の Claude 用実装である
#   （配役は ai-roster.json、正本は docs/ai-orchestration.md）。reviewer の同時有効は常に
#   1 実装であり、別エンジンのレビューを並走させない（AI レビューの多重化は品質を上げない）。
#
# 有効化（このファイルは .example。AI_SETUP.md のプロファイルに従って有効化する）:
#   - 拡張子から .example を外す（git mv claude-code-review.example.yml claude-code-review.yml）。
#   - 認証シークレットを「どちらか一方のみ」登録する:
#       * Claude Code サブスクリプション: CLAUDE_CODE_OAUTH_TOKEN（`claude setup-token` で発行）
#       * Anthropic API: ANTHROPIC_API_KEY（従量課金）
#   - このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効
#
# モデル:
#   レビューは速度・コストを優先し既定で claude-sonnet-5 を使う。
#   PR 本文/タイトルに「@claude opus / sonnet / haiku」と書くとそのモデルで起動する
#   （"Select model from mention" ステップが解析）。既定は同ステップの MODEL="..." で変更。
#
# 権限（GitHub MCP ツール）について:
#   GitHub MCP ツール（mcp__github__pull_request_review_write 等）は
#   claude_args の --allowedTools で許可する（これが CI での正しい指定方法）。
#   アクションはリポジトリの .claude/settings.json を自動では読み込まないため、
#   settings.json の allow リストに頼らないこと。
#   注意: additional_permissions は MCP ツール名の列挙ではなく `actions: read` 等の
#   スコープ指定用なので、ツール許可には使わない（CI ログ参照を許可したい場合のみ使う）。
#   追加保護: use_sticky_comment: true でアクション自身が出力を投稿（ツール拒否時のフォールバック）。
#
# 【重要】レビュー用と実装用でツール許可を食い違わせないこと:
#   claude-coding.example.yml のスタック別コマンド（build / test / format）は、**必ず同じ内容を
#   本ファイルの --allowedTools にも複製する**。下の setup ステップで SDK を用意しているのに
#   実行を許可しないと、レビューは検証できず静的読解へ退行し、毎回「Bash が承認待ちでブロック
#   されたため実行結果は検証できていません」という無価値な指摘を 1 枠消費する（CI には承認する
#   人間がいないため、この待ちは必ず失敗に終わる）。実運用でこの退行が 2 週間継続した実績がある。

name: Claude Code Review

on:
  pull_request:
    # `reopened` が必要である（IADR-0185 決定3）。無いと、close → reopen した PR で本チェックが
    # 起動せず、claude-review を required status check にしたとき当該 PR が恒久 pending でマージ
    # 不能になる。他のワークフロー（ci / security / pr-title）はすべて reopened を持つ。
    types: [opened, synchronize, reopened]

# 連続 push でレビューが多重起動するのを防ぐ（古い実行はキャンセルする）。
# 未設定だと 1 PR で 3〜4 本が並走し、サブスク枠を消費したうえ陳腐化した結果で
# スティッキーコメントを上書きし合う。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # dependabot に加え、bot が自動生成する PR（CHANGELOG 更新等）も除外する。
    # GITHUB_TOKEN で作られた PR はワークフローが `action_required`（承認待ち）で
    # 止まるため、対象に含めても実行されずキューを汚すだけである（changelog.yml 参照）。
    if: ${{ github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'automation/') }}
    runs-on: ubuntu-latest
    # ハングした実行が上限まで回り続けるのを防ぐ。
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # CI の状態・ログを参照するために必要。2 か所が同時にこれへ依存する:
      #   1. アクションが注入する mcp__github_ci__* サーバー。導入前にワークフロートークンが
      #      actions: read を持つか実際に検証し、無ければ「Skipping CI server installation」と
      #      警告して導入を取り止める（許可済みのはずのツールが存在しない状態になる）。
      #   2. --allowedTools の `Bash(gh run list:*)`。gh CLI 側が actions: read を要求するため、
      #      権限が無いと許可されていても実行時に失敗する。
      # 注: ツール許可に additional_permissions は使わない（あれはアプリトークンのスコープ用）。
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 実装リポの checkout / push には既定の GITHUB_TOKEN を使う（上の
          # permissions: contents: write が push を許可する）。ここで token を
          # 上書きしないこと。上書きすると checkout がその資格情報を永続化し、
          # 後段の git push もそのトークンで実行されるため、実装リポへの書き込み
          # 権限が無い PAT だと 403（Permission denied）になる。

      # 資料再編（ADR-0029 決定 2）で本リポジトリは planning への依存を持たない。以前ここにあった
      # 「計画リポジトリ(project-planning)を submodule 参照している場合のみ有効」な submodule
      # 取得ステップ（read-only PAT を一時的に使う形）は、.gitmodules 自体が撤去されたため削除した。

      # 🔴 NFR / IADR-0208 決定 7: 工具の事前導入を PR の差分で出し分ける。
      #
      # 実測（2026-08-21・run 32443950165）で本ワークフローは 4 分 21 秒掛かり、**AST で最も長い**
      # ワークフローだった（CI 3 分 29 秒より長い）。しかも claude-review は**必須チェック**である。
      # 内訳の大半は「AI が動き出す前」の工具一式（setup-dotnet / dotnet-ef / npm ci /
      # playwright install --with-deps）で、**docs だけの PR でも全額を払っていた**。
      #
      # プロンプト側は「backend/ が変わっていなければビルドするな」と指示しているが、
      # **セットアップはその時点で既に払い終わっている**。指示では回収できない。
      #
      # 🔴 **判定は「入れる」を既定にし、docs だけだと確かめられたときにだけ省く。**
      # 利用者裁定（2026-08-22）「なるべく精度は落とさない方向で」に従い、
      # 当初の「backend/ frontend のパターンに当たったら入れる」（＝当たらなければ省く）を
      # **逆向きに書き直した**。パターンの取りこぼしは前者では「省いてしまう」に倒れるが、
      # 後者では「余計に入れる」に倒れる。**遅くなるだけで、検証は落ちない。**
      #
      # 省くのは **変更ファイルがすべて .md（または LICENSE / .gitignore 等の非コード）である場合**に限る。
      # 1 つでもそれ以外があれば全部入れる。
      #
      # 🔴 取りこぼすと AI は「実行したが失敗した」と報告する。**原因が環境不備であることは
      # 本文から判らないため、拒否されるより質が悪い**（#391 の教訓）。
      #
      # 🔴 --allowedTools と .claude/settings.json は触っていない（3 系統一致の規約。
      # check-ai-workflow-config.js が STRICT で見ている）。変えたのは**事前導入の有無だけ**である。
      - name: Detect whether this PR is docs-only
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null \
                   || git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          n="$(printf '%s\n' "$files" | grep -c . || true)"
          echo "変更ファイル ${n} 件"
          printf '%s\n' "$files" | sed 's/^/    /'
          # 🔴 差分を引けなかった（0 件）ときは「docs のみ」と判定しない。fail-safe に全部入れる。
          if [ "$n" -eq 0 ]; then
            echo "::notice::差分を解決できなかった。工具一式を入れる（fail-safe）。"
            echo "setup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # コードに影響しないと確かめられる拡張子・パスだけを列挙する（許可リスト方式）。
          # ここに無いものが 1 つでもあれば setup=true になる。
          if printf '%s\n' "$files" | grep -qvE '(\.md$|^LICENSE$|^\.gitignore$|^\.gitattributes$|^docs/.*\.(png|jpg|svg|drawio)$)'; then
            echo "setup=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::変更が Markdown 等のみ。工具の事前導入を省く（AI の検証対象がコードに無いため）。"
            echo "setup=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # 検証(build/test)を @claude セッション内で実走するための SDK 準備。
      # 技術スタックに合わせて書き換える（既定は C#/.NET 10。ci.example.yml と揃える。
      # 他スタックは actions/setup-node / actions/setup-python 等に置き換える）。
      - uses: actions/setup-dotnet@v6
        if: steps.touched.outputs.setup == 'true'
        with:
          dotnet-version: "10.0.x"

      # EF マイグレーションの検証（`dotnet ef migrations has-pending-model-changes`）用。
      # 本リポジトリは tool manifest（.config/dotnet-tools.json）を持たないためグローバル導入する。
      # 導入に失敗してもレビュー自体は続ける（EF の主張だけが「未検証」になる）。
      - name: Install dotnet-ef
        if: steps.touched.outputs.setup == 'true'
        continue-on-error: true
        run: dotnet tool install --global dotnet-ef

      # frontend（typecheck / vitest / Playwright）の検証用。ci.yml の frontend-e2e ジョブと
      # 同じ手順を複製する。
      #
      # 【重要・#391】許可リストへ足すだけでは実行できない。node_modules が無ければ typecheck も
      # vitest も動かず、レビューは「実行したが失敗した」と報告する。原因が環境不備であることは
      # 本文からは判らないため、**拒否されるより質が悪い**。許可とセットアップは必ず対で入れる。
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.setup == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        if: steps.touched.outputs.setup == 'true'
        continue-on-error: true
        run: npm ci
        working-directory: frontend
      # Playwright（E2E）は利用者裁定によりレビューでも実走を許可する（2026-08-05・#391 ①）。
      # ブラウザ取得に 1〜2 分かかるが、E2E の主張を未検証のまま通すほうが害が大きいと判断した。
      # NFR / IADR-0208: ブラウザをキャッシュする（ci.yml の frontend-e2e と同じキー）。
      - uses: actions/cache@v6
        if: steps.touched.outputs.setup == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browser (chromium)
        if: steps.touched.outputs.setup == 'true'
        continue-on-error: true
        run: npm run e2e:install
        working-directory: frontend

      # レビューは PR オープン/更新で自動起動するため、モデル指定は PR 本文/タイトルの
      # 「@claude opus / sonnet / haiku」で切り替える。未指定時は既定 claude-sonnet-5。
      # 本文はコマンドインジェクション防止のため env 経由で受け取り、run へ直接展開しない。
      - name: Select model from mention
        id: model
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BODY="${PR_BODY}
          ${PR_TITLE}"
          MODEL="claude-sonnet-5"
          if   printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+fable';  then MODEL="claude-fable-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+opus';   then MODEL="claude-opus-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+sonnet'; then MODEL="claude-sonnet-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+haiku';  then MODEL="claude-haiku-4-5-20251001"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected model: $MODEL"

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        # gh CLI（Issue 発行等）を既定トークンで認証する。gh は GH_TOKEN/GITHUB_TOKEN を参照する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 認証はどちらか一方のみ設定する（未設定の方は空文字で無視される）:
          #   サブスク = CLAUDE_CODE_OAUTH_TOKEN / API = ANTHROPIC_API_KEY
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub API アクセス用トークン（MCP GitHub ツール・スティッキーコメント投稿に必要）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Bot（GitHub App の Claude 等）が開いた PR もレビュー対象にする。
          # 注意: 公開リポジトリで '*' を指定すると外部 App からも起動され得る（公式警告）。
          #   公開リポジトリでは 'claude,dependabot[bot]' など特定ボット名に絞ること。
          #   再帰ループが心配な場合も同様に絞る。
          allowed_bots: '*'
          # レビュー結果を PR スティッキーコメントとして投稿する（use_sticky_comment: true が重要）。
          # アクション自身が必ず PR にスティッキーコメントを投稿する（ツールの成否に関わらず保証される）。
          use_sticky_comment: true
          # CI ログにもレビュー本文を出力する（デバッグ・監査用）
          display_report: true
          # レビュー進捗コメントを PR に表示する
          track_progress: true
          # 既定モデル: 変更可（厳密さ優先なら claude-opus-5）。
          # GitHub MCP ツールはここで許可する（mcp__github__pull_request_review_write 等の
          # 権限拒否はこれで解消する。additional_permissions は使わない）。
          # Read はリポジトリ内の文書・コードの参照に必要（計画書は本リポジトリから参照
          # できない。資料再編 ADR-0029 決定 2。planning submodule・隣接クローンとも CI に無い）。
          # 安全性の注記: 下のビルド/テスト許可は PR のコードを**実行**する。fork からの
          # pull_request では secrets が渡らずアクションの認証自体が成立しない（＝実質
          # 同一リポの PR のみが対象）ため既定では許容範囲だが、公開リポジトリで fork の
          # レビューまで走らせる運用にする場合は、実行系（dotnet test / node 等）を外すか
          # pull_request_target を使わない構成を維持すること。
          # 書き込み系の git（commit / push / reset 等）はレビューには不要なので入れない。
          #
          # 【読み取り系 git は必須】アクション自身の組み込みプロンプトが差分の取得手段を
          # 指示している（`git diff origin/main...HEAD` / `git log origin/main..HEAD` /
          # `git status`）。許可しないと差分の内容と無関係に**毎回必ず拒否が出る**
          # （planning 側で同じ欠落により全 PR の CI が赤くなった。issue planning#146）。
          #
          # 【整形パイプと submodule 確認（issue planning#155）】拒否の実測から 2 つの穴が判った。
          #   - `cat` / `head` / `tail` が 1 つも無かった。パイプは**各コマンドが個別に判定される**
          #     ため、`node scripts/x.js | tail -5` は先頭が許可済みでも tail で拒否される。
          #     報告に出るのは先頭コマンド名なので、原因が判りにくい形で毎回落ちる。
          #     実装用には `cat` があり、レビュー用にだけ無いのも非対称であった。
          #   - （旧: submodule の pin 確認用に `git -C planning` 系を列挙していたが、資料再編
          #     〔ADR-0029 決定 2〕で submodule ごと撤去した。`git submodule` を丸ごと許可しない
          #     こと〔前方一致で `update` / `add` まで通る〕という設計判断は引き続き有効である。）
          # なお `VAR=1 cmd` 形（環境変数の前置き）は**許可リストでは解決できない**。先頭トークンが
          # `VAR=1` になり前方一致しないためである。`Bash(env:*)` を許すと任意コマンドが通るので
          # 危険であり、プロンプト側で「実行できない。未検証と明記せよ」と指示してある。
          #
          # 【前方一致の落とし穴】Bash の許可は**コマンド文字列の前方一致**である。したがって
          # `Bash(git log:*)` を許可しても `git -C <パス> log` には当たらない。
          # `Bash(git -C:*)` と一括で許可してはならない（前方一致で `git -C <パス> push` /
          # `commit` / `reset` まで通り、書き込み系を外した設計が崩れる）。
          #
          # 【記法・最重要】claude_args は**空白区切りで argv へトークン化**される。
          # したがって `--allowedTools Bash(dotnet test:*)` のように 1 ツール 1 行で書くと、
          # 空白を含む指定が `Bash(dotnet` と `test:*)` に割れて**すべて無効**になる。
          # 正しい記法は公式ドキュメントどおり「二重引用符でくくった 1 引数・カンマ区切り」。
          #   誤: --allowedTools Bash(gh issue create:*)
          #   正: --allowedTools "Read,Bash(gh issue create:*)"
          # 検証方法: ジョブログの `SDK options:` にある allowedTools 配列を目視する。
          # `"Bash(gh", "issue", "create:*)"` のように割れていたら記法が誤っている。
          #
          # #456: シェル断片（chart の CronJob 等）を含む PR では、レビューが抽出パターンを
          #   `echo ... | sed -n ...` で実走して確かめようとする。sed が無いと拒否になり、
          #   **検証が落ちるだけでなく check-permission-denials.js の許容値（4 件）も超えて
          #   ジョブが赤くなる**（実測: PR #458 で 5 件）。sed は既に許可済みの Bash(node:*) より
          #   狭く、能力の実質的な拡大にはならない。
          #
          # 末尾のビルド/テスト系（node / dotnet）が**スタック別**の可変部分である。
          # claude-coding.example.yml の対応箇所と同じ内容に保つこと（既定は C#/.NET）。
          # 他スタック例: Bash(npm run:*) / Bash(npx vitest:*) / Bash(pytest:*) / Bash(go test:*)
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-tree:*),Bash(git ls-files:*),Bash(git submodule status:*),Bash(git fetch:*),Bash(ls:*),Bash(rg:*),Bash(grep:*),Bash(sort:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(cmp:*),Bash(diff:*),Bash(echo:*),Bash(which:*),Bash(yq:*),Bash(helm template:*),Bash(helm lint:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh run list:*),mcp__github__pull_request_read,mcp__github__get_file_contents,mcp__github__issue_read,mcp__github__get_issue,mcp__github__get_pull_request,mcp__github__get_issue_comments,mcp__github__get_pull_request_reviews,mcp__github__search_issues,mcp__github__list_sub_issues,mcp__github__list_workflow_runs,mcp__github__actions_list,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__add_issue_comment,mcp__github__push_files,Bash(node:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(dotnet ef:*),Bash(dotnet --version),Bash(dotnet --info),Bash(npm ci:*),Bash(npm run:*),Bash(npm --prefix:*)"
          # 【プロンプトの書き方】prompt: の中身は毎 PR そのまま送信され課金される。事故の経緯・
          # 実測値の記録は送信されないこの YAML コメント側へ書き、prompt には AI が従う指示だけを
          # 置く（planning#416 の追随。#530）。prompt が禁じる各項目の経緯:
          #   - サブエージェント禁止: CI では起動が完了せず停止し、本文未投稿のままジョブが終わる。
          #   - バックグラウンド待ち禁止: 2026-08-14 の PR #489 で `dotnet test` を背景起動したまま
          #     完了を待たずにターンを終える事故が 3 回連続で起き、3 回とも判定が投稿されず、
          #     うち 2 回は success で終わった（#490。check-review-verdict.js 新設の起点）。
          #   - 「検証の誠実性」節の由来: 権限拒否 12 件を伏せて「実測した ✅」と報告した事例。
          #   - cd 禁止の実測: 1 回のレビューで cd 起点の拒否が 4 件出た。
          prompt: |
            このリポジトリは、上流工程リポジトリ project-planning の計画書を実装する作業リポジトリである。
            CLAUDE.md と AGENTS.md の方針に従い、この PR を以下の観点でレビューし、
            指摘を「重大 / 推奨 / 軽微」に分類してコメントせよ。

            【実行制約・最重要】
            - **単一セッション内で完結させる。** サブエージェント（Task ツール。`adr-guardian` /
              `traceability-auditor` / `general-purpose` など `.claude/agents/` 定義の起動を含む）は
              CI では停止するため一切使用しない。「ADR 制約チェック」「トレーサビリティ監査」を含む
              全観点を、このセッション内で自分自身が Read / Bash 等の直接ツールで実施する。
            - **サマリの投稿はどの検証よりも優先する。** レビューの最後に、下記フォーマットの
              サマリコメントを必ず自分で投稿してから終了する。委譲したまま・**バックグラウンド実行
              （`&` での起動・「後で回収する」形）の完了を待ったまま**終了してはならない
              （判定ゼロのまま success になり「レビュー済み・指摘なし」と読まれる。
              **判定を欠いたまま終了すると `check-review-verdict.js` がジョブを落とす**）。
              時間が足りなければ「未検証（理由）」と書いて投稿すること。

            【検証の誠実性・最重要】
            - 「実測」「確認済み」「✅」と書けるのは、**このセッション内で実際にコマンドを実行し、
              その出力を自分の目で見た項目だけ**である。
            - 実行できなかった項目を、推測・PR 本文の引き写し・「そうなっているはず」で
              埋めてはならない。**「未検証（理由）」と明記する**こと。未検証と書くことは減点ではない。
              嘘の ✅ だけが問題である。
            - **次は原理的に実行できない。試みる必要はなく、必要なら未検証と書くこと**:
              - 環境変数を前置きする形（`VAR=1 cmd` / `export VAR=1`）。ツール許可はコマンド文字列の
                前方一致で判定されるため、先頭が `VAR=1` になるこの形は**必ず拒否される**。
                （例: `STRICT_AI_WORKFLOW_CONFIG=1 node …` は実行できない）
              - **ファイルを書き換える検証**（変異テスト・設定を壊して再実行する類）。レビュー用の
                ツールに書き込み手段は無く、これは設計どおりである。PR 本文がそうした検証結果を
                主張していても、**追試はできない**ので「未検証（書き込み不可）」と書く。
              - **シェルのループ・複合形**（`for` / `while` / `if … then … fi`）。先頭トークンが
                `for` 等になるため許可リストで表現できず、必ず拒否される。複数ファイルを調べる
                ときは**1 ファイルずつ個別のコマンドで**実行すること。
              - **`cd` によるディレクトリ移動**（`cd <サブディレクトリ> && git log …` の形を含む）。
                `cd` は許可リストに無いため、後続が許可済みでも先頭で拒否される。サブディレクトリの
                履歴は **`git log -- <パス>`** の形で見ること。
              - **`git -C` の使用**。資料再編（ADR-0029 決定 2）で submodule が撤去され、`git -C` 系の
                許可はすべて外した。リポジトリ直下の `git log` / `git show` 等をそのまま使うこと。
            - **パイプは各コマンドが個別に許可判定される。** `git show X | cmp - Y` は `cmp` が
              未許可なら拒否される（前段が許可済みでも通らない）。バイト一致の確認には
              `cmp` / `diff` を許可してあるので、そのまま使ってよい。
            - **出力をファイルへリダイレクトしない**（`> /tmp/a` に加え **`> /dev/null` も**）。
              レビュー用は書き込み手段を持たないため、宛先に関わらず拒否される。
              出力はそのまま読むこと（捨てたい出力は最初から生成しない）。
            - **プロセス置換 `<(…)`・コマンド置換 `$(…)` も実行できない**。ツール許可はコマンド
              文字列を解析して判定するため、これらの構文は**中のコマンドが許可済みでも**拒否される。
              2 つの版を比べるときは `diff <(git show A) <(git show B)` ではなく、
              `git show <ref>:<path> | diff - <path>` の形（パイプ + 標準入力）を使う。
            - **長い連鎖のワンライナーを作らない。** `… | head -20 | echo "exit:$?"` のように
              `|` `&&` でつなぐほど、鎖のどこかに未許可コマンドが混ざる確率が上がり、拒否されると
              **鎖全体が実行されない**（前段の結果も得られない）。1 コマンドずつ実行すること。
              なお `$?` はパイプの後では直前の 1 コマンドの結果しか表さないため、判定にも使えない。
            - レビュー本文の末尾に **「実行できなかったこと」節を必ず設ける**。拒否された、または
              実行を諦めたツール／コマンドと、**それによって裏付けが取れていない主張**を列挙する。
              何も無かった場合は「なし」と 1 行書く（節自体を省略しない）。

            【出力必須ルール】
            - 指摘が 0 件であっても、必ず以下のサマリ形式でコメントを出力すること。
            - 無言終了・出力なし終了は禁止。レビューが完了したら必ずサマリを出力せよ。

            出力フォーマット（Markdown）:
            ## AI コードレビュー結果

            ### 🔴 重大
            - （指摘なし）または具体的な指摘内容

            ### 🟡 推奨
            - （指摘なし）または具体的な指摘内容

            ### 🟢 軽微
            - （指摘なし）または具体的な指摘内容

            ### 🔍 実行できなかったこと
            - なし / または「`<コマンド>` は権限拒否（このため <どの主張> は未検証）」の形で列挙

            ---
            *レビュー観点: トレーサビリティ / 受け入れ基準 / ADR 制約 / 品質 / AI 固有リスク*

            レビュー観点の詳細:
            1. トレーサビリティ: PR 本文・コミット・コードに起点 ID（FR-xx / UC-xx / SC-xx）が
               残されているか。実装が対象の計画書（要求・ユースケース・画面）に忠実か。
            2. 受け入れ基準: 計画書の受け入れ基準を満たし、基本/代替/例外フローを網羅しているか。
               対応するテストがあるか。
            3. ADR 制約: 関連 ADR（07_adr/ の Accepted）で確定した制約に違反していないか。
            4. 一般的な品質: 不具合・抜け漏れがないか。
            5. AI 実装に特有のリスク（重点）:
               - 過剰実装（計画外の機能追加・不要な抽象化・起こり得ないケースへの防御）。
               - 存在しない API/ライブラリ/設定の使用（幻覚）。
               - エッジケース・例外フローの取りこぼし。
               - 仕様の表面的充足（テストを通すためだけの空実装・空テスト）。
               - 秘密情報のハードコードや不適切な扱い。

            【計画書の場所】この順で探すこと:
            1. `planning/projects/<name>/` — **CI ではこちら**。checkout 直後のステップで
               submodule を populate 済みであり、ワークスペース内なので Read が届く。
            2. `../project-planning/projects/<name>/` — 隣接クローン運用のローカル環境のみ。
               CI ではワークスペース外のため Read が届かない。
            **1 を試さずに「計画リポジトリは参照不可」と結論してはならない。**
            両方とも存在しない場合に限り、その旨を明記したうえで PR 内の情報のみでレビューする。

            【他リポジトリ・issue 参照の扱い】
            - GitHub の issue / PR を読む MCP ツール名は `mcp__github__issue_read` /
              `mcp__github__pull_request_read` である（`get_issue` / `get_pull_request` は廃止名。
              廃止名を試して「権限がない」と結論しないこと）。
            - `github_token` は本リポジトリにスコープされるため、**他リポジトリの issue / PR は
              参照できない**。これは設定不備ではないので「未検証」と書かず、「他リポジトリの
              参照は本セッションの対象外」と明記して先へ進むこと。

            【検証の実行】
            ビルド・テスト・フォーマットの実行は許可されている。PR 本文が「テストが通る」と
            主張している場合は、可能な限り**自分で実走して確認**し、結果を報告に含めること。

            **ただし変更範囲に応じて絞ること（#490 / IADR-0190 決定4）。まず差分の範囲を見る。**
            - **`backend/` の差分が空なら `dotnet build` / `dotnet test` を実行しない。**
              コードが 1 行も変わっていない PR で全テストスイートを回す意味は無く、
              **その待ちで判定を投稿できなくなる方が有害である**（PR #489 で実際に起きた）。
            - 同様に **`frontend/` の差分が空なら frontend の検証を実行しない。**
            - **実行しなかったことは「実行できなかったこと」節へ理由付きで書く**
              （「コード差分が無いため対象外と判断した」等）。**黙って省略しない。**
            - 差分がある場合も、**まず対象プロジェクトだけを絞って実行する**ことを検討する
              （`dotnet test <対象の .csproj>`）。**全スイートは最後の手段である。**

            **frontend と EF マイグレーションと E2E も実走できる**（#391 で許可とセットアップを
            揃えた）。ジョブ側で `npm ci`（`frontend/`）・Playwright の chromium・`dotnet-ef` を
            導入済みなので、次はそのまま実行してよい。
            - `npm --prefix frontend run typecheck` / `npm --prefix frontend run test -- --run`
            - `npm --prefix frontend run e2e`（Playwright。**ブラウザは導入済み**）
            - `dotnet ef migrations has-pending-model-changes --project <csproj>`
            PR 本文が frontend のテスト結果や「マイグレーション差分なし」を主張している場合は、
            **必ず自分で実走して確かめること**（従来これらは検証されないまま通過していた）。
            セットアップ手順は失敗しても続行する構成のため、実行してエラーになったら
            「環境の不備で未検証」と書けばよい（**推測で ✅ にしない**）。
            計画リポジトリ（project-planning）は本リポジトリから参照できない（資料再編
            ADR-0029 決定 2 で submodule を撤去済み）。PR が計画書の内容に言及している場合、
            その照合はできないため「未検証（計画リポ参照不可）」と明記すること（推測で ✅ にしない）。

            【.claude / CLAUDE.md を変更する PR での注意】
            アクションはセキュリティ上、`.claude` / `CLAUDE.md` / `.mcp.json` 等を統合ブランチ版へ
            復元し、PR 版を `.claude-pr/` へ退避する（PR head は untrusted 扱いのため）。
            そのため作業ツリーに「直近コミットを打ち消す未コミット差分」が見えるのは**正常**であり、
            異常として報告しないこと。これらのファイルをレビューするときは `.claude-pr/` または
            `git show HEAD:<path>` を参照すること。

      # 権限拒否の可視化（安全弁）。
      #
      # claude-code-action は、AI がツールを 1 つも実行できなくても
      # `"subtype": "success", "is_error": false` で終わる。ジョブは緑になり、PR には
      # 進行中コメントだけが残る。「CI が緑 ＝ レビューが通った」ではなく
      # 「エラー無く終了した」に過ぎない状態であり、レビュー未実施が誰にも見えない。
      # CI には承認する人間が居ないため、権限拒否は「待たされた」ではなく
      # **「その作業は永久に実行されない」**を意味する。ここで止める。
      #
      # if: always() が必須である（上の step が失敗した場合こそ内訳を知りたい）。
      # 実行ログを読めない構成では warn を出して exit 0（fail-open）。
      - name: Check permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-permission-denials.js "$EXECUTION_FILE"

      # 判定の未投稿の検出（安全弁 2 本目・#490 / IADR-0190）。
      #
      # **上の検査とは別の穴を見る。** あちらは「AI がツールを 1 つも実行できなかった」形。
      # 本件は**ツールは正常に動いており、最後の判定の投稿だけが無い**形である。
      #
      # 2026-08-14 の PR #489 で、同一 PR で **3 回連続**レビューが判定を投稿せずに終わり、
      # うち 2 回はジョブが **success** だった。PR には進行中のプレースホルダだけが残り、
      # 「dotnet test をバックグラウンドで実行中です。完了後にサマリを投稿します」と
      # 書かれたまま終了していた。**緑は「レビュー済み・指摘なし」と読まれ、マージも止まらない。**
      #
      # if: always() が必須である（上の step が落ちた場合こそ判定の有無を知りたい）。
      # 実行ログを読めない構成では warn ＋ exit 0（fail-open）——その形は上の検査が捕まえる。
      - name: Check review verdict
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-review-verdict.js "$EXECUTION_FILE"
