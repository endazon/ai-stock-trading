# フロントエンド SPA の CI（typecheck / lint / build / e2e スモーク）。
# frontend/ 配下の変更で起動する。バックエンド CI とは独立。
# 単体テスト＝品質ゲートは frontend-tests.yml（npm run test:coverage）が担うため、
# 本ワークフローではテストを実行しない（同一スイートの二重実行を避ける）。
#
# 【前提・有効化前に必ず確認すること】
# 本ファイルはフロントエンドの雛形（`frontend/` や `package.json`）を**同梱していない**。
# 有効化しただけでは動かず、以下の npm スクリプトが自分の `package.json` に定義されている
# 必要がある。未定義のまま `.example` を外すと即失敗する。
#   - `typecheck` / `lint` / `build` / `test:e2e`（本ファイル）
#   - `test:coverage`（frontend-tests.example.yml）
# 名称が異なる場合は各 run ステップを実際のスクリプト名へ書き換えること
# （差し替え箇所の一覧は impl-handoff-kit/HOWTO.md Part B-5 を参照）。
name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

# ユニット第一構成（基盤＋可変機能ユニット。npm workspaces ルート = src/）を採る場合の書き換え例
# （実例: microservices-platform ADR-0019 / 実装 IADR-0056）:
#   paths: ["src/*/frontend/**", "src/package.json", "src/package-lock.json",
#           "src/vitest.config.ts", "src/eslint.config.js", ".github/workflows/<本ファイル名>"]
#   working-directory: src / cache-dependency-path: src/package-lock.json
defaults:
  run:
    working-directory: frontend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # 単体テストは frontend-tests.yml（npm run test:coverage）へ集約（二重実行回避）。
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # スクリーンレベル・スモーク（バックエンド不要。ログイン画面到達を検証）。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E smoke
        run: npm run test:e2e
