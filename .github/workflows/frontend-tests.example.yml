# フロントエンド単体テスト＋カバレッジの専用 CI。
# frontend.yml（typecheck/lint/build/e2e を含む複合 CI）とは別に、
# テスト＝品質ゲートを独立させ、カバレッジのレポート生成としきい値ゲートを担う。
# frontend/ 配下の変更で起動する（バックエンド CI とは独立）。
#
# 【前提】本ファイルはフロントエンドの雛形（`frontend/` や `package.json`）を同梱していない。
# `test:coverage` スクリプトが自分の `package.json` に定義されている必要がある（未定義なら即失敗）。
# 名称が異なる場合は run ステップを書き換えること（HOWTO.md Part B-5 参照）。
name: Frontend Tests

on:
  push:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

# ユニット第一構成（基盤＋可変機能ユニット。npm workspaces ルート = src/）を採る場合の書き換え例
# （実例: microservices-platform ADR-0019 / 実装 IADR-0056）:
#   paths: ["src/*/frontend/**", "src/package.json", "src/package-lock.json",
#           "src/vitest.config.ts", "src/eslint.config.js", ".github/workflows/<本ファイル名>"]
#   working-directory: src / cache-dependency-path: src/package-lock.json / カバレッジ path: src/coverage
defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 単体テスト（Vitest）をカバレッジ付きで実行する。
      # vite.config.ts の coverage.thresholds を下回ると失敗する（回帰防止ゲート）。
      - name: Unit tests with coverage
        run: npm run test:coverage
      # カバレッジレポート（lcov / html / text-summary）を成果物として保存する。
      # しきい値未達でも診断できるよう、失敗時も常にアップロードする。
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14
