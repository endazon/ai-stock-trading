# PR タイトル（＝スカッシュマージ後件名）の規約チェック。
#
# 背景: ci.yml の commit-messages ジョブは PR コミット（base..HEAD）を検査するが、スカッシュ
# マージで統合ブランチに載る件名は「PR タイトル + 半角スペース + (#番号)」であり、その範囲に
# 含まれず未検査になる。中間コミットは force push 禁止のため事後修正できないため、PR タイトル
# 検査が最後の砦にあたる。本ワークフローは PR タイトルを規約 `種別(起点ID): 要約` に照合し、
# 違反ならマージ前に CI を失敗させる。
#
# 検査ロジックは scripts/check-commit-messages.js の単一件名モード（--title 引数 / PR_TITLE
# 環境変数 → validateSubject を再利用）に実装済みで、scripts/scripts.test.js に単体テストもある。
# 本ファイルはその呼び出し配線のみを担う（規約の単一情報源を二重実装しない）。
#
# edited を含めることで、PR タイトルを後から編集した場合にも再検査する。
# bot 作成 PR（dependabot 等）は commit-messages ジョブと同方針で除外する。
#
# このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効。

name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# タイトル編集の連打時は古い実行をキャンセルする。
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 【重要】bot 作成 PR の除外を、ここ（ワークフローの条件）で行ってはならない。
    #
    # `if: github.event.pull_request.user.type != 'Bot'` と書くと、**GitHub App が作成した PR
    # （`claude[bot]` 等）も `user.type == 'Bot'` になるため一緒に落ちる**。本リポジトリは
    # AI に実装を委ねる運用が主要な経路であり、**その経路でだけ「最後の砦」が skipped になる**
    # （planning#202 が実測。人間の PR は success・GitHub App の PR は skipped という差が観測された）。
    #
    # 除外は**スクリプト側**（`isBotLogin()` が `BOT_AUTHORS` へ完全一致した場合のみ）が担う。
    # `claude[bot]` は `BOT_AUTHORS` に無いため**検査される**。それが意図である（#477 / IADR-0189）。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check PR title (squash subject)
        # タイトルは環境変数経由で渡し、シェル展開による注入を避ける。
        # Revert / [skip ci] の除外と、空タイトル時の fail-open はスクリプト側が担う。
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          # bot 判定は作成者の**ログイン名**で行う（`user.type` ではない。上のコメント参照）。
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-commit-messages.js
