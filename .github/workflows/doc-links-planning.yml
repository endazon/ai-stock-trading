# doc-links（planning submodule 込み）— 定期・トークン付き検査
#
# 【役割（2026-08-14 更新・#496）】
#
# **PR 段階の検査は ci.yml が担うようになった。** `ci.yml` の `doc-links` / `test-traceability` は
# `submodules: recursive` + `PLANNING_REPO_TOKEN` + `--require-planning` で走り、
# **planning 配下リンクも PR ごとに検査して落とす**。
#
# 以前の分離（PR は非 planning だけ・planning は夜間）は、**「PR CI には PLANNING_REPO_TOKEN が
# 無い」という前提**に立っていた。**この前提は #495 の実測で反証された**——`kit-sync` ジョブが
# 同じトークンで PR の CI から submodule の取得に成功した。
#
# **それでも本ワークフローは畳まない。役割が変わったのである。**
#
#   PR CI が見るのは「**その PR の差分**」である。**計画側（planning）が更新されて実装側の参照が
#   切れる事故は、実装側に PR が無い間に起きる**。pin を進めた瞬間ではなく、進めないまま計画側で
#   ファイルが改名されたときに壊れる。**それを拾えるのは定期実行だけである。**
#
# 実例: 計画側の ADR ファイル改名に実装側 2 ファイルが未追随となり、夜間ジョブが 4 夜連続で
# 失敗したまま放置された（microservices-platform #430）。**放置されたのが問題であって、
# 夜間に検査すること自体は正しい。** 失敗に気付く導線（下の Notify ステップ）が要点である。
#
# 【まだ残る穴】
# `scripts/check-commit-messages.js` の計画 ADR 実在性検査は、`commit-messages` ジョブが
# submodule を取得しないため **PR CI では今も skip される**。実効するのは実装 ADR（IADR）側のみ。
# 同じ手（submodules + token + 必須化）で塞げるが、本ワークフローの範囲外である。
#
# 有効化手順（**本リポジトリでは 1) は完了済み＝本ファイルは稼働中**。キット雛形向けの手順を残す）:
#   1) 本ファイルを `doc-links-planning.yml` にリネームする。
#   2) Secret `PLANNING_REPO_TOKEN` に、本リポジトリと planning リポジトリ双方へ read 権限を持つ
#      PAT（fine-grained 推奨）を登録する。未登録の場合、本ジョブは submodule 取得に失敗して fail する
#      （＝設定漏れを可視化する。PR CI はブロックしない）。
name: doc-links (planning)

on:
  schedule:
    - cron: "0 17 * * *" # 毎日 17:00 UTC（≈ 02:00 JST）。プロジェクトに合わせて調整する
  workflow_dispatch:

permissions:
  contents: read
  # 失敗時に検知用 issue を起票するため（下の Notify ステップ）。不要なら削る。
  issues: write

concurrency:
  group: doc-links-planning
  cancel-in-progress: true

jobs:
  doc-links-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # 本体リポと planning submodule 双方の取得に使う（双方 read 権限が必要）。
          token: ${{ secrets.PLANNING_REPO_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # --require-planning: planning が未 populate（＝トークン未設定/取得失敗）なら fail する。
      # populate 済みなら planning 配下リンクも含めて実在検査する。
      - name: Check doc links (including planning submodule)
        run: node scripts/check-doc-links.js --require-planning

      # テストが参照する FR/UC/SC が計画書に実在するかの検査（issue #343 / IADR-0127）。
      # PR CI（ci.yml の test-traceability）は submodule 無しのため本検査だけを skip している。
      # 上の doc-links と同じ弱点（PR では止まらず夜間に初めて赤くなる）を共有するため、
      # 失敗の気付き導線は下の Notify ステップが共通で担う。
      - name: Check test traceability (including planning submodule)
        if: always()
        run: node scripts/check-test-traceability.js --require-planning

      # 失敗の気付き導線。夜間ジョブは PR に紐づかないため、通知が無いと「誰も見ない赤」が
      # 常態化する（実運用で 14 夜連続の失敗が放置された実績がある）。
      # 既に open の検知 issue があれば起票せず、無ければ 1 件だけ作る。
      - name: Notify on failure (open a tracking issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="fix(NFR): doc-links (planning) が失敗している"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "夜間の doc-links (planning) が再び失敗した: $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "$(printf 'planning submodule を含むリンク検査が失敗した。\n\n実行ログ: %s\n\n計画側のファイル改名に実装側の参照が未追随か、参照先ファイル名の誤り（存在しない計画書名）の可能性が高い。`node scripts/check-doc-links.js --require-planning` をローカルで実行して破損リンクを特定すること。' "$RUN_URL")"
          fi
