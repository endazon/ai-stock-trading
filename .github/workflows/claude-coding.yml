# Claude Code — @claude メンションで Issue / PR に応答する対話ワークフロー
#
# 有効化（このファイルは .example。AI_SETUP.md のプロファイルに従って有効化する）:
#   - 拡張子から .example を外す（git mv claude-coding.example.yml claude-coding.yml）。
#     scripts/apply-profile.sh claude-code / api でも自動化できる。
#   - 認証シークレットを「どちらか一方のみ」登録する
#     （GitHub → Settings → Secrets and variables → Actions → New repository secret）:
#       * Claude Code サブスクリプション（Pro/Max）: ローカルで `claude setup-token` を実行し
#         OAuth トークン（sk-ant-oat01-...）を発行して CLAUDE_CODE_OAUTH_TOKEN に登録する。
#         利用は購読プランのクォータに計上され、API キーは不要。
#       * Anthropic API: ANTHROPIC_API_KEY（sk-ant-api03-...）を登録する（従量課金）。
#     両方を設定しないこと（静的クレデンシャルが競合する）。未設定の方は空文字となり無視される。
#   - Issue / PR のコメント、PR レビューコメント、Issue 本文で「@claude ...」と書くと起動する
#   - このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効
#
# 位置づけ: worker スロットの Claude 用 GitHub 実装である（配役は ai-roster.json、
#   正本は docs/ai-orchestration.md）。他エンジンを worker の主とする場合も本ファイルは
#   削除せず有効のまま残す（失敗時に @claude メンションで切り戻すフォールバック経路になる）。
#
# モデル:
#   既定は claude-sonnet-5-5（レビュー側と同じ既定。高コストモデルは明示指定に限る）。
#   メンションで「@claude opus / sonnet / haiku」と書くと、そのモデルで起動する
#   （"Select model from mention" ステップが解析）。
#   既定値を変えたい場合は同ステップの MODEL="..." を書き換える。

name: Claude Coding

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# 同一 issue / PR への連続メンションで多重起動しないようにする。
# レビュー用（claude-code-review）と違い cancel-in-progress は false にする。
# 実装途中のセッションを打ち切ると、コミット前の変更が失われるため。
concurrency:
  group: claude-coding-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

# NFR: ワークフロー単位は読むだけにする。書き込み（ブランチの push・PR / issue へのコメント）は
# claude ジョブの permissions が持つ。このジョブは git push するので、checkout の資格情報は残す。
permissions:
  contents: read

jobs:
  claude:
    # @claude を含むイベントのみ起動する。
    # NFR: 加えて、**本文の書き手**が OWNER / MEMBER / COLLABORATOR のときだけ起動する
    # （起動した人ではなく、AI が読む本文を書いた人で判定する。issues の assigned では両者が異なる）。
    # NFR, IADR-0635: さらに、**対象の issue / PR の書き手**も同じ 3 つに限る（外の書き手の issue・PR の本文を読ませない。
    # 呼んだのがコラボレーターでも、外の人の PR・issue では起動しない）。PR は**同じリポジトリのブランチ**に限る（フォークの head の
    # コードを、書き込みのトークンの手の届く所でビルド・テストしない）。issue_comment の PR は、イベントに head が無いので
    # 下の「Check the target pull request」の段で確かめる。
    # 各句に author_association の判定を必ず置くこと（scripts/scripts.repo.test.js が句ごとに固定する）。
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # ハングした実装セッションが上限まで回り続けるのを防ぐ。
    # レビュー（20 分）より長めに取る（実装はビルド・テストを伴うため）。
    timeout-minutes: 45
    # NFR, IADR-0635: contents: write は実装の成果（ブランチの git push・push_files）に要るので残す。
    # id-token: write は外した。アクションは github_token を渡すとその値を使い、OIDC（App トークンへの交換）を求めない。
    # Anthropic への認証も API キー／OAuth トークンで、workload identity・Bedrock・Vertex を使わない（使うなら IADR を改定して戻す）。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # claude-code-review.example.yml と同じ理由（mcp__github_ci__* サーバーの導入条件）。
      # 実装セッションでは、自分が出した PR の CI 失敗を自分で読んで直すために要る。
      # 注: ツール許可に additional_permissions は使わない（あれはアプリトークンのスコープ用）。
      actions: read
    steps:
      # NFR, IADR-0635: issue_comment の対象が PR のとき、その PR が同じリポジトリのブランチであることを確かめる
      # （イベントに head が無いので API で引く）。フォークの PR・確かめられないときは止める（閉じる向き）。値は env で受ける。
      - name: Check the target pull request
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name // ""')" \
            || { echo "::error::対象の PR を引けません（起動しません）。"; exit 1; }
          if [ "$head" != "$REPOSITORY" ]; then
            echo "::error::対象の PR の head が別のリポジトリ（フォーク）です。AI は起動しません。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 実装リポの checkout / push には既定の GITHUB_TOKEN を使う（上の
          # permissions: contents: write が push を許可する）。ここで token を
          # 上書きしないこと。上書きすると checkout がその資格情報を永続化し、
          # 後段の git push もそのトークンで実行されるため、実装リポへの書き込み
          # 権限が無い PAT だと 403（Permission denied）になる。

      # 資料再編（ADR-0029 決定 2）で本リポジトリは planning への依存を持たない。以前ここにあった
      # 「計画リポジトリ(project-planning)を submodule 参照している場合のみ有効」な submodule
      # 取得ステップ（read-only PAT を一時的に使う形）は、.gitmodules 自体が撤去されたため削除した。

      # 検証(build/test)を @claude セッション内で実走するための SDK 準備。
      # 技術スタックに合わせて書き換える（既定は C#/.NET 10。ci.example.yml と揃える。
      # 他スタックは actions/setup-node / actions/setup-python 等に置き換える）。
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.403" # #1478: 厳密な版（"10.0.x" は配布元の 409 で導入できない）。全箇所で同じ値であることを scripts.repo.test.js が見る

      # @claude メンションでモデルを選択する。既定は claude-sonnet-5-5（品質基準を満たす最安モデルを
      # 既定にし、高コストモデルは明示指定に限る。レビュー側 claude-code-review と同じ方針）。
      # 複雑な実装には「@claude opus」と書くと上位モデルで起動する。
      # 本文はコマンドインジェクション防止のため env 経由で受け取り、run へ直接展開しない。
      - name: Select model from mention
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BODY="${COMMENT_BODY}
          ${REVIEW_BODY}
          ${ISSUE_BODY}
          ${ISSUE_TITLE}"
          MODEL="claude-sonnet-5-5"
          # fable は CI でも使わない（利用者裁定 2026-10-10・planning#783）。「@claude fable」と書いても既定モデルで起動する。
          if   printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+opus';   then MODEL="claude-opus-5-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+sonnet'; then MODEL="claude-sonnet-5-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+haiku';  then MODEL="claude-haiku-5-5"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected model: $MODEL"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
        # gh CLI（Issue 発行等）を既定トークンで認証する。gh は GH_TOKEN/GITHUB_TOKEN を参照する。
        # NFR, IADR-0635: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 で、AI が起動するサブプロセス（dotnet build / test・npm run など）の環境から
        # Anthropic・クラウド・GitHub Actions の秘密を落とす（アクションの action.yml がこの値を CLI へ渡す。best-effort）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          # 認証はどちらか一方のみ設定する（未設定の方は空文字で無視される）:
          #   サブスク = CLAUDE_CODE_OAUTH_TOKEN / API = ANTHROPIC_API_KEY
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub API アクセス用トークン（MCP GitHub ツール・スティッキーコメント投稿に必要）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 既定モデル: 変更可（レビュー用途は claude-sonnet-5-5 も可）
          #
          # --allowedTools: CI での権限はここ（claude_args）で決まる。アクションは
          #   リポジトリの .claude/settings.json を自動では読み込まないため、ローカル用
          #   settings.json とは別に、CI で使うツールはこの一覧に明示する。
          #   ローカル（.claude/settings.json）と内容を揃えておくと運用が分かりやすい。
          #   ・ユニバーサルツールと GitHub MCP は固定。
          #   ・スタック別ツール（一覧末尾の node / dotnet 系）は ci.example.yml 先頭コメントの
          #     対照表を参考に使用スタックのコマンドへ書き換えること（例: npm run:* / pytest:* / go test:*）。
          # 【記法・最重要】claude_args は**空白区切りで argv へトークン化**される。
          # 1 ツール 1 行で書くと `Bash(dotnet test:*)` が `Bash(dotnet` と `test:*)` に割れ、
          # 空白を含む指定（git 系・dotnet 系・gh 系）が**すべて無効**になる。正しい記法は
          # 「二重引用符でくくった 1 引数・カンマ区切り」（公式ドキュメント準拠）。
          # 検証: ジョブログの `SDK options:` の allowedTools 配列が割れていないか目視する。
          #
          # 末尾のビルド/テスト系（node / dotnet）がスタック別の可変部分である。
          # claude-code-review.example.yml の対応箇所と**同じ内容**に保つこと。
          #
          # 【読み取り専用ツールの対称性（issue planning#160）】head / tail / cmp / diff /
          # git ls-tree / git fetch はレビュー用に先に入ったが、実装用にも同じ作業
          # （キット同期時のバイト一致確認）があるため揃えてある。**ドリフト検査
          # （check-ai-workflow-config）はスタック別の実行ツールしか見ないため、この種の
          # 非対称は機械的に検出されない。**手で揃えること。
          # 🔴 `Bash(git submodule status:*)` は #712 で 3 系統から削除した（ADR-0029 決定 2 で
          # submodule 自体が撤去済みのため、確認する対象が存在しない）。
          #
          # 【--append-system-prompt: サブエージェント禁止】レビュー用は同じ制約を prompt:
          # 入力に書いているが、本ファイルは `@claude` メンション本文で駆動する構造のため
          # prompt: を持たず、置き場所がここしか無い（issue planning#149）。
          # 制約が無いと次の形で**成果物が正しくてもジョブが赤くなる**:
          #   AI が Task（サブエージェント）を試みる → 許可リストにも既定にも無いので拒否
          #   → Task 抜きで実装を完遂しコミット・PR も正しく出せる
          #   → 末尾の Check permission denials が拒否 1 件を検出して exit 1
          # Task を許可する選択もあるが採らない。CI ではサブエージェントの起動が完了せず
          # 停止する不具合が出ており（HOWTO 付録3）、レビュー用と同じ (b) に揃える。
          # 【記法】この値も空白区切りでトークン化される。**1 行・二重引用符でくくる**こと
          # （改行して書くと後続行が別の引数になり、指示が壊れる）。
          # 【最小化（NFR）】実装用からは find と sed を外し、node は `node scripts/` の前置の形だけを許す
          # （基盤の claude-coding.yml の最小化に揃えた。レビュー用の `node:*` / `sed:*` との差は
          # check-ai-workflow-config.js の CODING_NARROWED_TOOLCHAIN / REVIEW_ONLY_BASH が宣言する）。広げるときは IADR を改定すること。
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --append-system-prompt "この実行は単一セッション内で完結させること。サブエージェント（Task ツールによる spawn。.claude/agents/ 定義の起動を含む）は使用しない。CI では Task が許可されておらず、呼び出しは必ず拒否されるうえ、拒否が 1 件でも記録されるとジョブは失敗する。作業の分割は自分の作業順序として扱い、Read / Grep / Glob / Bash / GitHub MCP ツールで自分自身が順に実施すること。また cd でディレクトリを移動しないこと（cd は許可リストに無く、cd <サブディレクトリ> && git log の形は後続が許可済みでも先頭で拒否される）。サブディレクトリの履歴は git log -- <パス> の形で参照すること。ファイルの列挙は Glob を、置換は Edit を使うこと（find と sed は許可されていない）。node は node scripts/<ファイル> の形（リポジトリの scripts/ 配下のスクリプトを実行する形）だけが使え、node -e や他の場所のスクリプトは拒否される。"
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-tree:*),Bash(git ls-files:*),Bash(git fetch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(rg:*),Bash(grep:*),Bash(sort:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(cmp:*),Bash(diff:*),Bash(echo:*),Bash(which:*),Bash(yq:*),Bash(helm template:*),Bash(helm lint:*),Bash(mkdir:*),Bash(gh issue create:*),mcp__github__pull_request_read,mcp__github__get_file_contents,mcp__github__issue_read,mcp__github__get_issue,mcp__github__get_pull_request,mcp__github__get_issue_comments,mcp__github__get_pull_request_reviews,mcp__github__search_issues,mcp__github__list_sub_issues,mcp__github__list_workflow_runs,mcp__github__actions_list,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__add_issue_comment,mcp__github__push_files,Bash(node scripts/:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(dotnet ef:*),Bash(dotnet --version),Bash(dotnet --info),Bash(npm ci:*),Bash(npm run:*),Bash(npm --prefix:*),Bash(bash scripts/k8s-local-deploy.test.sh:*),Bash(bash deploy/opend/entrypoint.test.sh:*),Bash(bash scripts/cutover-count-reconcile.test.sh:*)"

      # 権限拒否の可視化（安全弁）。claude-code-review.example.yml と同じ内容に保つこと。
      #
      # claude-code-action は、AI がツールを 1 つも実行できなくても
      # `"subtype": "success", "is_error": false` で終わる。実装側では「実装したつもりで
      # 何もコミットされていない」形になり、ジョブは緑のままである。
      # CI には承認する人間が居ないため、権限拒否は「待たされた」ではなく
      # **「その作業は永久に実行されない」**を意味する。ここで止める。
      #
      # if: always() が必須である（上の step が失敗した場合こそ内訳を知りたい）。
      # 実行ログを読めない構成では warn を出して exit 0（fail-open）。
      - name: Check permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-permission-denials.js "$EXECUTION_FILE"
