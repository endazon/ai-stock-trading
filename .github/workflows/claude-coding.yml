# Claude Code — @claude メンションで Issue / PR に応答する対話ワークフロー
#
# 有効化（このファイルは .example。AI_SETUP.md のプロファイルに従って有効化する）:
#   - 拡張子から .example を外す（git mv claude-coding.example.yml claude-coding.yml）。
#     scripts/apply-profile.sh claude-code / api でも自動化できる。
#   - 認証シークレットを「どちらか一方のみ」登録する
#     （GitHub → Settings → Secrets and variables → Actions → New repository secret）:
#       * Claude Code サブスクリプション（Pro/Max）: ローカルで `claude setup-token` を実行し
#         OAuth トークン（sk-ant-oat01-...）を発行して CLAUDE_CODE_OAUTH_TOKEN に登録する。
#         利用は購読プランのクォータに計上され、API キーは不要。
#       * Anthropic API: ANTHROPIC_API_KEY（sk-ant-api03-...）を登録する（従量課金）。
#     両方を設定しないこと（静的クレデンシャルが競合する）。未設定の方は空文字となり無視される。
#   - Issue / PR のコメント、PR レビューコメント、Issue 本文で「@claude ...」と書くと起動する
#   - このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効
#
# モデル:
#   既定は最新の claude-opus-5。メンションで「@claude opus / sonnet / haiku」と
#   書くと、そのモデルで起動する（"Select model from mention" ステップが解析）。
#   既定値を変えたい場合は同ステップの MODEL="..." を書き換える。

name: Claude Coding

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# 同一 issue / PR への連続メンションで多重起動しないようにする。
# レビュー用（claude-code-review）と違い cancel-in-progress は false にする。
# 実装途中のセッションを打ち切ると、コミット前の変更が失われるため。
concurrency:
  group: claude-coding-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # @claude を含むイベントのみ起動する
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # ハングした実装セッションが上限まで回り続けるのを防ぐ。
    # レビュー（20 分）より長めに取る（実装はビルド・テストを伴うため）。
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # claude-code-review.example.yml と同じ理由（mcp__github_ci__* サーバーの導入条件）。
      # 実装セッションでは、自分が出した PR の CI 失敗を自分で読んで直すために要る。
      # 注: ツール許可に additional_permissions は使わない（あれはアプリトークンのスコープ用）。
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 実装リポの checkout / push には既定の GITHUB_TOKEN を使う（上の
          # permissions: contents: write が push を許可する）。ここで token を
          # 上書きしないこと。上書きすると checkout がその資格情報を永続化し、
          # 後段の git push もそのトークンで実行されるため、実装リポへの書き込み
          # 権限が無い PAT だと 403（Permission denied）になる。

      # 計画リポジトリ(project-planning)を submodule 参照している場合のみ有効。
      # PLANNING_REPO_TOKEN は organization の secret に登録した fine-grained PAT で、
      # project-planning への Contents: Read 権限のみを付与する。実装リポの push 認証
      # (GITHUB_TOKEN) とは分離するため、submodule 取得の間だけ一時的に PAT を使い、
      # 直後に解除して push へ漏れないようにする（.gitmodules が無ければ何もしない）。
      - name: Fetch planning submodule (read-only PAT)
        env:
          SUBMODULE_PAT: ${{ secrets.PLANNING_REPO_TOKEN }}
        run: |
          if [ -f .gitmodules ]; then
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule sync --recursive
            git submodule update --init --recursive
            git config --global --unset-all url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf
          fi

      # 検証(build/test)を @claude セッション内で実走するための SDK 準備。
      # 技術スタックに合わせて書き換える（既定は C#/.NET 10。ci.example.yml と揃える。
      # 他スタックは actions/setup-node / actions/setup-python 等に置き換える）。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # @claude メンションでモデルを選択する。既定は claude-opus-5。
      # 「@claude opus / sonnet / haiku」と書くとそのモデルで起動する。
      # 本文はコマンドインジェクション防止のため env 経由で受け取り、run へ直接展開しない。
      - name: Select model from mention
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BODY="${COMMENT_BODY}
          ${REVIEW_BODY}
          ${ISSUE_BODY}
          ${ISSUE_TITLE}"
          MODEL="claude-opus-5"
          if   printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+fable';  then MODEL="claude-fable-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+opus';   then MODEL="claude-opus-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+sonnet'; then MODEL="claude-sonnet-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+haiku';  then MODEL="claude-haiku-4-5-20251001"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected model: $MODEL"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        # gh CLI（Issue 発行等）を既定トークンで認証する。gh は GH_TOKEN/GITHUB_TOKEN を参照する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 認証はどちらか一方のみ設定する（未設定の方は空文字で無視される）:
          #   サブスク = CLAUDE_CODE_OAUTH_TOKEN / API = ANTHROPIC_API_KEY
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub API アクセス用トークン（MCP GitHub ツール・スティッキーコメント投稿に必要）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 既定モデル: 変更可（レビュー用途は claude-sonnet-5 も可）
          #
          # --allowedTools: CI での権限はここ（claude_args）で決まる。アクションは
          #   リポジトリの .claude/settings.json を自動では読み込まないため、ローカル用
          #   settings.json とは別に、CI で使うツールはこの一覧に明示する。
          #   ローカル（.claude/settings.json）と内容を揃えておくと運用が分かりやすい。
          #   ・ユニバーサルツールと GitHub MCP は固定。
          #   ・スタック別ツール（一覧末尾の node / dotnet 系）は ci.example.yml 先頭コメントの
          #     対照表を参考に使用スタックのコマンドへ書き換えること（例: npm run:* / pytest:* / go test:*）。
          # 【記法・最重要】claude_args は**空白区切りで argv へトークン化**される。
          # 1 ツール 1 行で書くと `Bash(dotnet test:*)` が `Bash(dotnet` と `test:*)` に割れ、
          # 空白を含む指定（git 系・dotnet 系・gh 系）が**すべて無効**になる。正しい記法は
          # 「二重引用符でくくった 1 引数・カンマ区切り」（公式ドキュメント準拠）。
          # 検証: ジョブログの `SDK options:` の allowedTools 配列が割れていないか目視する。
          #
          # 末尾のビルド/テスト系（node / dotnet）がスタック別の可変部分である。
          # claude-code-review.example.yml の対応箇所と**同じ内容**に保つこと。
          #
          # 【--append-system-prompt: サブエージェント禁止】レビュー用は同じ制約を prompt:
          # 入力に書いているが、本ファイルは `@claude` メンション本文で駆動する構造のため
          # prompt: を持たず、置き場所がここしか無い（issue #149）。
          # 制約が無いと次の形で**成果物が正しくてもジョブが赤くなる**:
          #   AI が Task（サブエージェント）を試みる → 許可リストにも既定にも無いので拒否
          #   → Task 抜きで実装を完遂しコミット・PR も正しく出せる
          #   → 末尾の Check permission denials が拒否 1 件を検出して exit 1
          # Task を許可する選択もあるが採らない。CI ではサブエージェントの起動が完了せず
          # 停止する不具合が出ており（HOWTO 付録3）、レビュー用と同じ (b) に揃える。
          # 【記法】この値も空白区切りでトークン化される。**1 行・二重引用符でくくる**こと
          # （改行して書くと後続行が別の引数になり、指示が壊れる）。
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --append-system-prompt "この実行は単一セッション内で完結させること。サブエージェント（Task ツールによる spawn。.claude/agents/ 定義の起動を含む）は使用しない。CI では Task が許可されておらず、呼び出しは必ず拒否されるうえ、拒否が 1 件でも記録されるとジョブは失敗する。作業の分割は自分の作業順序として扱い、Read / Grep / Glob / Bash / GitHub MCP ツールで自分自身が順に実施すること。"
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git -C planning log:*),Bash(git -C planning show:*),Bash(git -C planning diff:*),Bash(git -C planning ls-tree:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(find:*),Bash(rg:*),Bash(cat:*),Bash(mkdir:*),Bash(gh issue create:*),mcp__github__pull_request_read,mcp__github__get_file_contents,mcp__github__issue_read,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__add_issue_comment,mcp__github__push_files,Bash(node:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*)"

      # 権限拒否の可視化（安全弁）。claude-code-review.example.yml と同じ内容に保つこと。
      #
      # claude-code-action は、AI がツールを 1 つも実行できなくても
      # `"subtype": "success", "is_error": false` で終わる。実装側では「実装したつもりで
      # 何もコミットされていない」形になり、ジョブは緑のままである。
      # CI には承認する人間が居ないため、権限拒否は「待たされた」ではなく
      # **「その作業は永久に実行されない」**を意味する。ここで止める。
      #
      # if: always() が必須である（上の step が失敗した場合こそ内訳を知りたい）。
      # 実行ログを読めない構成では warn を出して exit 0（fail-open）。
      - name: Check permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-permission-denials.js "$EXECUTION_FILE"
