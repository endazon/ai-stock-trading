# CodeQL（SAST）雛形 — 言語に依存するため .example（コピー後に codeql.yml にリネーム）。
# matrix.language を使用スタックに合わせて変更する:
#   csharp / java-kotlin / javascript-typescript / python / go / ruby / swift / c-cpp
# 既定は C#（csharp）。

name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    # コード変更の無い PR では解析を回さない（#481・kit: planning#327 追随）。
    # push / schedule は全量解析のまま。paths 付きチェックは required check に指定しないこと（恒久 pending になる）。
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.slnx"
      - "**/*.sln"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 3 * * 1"

# NFR / IADR-0208 決定 1: 連続 push で古い実行を捨てる。
# 🔴 develop / main への push と週次 schedule はキャンセルしない —— PR で落とした精度を
# 担保しているのはそちら（build-mode: autobuild の全量解析）であり、捨てると担保が失われる。
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          # NFR / IADR-0208 決定 4: **PR だけ** ビルド不要の build-mode: none にする。
          # build-mode は none / autobuild / manual の 3 値を取る文字列入力なので、
          # イベントで切り替えられる。
          #
          # 🔴 **PR と後段で精度が違う。** ここが最も誤解しやすい点なので明記する。
          #   - PR: build-mode: none。ビルドせず解析する（PR ではインクリメンタル解析が効く）。
          #     **生成コードは解析対象外になる。** 下の Autobuild も走らない。
          #   - push（develop/main）・週次 schedule: build-mode: autobuild ＋ 下の Autobuild。
          #     **従来と同じ精度**であり、PR で落とした分をここで担保する（IADR-0208 決定 1）。
          #
          # したがって **PR が緑でも push で赤くなることがあり得る。それは退行ではなく設計どおり**である。
          build-mode: ${{ github.event_name == 'pull_request' && 'none' || 'autobuild' }}
      # 【落とし穴】autobuild はリポジトリ全体を走査してビルド対象を推定するため、**ビルド不可の
      # 雛形ソリューション**（スキャフォールド用に置いてあり、共通 props を継承せず単体では
      # ビルドできないもの）を同梱するリポジトリでは、それを拾ってジョブが失敗する。
      # エラーは「ビルドに失敗した」としか出ず、原因が雛形であることは出力から読み取れない。
      # CodeQL は実行時間が長いため試行錯誤のコストも高い。
      #
      # 同種のトラップへの対処が scripts/setup.sh・security.yml（2 か所）・
      # copilot-setup-steps.example.yml にもあるが、それらは `find` の除外で対処できるのに対し、
      # **autobuild は find を使わないため同じ方法では直せない**。該当する場合は下の Autobuild を
      # 削除し、実ビルド対象を明示するステップへ置き換えること。置き換え例:
      #
      #   - name: Build backend units (traced)
      #     run: |
      #       for slnx in src/*/backend/backend.slnx; do
      #         echo "::group::$slnx"
      #         dotnet build "$slnx" --configuration Release
      #         echo "::endgroup::"
      #       done
      #
      # 明示ビルドにする場合は、init と analyze の間に置いて CodeQL のトレーサに載せること。
      # build-mode: none（PR）ではビルドしないので走らせない。これが PR の待ち時間の大半である。
      - name: Autobuild
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/autobuild@v4.37.7
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  # 🔴 PR から落とした精度の担保（build-mode: autobuild の全量解析）が落ちたことを issue に残す
  # （IADR-0208 決定 1）。PR 経路（build-mode: none）では起票しない —— PR は自身の check が
  # 赤くなるので気付けるためである。
  report-failure:
    needs: [analyze]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/ci-failure-issue.yml
    permissions:
      contents: read
      issues: write
