# セキュリティ自動化: 秘密情報スキャン ＋ 依存関係レビュー ＋ 推移依存の脆弱性スキャン
#
# - gitleaks: コミット/履歴に秘密情報が混入していないか検査（AI が誤って鍵を混入するリスクに対処）。
# - dependency-review: PR で「新たに導入される」依存に既知の重大脆弱性が無いか検査（PR 差分のみ）。
# - vulnerable-scan: 既存の「推移依存」を含む全依存を `dotnet list package --vulnerable` で走査（NFR・#61 の後継）。
#     dependency-review は PR 差分しか見ないため、マージ後に公開された advisory（例: NU1903/GHSA-v5pm-xwqc-g5wc）を
#     取りこぼす。schedule で定期実行し、変更の無い既存依存に対しても新規 advisory を検出する。
#
# このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効。

name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]
  # 定期実行: 変更が無くても、後から公開された advisory を既存の推移依存に対して検出する（PR 差分検査では不可能）。
  schedule:
    - cron: "0 3 * * 1"

# NFR / IADR-0208 決定 1: 連続 push で古い実行を捨てる。
# 🔴 develop / main への push と週次 schedule はキャンセルしない（後から公開された advisory を
# 既存の依存に対して検出する定期実行であり、捨てると当該時点の走査が残らない）。
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 誤検知の扱い（実運用の知見）:
      #   - 単発・履歴上の誤検知（例示鍵・ダミー ID 等）は `.gitleaksignore` に fingerprint を
      #     追記して無効化する（履歴は書き換えない＝force-push しない方針）。
      #   - **同型の誤検知が繰り返し出る**場合（アプリが生成する自然キー等、値の形が決まっている
      #     もの）は fingerprint 追記では再発を止められない。新しいコミットは別 fingerprint に
      #     なるためである。この場合は `.gitleaks.toml` を置き、`[extend] useDefault = true` で
      #     既定ルールを維持したまま、その値形だけを `[allowlist]` の正規表現で狙い撃ちする。
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # NFR(セキュリティ): 推移依存を含む全依存の既知脆弱性を検出する（#61 NU1903 の後継・恒久化）。
  # dependency-review が見ない「既存の推移依存 × 後から公開された advisory」を、CPM(Directory.Packages.props)の
  # 中央定義に対して走査する。schedule での定期実行が主目的（PR/push でも二重に検査する）。
  vulnerable-scan:
    name: Vulnerable transitive dependencies
    runs-on: ubuntu-latest
    # NFR / IADR-0208 決定 5: **PR でも走らせる。**
    #
    # 当初は「本ジョブが見るのは『既存の推移依存 × 後から公開された advisory』であり PR の差分とは
    # 無関係。PR 差分は dependency-review がカバーしている」として PR から外していた。
    # **利用者裁定（2026-08-22）「なるべく精度は落とさない方向で」により取り下げた。**
    #
    # dependency-review が依存グラフの差分を見るのに対し、本ジョブは実際に restore した推移閉包を
    # `dotnet list package --vulnerable --include-transitive` で見る。**見ている面が違う以上、
    # 「重複だから外してよい」と言い切れない。** 迷ったら残す。
    #
    # 速さは NuGet キャッシュ（下）で取る。security.yml は CI と並列に走り
    # クリティカルパスではないため、残しても PR の待ち時間はほぼ変わらない。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # ソリューションを自動発見して走査する（ルート単一 .sln/.slnx でも、ユニット第一構成
      # `src/<unit>/backend/backend.slnx` でも編集不要で動く）。スタックが異なる場合は差し替える。
      - name: Restore
        run: |
          for sln in $(find . -maxdepth 4 \( -name '*.slnx' -o -name '*.sln' \) -not -path '*/node_modules/*' -not -path './templates/*' | sort); do
            dotnet restore "$sln"
          done
      - name: List vulnerable packages (incl. transitive)
        run: |
          set -o pipefail
          # `dotnet list package --vulnerable` は脆弱性が有っても exit 0 を返すため、出力を解析して判定する。
          : > vuln-report.txt
          for sln in $(find . -maxdepth 4 \( -name '*.slnx' -o -name '*.sln' \) -not -path '*/node_modules/*' -not -path './templates/*' | sort); do
            dotnet list "$sln" package --vulnerable --include-transitive 2>&1 | tee -a vuln-report.txt
          done
          # 脆弱な依存の行は必ず GitHub Advisory URL(https://github.com/advisories/GHSA-...)を含む。
          # 深刻度語(High 等)はパッケージ名に紛れ得るため、より特異な advisory URL の有無で判定する。
          if grep -Eq 'https?://github\.com/advisories/' vuln-report.txt; then
            echo "::error::Vulnerable (transitive) dependencies detected. 上記表の advisory を参照し、Directory.Packages.props で該当パッケージをパッチ版へピンすること（#61 と同手順）。"
            exit 1
          fi
          echo "No vulnerable packages found."

  # push / 週次 schedule での失敗を issue に残す（IADR-0208 決定 1）。
  # PR では起票しない —— PR は自身の check が赤くなるので気付けるためである。
  report-failure:
    needs: [secret-scan, vulnerable-scan]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/ci-failure-issue.yml
    permissions:
      contents: read
      issues: write
