# 全テスト（実コンテナ含む）の回収実行（issue #82 / IADR-0049 / IADR-0208 改定 3）
#
# 既定 CI（ci.yml）は --filter "Category!=Integration" で、実 PostgreSQL / RabbitMQ を
# Testcontainers で起動するテストを PR から外している。**その回収先が本ワークフローである。**
# **回収先が無ければ「PR から外した」は「やめた」と同義になる。**
#
# 🔴 **ここでは --filter を付けず、全テストを 1 回走らせる**（下の run ステップに理由を詳述）。
# 両側でフィルタすると、Trait を付け忘れたテストがどこでも走らない形に倒れるためである。
#
# 走るのは develop への push（マージのたび）／日次 schedule（flaky・環境ドリフト）／手動である。
# GitHub の ubuntu ランナーは Docker 同梱のため Testcontainers が動作する。
name: Integration E2E

on:
  # 🔴 IADR-0208 決定 1（利用者裁定 2026-08-21）: PR から外した検証は develop へのマージ時にも
  # 回す。日次だけだと、朝までの間に別の PR が積み上がって原因の切り分けが難しくなる。
  push:
    branches: [develop]
  schedule:
    # 毎日 UTC 18:00（JST 03:00）に実行。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "自動起票の動作確認用に、テストを走らせず必ず失敗させる（IADR-0208 残余リスク）"
        type: boolean
        required: false
        default: false

# 同時実行は 1 本に制限（ランナー上の Docker リソース競合回避）。
# 🔴 cancel-in-progress: false。ここは PR から外した検証の担保そのものなので、
# 後続の push で捨ててはならない（ci.yml の PR 側とは意図が逆である。IADR-0208 決定 1）。
concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # NFR / IADR-0208: NuGet のグローバルパッケージをキャッシュする（ci.yml と同じキー）。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # 自動起票が本当に動くかを実測するための入口（IADR-0208 残余リスク）。
      # 自動起票は失敗時にしか走らないため、平時は常に skip で緑になる ——
      # 意図的に失敗させない限り「壊れていること」に永久に気付けない。
      - name: Force failure (自動起票の動作確認用)
        if: ${{ inputs.force_failure }}
        run: |
          echo "::error::force_failure=true が指定された。自動起票の経路を確認するための意図的な失敗である。"
          exit 1
      - name: Restore
        run: dotnet restore backend/backend.slnx
      - name: Build
        run: dotnet build backend/backend.slnx --no-restore --configuration Release
      # 🔴 **--filter を付けない。全テストを 1 回だけ走らせる**（IADR-0208 改定 3）。
      #
      # 既定 CI（ci.yml）は --filter "Category!=Integration" で Testcontainers を起動するテストを
      # 外している。その回収先が本ワークフローである。**ここでもフィルタすると、
      # [Trait("Category","Integration")] を付け忘れたテストが「PR でも日次でも走らない」形に倒れる。**
      # フィルタを外しておけば、付け忘れたテストは ci.yml 側に残る（fail-safe）。
      #
      # 副次的に、フィルタに依存しなくなるので fail-closed の門（0 件実行で落とす）も要らなくなった。
      # 門は「フィルタに依存するなら併設する」ものであり、依存自体を無くしたということである。
      #
      # 🔴 **ここに --filter を戻すなら、fail-closed の門を必ず併設すること。**
      # `dotnet test` はフィルタに 1 件も一致しなくても exit 0 で終わるため、
      # 門が無いと「0 件実行のまま緑」で通り続ける。
      #
      # NFR / #1200 / IADR-0497: --logger trx は下の skip 検査の入力である（TRX が無ければ検査は赤）。
      - name: All tests including real containers
        id: tests
        run: >-
          dotnet test backend/backend.slnx --no-build --configuration Release --verbosity normal
          --logger trx --results-directory "$PWD/integration-results"
      # 🔴 **「全 skip で緑」を検知する担保**（NFR / #1200 / IADR-0497。正本は MSP/ADR-0090 決定 3・planning#575）。
      #
      # 統合テストは要る依存（PostgreSQL・RabbitMQ・Keycloak）を得られなければ理由つきで skip する
      # （門は backend/Tests/AiStockTrading.IntegrationTests/RequiredServices.cs）。**Docker のある本ワークフローで
      # skip が出たら、それは依存が揃っていない実行である** —— skip 件数の上限 0 で赤にし、件数・試験名・理由をログへ出す。
      # 従前は Docker に届かないと fail しており、その fail が偶然この守りを担っていた。門と同じ PR で置き直した。
      #
      # 🔴 上の「fail-closed の門（0 件実行で落とす）も要らなくなった」は --filter 由来の 0 件の話であり、
      # 本検査（skip 由来の未実走）とは別物である。取り違えて外さないこと。
      #
      # テストが赤くても評価する（skip と失敗は独立した観測）。テスト step 自体が走らなかったとき（force_failure）だけ走らない。
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          node-version: "22"
      - name: Self-test integration skip checker
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/check-integration-skips.js --self-test
      - name: Check integration tests were not skipped (全 skip で緑にしない)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node scripts/check-integration-skips.js integration-results

  # 🔴 PR から外した検証の回収が落ちたことを issue に残す（IADR-0208 決定 1）。
  # これが無ければ「PR から外した」は「やめた」と同義になる。
  # 本ワークフローは元から nightly 分離済み（IADR-0049）だが自動起票が無く、
  # 赤が黙って積み上がる形だった。同型の穴を 2 つ残さないため、ここにも入れる。
  report-failure:
    needs: [integration-e2e]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/ci-failure-issue.yml
    permissions:
      contents: read
      issues: write
