// NFR, FR-10, FR-03, FR-04, FR-06, FR-20, FR-21, MSP:ADR-0029, MSP:ADR-0075, IADR-0284 決定 5（段 2）, IADR-0328 決定 4,
// IADR-0331 決定 7, IADR-0427, #997 (#753):
// リスク管理の**読み取り**（OwnerOrService）の同期照会の gRPC 契約。REST の `GET /risk-controls/…` と同じ意味論であり、
// 提供側は REST と同じサービス・純関数を呼ぶ（評価器を 2 つにしない）。
//
// ■ 置き場と所有（IADR-0328 決定 4 / IADR-0331 決定 7）
//   所有者は呼び出される側（RiskManagementService）。置き場は共有プロジェクト `AiStockTrading.Shared.Grpc`。
//
// ■ 🔴 原則 A（不明・無し・有りを取り違えない。IADR-0427 決定 3）
//   REST の受け手は、項目が欠けた応答（送り手の改名など）を既定値で読まないよう **nullable の DTO** で受けていた
//   （#943 / #957）。proto3 の暗黙の既定値（0 / "" / false / 列挙 0）はその区別を消すので、ここでは次の形で運ぶ。
//   - スカラーは**すべて `optional`**（存在を持つ）。欠落は「不明」であり、0・false・空として読まない。
//   - 列挙は**すべて `*_UNSPECIFIED = 0`** を持つ。C# の列挙とは番号が 1 ずれる（C# の 0 は `Japan` / `Buy` 等の実在値）ため、
//     両端で**名前で明示的に**写す。未指定・未知の番号は「不明」。
//   - 金額・率は**不変文化の 10 進文字列**（IADR-0331 決定 2 と同じ理由）。🔴 **空・欠落は 0 ではなく不明**である
//     （段 1 の `"" → 0` とは違う。ここで運ぶ金額は REST の受け手が nullable で受けていたもの）。
//   - 日付は `yyyy-MM-dd`、時刻は往復書式（`O`・オフセットを保つ）の文字列。
//   - REST が「一覧が null（未供給）」と「一覧が空」を分けていた箇所は、存在を持つ入れ物 message で運ぶ。
//
// ■ 運ぶ項目（IADR-0427 決定 4）
//   **移した呼び出し元が読む項目だけ**を運ぶ（REST の応答はより多くを持つ）。足すのはフィールド追加＝非破壊である。
//
// ■ 🔴 message 名を送り手（RiskManagementService）の C# の型名と同じにしない（`OpenPosition` ではなく `OpenPositionRow` 等）
//   生成型は受け手の本番コードに現れる。送り手の型名が受け手の本番コードに現れると、送り手の型による契約テストの判定
//   （IADR-0420 決定 3 の ⑤「送り手が宣言し、受け手の本番コードが宣言も参照もしない型を使う」）が効かなくなる
//   （実測: 当初 `LedgerFill` と名付けて報告書の約定の契約テストが「無い」と判定された）。
//
// ■ s2s（IADR-0328 決定 2）
//   `authorization` メタデータには呼び出し側サービス自身の client credentials JWT を載せる。利用者のトークンは載せない。
//   本 service の rpc は利用者の文脈を取らない（REST の読み取りも主体を読まない）。
syntax = "proto3";

package aistocktrading.riskmanagement.v1;

option csharp_namespace = "AiStockTrading.Shared.Grpc.RiskManagement.V1";

// リスク管理の読み取り。REST の読み取り群（`/risk-controls/*`・OwnerOrService）と同じ認可・同じ評価器を通る。
// - 呼び出し側サービスの資格情報が無い → UNAUTHENTICATED、ロールが無い → PERMISSION_DENIED
// - 期間の必須引数が無い（REST の 400）→ INVALID_ARGUMENT
// - 提供側が不調・不達 → UNAVAILABLE、deadline 超過 → DEADLINE_EXCEEDED
//   （いずれも呼び出し元は REST と同じ安全側既定へ倒す）
service RiskControlsRead {
  // GET /risk-controls/open-positions（建玉の射影。数量は常に正・向きは side）。
  rpc GetOpenPositions(GetOpenPositionsRequest) returns (GetOpenPositionsResponse);
  // GET /risk-controls/working-entry-orders（当日の未約定の新規建て注文）。
  rpc GetWorkingEntryOrders(GetWorkingEntryOrdersRequest) returns (GetWorkingEntryOrdersResponse);
  // GET /risk-controls/sizing-context（サイジング文脈）。
  rpc GetSizingContext(GetSizingContextRequest) returns (GetSizingContextResponse);
  // GET /risk-controls/entry-blockers?symbol&market（銘柄単位の新規建ての可否。審査と同じ述語。#1113 / IADR-0463）。
  // symbol・market の欠落は INVALID_ARGUMENT。
  rpc GetEntryBlockers(GetEntryBlockersRequest) returns (GetEntryBlockersResponse);
  // GET /risk-controls/stage-gate（段階ゲートの現況。現段階と、Discord ボットの `/stage status` が読む項目。段 5 で項目を足した）。
  rpc GetStageGate(GetStageGateRequest) returns (GetStageGateResponse);
  // GET /risk-controls/fills?from&to（期間の約定。取り込み行は含まない）。
  rpc GetFills(GetFillsRequest) returns (GetFillsResponse);
  // GET /risk-controls/drift-adoptions?from&to（期間の乖離の取り込み）。
  rpc GetDriftAdoptions(GetDriftAdoptionsRequest) returns (GetDriftAdoptionsResponse);
  // GET /risk-controls/buy-in-inferences?from&to（強制買戻しの推定と観測の到達）。
  rpc GetBuyInInferences(GetBuyInInferencesRequest) returns (GetBuyInInferencesResponse);
  // GET /risk-controls/session-uptime?from&to（OpenD 稼働率）。
  rpc GetSessionUptime(GetSessionUptimeRequest) returns (GetSessionUptimeResponse);
  // GET /risk-controls/opening-inventory?market&before（期間開始時点の在庫。#1181 / IADR-0493）。
  // market・before の欠落・未指定は INVALID_ARGUMENT。
  rpc GetOpeningInventory(GetOpeningInventoryRequest) returns (GetOpeningInventoryResponse);
}

// ---- 列挙（C# の列挙とは名前で写す。未指定・未知は「不明」） ----

enum Market {
  MARKET_UNSPECIFIED = 0;
  MARKET_JAPAN = 1;
  MARKET_UNITED_STATES = 2;
}

enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
}

enum PositionEffect {
  POSITION_EFFECT_UNSPECIFIED = 0;
  POSITION_EFFECT_OPEN = 1;
  POSITION_EFFECT_CLOSE = 2;
}

enum BrokerProvider {
  BROKER_PROVIDER_UNSPECIFIED = 0;
  BROKER_PROVIDER_INTERNAL_PAPER = 1;
  BROKER_PROVIDER_MOOMOO_REAL = 2;
  BROKER_PROVIDER_MOOMOO_SIMULATE = 3;
}

enum StopLossExecutionMethod {
  STOP_LOSS_EXECUTION_METHOD_UNSPECIFIED = 0;
  STOP_LOSS_EXECUTION_METHOD_BROKER_STOP_ORDER = 1;
  STOP_LOSS_EXECUTION_METHOD_SOFTWARE_STOP = 2;
  STOP_LOSS_EXECUTION_METHOD_NO_PROTECTIVE_STOP = 3;
  STOP_LOSS_EXECUTION_METHOD_ALTERNATIVE_BROKER_ORDER_TYPE = 4;
}

enum TradingStage {
  TRADING_STAGE_UNSPECIFIED = 0;
  TRADING_STAGE_STAGE0_VERIFICATION = 1;
  TRADING_STAGE_STAGE1_SIMULATE = 2;
  TRADING_STAGE_STAGE2_MINIMAL_LIVE = 3;
  TRADING_STAGE_STAGE3_SCALED_LIVE = 4;
}

// FR-20, IADR-0449（段 5）: 段階遷移の種別（C# `StageTransitionKind`）。名前で写す。
enum StageTransitionKind {
  STAGE_TRANSITION_KIND_UNSPECIFIED = 0;
  STAGE_TRANSITION_KIND_PROMOTION = 1;
  STAGE_TRANSITION_KIND_DEMOTION = 2;
  STAGE_TRANSITION_KIND_SHORT_SELL_RELEASE_VERDICT = 3;
}

// FR-20, IADR-0449（段 5）: 段階遷移の合格・拒否の基準（C# `StageGateCriterion`）。C# の 1（旧 PaperDeviationUnexplained）は
// 廃止済みで送り手に存在しないため、線上にも置かない（受け手は REST と同じく序数 1 のラベルを持ち続ける）。
enum StageGateCriterion {
  STAGE_GATE_CRITERION_UNSPECIFIED = 0;
  STAGE_GATE_CRITERION_BACKTEST_NOT_PASSED = 1;
  STAGE_GATE_CRITERION_CONTROL_VIOLATIONS_PRESENT = 2;
  STAGE_GATE_CRITERION_SLIPPAGE_OR_COST_EXCEEDED = 3;
  STAGE_GATE_CRITERION_DAILY_LOSS_LIMIT_VIOLATED = 4;
  STAGE_GATE_CRITERION_NO_USER_APPROVAL = 5;
  STAGE_GATE_CRITERION_PROMOTION_MUST_BE_SEQUENTIAL = 6;
  STAGE_GATE_CRITERION_TARGET_IS_CURRENT_STAGE = 7;
  STAGE_GATE_CRITERION_ALREADY_AT_TOP_STAGE = 8;
  STAGE_GATE_CRITERION_STAGE1_TRADING_DAYS_INSUFFICIENT = 9;
  STAGE_GATE_CRITERION_STAGE1_TRADE_COUNT_INSUFFICIENT = 10;
  STAGE_GATE_CRITERION_STAGE1_EXTENSION_EXHAUSTED = 11;
  STAGE_GATE_CRITERION_CONTROL_VIOLATION_COUNT_UNAVAILABLE = 12;
}

// FR-20, IADR-0449（段 5）: 撤退（差し戻し）の理由（C# `WithdrawalReason`。1 は廃止済みで送り手に無い）。
enum WithdrawalReason {
  WITHDRAWAL_REASON_UNSPECIFIED = 0;
  WITHDRAWAL_REASON_DRAWDOWN_BREACHED_MULTIPLE = 1;
  WITHDRAWAL_REASON_STAGE1_EXTENSION_EXHAUSTED = 2;
}

// ---- 建玉 ----

message GetOpenPositionsRequest {}

// REST の OpenPositionView と同じ形。
message OpenPositionRow {
  optional string symbol = 1;
  Market market = 2;
  TradeSide side = 3;
  optional int32 quantity = 4;
  // 平均取得単価（ローカル通貨・10 進文字列）。
  optional string entry_price = 5;
  // 保有中のエントリーのうち最も保護的な損切りライン（10 進文字列）。
  optional string stop_loss_price = 6;
}

message GetOpenPositionsResponse {
  // 空は「保有なし」。照会できないことは rpc の失敗（status）で表す。
  repeated OpenPositionRow positions = 1;
}

// ---- 未約定の新規建て注文 ----

message GetWorkingEntryOrdersRequest {}

// REST の WorkingEntryOrderView のうち、判断が読む項目。
message WorkingEntryOrderRow {
  optional string symbol = 1;
  Market market = 2;
  TradeSide side = 3;
  // 残数量（承認数量 − 約定済み）。
  optional int32 remaining_quantity = 4;
  // 承認価格（ローカル通貨・10 進文字列）。
  optional string price = 5;
  // 承認時刻（往復書式の文字列）。
  optional string approved_at = 6;
}

message GetWorkingEntryOrdersResponse {
  repeated WorkingEntryOrderRow orders = 1;
}

// ---- サイジング文脈 ----

message GetSizingContextRequest {}

// REST の RiskLimitSettings と同じ形（比率は 10 進文字列）。
message RiskLimits {
  optional string max_order_amount_ratio = 1;
  optional string max_daily_order_amount_ratio = 2;
  optional int32 max_open_positions = 3;
  optional string daily_loss_limit_ratio = 4;
  optional string per_trade_risk_ratio = 5;
  optional string max_drawdown_ratio = 6;
  optional int32 losing_streak_threshold = 7;
  optional string losing_streak_size_factor = 8;
}

// FR-10, ADR-0063, #1291 / IADR-0527: REST の HighVolatilitySymbol と同じ形（利用者の明示指定）。
message HighVolatilitySymbolRow {
  optional string symbol = 1;
  Market market = 2;
}

// FR-10, ADR-0063, #1291 / IADR-0527: REST の HighVolatilitySettings と同じ形（区分の上限〔比率は 10 進文字列〕・明示指定）。
// 🔴 メッセージ自体の欠落は「送り手が本項目を知らない」であり、受け手は既定（上限 5%・明示指定なし）で読む（区分の上限を外さない）。
message HighVolatilityControls {
  optional string max_order_amount_ratio = 1;
  repeated HighVolatilitySymbolRow designated_symbols = 2;
}

// REST の SizingContextView と同じ形。
message GetSizingContextResponse {
  // 🔴 欠落は「口座を照会できていない」（残枠も解決できない）。0 ではない。
  optional string capital = 1;
  optional string stage_capital_remaining = 2;
  optional string daily_order_remaining = 3;
  optional int32 consecutive_losses = 4;
  optional string drawdown_ratio = 5;
  BrokerProvider mode = 6;
  RiskLimits limits = 7;
  StopLossExecutionMethod stop_loss_method = 8;
  HighVolatilityControls high_volatility = 9;
}

// ---- 新規建ての可否（#1113 / IADR-0463） ----

message GetEntryBlockersRequest {
  optional string symbol = 1;
  Market market = 2;
}

// 状態から確定する新規建ての拒否理由（C# `RejectionReason` の同名の値。名前で写す）。
// 口が返し得る理由だけを置く（送り手の `EntryStateBlockers.Determinable`）。未指定・未知の番号は「不明」。
enum EntryBlocker {
  ENTRY_BLOCKER_UNSPECIFIED = 0;
  ENTRY_BLOCKER_KILL_SWITCH_ACTIVE = 1;
  ENTRY_BLOCKER_TRADING_PAUSED = 2;
  ENTRY_BLOCKER_STOPPED_OUT_SAME_DAY = 3;
  ENTRY_BLOCKER_GOOD_FAITH_VIOLATION_LIMIT_REACHED = 4;
  ENTRY_BLOCKER_MAX_POSITIONS_EXCEEDED = 5;
  ENTRY_BLOCKER_DAILY_LOSS_LIMIT_REACHED = 6;
  ENTRY_BLOCKER_MAX_DRAWDOWN_REACHED = 7;
  // #1176 / IADR-0495: 当日に判断由来の決済（利確・判断の手仕舞い）をした銘柄の同じ方向の新規建て。
  ENTRY_BLOCKER_DECISION_EXIT_SAME_DAY = 8;
  // #1286 / IADR-0521 決定 4: 全注文の拒否（any_order にだけ現れる。送り手の `OrderStateBlockers`）。
  ENTRY_BLOCKER_MARKET_DISABLED = 9;
  ENTRY_BLOCKER_BANNED_SYMBOL = 10;
}

// 1 方向の理由の一覧。🔴 入れ物の欠落は「不明」、空の入れ物は「確定する拒否は無い」。
message EntryBlockerReasons {
  repeated EntryBlocker reasons = 1;
}

// REST の EntryBlockersView と同じ意味（名前は送り手の型名と変えてある）。
message GetEntryBlockersResponse {
  optional string symbol = 1;
  Market market = 2;
  // 買いの新規建て（ロングを建てる）。
  EntryBlockerReasons long_side = 3;
  // 売りの新規建て（ショートを建てる）。
  EntryBlockerReasons short_side = 4;
  // #1286 / IADR-0521 決定 4: 新規建て・決済を問わず全注文を拒否する理由（市場の無効・禁止銘柄）。追加の項目（非破壊）。
  // 🔴 入れ物の欠落は「不明」（旧い送り手）、空の入れ物は「全注文の拒否は無い」。
  EntryBlockerReasons any_order = 5;
}

// ---- 段階ゲート ----

message GetStageGateRequest {}

// REST の StageGateStatus のうち、移した呼び出し元が読む項目。
// - 段 2（取引判断・市場監視・報告書）: 現段階だけ。
// - 段 5（Discord ボットの `/stage status`。IADR-0449）: 設定・履歴・昇格評価・撤退評価・Stage 1 の合格条件を**フィールド追加**で足した
//   （非破壊。段 2 の読み手は current_stage だけを読む）。🔴 入れ物（message）の欠落は「不明」であり、既定値で読まない。
message GetStageGateResponse {
  TradingStage current_stage = 1;
  StageSettingsRecord current_settings = 2;
  repeated StageTransitionRecord history = 3;
  PromotionAssessmentRecord promotion = 4;
  WithdrawalAssessmentRecord withdrawal = 5;
  // 欠落は「宣言が無い」（REST の旧版の送り手と同じく警告を出さない）。
  Stage1CriteriaRecord stage1_criteria = 6;
}

// 段階の設定（REST の StageSettings。名前は送り手の型名と変えてある）。
message StageSettingsRecord {
  TradingStage stage = 1;
  BrokerProvider mode = 2;
  // 総資金に対する発注可能額の比（不変文化の 10 進）。
  optional string capital_cap_ratio = 3;
}

// 段階遷移の記録 1 件（REST の StageTransition）。
message StageTransitionRecord {
  optional int32 sequence = 1;
  TradingStage from_stage = 2;
  TradingStage to_stage = 3;
  StageTransitionKind kind = 4;
  optional string approved_by = 5;
  // 往復書式（`O`）。
  optional string occurred_at = 6;
  optional string reason = 7;
}

// 昇格評価（REST の PromotionAssessment）。
message PromotionAssessmentRecord {
  // 欠落＝昇格先なし（最上段）。
  optional TradingStage target_stage = 1;
  optional bool eligible = 2;
  repeated StageGateCriterion unmet_criteria = 3;
}

// 撤退評価（REST の WithdrawalAssessment）。
message WithdrawalAssessmentRecord {
  optional bool triggered = 1;
  // 欠落＝理由なし（REST の null）。
  optional WithdrawalReason reason = 2;
  optional bool halt_new_entries = 3;
  // 欠落＝差し戻しの提案なし（REST の null）。
  optional TradingStage proposed_stage = 4;
}

// Stage 1 の合格条件（REST の Stage1GateCriteria ＋ サーバが宣言する BelowStatisticalBasis）。
message Stage1CriteriaRecord {
  optional int32 target_trading_days = 1;
  optional int32 minimum_trade_count = 2;
  optional int32 maximum_trading_days = 3;
  optional bool below_statistical_basis = 4;
}

// ---- 期間の約定 ----

message GetFillsRequest {
  // 取引日の期間（yyyy-MM-dd・両端を含む）。欠落は INVALID_ARGUMENT。
  string from = 1;
  string to = 2;
}

// REST の LedgerFill のうち、報告書が読む項目（名前は冒頭の 🔴 のとおり送り手の型名と変えてある）。
message PeriodFill {
  optional string symbol = 1;
  Market market = 2;
  TradeSide side = 3;
  PositionEffect position_effect = 4;
  optional int32 quantity = 5;
  // 約定単価（ローカル通貨・10 進文字列）。
  optional string price = 6;
  // 約定時刻（往復書式の文字列）。
  optional string executed_at = 7;
  // 基準通貨への同伴レート（10 進文字列）。欠落は REST と同じく 1。
  optional string fx_rate_to_base = 8;
  // 判断 ID（GUID 文字列）。欠落は REST と同じく空の GUID（相関できない）。
  optional string decision_id = 9;
  // 実際に発注したアダプタの発注先。未指定は「不明」（REST の null）。
  BrokerProvider provider = 10;
  // 承認時点の認識時レート（1 USD あたりの円・10 進文字列）。欠落は「未記録」（REST の null）。
  optional string fx_rate_base_to_display = 11;
}

message GetFillsResponse {
  repeated PeriodFill fills = 1;
}

// ---- 期間の乖離の取り込み ----

message GetDriftAdoptionsRequest {
  string from = 1;
  string to = 2;
}

// REST の DriftAdoptionView のうち、報告書が読む項目（価格は持たない）。
message DriftAdoption {
  optional string adoption_id = 1;
  optional string symbol = 2;
  Market market = 3;
  TradeSide side = 4;
  optional int32 quantity = 5;
  optional int32 ledger_quantity_before = 6;
  optional int32 broker_quantity = 7;
  optional string observed_at = 8;
  optional string actor = 9;
  optional string reason = 10;
  optional string adopted_at = 11;
}

message GetDriftAdoptionsResponse {
  repeated DriftAdoption adoptions = 1;
}

// ---- 期間開始時点の在庫（FR-06, FR-16, #1181, IADR-0493） ----

message GetOpeningInventoryRequest {
  // 対象の市場（未指定は INVALID_ARGUMENT）。
  Market market = 1;
  // この市場の現地取引日**より前**（排他。yyyy-MM-dd）までの台帳行を畳む。報告書は窓の市場ごとの下端を渡す。
  string before = 2;
}

// REST の OpeningInventoryView と同じ形（数量は常に正・向きは side）。
message OpeningInventoryLot {
  optional string symbol = 1;
  Market market = 2;
  TradeSide side = 3;
  optional int32 quantity = 4;
  // 基準通貨（USD）建ての平均取得単価（10 進文字列）。
  optional string average_cost_in_base = 5;
  // 認識時レート（1 USD あたりの円）の加重平均。🔴 欠落は「建玉に未記録の約定が含まれ平均を作れない」（0・1 ではない）。
  optional string average_fx_rate_base_to_display = 6;
  // 建玉に残る、認識時レートが未記録の台帳行の数。
  optional int32 unrecorded_fx_rate_fill_count = 7;
}

message GetOpeningInventoryResponse {
  // 空は「その時点で建玉なし」。照会できないことは rpc の失敗（status）で表す。
  repeated OpeningInventoryLot lots = 1;
}

// ---- 強制買戻しの推定 ----

message GetBuyInInferencesRequest {
  string from = 1;
  string to = 2;
}

// REST の BuyInInferenceRecord と同じ形。
message BuyInInferenceRow {
  optional string id = 1;
  optional string symbol = 2;
  Market market = 3;
  optional int32 ledger_short_quantity = 4;
  optional int32 broker_short_quantity = 5;
  optional int32 in_flight_close_quantity = 6;
  optional int32 unexplained_quantity = 7;
  optional int32 newly_inferred_quantity = 8;
  // 新規空売り禁止の期限（yyyy-MM-dd）。欠落は REST の null。
  optional string ban_until = 9;
  optional string inferred_on = 10;
  optional string observed_at = 11;
  optional string inferred_at = 12;
}

message GetBuyInInferencesResponse {
  // 🔴 欠落・false は「報告期間が観測に覆われていない」。推定が 0 件でも 0 件と読んではならない。
  optional bool period_covered = 1;
  // 診断用（どの日が欠けているか）。判定には使わない。
  repeated string observed_trading_days = 2;
  repeated BuyInInferenceRow inferences = 3;
}

// ---- OpenD 稼働率 ----

message GetSessionUptimeRequest {
  string from = 1;
  string to = 2;
}

message SessionUptimeDay {
  optional string session_date_eastern_time = 1;
  // 稼働率（0〜1・10 進文字列）。
  optional string uptime_ratio = 2;
}

// REST の Days（null ＝未供給 / [] ＝行なし）を分けるための入れ物。
message SessionUptimeDays {
  repeated SessionUptimeDay items = 1;
}

message GetSessionUptimeResponse {
  // 🔴 欠落は「未供給」。空の入れ物は「行なし」（欠けた日を 0% とは描かない）。
  SessionUptimeDays days = 1;
  // 累計の算入日数（発注先の許可制まで含む権威判定）。欠落は「未供給」。
  optional int32 stage1_cumulative_counted_days = 2;
}
