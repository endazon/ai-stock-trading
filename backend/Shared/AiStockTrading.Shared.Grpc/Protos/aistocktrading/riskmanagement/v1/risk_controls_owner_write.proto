// NFR, NFR-06, FR-10, FR-11, FR-14, FR-19, FR-20, MSP:ADR-0029, MSP:ADR-0075, ADR-0047 決定 1〜3, IADR-0284 決定 5（段 5）, IADR-0448, IADR-0450, #753:
// リスク管理の**所有者限定の書き込み**（REST の OwnerOnly）の gRPC 契約。呼び出し元は Discord ボットだけである
// （ボットの所有者トークンはサービスの身元＝east-west。ADR-0047 決定 1）。各 rpc は下に書いた REST の端点と同じ処理関数を通る
// （操作者の解決・検証・監査の発行を 2 箇所に書かない）。
//
// ■ 認可（IADR-0450）: 門は `GrpcOwnerOnly` ＝ `trading-owner` ∧ トークンの `azp` がボットの機密クライアント。**s2s には開かない**
//   （生成AI・自動処理が統制を解けないようにする。REST の OwnerOnly と同じ）。人の利用者のトークンも通さない（ADR-0047 決定 3）。
// ■ 利用者の文脈は本文の `on_behalf_of` で運ぶ（ADR-0047 決定 1）。提供側が信じるのは今どおり信頼クライアントのトークンに限る。
// ■ 誤りの写し（REST と同じ分類）: 400 → INVALID_ARGUMENT、404 → NOT_FOUND、409 → ABORTED、422 → FAILED_PRECONDITION。
//   REST の `error`（利用者向けの文言）は状態の詳細に載せる。段階遷移の受理不能（REST の 422）だけは本文を持つので応答（accepted=false）で返す。
// ■ 🔴 書き込みは冪等とは限らない（例: GFV 解除・段階遷移の 2 回目は受理不能になる）。呼び出し側は再試行しない（IADR-0450）。
// ■ 線上表現は `risk_controls_read.proto` の冒頭の原則 A と同じ。message 名を送り手の C# の型名にしない。
syntax = "proto3";

package aistocktrading.riskmanagement.v1;

option csharp_namespace = "AiStockTrading.Shared.Grpc.RiskManagement.V1";

import "aistocktrading/riskmanagement/v1/risk_controls_read.proto";

// リスク管理の所有者限定の書き込み。
// - 資格情報が無い → UNAUTHENTICATED、ボットの所有者トークンでない（azp・ロール）→ PERMISSION_DENIED
// - 提供側が不調・不達 → UNAVAILABLE、deadline 超過 → DEADLINE_EXCEEDED（書き込みでは結果は不明）
service RiskControlsOwnerWrite {
  // POST /risk-controls/kill-switch/engage（理由必須）。
  rpc EngageKillSwitch(KillSwitchChangeRequest) returns (KillSwitchChangeResponse);
  // POST /risk-controls/kill-switch/disengage（理由必須）。
  rpc DisengageKillSwitch(KillSwitchChangeRequest) returns (KillSwitchChangeResponse);
  // POST /risk-controls/pause（理由必須・冪等）。
  rpc PauseTrading(TradingPauseChangeRequest) returns (TradingPauseChangeResponse);
  // POST /risk-controls/resume（理由必須・冪等）。
  rpc ResumeTrading(TradingPauseChangeRequest) returns (TradingPauseChangeResponse);
  // POST /risk-controls/good-faith-violations/clear（理由必須。解除対象なしは FAILED_PRECONDITION）。
  rpc ClearGoodFaithViolations(GoodFaithViolationClearanceRequest) returns (GoodFaithViolationClearanceResponse);
  // POST /risk-controls/stage-gate/transition（承認者は on_behalf_of。受理不能は accepted=false）。
  rpc RequestStageTransition(StageTransitionApprovalRequest) returns (StageTransitionApprovalResponse);
  // POST /risk-controls/stage-gate/withdrawal/evaluate（成立時は kill switch を自動起動する）。
  rpc EvaluateWithdrawal(WithdrawalEvaluationRequest) returns (WithdrawalEvaluationResponse);
  // POST /risk-controls/position-drift/adopt（操作者は on_behalf_of。受理不能は FAILED_PRECONDITION）。
  rpc AdoptPositionDrift(DriftAdoptionCommandRequest) returns (DriftAdoptionCommandResponse);
}

message KillSwitchChangeRequest {
  string reason = 1;
}

message KillSwitchChangeResponse {
  // 欠落は「不明」（受け手は応答を解釈できないとして失敗を返す）。
  optional bool engaged = 1;
}

message TradingPauseChangeRequest {
  string reason = 1;
}

message TradingPauseChangeResponse {
  optional bool paused = 1;
}

message GoodFaithViolationClearanceRequest {
  string reason = 1;
}

message GoodFaithViolationClearanceResponse {
  repeated string cleared_order_ids = 1;
  // 往復書式（`O`）。
  optional string cleared_at = 2;
  // 解除の後に残った件数（0 とは限らない）。欠落は「不明」。
  optional int32 remaining_count = 3;
}

message StageTransitionApprovalRequest {
  // 未指定は REST の targetStage の省略と同じ（INVALID_ARGUMENT）。
  TradingStage target_stage = 1;
  // 代理される利用者（ボットが多層認証で解決した操作者）。欠落は REST の onBehalfOf の省略と同じ。
  optional string on_behalf_of = 2;
}

message StageTransitionApprovalResponse {
  optional bool accepted = 1;
  // 受理したときの遷移先（欠落＝遷移が無い）。
  optional TradingStage to_stage = 2;
  repeated StageGateCriterion rejection_reasons = 3;
  // 受理・拒否の両方で運ぶ実効の合格条件（警告の材料）。
  Stage1CriteriaRecord stage1_criteria = 4;
}

message WithdrawalEvaluationRequest {}

message WithdrawalEvaluationResponse {
  WithdrawalAssessmentRecord assessment = 1;
}

message DriftAdoptionCommandRequest {
  string symbol = 1;
  // 未指定は REST の market の省略と同じ（INVALID_ARGUMENT）。
  Market market = 2;
  string reason = 3;
  optional string on_behalf_of = 4;
}

message DriftAdoptionCommandResponse {
  // Guid の文字列表現。
  optional string adoption_id = 1;
  optional string symbol = 2;
  Market market = 3;
  optional int32 ledger_quantity_before = 4;
  optional int32 ledger_quantity_after = 5;
  optional int32 broker_quantity = 6;
  // 往復書式（`O`）。
  optional string observed_at = 7;
  // 実現損益を記録したか（常に false＝システム外の売買の約定価格は分からない）。
  optional bool realized_pnl_recorded = 8;
  // 台帳へ記録した操作者。
  optional string actor = 9;
}
