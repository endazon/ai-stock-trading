// NFR（費用）, FR-01, MSP:ADR-0029, MSP:ADR-0075, IADR-0284 決定 5（段 4）, IADR-0328 決定 4, IADR-0331 決定 7,
// IADR-0427, IADR-0446, #1061 (#753):
// 費用統制の現在の判定（定時サイクルの間隔延長・停止）の同期照会の gRPC 契約。REST の `GET /costs/state`（OwnerOrService）と
// 同じ意味論であり、提供側は REST と同じサービス（CostControlAppService.GetLlmStateAsync）を呼ぶ。
//
// ■ 置き場と所有（IADR-0328 決定 4 / IADR-0331 決定 7）
//   所有者は呼び出される側（CostControlService）。置き場は共有プロジェクト `AiStockTrading.Shared.Grpc`。
//
// ■ 🔴 原則 A（IADR-0427 決定 3 と同じ。#915 の是正を線上でも保つ）
//   - 停止の有無は `optional bool`。**欠落は「判定できない」**であり false（停止しない）と読まない。
//   - 倍率は `optional string`（不変文化の 10 進）。**欠落・空は 0 ではなく「言っていない」**。
//   **運ぶのは呼び出し元（情報収集）が読む項目だけ**（REST の応答は状態の名前も持つ）。足すのはフィールド追加＝非破壊。
//
// ■ 🔴 message 名を送り手（CostControlService）の C# の型名（`CostControlDecision`）と同じにしない（IADR-0420 決定 3 の ⑤）。
syntax = "proto3";

package aistocktrading.costcontrol.v1;

option csharp_namespace = "AiStockTrading.Shared.Grpc.CostControl.V1";

// 費用統制の判定の読み取り。REST の `GET /costs/state`（OwnerOrService）と同じ認可・同じサービスを通る。
// - 呼び出し側サービスの資格情報が無い → UNAUTHENTICATED、ロールが無い → PERMISSION_DENIED
// - 提供側が不調・不達 → UNAVAILABLE、deadline 超過 → DEADLINE_EXCEEDED（呼び出し元は Normal へ倒す）
service CostStateRead {
  // GET /costs/state（現在月の LLM 統制判定）。
  rpc GetCostState(GetCostStateRequest) returns (GetCostStateResponse);
}

message GetCostStateRequest {}

message GetCostStateResponse {
  // 停止しているか（100% 到達）。欠落は「判定できない」。
  optional bool is_halted = 1;
  // 定時サイクル間隔の倍率（不変文化の 10 進。Normal=1・Throttled=2・Halted=0）。欠落・空は「言っていない」。
  optional string interval_multiplier = 2;
}
