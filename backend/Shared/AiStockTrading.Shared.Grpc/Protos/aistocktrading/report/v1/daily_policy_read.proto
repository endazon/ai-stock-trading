// NFR, FR-04, FR-07, MSP:ADR-0029, MSP:ADR-0075, IADR-0284 決定 5（段 4）, IADR-0328 決定 4, IADR-0331 決定 7,
// IADR-0427, IADR-0446, #1061 (#753):
// 確定済み日報の方針の同期照会の gRPC 契約。REST の `GET /reports/daily-policy`（OwnerOrService）と同じ意味論であり、
// 提供側は REST と同じサービス（ReportAppService.GetConfirmedDailyPolicy）を呼ぶ。
//
// ■ 置き場と所有（IADR-0328 決定 4 / IADR-0331 決定 7）
//   所有者は呼び出される側（ReportService）。置き場は共有プロジェクト `AiStockTrading.Shared.Grpc`。
//
// ■ 🔴 「未確定」の表し方（IADR-0446 決定 3）
//   REST は未確定を 404 で返す。gRPC では **`policy` を持たない応答**で表す（NOT_FOUND の状態コードにしない —— 未確定は
//   毎朝の平常の状態であり、失敗として記録・再試行の判定へ流さない）。呼び出し元は REST の 404 と同じく「取引しない」へ倒す。
//
// ■ 🔴 原則 A（IADR-0427 決定 3 と同じ）
//   方針の項目は**すべて `optional`**。日付・要約のどちらかが欠けた方針を既定値（空文字・0001-01-01）で作らない。
//   **運ぶのは呼び出し元（取引判断）が読む項目だけ**（REST の応答は前提条件の版も持つ）。足すのはフィールド追加＝非破壊。
//
// ■ 🔴 message 名を送り手（ReportService）の C# の型名（`ConfirmedDailyPolicy`）と同じにしない（IADR-0420 決定 3 の ⑤）。
//
// ■ ［2026-10-17 / #1388］IADR-0557 決定 3: ある時点で確定していた方針（REST `GET /reports/daily-policy/as-of`・Stage 0 の記録）の rpc を足した。
//   時刻はオフセット必須の文字列（`WatchlistRead/GetWatchlistAsOf` と同じ）。確定の時刻は応答の別の項目で運び、`DailyPolicyRecord` へ足さない。
syntax = "proto3";

package aistocktrading.report.v1;

option csharp_namespace = "AiStockTrading.Shared.Grpc.Report.V1";

// 確定済み日報の方針の読み取り。REST の `GET /reports/daily-policy`（OwnerOrService）と同じ認可・同じサービスを通る。
// - 呼び出し側サービスの資格情報が無い → UNAUTHENTICATED、ロールが無い → PERMISSION_DENIED
// - 提供側が不調・不達 → UNAVAILABLE、deadline 超過 → DEADLINE_EXCEEDED（呼び出し元は「取引しない」へ倒す）
service DailyPolicyRead {
  // GET /reports/daily-policy（未確定は `policy` を持たない応答）。
  rpc GetConfirmedDailyPolicy(GetConfirmedDailyPolicyRequest) returns (GetConfirmedDailyPolicyResponse);
  // GET /reports/daily-policy/as-of?at=（無かったときは `policy` を持たない応答。`at` の欠落・オフセットの欠落・書式違いは INVALID_ARGUMENT）。
  rpc GetConfirmedDailyPolicyAsOf(GetConfirmedDailyPolicyAsOfRequest) returns (GetConfirmedDailyPolicyAsOfResponse);
}

message GetConfirmedDailyPolicyRequest {}

message GetConfirmedDailyPolicyResponse {
  // 確定済みの方針。**無ければ未確定**（REST の 404）。
  DailyPolicyRecord policy = 1;
}

message DailyPolicyRecord {
  // 方針の日付（yyyy-MM-dd）。
  optional string date = 1;
  // 方針の要約（判断のプロンプトへそのまま渡す）。
  optional string summary = 2;
  // FR-04, FR-11, ADR-0068 決定4, #1373, IADR-0548 決定5: この方針を持つ確定版の期間キー（例 daily-2026-10-17）と版番号
  // （確定後の行の版）。取引判断が判断の記録へ残す。**欠けていても方針は使う**（送り手が古い間の並走。判断を止める理由にしない）。
  optional string period_key = 3;
  optional int32 version = 4;
  // FR-07, #1423 M-6, ADR-0075, IADR-0583 決定3: 無応答時の「停止」が効いている（取引判断は全体を見送る）。欠落・false は停止していない。
  // 方針（上の項目）は直近の確定済み日報のまま載る（閉場前の手仕舞いが方針を読めないへ倒れないように）。as-of の応答では載せない。
  optional bool no_response_halted = 5;
}

// FR-15, FR-07, #1308, #1388, IADR-0528 決定 3, IADR-0557 決定 3: ある時点で確定していた日報の方針の照会。
message GetConfirmedDailyPolicyAsOfRequest {
  // 時点。ISO 8601 で、オフセット（Z か ±hh:mm）が必須（REST の `at` と同じ）。
  string at = 1;
}

message GetConfirmedDailyPolicyAsOfResponse {
  // その時点で確定していた方針のうち最新。**無ければ「無かった」**（REST の 404）。
  DailyPolicyRecord policy = 1;
  // 🔴 選んだ版の確定の時刻（往復書式・オフセットごと）。受け手が「照会の時刻より後の確定」を拒むために使う。
  // **欠けていれば受け手は「取れなかった」として扱う**（REST の `confirmedAt` の欠落と同じ）。
  optional string confirmed_at = 2;
}
