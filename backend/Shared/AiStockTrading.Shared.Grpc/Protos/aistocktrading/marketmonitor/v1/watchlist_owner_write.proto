// NFR, NFR-06, FR-13, FR-14, MSP:ADR-0029, MSP:ADR-0075, ADR-0047 決定 1〜3, IADR-0284 決定 5（段 5）, IADR-0448, IADR-0450, #753:
// 監視銘柄の**所有者限定の書き込み**（REST の OwnerOnly）の gRPC 契約。呼び出し元は Discord ボットだけである（ADR-0047 決定 1）。
// REST の `POST /monitor/watchlist/proposal-apply` と同じ処理関数を通る（代理の解決・案の形の検証・楽観排他・巡回間隔の検査を 2 箇所に書かない）。
//
// ■ 認可（IADR-0450）: 門は `GrpcOwnerOnly`。s2s には開かない。
// ■ 誤りの写し: 400 → INVALID_ARGUMENT、409 → ABORTED（案を作った後に監視銘柄が変わった・保存の競合）。**いずれも 1 件も適用していない。**
// ■ 🔴 適用は冪等でない（2 回目は楽観排他で ABORTED になり、適用済みなのに「適用していない」に見える）。呼び出し側は再試行しない（IADR-0450）。
// ■ 線上表現は `watchlist_read.proto` の原則 A と同じ。message 名を送り手の C# の型名にしない。
syntax = "proto3";

package aistocktrading.marketmonitor.v1;

option csharp_namespace = "AiStockTrading.Shared.Grpc.MarketMonitor.V1";

import "aistocktrading/marketmonitor/v1/watchlist_read.proto";

service WatchlistOwnerWrite {
  // POST /monitor/watchlist/proposal-apply（`/policy` の入れ替え案を 1 回で適用する）。
  rpc ApplyWatchlistProposal(WatchlistProposalApplicationRequest) returns (WatchlistProposalApplicationResponse);
}

message WatchlistProposalApplicationRequest {
  // 案を作った時点の監視銘柄（楽観排他の基準）。欠落は REST の null（INVALID_ARGUMENT）。
  WatchlistItems expected_watchlist = 1;
  // 入れ替え。欠落は REST の null（INVALID_ARGUMENT）。
  WatchlistChangeInstructions changes = 2;
  // 案の出所（会話キー＋版）。
  string proposal_ref = 3;
  optional string on_behalf_of = 4;
}

message WatchlistChangeInstructions {
  repeated WatchlistChangeInstruction items = 1;
}

message WatchlistChangeInstruction {
  // "add" / "remove"。
  optional string action = 1;
  optional string symbol = 2;
  optional string reason = 3;
}

message WatchlistProposalApplicationResponse {
  repeated WatchlistApplicationItem items = 1;
  // 変更履歴に残した変更者。
  optional string actor = 2;
  // 適用後の Finnhub の日次要求の推定（欠落＝Finnhub を使わない構成）。
  FinnhubRequestEstimate estimate = 3;
}

message WatchlistApplicationItem {
  optional string action = 1;
  optional string symbol = 2;
  optional bool applied = 3;
  optional string skip_reason = 4;
}

message FinnhubRequestEstimate {
  optional int64 estimated_daily_requests = 1;
  // 欠落＝日次上限が未設定（比べない）。
  optional int32 provisional_daily_limit = 2;
  optional bool exceeds = 3;
}
