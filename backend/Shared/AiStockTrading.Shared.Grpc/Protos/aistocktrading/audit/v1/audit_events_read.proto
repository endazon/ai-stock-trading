// NFR, FR-06, FR-11, MSP:ADR-0029, MSP:ADR-0075, IADR-0284 決定 5（段 3）, IADR-0328 決定 4, IADR-0331 決定 7,
// IADR-0427, IADR-0445, #1059 (#753):
// 監査台帳の**種別 × 期間の読み取り**（OwnerOrService）の同期照会の gRPC 契約。REST の `GET /audit/events/by-type` と同じ意味論であり、
// 提供側は REST と同じストア・同じ種別の解析を呼ぶ（評価器を 2 つにしない）。
//
// ■ 置き場と所有（IADR-0328 決定 4 / IADR-0331 決定 7）
//   所有者は呼び出される側（AuditService）。置き場は共有プロジェクト `AiStockTrading.Shared.Grpc`。
//
// ■ 🔴 原則 A（不明・無し・有りを取り違えない。IADR-0427 決定 3 / IADR-0445 決定 3）
//   - 記録の項目は**すべて `optional`**（存在を持つ）。受け手は、どれかが欠けた記録を既定値（空の GUID・空文字）で作らず、
//     **応答全体を「照会できていない」**として扱う（送り手と受け手の片方だけを先に配備した窓で起きる食い違い）。
//   - 「0 件」は `records` が空の応答であり、欠落とは区別される（報告書はこれを「事象なし」と描く）。
//   - 時刻は往復書式（`O`・オフセットを保つ）の文字列。期間は**半開区間** [from, to)。
//
// ■ 運ぶ項目（IADR-0427 決定 3 と同じ）
//   **移した呼び出し元（報告書）が読む項目だけ**を運ぶ（REST の応答は相関 ID・銘柄・要約・時刻も持つ）。足すのはフィールド追加＝非破壊。
//
// ■ 🔴 message 名を送り手（AuditService）の C# の型名と同じにしない（`AuditEntry` ではなく `LedgerRecord`）
//   生成型は受け手の本番コードに現れ、送り手の型名がそこに現れると送り手の型による契約テストの判定（IADR-0420 決定 3 の ⑤）が効かなくなる。
//
// ■ s2s（IADR-0328 決定 2）
//   `authorization` メタデータには呼び出し側サービス自身の client credentials JWT を載せる。利用者のトークンは載せない。
syntax = "proto3";

package aistocktrading.audit.v1;

option csharp_namespace = "AiStockTrading.Shared.Grpc.Audit.V1";

// 監査台帳の読み取り。REST の `GET /audit/events/by-type`（OwnerOrService）と同じ認可・同じストアを通る。
// - 呼び出し側サービスの資格情報が無い → UNAUTHENTICATED、ロールが無い → PERMISSION_DENIED
// - 期間の欠落・書式違い・逆順、種別が 1 つも無い（REST の 400）→ INVALID_ARGUMENT
// - 提供側が不調・不達 → UNAVAILABLE、deadline 超過 → DEADLINE_EXCEEDED
//   （いずれも呼び出し元は REST と同じ安全側既定＝未供給へ倒す）
service AuditEventsRead {
  // GET /audit/events/by-type?from&to&types（期間 [from, to) の指定種別の記録を OccurredAt 昇順で。件数の上限は無い）。
  rpc GetEventsByType(GetEventsByTypeRequest) returns (GetEventsByTypeResponse);
}

message GetEventsByTypeRequest {
  // 期間の始端（含む）。往復書式（例 2026-09-01T00:00:00.0000000+09:00）。
  string from = 1;
  // 期間の終端（含まない）。往復書式。
  string to = 2;
  // 引く種別（イベント型名）。空・空白の要素は無視する（REST の `types=,,` と同じ）。1 つも残らなければ INVALID_ARGUMENT。
  // 🔴 名前を `types` にしない —— protoc の C# 生成は入れ子の型の置き場 `Types` と衝突させ、プロパティを `Types_` に改名する。
  repeated string event_types = 3;
}

message GetEventsByTypeResponse {
  // OccurredAt 昇順。
  repeated LedgerRecord records = 1;
}

// 監査台帳の 1 記録のうち、報告書が読む 3 項目。
message LedgerRecord {
  // 記録の ID（GUID・`D` 書式）。
  optional string id = 1;
  // 種別（イベント型名）。
  optional string event_type = 2;
  // イベント全量の JSON（書き手の直列化設定のまま）。
  optional string detail = 3;
}
