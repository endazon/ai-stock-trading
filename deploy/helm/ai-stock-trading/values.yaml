      # 「供給なし」を返し構造的に不活性なため、駆動を既定有効にしても供給元が実装されるまでは
      # 1 回も発動しない。ここでは非対称な既定を明示値で可視化する（他 2 件は既定無効のため helm に明示行を持たない）。
      - { name: MaintenanceMarginEvaluation__Enabled, value: "true" }
      - { name: MaintenanceMarginEvaluation__IntervalSeconds, value: "300" }
      # FR-10, #81, #158, IADR-0066/0068: 時価評価（含み損益・DD）。fail-safe: EnableMarkToMarket=false（既定）。
      # true は最大DD の取引ゲート（IADR-0008）の判定入力を変えるため、実市況の live 検証後に人手で切り替える（決定4）。
      # Provider 空=no-op（実接続しない）。finnhub＋鍵で opt-in。鍵は情報収集とは別枠。
      - { name: MarketData__EnableMarkToMarket, value: "false" }
      - { name: MarketData__Provider, value: "" }
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      # FR-01, #1132, IADR-0477: Finnhub の日次要求見積りは巡回ごとに保有建玉の実数から数える（旧 EstimatedSymbolCount の申告は撤去）。
      - { name: Finnhub__ProvisionalDailyLimit, value: "" }
      # FR-06/16, #611, ADR-0022, IADR-0286 決定1: 承認記録時の**認識時レート**（1 USD あたりの円）を承認台帳へ固定する源。
      # trade-decision と同じ為替レート源（日銀第一・FRED フォールバック）を同じ構成キーで組む。
      # #686, IADR-0308: 計画 ADR-0022 決定1 の第一情報源＝日銀（認証不要）。鍵があれば FRED が後段に積まれる。
      # fail-safe: 空/none/未知=no-op＝承認は未記録（null）のまま記録される（承認を止めない・推定しない）。
      - { name: Fx__Provider, value: "boj" }
      - name: Fx__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }
      # FR-10, ADR-0016 決定3, #967, IADR-0425: 借株可否（空売りの一次ゲート）の照会先＝発注執行。
      # fail-safe: 空=未結線＝借株可否は常に「分からない」＝新規の売り建ては BorrowUnavailable で拒否（今と同じ）。
      # 結線しても、発注執行は（既定では）発注と同じ SIMULATE 口座のヘッダで照会し SIMULATE では照会が失敗するため結果は変わらない。
      # #1000, IADR-0482: 発注執行の Broker__Moomoo__RealMarginQuery__Enabled=true（既定は無効。ここでは置かない）を明示したときだけ、
      # 照会は実弾口座（Real × Margin）のヘッダの読み取り専用の照会に替わり、結線すると借株可否が答えられる（発注は SIMULATE のまま）。
      # 結線するときは order-execution 側の auth（上）と本サービスの ServiceAuth__*（trading-service）が要る。
      - { name: OrderExecution__BaseUrl, value: "" }
      # NFR, MSP:ADR-0029, IADR-0284 決定 5（段 5 の追補 2）, IADR-0559, #1391: 上の照会を east-west gRPC（h2c）で呼ぶ場合の宛先。
      # 🔴 **既定は REST であり、このキーは意図的に置いていない**（置くと既定描画が変わる）。有効化するときだけ、このサービスの `grpcClients`（extraEnv の兄弟のマップ）へ足す。🔴 この env 配列へ `*__Grpc` を足さない（配列は values を重ねると丸ごと置き換わり、既存の env が消える・IADR-0489）:
      #   grpcClients: { OrderExecution: true }   # → OrderExecution__Grpc=http://order-execution-service:<grpcPort>（宛先は描画が導出する）
      # 前提（同じ変更で揃える。無ければ描画で止まる）: services.order-execution に `grpcPort: 8081` を宣言すること。
      # 宣言があれば上の BaseUrl より優先する（BaseUrl が空でも借株可否を照会する＝結線と同じ意味になる）。s2s は REST と同じ ServiceAuth__*。deadline は OrderExecution__GrpcTimeoutSeconds（既定 5 秒）。
      # FR-20, FR-11, UC-06, ADR-0003, #868, IADR-0240 決定11, IADR-0383: 段階遷移の要求の onBehalfOf
      # （代理される利用者）を信じてよいクライアント（カンマ区切り）。Discord Bot は owner マップ機密クライアントの
      # トークンで承認を呼ぶため、トークンからは人を解決できない（実資金ゲートの承認者が unknown になっていた）。
      # **notification の Notifications__Discord__OwnerAuth__ClientId と同じ秘密鍵から採る**（単一情報源。
      # report の Reports__DelegatedActor__TrustedClientIds と同じ鍵）。
      # fail-safe: 未設定/空=誰の onBehalfOf も信じない（承認者はトークンの主体へ倒れる）。
      - name: RiskControls__DelegatedActor__TrustedClientIds
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      # 🔴 FR-10, FR-19, #1396, IADR-0561 決定 2: 閉場前の新規建ての締め切り（閉場の何分前から新規建て〔買い増し・売り増しを含む〕を審査で拒否するか）。
      # **既定 60 分（JP・US とも）はコードの既定で効くため、このキーは意図的に置いていない**（置くと既定描画が変わる）。変えるときだけ足す
      # （1〜場中の長さ〔米国 390・東証 330〕。0〔統制を外す値〕・読めない値・範囲外・未知の市場は起動が止まる）:
      #   - { name: PreCloseEntryCutoff__Minutes__UnitedStates, value: "60" }
      #   - { name: PreCloseEntryCutoff__Minutes__Japan, value: "60" }
      # 🔴 FR-10, FR-19, SC-02, #1407, IADR-0564 決定 1: 閉場前の手仕舞い（閉場の 15 分前以降に保有を成行で全量手仕舞う。方針の「持ち越し可: …」行の銘柄は残す）。
      # **既定は無効**（コードの既定で効くため、このキーは意図的に置いていない）。方針の「閉場前の手仕舞い: 有効」の行でも有効になる。
      # IADR-0561 決定 3 では trade-decision の構成だったが、締め切り・テーマの上限と同じくここ（risk-management）へ移した（trade-decision に書くと起動が止まる）。
      # 構成で有効にするとき・分数を変えるときだけ足す（分数 1〜60。読めない値・範囲外は起動が止まる）:
      #   - { name: PreCloseFlatten__Enabled, value: "true" }
      #   - { name: PreCloseFlatten__Minutes__UnitedStates, value: "15" }
      #   - { name: PreCloseFlatten__Minutes__Japan, value: "15" }
      # 🔴 SC-02, #1407, IADR-0564 決定 2: 締め切り・手仕舞い・テーマの定義は **SC-02 で保存した値があればそちらが効く**（構成は「保存するまでの値」）。
      # 保存した後にここを変えても、その項目には効かない（SC-02 と GET /risk-controls/settings/pre-close・/theme-concentration が「構成と食い違い」を示す）。
      # NFR-06, IADR-0448, #1067: gRPC 面の所有者の門が許す azp（書き方・既定・fail-safe は values.yaml の audit の同じ行）。
      - name: Auth__GrpcOwnerClients__0
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      # NFR, FR-10, UC-06, #1530, IADR-0613: Discord を経ない停止の保持（SSH から scripts/ast-trading-stop.sh が Secret ast-operator-hold を作る）。
      # 保持の間は起動時に既存の kill switch を起動し、解除（Discord・画面）を 409 で拒む。外しても kill switch は起動したまま残る。
      # optional のため Secret が無ければ env も無い＝既定の振る舞いのまま。Secret は chart・ESO・ArgoCD の管理の外（オーナーが作る・消す）。
      - name: RiskManagement__OperatorKillSwitchHold__Enabled
        secretKeyRef: { name: ast-operator-hold, key: enabled, optional: true }
      - name: RiskManagement__OperatorKillSwitchHold__Reason
        secretKeyRef: { name: ast-operator-hold, key: reason, optional: true }
      # NFR-06, FR-14, #1542, IADR-0615: 危険な操作の第 2 要素（TOTP）を提供側で確かめる。段 1 は Audit（記録だけ・操作を止めない）。
      # 段 2 で Enforce にする（確かめられない操作を 403 で拒む）。シークレットは scripts/ast-owner-totp-enroll.sh が作る Secret ast-owner-totp
      # （chart・ESO・ArgoCD の管理の外）を optional で読む。Secret が無ければ Audit は「未構成」と記録するだけ。
      # クラウド（values-cloud）は ESO が OpenBao の cloud/ast/ast-owner-totp から写し、段は Enforce（#1560, IADR-0623）。
      - { name: OwnerSecondFactor__Mode, value: "Audit" }
      - name: OwnerSecondFactor__Secret
        secretKeyRef: { name: ast-owner-totp, key: secret, optional: true }
  trade-decision:
