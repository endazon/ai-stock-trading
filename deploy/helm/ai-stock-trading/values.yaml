# ai-stock-trading k8s chart values（MSP 連結ローカル k8s dev 既定）。
# fail-safe: 外部連携（実 LLM/市場データ/Discord/実発注）は既定 no-op / paper。
# 実接続は Secret `ast-secrets`（空既定）を明示設定したときのみ有効化する。

global:
  image:
    # ローカル import 接頭辞（values-local と一致・IfNotPresent で pull しない）。
    registry: k3d-local
    tag: latest
    pullPolicy: IfNotPresent
  # 共有インフラ（MSP platform-infra）への接続既定。ExternalName エイリアス（下記 infraAliases）で
  # 素のサービス名を platform-infra の FQDN へ解決する。
  rabbitmqConnectionString: amqp://guest:guest@rabbitmq:5672
  otlpEndpoint: http://otel-collector:4317
  authAuthority: http://keycloak:8080/realms/ai-stock-trading
  # #22 受け入れ基準③: 実効構成バージョン（適用中の構成の Git コミット等）。GitOps（ArgoCD）で注入する。
  # 空既定 = 自己申告の configVersion は null（fail-safe）。
  configVersion: ""
  db:
    host: postgres
    port: 5432
    # 共有 Postgres 上の AST 用ユーザ（MSP infra init が作成: user=ai / owner of *_svc）。
    username: ai
    password: ai

namespace:
  create: true
  name: ai-stock-trading

# 共有インフラを素のサービス名で解決するための ExternalName（platform-infra を指す）。
infraAliases:
  enabled: true
  infraNamespace: platform-infra
  services: [postgres, rabbitmq, keycloak, otel-collector]

# #121: 取引サイクルの本番スケジューラ（K8s CronJob）。
# 既定 disabled = fail-safe（in-process ポーリング IADR-0023 を維持）。
# 有効化には収集の run-once トリガ（#121 の C# 実装）が前提。schedule は市場開場時間帯に合わせる
# （休場ガードは run-once 側の市場カレンダーで担保する）。
tradingCycle:
  cronjob:
    enabled: false
    # 例: 平日 米国東部 寄り付き〜引け相当（UTC）。実運用では市場カレンダーで休場日を除外する。
    schedule: "*/30 13-20 * * 1-5"
    # 収集の run-once を叩く軽量イメージ（#121 実装後に有効化）。
    image: curlimages/curl:8.11.1
    target: http://information-collection-service:8080/internal/collection/run-once
    # NFR, #456, IADR-0176 決定2: run-once は OwnerOrService の認可を要する。CronJob は
    # client_credentials でトークンを取ってから叩く。**資格情報が無ければ Job は赤くなる**
    # （無認証で通る経路は無い＝fail-closed）。
    # tokenEndpoint はここに置かない。global.authAuthority から cronjob.yaml が導出する
    # （リテラルを置くと --set global.authAuthority=... に追随せず、CronJob だけ別レルムを叩く）。
    # service-auth-client-id / service-auth-client-secret を持つ Secret（他サービスの s2s と同じもの）。
    serviceAuthSecretName: ast-secrets

# FR-05, #267, IADR-0111: ブローカ階層の**単一スイッチ**。運用の本番近接順は
#   paper（内蔵擬似・実発注しない） ＜ moomoo-sim（OpenD 経由 SIMULATE） ＜ moomoo-live（実弾）。
# template がこれを Broker__Provider（証券会社）× Broker__Environment（取引環境）の 2 軸へ展開する。
#
# ⚠️ moomoo-live（実弾）は**未解禁**であり、指定すると**描画時に fail する**（外周の閂）。
#    アプリ側も LiveTradingGate（閂 0）が起動時に停止させる。解禁には別の実装 ADR と
#    IADR-0056 §3 の前提充足が要る。本チャートで実弾は撃てない。
broker:
  # "" （空）= 非推奨エイリアス moomoo.enabled から導出する（false→paper / true→moomoo-sim）。
  # 明示指定する場合は "paper" または "moomoo-sim"。明示しつつ moomoo.enabled=true にすると描画時に止まる。
  tier: ""

# #13: moomoo（OpenD）発注の in-cluster 配線。既定 disabled = fail-safe（order-execution は paper・実発注しない）。
# ⚠️ IADR-0111 以降、`moomoo.enabled` は**非推奨**（broker.tier=moomoo-sim を使う）。broker.tier が空のときだけ
#    エイリアスとして解釈される（既存構成の互換維持）。opend.* の接続パラメータは引き続き本節が持つ。
# ⚠️ 有効化前提: (1) 常駐 OpenD が稼働し**ログイン済み**であること（`opend.enabled` か deploy/opend/k8s の生 manifest）。
#    OpenD 不在で enabled=true にすると order-execution は接続に失敗する。(2) Secret moomoo-rsa（OpenD と同一の RSA 鍵）。
# cross-network（worker→opend）trade は RSA 暗号化必須（#13 で確定）。実弾は撃たない（SIMULATE 固定・IADR-0016 / IADR-0056）。
moomoo:
  enabled: false
  opend:
    host: opend
    port: 11111
    rsaSecretName: moomoo-rsa
    rsaSecretKey: opend_rsa.pem
    rsaMountPath: /opt/opend/rsa
    # #132: OpenD への応答待ち（秒）。空=アダプタ既定（15 秒）。1〜600 の範囲外は order-execution が起動時に停止する。
    replyTimeoutSeconds: ""
    # #132, IADR-0060 決定 3: RSA 秘密鍵マウントのパーミッション。0400（YAML の 8 進＝10 進 256）＝所有者のみ読取。
    # ⚠️ マウント先コンテナの実行 uid と一致していること（現行の Worker イメージは root 実行）。
    #    非 root 化する場合は fsGroup と 0440 を用いる（chart README 参照）。
    rsaSecretDefaultMode: 0400

# #132, IADR-0060 決定 1: 常駐 OpenD（moomoo ゲートウェイ）の**本番配備**の経路。
# 既定 disabled = fail-safe（何も描画しない）。dev の現行経路は deploy/opend/k8s の生 manifest（そちらは残す）。
#
# ⚠️ 常駐モデル（IADR-0053）: OpenD は初回に**有人**のデバイス検証（画像/SMS）が要る
#    （`kubectl -n ai-stock-trading attach -it deploy/opend` → input_pic_verify_code / input_phone_verify_code）。
#    以降は「デバイス信頼の永続化（PVC）＋ egress IP の安定」が保てれば無人再ログインが成立する（追検証済み）。
#    → **nodeSelector 等でノードを固定すること**（egress IP はノードの NAT 後 IP。ノードが変わったときに
#      再検証が要るかは **ADR-0024 決定5-1 で未検証**であり、安全側に「要る」と想定する）。
#    liveness を付けない・単一レプリカ・Recreate なのは、**再起動の最小化を維持する**ため（ADR-0024 決定3）と、
#    **SPOF であることが変わらない**ため（決定4。自動再起動は復旧までの発注不可時間を無人で繰り返し得る）。
#    ※ 旧理由「自動再起動＝有人検証待ちの停止」は ADR-0024 決定2 で否定された（IADR-0167 決定2）。
opend:
  enabled: false
  image:
    # global.image.registry を接頭辞に用いる（scripts/opend-build.sh のタグと一致させること）。
    repository: ai-stock-trading/opend
    tag: ""
  apiPort: 11111
  # OpenD はデバイス信頼を $HOME/.com.moomoo.OpenD に書く。PVC のマウント先は本値から導出する。
  # ⚠️ 非 root 化するときは /home/opend にする（下記 securityContext とセットで・chart README 参照）。
  home: /root
  # 資格情報（login-account / login-pwd-md5）。実値は Git に載せない（deploy/opend/k8s/secret.example.yaml 参照）。
  # 恒久フェーズは Vault / External Secrets（下記 externalSecrets・**ストア整備は #24 で未充足**）。
  credentialsSecretName: moomoo-credentials
  rsaSecretName: moomoo-rsa
  rsaSecretKey: opend_rsa.pem
  rsaMountPath: /opt/opend/rsa
  rsaSecretDefaultMode: 0400
  lang: en
  logLevel: info
  persistence:
    enabled: true
    size: 1Gi
    # 空=クラスタ既定の StorageClass（k3d/Rancher Desktop の local-path で足りる）。
    storageClassName: ""
  # ⚠️ 本番では**必ず**ノードを固定する（egress IP の安定＝無人再ログインの成立条件）。
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # #132, IADR-0060 決定 2: 非 root 化（issue #132 のハードニング項目）。
  # 既定 {} = 現行の root 実行を維持する。**実 OpenD で未検証のため既定 ON にしない**
  #（HOME が変わるとデバイス信頼を失い、有人検証からやり直しになる恐れがある）。
  # 切替は home=/home/opend と併せて指定する（Dockerfile が uid/gid 10001 を用意済み）:
  #   --set opend.home=/home/opend \
  #   --set opend.securityContext.runAsNonRoot=true \
  #   --set opend.securityContext.runAsUser=10001 \
  #   --set opend.podSecurityContext.fsGroup=10001 \
  #   --set opend.rsaSecretDefaultMode=0440
  securityContext: {}
  podSecurityContext: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# #132, IADR-0060 決定 4: 秘匿情報の External Secrets（Vault）**受け口**。既定 disabled = fail-safe。
# ⚠️ **これは Vault 化の充足ではない**。ストア（Vault / External Secrets Operator）は #24 の管掌で本リポジトリには無く、
#    CRD が無いクラスタで有効化すると apply が失敗する。実際に Vault へシークレットが載り ESO が同期して初めて充足。
#    IADR-0056 §3 が実弾解禁の前提に挙げる「秘匿情報の Vault 化」は**未充足のまま**である。
externalSecrets:
  enabled: false
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  # Vault 側のパスとプロパティ名。同期先の Secret 名は opend.credentialsSecretName / opend.rsaSecretName と一致させる。
  moomooCredentials:
    remoteKey: ai-stock-trading/moomoo
    loginAccountProperty: login-account
    loginPwdMd5Property: login-pwd-md5
  moomooRsa:
    remoteKey: ai-stock-trading/moomoo-rsa
    property: opend_rsa.pem
  # ADR-0006, IADR-0094 (#24): API 鍵群（Secret `ast-secrets`）の Vault 同期。既定 disabled = fail-safe
  # （現行の手動 k8s Secret 直運用を維持）。有効化には externalSecrets.enabled=true も要る。
  # ⚠️ 平文の鍵は置かない。Vault の単一 KV（remoteKey）に **Secret キー名と同名のプロパティ**で格納し
  #    （finnhub-api-key / service-auth-client-id / discord-bot-token 等・deployment.yaml の secretKeyRef.key）、
  #    dataFrom.extract で吸い上げる。欠けた鍵は消費側 optional=true で許容（fail-safe）。
  #    ストア（ESO/Vault）は #24 の MSP 側 stand-up・実運用は Tier 3。
  appSecrets:
    enabled: false
    # 同期先 Secret 名（services.*.extraEnv の secretKeyRef.name と一致）。
    targetName: ast-secrets
    # 全プロパティを吸い上げる Vault KV のパス。
    remoteKey: ai-stock-trading/app-secrets

# FR-09/14, #245, IADR-0102: Discord Bot の**環境固有 ID**（非機密）の設定点。すべて空既定 = 差し替えなし。
# templates/deployment.yaml が notification の extraEnv 値を**非空のときだけ**上書きする（env は増やさない）
# ため、空既定の描画は本設定点を追加する前と**バイト等価**である。
# 空のままなら IADR-0062 の安全既定（空 GuildId/ChannelId/AllowedUserIds は「全許可」ではなく**全拒否**）で
# Bot は接続しても操作を受け付けない。値を与えるのは利用者の明示操作である。
# ⚠️ `kubectl set env deploy/notification-service ...` で注入しないこと。env の所有が Helm と kubectl(kubectl-set)へ
#    割れ、次回の helm upgrade が `conflict with "kubectl-set"` で失敗する（#245 の実発生事象）。ここか
#    scripts/k8s-local-deploy.sh の DISCORD_BOT_* env（→ --set-string）で与える。
# ⚠️ 機密（Bot Token / kill switch 確認フレーズ / OwnerAuth 資格情報）はここに置かない。ast-secrets の
#    secretKeyRef のままとする（services.notification.extraEnv 参照）。
discord:
  bot:
    # 運用サーバー（ギルド）ID。18〜19 桁の snowflake。--set ではなく **--set-string** で渡す
    # （--set は float64 に解釈して 1.234567890123456e+18 に化ける）。
    guildId: ""
    # 運用チャンネル ID（同上）。
    channelId: ""
    # 許可ユーザー ID のカンマ区切り。手動で --set-string するときはカンマを `\,` にエスケープする。
    allowedUserIds: ""
    # "discordUserId:keycloak利用者名" のカンマ区切り（同上のエスケープが要る）。対応が無いユーザーは操作できない。
    userMapping: ""

# 10 Worker。全て Web SDK :8080（/health/live・/health/ready）。
# db を持つものは ConnectionStrings を注入、auth=true は Auth__Authority を注入する。
services:
  audit:
    image: ai-stock-trading/audit-service
    db: audit_svc
    auth: true
  backtest:
    image: ai-stock-trading/backtest-service
    # DB もメッセージバスも持たない（永続化なし・verdict の実 publish は #82）。auth も要らない
    # （公開する HTTP 面はヘルスチェックと実効構成の自己申告のみ・いずれもメッシュ内部限定）。
    extraEnv:
      # FR-15, ADR-0004, #208, IADR-0105: バックテストの実過去データ源。
      # fail-safe: 空/"none"/未知の値/不正な BaseUrl はすべて no-op＝**外部へ 1 リクエストも出さない**。
      # "stooq"（登録不要・鍵なし）を入れると実過去データ取得が有効になる。
      - { name: Backtest__BarData__Provider, value: "" }
  configuration:
    image: ai-stock-trading/configuration-service
    db: configuration_svc
    auth: true
  cost-control:
    image: ai-stock-trading/cost-control-service
    db: cost_control_svc
    # auth=true は自身の API の認証（/costs/*）に加え、**呼び出し側**として s2s トークンの token エンドポイント
    # 導出に Authority が要ることも意味する（GET /assumptions の照会・IADR-0051/0065）。
    auth: true
    extraEnv:
      # FR-17, IADR-0065 (#139): 月次費用上限の取得元（設定サービス）。利用者の上限変更を 80%/100% 判定へ反映する。
      # fail-safe: 空=前提条件の既定値（20,000/15,000）で判定する。
      - { name: Configuration__BaseUrl, value: "http://configuration-service:8080" }
      # IADR-0051: /assumptions（OwnerOrService）用の client_credentials。fail-safe: 未設定=認証なし→401→既定値へ縮退。
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
  information-collection:
    image: ai-stock-trading/information-collection-service
    # auth=true は Auth__Authority の注入を意味する。本サービスは自身の API を認証しない（server 側 auth は無し）が、
    # **呼び出し側**として s2s トークン（client_credentials）の token エンドポイント導出に Authority が要る（IADR-0051）。
    auth: true
    extraEnv:
      # fail-safe: 空=NoOp（外部接続しない）。案A+（ADR-0004）の情報源はカンマ区切りで列挙して有効化する
      # （例: "finnhub,finnhub-news,google-news,sec-edgar,edinet,boj,fred"）。列挙しても必須設定（キー・銘柄・CIK・系列コード）が
      # 空のソースは、そのソースだけ無効に倒れる（他ソースは有効なまま・IADR-0064）。
      - { name: Collection__Source__Provider, value: "" }
      # Finnhub Free（米国株の市況・60回/60秒固定ウィンドウ。IADR-0275 で実測確認済み）。
      - name: Collection__Source__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: finnhub-api-key, optional: true }
      - { name: Collection__Source__Finnhub__Symbols__0, value: "" }
      # ADR-0020 §結果 / IADR-0224 / IADR-0275: 日次上限は空=未実測（銘柄数上限を逆算しない）のまま。
      # 分次は実測済みだが、日次は実測セッションでも確定できなかった（継続観察が要る）。
      - { name: Collection__Source__Finnhub__DailyRequestLimit, value: "" }
      # Google News RSS（ニュース系の代替・キー不要。ADR-0020 決定2）。空=本ソース無効。
      - { name: Collection__Source__GoogleNews__Queries__0, value: "" }
      # SEC EDGAR（米国の開示・キー不要）。連絡先入り User-Agent は SEC 規約で必須（空=本ソース無効）。
      - { name: Collection__Source__SecEdgar__UserAgent, value: "" }
      - { name: Collection__Source__SecEdgar__Ciks__0, value: "" }
      # EDINET API v2（日本の開示・要 API キー）。
      - name: Collection__Source__Edinet__SubscriptionKey
        secretKeyRef: { name: ast-secrets, key: edinet-subscription-key, optional: true }
      # 日銀 時系列統計データ API（キー不要・クレジット表記必須）。
      - { name: Collection__Source__Boj__Db, value: "" }
      - { name: Collection__Source__Boj__SeriesCodes__0, value: "" }
      # FRED（米マクロ・要 API キー・120回/分）。
      - name: Collection__Source__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }
      - { name: Collection__Source__Fred__SeriesIds__0, value: "" }
      # NFR（費用）, IADR-0031/0051 (#79): 定時サイクルの費用統制ゲート。費用統制サービスの GET /costs/state を
      # s2s（trading-service）で同期照会し、Throttled なら間隔延長・Halted なら巡回停止する。
      # 照会不達・401・例外は Normal（停止せず）へ倒す fail-safe（IADR-0031）。単価既定 0（IADR-0055）のため
      # 費用は積み上がらず、既定では Normal のまま＝実単価を投入して初めて効く。
      - { name: CostControl__BaseUrl, value: "http://cost-control-service:8080" }
      # IADR-0051: s2s 同期照会（costs/state）用の client_credentials。fail-safe: 未設定=認証なし→401→Normal。
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      # FR-08, #9, IADR-0069/0073: 収集情報の実 KB 保存 opt-in。fail-safe: 空=NoOp（LoggingKnowledgeBaseSink＝保存しない）。
      # Documents:BaseUrl を platform DocumentService へ向けると実 KB 保存へ切替（KnowledgeBaseWriterSink）。
      - { name: KnowledgeBase__Documents__BaseUrl, value: "" }
      - { name: KnowledgeBase__Search__BaseUrl, value: "" }
      # FR-08, #18, IADR-0093: KB 書き込み/検索の s2s は MSP `microservices-platform` レルムの専用クライアント
      # （ai-stock-trading-kb-writer／service-account に platform-operator）で認証する。AST レルムの ServiceAuth__* は
      # issuer 不一致（401）・role 不一致（403）で KB 書き込みに使えないため（IADR-0093）。fail-safe: 空=トークン無し→401→未保存。
      # Authority は MSP レルムを指す（例 http://keycloak:8080/realms/microservices-platform）。ClientSecret は Secret 経由（空既定）。
      - { name: KnowledgeBase__Auth__Authority, value: "" }
      - name: KnowledgeBase__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-id, optional: true }
      - name: KnowledgeBase__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-secret, optional: true }
  market-monitor:
    image: ai-stock-trading/market-monitor-service
    db: market_monitor_svc
    auth: true
    extraEnv:
      - { name: RiskManagement__BaseUrl, value: "" }
      # IADR-0051: s2s 同期照会（open-positions）用の client_credentials。fail-safe: 未設定=認証なし→401→安全既定。
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      # FR-10, #158, IADR-0066/0068: 損切り検知の現在値。fail-safe: 空=no-op（実接続しない＝検知対象なし）。
      # finnhub＋鍵で opt-in（手動 live 検証）。前回値フォールバックはかけない（決定2）。鍵は情報収集とは別枠。
      - { name: MarketData__Provider, value: "" }
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
  notification:
    image: ai-stock-trading/notification-service
    extraEnv:
      # fail-safe: 空=NoOp（外部送信しない。実 Discord は #15）。
      - { name: Notifications__Provider, value: "" }
      - name: Notifications__Discord__WebhookUrl
        secretKeyRef: { name: ast-secrets, key: discord-webhook-url, optional: true }
      # FR-14, IADR-0062: Discord Bot（双方向）。fail-safe: false=Gateway に接続しない。
      # 有効化には Enabled=true・Token に加え多層認証の設定がすべて要る（1つでも欠ければ接続しない）。
      # 空の GuildId/ChannelId/AllowedUserIds は「全許可」ではなく全拒否に倒れる。
      - { name: Notifications__Discord__Bot__Enabled, value: "false" }
      - name: Notifications__Discord__Bot__Token
        secretKeyRef: { name: ast-secrets, key: discord-bot-token, optional: true }
      - { name: Notifications__Discord__Bot__GuildId, value: "" }
      - { name: Notifications__Discord__Bot__ChannelId, value: "" }
      - { name: Notifications__Discord__Bot__AllowedUserIds, value: "" }
      # "discordUserId:keycloak利用者名" のカンマ区切り。対応が無いユーザーは操作できない。
      - { name: Notifications__Discord__Bot__UserMapping, value: "" }
      # 空=kill switch を起動できない（誤爆防止の閂を設定漏れで外さない）。
      - name: Notifications__Discord__Bot__KillSwitchConfirmationPhrase
        secretKeyRef: { name: ast-secrets, key: discord-bot-killswitch-phrase, optional: true }
      # kill switch は Risk の OwnerOnly。ServiceAuth（trading-service）では 403 のため、
      # trading-owner をマップした専用クライアントを使う（IADR-0062 決定4）。未設定=401→操作は失敗（安全側）。
      - name: Notifications__Discord__OwnerAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      - name: Notifications__Discord__OwnerAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-secret, optional: true }
      # #226, IADR-0098: owner トークンの token エンドポイント（AST レルム）は templates/deployment.yaml が
      # global.authAuthority から導出して注入する（Auth__Authority と同一ソース＝--set 追随）。ここには置かない
      # （非テンプレート値では authAuthority 変更に追随せず 401 が別経路で再発するため）。
      # kill switch の呼び先（空=BaseAddress 未設定＝呼び出し失敗）。
      - { name: RiskManagement__BaseUrl, value: "" }
  order-execution:
    image: ai-stock-trading/order-execution-service
    db: order_execution_svc
    # Broker__Provider / Broker__Environment は template が broker.tier から決定する
    # （既定 paper・moomoo-sim は OpenD 経由 SIMULATE・moomoo-live は描画時 fail＝実弾は未解禁・#13 / IADR-0111）。
  report:
    image: ai-stock-trading/report-service
    db: report_svc
    auth: true
    extraEnv:
      # FR-10, FR-06, FR-21, ADR-0016 決定15, #463, IADR-0181: 強制買戻しの推定の照会先（権威源＝リスク管理）。
      # **空＝未供給（null）**。空列（＝推定 0 件）へ倒さない——0 件と表示すると「強制買戻しは
      # 起きていない」と読める（計画が名指しで禁じた向き）。期間約定（/fills）と同じ BaseUrl を使う。
      - { name: RiskManagement__BaseUrl, value: "" }
      # FR-16, #158, IADR-0068: 評価損益の現在値。fail-safe: 空=no-op（評価損益 0）。報告書はゲート無し＝
      # 差し替えがそのまま有効化。finnhub＋鍵で opt-in（手動 live 検証）。鍵は情報収集とは別枠。
      - { name: MarketData__Provider, value: "" }
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      # FR-06/16, ADR-0010, IADR-0071 決定1: 報告書散文の実 LLM ドラフト。fail-safe: 空=Placeholder（定型散文＝既定オフ）。
      - { name: LlmGateway__BaseUrl, value: "" }
      - { name: LlmGateway__TimeoutSeconds, value: "" }
      - { name: LlmGateway__LogPrompts, value: "" }
      # FR-08, IADR-0069/0071 決定3: 確定報告書の KB 保存。fail-safe: 空=no-op（保存しない）。設定時のみ opt-in。
      - { name: KnowledgeBase__Documents__BaseUrl, value: "" }
      # FR-08, IADR-0051: 自身の API・s2s の Authority 導出元（AST レルム）。
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      # FR-08, #18, IADR-0093: KB 保存の s2s は MSP レルムの専用クライアント（ai-stock-trading-kb-writer／platform-operator）で
      # 認証する（AST レルムの ServiceAuth__* では 401/403）。fail-safe: 空=トークン無し→401→未保存。Authority は MSP レルムを指す。
      - { name: KnowledgeBase__Auth__Authority, value: "" }
      - name: KnowledgeBase__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-id, optional: true }
      - name: KnowledgeBase__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-secret, optional: true }
      # FR-07, IADR-0071 決定2: 無応答時の既定動作。空/不正=ContinueLastConfirmed（直近確定を継続＝安全既定）。
      - { name: Reports__NoResponseBehavior, value: "" }
  risk-management:
    image: ai-stock-trading/risk-management-service
    db: risk_management_svc
    auth: true
    extraEnv:
      # FR-10, #81, #158, IADR-0066/0068: 時価評価（含み損益・DD）。fail-safe: EnableMarkToMarket=false（既定）。
      # true は最大DD の取引ゲート（IADR-0008）の判定入力を変えるため、実市況の live 検証後に人手で切り替える（決定4）。
      # Provider 空=no-op（実接続しない）。finnhub＋鍵で opt-in。鍵は情報収集とは別枠。
      - { name: MarketData__EnableMarkToMarket, value: "false" }
      - { name: MarketData__Provider, value: "" }
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
  trade-decision:
    image: ai-stock-trading/trade-decision-service
    extraEnv:
      - { name: Reports__BaseUrl, value: "" }
      - { name: RiskManagement__BaseUrl, value: "" }
      # FR-02/13, UC-06, SC-02, IADR-0088/0095: 監視銘柄（watchlist）の権威源＝市場監視の GET /monitor/watchlist を s2s 同期照会。
      # fail-safe: 空=構成ベース（TradeCycle:Watchlist）＝現行挙動。実結線時は市場監視サービス URL（例: http://market-monitor-service:8080）を入れると
      # SC-02 での監視銘柄変更が定時サイクルの判断対象に反映される。本 PR では実 URL を投入しない（他 s2s と足並みを揃える）。
      - { name: MarketMonitor__BaseUrl, value: "" }
      # FR-04, ADR-0010, IADR-0061: 実 LLM は platform LLM ゲートウェイ（POST /complete）へ委譲する。
      # fail-safe: 空=Placeholder LLM（呼ばない＝常に Hold）。実結線時は MSP のゲートウェイ URL を入れる
      # （例: http://llmgateway-service.microservices-platform:8080）。本 PR では実 URL を投入しない。
      - { name: LlmGateway__BaseUrl, value: "" }
      # 空・不正・非正値=既定 30 秒（IADR-0061 決定2）。
      - { name: LlmGateway__TimeoutSeconds, value: "" }
      # FR-11: プロンプト・生出力の全量ログ。空=残さない（機微を既定でログ基盤へ流さない・IADR-0061 決定1）。
      - { name: LlmGateway__LogPrompts, value: "" }
      # LLM プロバイダ鍵は注入しない。鍵は MSP の LlmGateway 側が保持し AST は鍵を持たない（ADR-0010 / IADR-0061 決定6）。
      # IADR-0051: s2s 同期照会（daily-policy/sizing-context）用の client_credentials。fail-safe: 未設定=認証なし→401→安全既定。
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      # FR-08, #11, IADR-0069/0072: RAG 取得（収集情報・判断根拠を KB から本判断プロンプトへ注入）。fail-safe: 空=NoOp 検索（参考情報なし）。
      - { name: KnowledgeBase__Search__BaseUrl, value: "" }
      # FR-08, #18, IADR-0093: RAG 検索の s2s も MSP `microservices-platform` レルムの専用クライアント（ai-stock-trading-kb-writer）で
      # 認証する（AST レルムの ServiceAuth__* ではない）。fail-safe: 空=トークン無し（現行の NoOp 検索を保持）。Authority は MSP レルムを指す。
      - { name: KnowledgeBase__Auth__Authority, value: "" }
      - name: KnowledgeBase__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-id, optional: true }
      - name: KnowledgeBase__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-secret, optional: true }
      # FR-10/17, #257, IADR-0107: 基準通貨（円）への換算レート源。統制上限・サイジングは円建てで判定するため、
      # 外貨建て銘柄はレートが解決できないと新規建てを見送る（過大発注を招かない安全側）。
      # fail-safe: 空/none/未知/キー無し=no-op（外部へ接続しない）。日本株は定義上レート 1 で従来どおり判断できる。
      # 実結線は fred＋API キー（FRED の DEXJPUS＝円/ドル）。本 PR では実 provider を投入しない。
      - { name: Fx__Provider, value: "" }
      - name: Fx__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
