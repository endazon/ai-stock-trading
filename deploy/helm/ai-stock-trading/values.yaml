      # 前提（クラスタ側の作業と一体）: 基盤の LlmGateway が h2c ポート（Grpc__Port）を配備していること、
      # AST から当該ポートへ到達できること（Istio PeerAuthentication）。s2s は下の LlmGateway__Auth__* をそのまま使う。
      # #1256, MSP#1811, MSP#1812, MSP/IADR-0513: 🔴 到達には L4 も入る。MSP の本番の NetworkPolicy `networkPolicy.fromAst.llmGateway`
      # （既定は閉）は、開けても AST の report・trade-decision から LLM ゲートウェイの REST 8080 だけを通し、gRPC 8081 は開けない
      # （KB の `kbReader`（検索）・`kbWriter`（文書）も REST だけ）。このまま gRPC へ切り替えると 8081 は L4 で塞がれ、接続できない。
      # gRPC へ切り替えるなら、先に MSP 側で穴の形（REST だけ）を改めて判断してもらう（MSP/IADR-0513）。
      # FR-04, ADR-0014/0017, IADR-0212/0276, #571: 二段判断（一次スクリーニング=軽量モデル→二次本判断）の有効化。
      # コード側の構成既定も true（#571 で反転。明示行はここでの可視化が目的で挙動を変えない）。
      # ⚠️ 前提: 基盤 LlmGateway に用途 trade-decision-screening（claude-haiku-5-5。#1295）が登録されていること
      # （microservices-platform 側 PR。未登録のまま true でも安全側（見送り）に倒れるだけで発注はされないが、
      # スクリーニングによる費用統制は機能しない＝IADR-0212 が挙げた帰結）。無効化する場合は "false" にする。
      - { name: Decision__EnableScreening, value: "true" }
      # FR-02, FR-04, IADR-0247/0313, #567: スクリーニング入力のコンテキスト予算（文字数プロキシ）。
      # 既定 150,000 文字＝200,000 トークン（導出時の割当 claude-haiku-4-5 のコンテキスト）× 1.0 文字/トークン × 安全率 0.75。
      # #1295, IADR-0524: 現割当 claude-haiku-5-5 のコンテキストは 1M トークンで上の制約は効かない。値は据え置き、根拠は
      # 費用の段へ移る（入力 100,000 トークン超は単価が 5 倍。150,000 文字は最悪側〈1.0 文字/トークン〉で高単価の段に入り得る）。
      # 超過時は ① 銘柄分割 → ② RAG 削減 → ③ ニュース・開示削除 の順で縮退し、日報の方針と当日の市況は削らない。
      # 空=コード側の既定（150,000）。正の整数で上書き。**無効化する場合だけ "0" か "off" を明示する**
      # （無効化すると参考情報がスクリーニングへ載らない従来プロンプトへ戻る＝IADR-0072 決定2）。
      - { name: Decision__ScreeningContextBudgetChars, value: "" }
      # 空・不正・非正値=既定 30 秒（IADR-0061 決定2）。
      - { name: LlmGateway__TimeoutSeconds, value: "" }
      # FR-11: プロンプト・生出力の全量ログ。空=残さない（機微を既定でログ基盤へ流さない・IADR-0061 決定1）。
      - { name: LlmGateway__LogPrompts, value: "" }
      # NFR-05, #724, IADR-0323: LLM ゲートウェイの s2s。基盤が REST 3 口へ端点単位の認可（ServiceCaller＝realm ロール
      # platform-service）を掛けたため、匿名では 401 になる。KB と同じ **MSP の `platform` レルム**の confidential
      # client で認証する（AST レルムの ServiceAuth__* は issuer 不一致で通らない）。
      # fail-safe: 空=トークン無し→401→**認可の失敗として**記録し Hold（＝モデル不可へは倒さない・IADR-0323 決定3）。
      - { name: LlmGateway__Auth__Authority, value: "" }
      - name: LlmGateway__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: llm-auth-client-id, optional: true }
      - name: LlmGateway__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: llm-auth-client-secret, optional: true }
      # LLM プロバイダ鍵は注入しない。鍵は MSP の LlmGateway 側が保持し AST は鍵を持たない（ADR-0010 / IADR-0061 決定6）。
      # IADR-0051: s2s 同期照会（daily-policy/sizing-context）用の client_credentials。fail-safe: 未設定=認証なし→401→安全既定。
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      # FR-08, #11, IADR-0069/0072: RAG 取得（収集情報・判断根拠を KB から本判断プロンプトへ注入）。fail-safe: 空=NoOp 検索（参考情報なし）。
      - { name: KnowledgeBase__Search__BaseUrl, value: "" }
      # FR-08, FR-04, #1078, IADR-0485（MSP#1696 の裁定 案 B）: RAG 検索の s2s は MSP の `platform` レルムの**読み手**
      # （ai-stock-trading-kb-reader。ロールなし・ABAC で project=ai-stock-trading の文書だけを読める）で認証する。
      # 書き手（kb-writer）の資格情報は取引判断へ渡さない（取引判断は KB へ書かない。最小権限）。
      # fail-safe: 空=トークン無し→401→空結果（参考情報なしで判断を続ける）。
      # #626, IADR-0283: Authority は MSP の `platform` レルムを指す（値は template が global.authAuthority から導出する）。
      - { name: KnowledgeBase__SearchAuth__Authority, value: "" }
      - name: KnowledgeBase__SearchAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-reader-auth-client-id, optional: true }
      - name: KnowledgeBase__SearchAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-reader-auth-client-secret, optional: true }
      # FR-10/17, #257, #364, IADR-0107/0152: 基準通貨（USD）への換算レート源。統制上限・サイジングは
      # 基準通貨で判定するため、非基準通貨（JPY 建て）はレートが解決できないと新規建てを見送る
      # （過大発注を招かない安全側）。基準通貨の米国株は定義上レート 1 で従来どおり判断できる。
      # #686, IADR-0308: 計画 ADR-0022 決定1 の第一情報源＝日銀（認証不要のため鍵を要さない）。
      # FRED は決定2 のフォールバックであり、Fx__Fred__ApiKey があるときだけ後段に積まれる
      # （空なら日銀単独＝「フォールバックがありません」を起動時に 1 回警告する）。
      # fail-safe: 空/none/未知=no-op（外部へ接続しない）＝非基準通貨は見送り。
      - { name: Fx__Provider, value: "boj" }
      - name: Fx__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

# NFR, #1137: 11 Worker 共通の readinessProbe（/health/ready）。templates/deployment.yaml が読む単一情報源。
# 🔴 timeoutSeconds はアプリの DB 疎通チェックの打ち切り（HealthCheckExtensions.NpgSqlReadinessTimeout = 3 秒）より
#    **厳密に長く**保つ。チェックが先に打ち切って 503 を返し、kubelet の打ち切りより先に答えが届くようにするため（Npgsql が取り消しに
#    応じる局面に限る。ハンドシェイクでの無応答は接続 Timeout まで止まらない）。
#    未指定（Kubernetes 既定 1 秒）だと、DB の往復が 1 秒を超えた時点で kubelet が切り、チェックは途中で取り消される
#    （2026-09-30 17:49 UTC の実測）。差（2 秒）は応答の書き出し・スケジューリングの遅れの余裕。大小は
#    PlatformShim.Tests の ReadinessProbeTimeoutConsistencyTests と helm.yml の assert が固定する。
# initialDelaySeconds / periodSeconds / failureThreshold は従来の値のまま（起動時の migration を待つため 30 回 × 10 秒）。
# liveness（/health/live）はチェックを 1 つも走らせない（DB に依存しない）ため対象外で、テンプレートに据え置く。
probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
