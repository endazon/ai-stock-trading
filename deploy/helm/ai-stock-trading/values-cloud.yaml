# ai-stock-trading — 単一ノードのクラウド（Hetzner の k3s）のプロファイル。
# ADR-0006, ADR-0024, NFR, #1525, IADR-0608。手順は docs/operations/cloud-single-node-migration-runbook.md。
#
# ★ 重ね方: `helm upgrade --install ast deploy/helm/ai-stock-trading -f values-cloud.yaml -f <digest のファイル>`
#   - values.yaml に**直接**重ねる。values-local.yaml とは併用しない（経路 B の調整をクラウドへ流さない。IADR-0608 決定 1）。
#   - Helm はリスト（extraEnv）を置き換える。下の各サービスの extraEnv は、そのサービスで使う全要素を持つ。
#     values.yaml に env を足したら、ここの同じサービスにも写す。写し忘れは helm.yml の「values-cloud drops no env」が止める（#1548）。
#     クラウドで意図して外すものは、同じ段の除外表に理由と一緒に書く。
#
# ★ クラウドに持ち込まないもの（オーナーの決定 2026-11-05）:
#   - ニュースの RAG（MSP の knowledge ユニット）: KB の宛先（KnowledgeBase__*）を書かない＝既定の空＝no-op。
#     取引判断のプロンプトには「この環境では検索を使っていない」の 1 行が出る（IADR-0608 決定 4）。
#   - Web の画面: OpenD の認証サイドカー（画面から検証コードを入れる口）は使わない。初回の SMS 認証は kubectl attach で行う。
#   - Stage 0 の記録: 無効（記録の構成を書かない＝既定の Enabled=false）。
#
# ★ 秘密: 値は secretKeyRef だけで参照し、このファイルにも helm の引数にも書かない。
#   🔴 NFR-05, ADR-0080, #1560, IADR-0623: 秘密はすべて OpenBao から ESO で写す（下の externalSecrets）。k8s の Secret を手で作らない
#   （例外は ast-operator-hold だけ。秘密ではない SSH からの停止の切り替えで、OpenBao の封印のあいだも効く必要がある）。
#   🔴 移行の条件（手順書の最初の節）を満たすまで、本物の秘密をサーバーへ入れない。
#
# ★ 段 2（強制。NFR-06, FR-10, #1560, IADR-0623 決定 3）: 段 1（記録だけ）と段 2 の 2 段で作った守りを、クラウドでは段 2 で始める。
#   注文の承認の印・所有者のトークンの aud / azp・ボットの許可表（global の 3 つ）、危険な操作の第 2 要素（risk-management・report）、
#   kill switch の前提条件（risk-management）。values.yaml（既定）と values-local（経路 B）は段 1 のまま。
#
# ★ 基盤との接続の暗号化（DB・ブローカ・LLM ゲートウェイ。#1535, IADR-0621）: 接続の形は chart（deployment.yaml）が持ち、
#   ここはスイッチを入れるだけにする。DB は VerifyFull＋基盤の CA、ブローカは amqps:5671、LLM ゲートウェイは https
#   （基盤の CA で検証。外部 API は従来のシステムの信頼のまま）。CA は名前空間 ai-stock-trading の ConfigMap
#   platform-infra-ca（キー ca.crt）から読む。無いと Pod は起動しない（平文へ戻らない）。写し方は手順書の §5。
#   認可サーバー（Keycloak）も https:8443 で同じ CA で検証する（global.authTls。IADR-0629）。
#
# ★ イメージ: ノードでビルドして取り込み、digest で固定する（レジストリを持たない）。
#   digest はノードで書き出したファイル（コミットしない）から重ねる。欠けたら描画で止まる（global.image.requireDigest）。

global:
  image:
    registry: k3d-local
    tag: latest
    # ノードへ取り込んだイメージだけを使う（レジストリから取りに行かない）。
    pullPolicy: Never
    # 自前のイメージに digest が無ければ描画で止める（IADR-0608 決定 2）。
    requireDigest: true
  # 🔴 明示する（chart の既定は空になり、未設定なら描画で止まる）。クラウドの基盤の Keycloak の issuer と同じ値:
  #   基盤の最小構成は KC_HOSTNAME=https://keycloak:8443・realm platform で（MSP:IADR-0693。平文の口は持たない）、AST の名前空間からは
  #   ExternalName の keycloak で引く（infraAliases）。トークンの iss がこの値と一致しないと検証で落ちる。
  #   トークンの取得先（ServiceAuth__TokenEndpoint・Discord の OwnerAuth・LLM ゲートウェイの Authority）はこの値から導く（chart）。
  authAuthority: https://keycloak:8443/realms/platform
  # NFR, NFR-05, IADR-0629: 認可サーバーへの通信を TLS で検証する。https でない Authority はアプリが起動で拒み
  #   （Auth__RequireHttpsMetadata=true）、サーバ証明書は基盤の CA（下の infraCa。DB・ブローカと同じ CA）で検証する。
  #   全 11 サービスが CA を持つ（DB・ブローカを使わないサービスも。描画の検査 helm.yml が固定する）。
  #   🔴 Keycloak を呼ぶサービスを足したら、基盤（MSP）の deploy/cloud/infra/networkpolicy.yaml の Keycloak の入りの一覧（label app）にも
  #   足すよう MSP へ依頼する。足さなければ、そのサービスの起動・呼び出しが落ちる（手順書 docs/operations/cloud-keycloak-tls-runbook.md）。
  #   稼働中の構成を移す間だけ、旧の発行元を --set-string global.authValidIssuers=http://keycloak:8080/realms/platform で足す
  #   （ここには書かない。外す時期は手順書の段 6）。
  authTls:
    enabled: true
  # 🔴 段 2（IADR-0610 / 0611 / 0622）。鍵の Secret が無ければ注文の承認の発行元・受け手の Pod は起動しない（Enforce は非 optional）。
  orderApprovalSigning:
    mode: Enforce
  ownerTokenBinding:
    mode: Enforce
    # 🔴 NFR, FR-10, IADR-0638 決定 4: クラウドの所有者の操作は Discord ボットのクライアントだけが送る（基盤の realm に中継のクライアントは無い）。
    #   コードの既定の集合に頼らず明示する（将来 realm に同名のクライアントが足されても所有者として通さない）。
    clients: [ai-stock-trading-owner]
  ownerBotScope:
    mode: Enforce
  # 🔴 NFR, NFR-05, IADR-0637: サービスのトークンは身元（azp）と宛先（aud ai-stock-trading-api）で確かめ、口ごとに呼び手を限る（段 Enforce）。
  #   呼び手は基盤の realm のサービスごとの機密クライアント（下の services.<名前>.serviceAuthClient。基盤の realm-for-cloud.js の SERVICE_CLIENTS）。
  #   🔴 移行の段: 旧の共有クライアント ai-stock-trading-svc も受ける（宛先を問わず、サービスに開いた口を通す。受けた回はログに残る）。
  #   全サービスが自分のクライアントで動き、そのログが 1 日出ないことを確かめてから legacyClients を外す（手順書
  #   docs/operations/cloud-s2s-per-service-clients-runbook.md の段 3）。戻すときは mode を Report にする（記録だけ）。
  serviceTokenBinding:
    mode: Enforce
    legacyClients: [ai-stock-trading-svc]
  # 🔴 段 2（IADR-0633）。発行元の鍵（cloud/ast/ast-message-origin-{signing,verify}-keys）が無ければ、鍵を読むサービスの Pod は起動しない。
  #   旧い共有の鍵（legacyHmac）は使わない（段 2 と併用すると描画で止まる）。
  messageOrigin:
    mode: Enforce
    # 🔴 NFR, FR-09, IADR-0638 決定 3: 通知は新しく足した受け手なので、段 1（記録だけ）で当てる。鍵は段 2 のまま必須で読む。
    #   通知のログに EventId 16261 が 1 日出ないことを確かめてから、この行を外す（手順書 docs/operations/cloud-single-node-migration-runbook.md §5.1「受け手を足したときの段」）。
    modeOverrides:
      notification: Report
  # NFR-18, #1535, IADR-0621: 基盤の DB・ブローカへの接続を TLS にする（経路 B の values-local と同じスイッチ）。
  rabbitmq:
    tls:
      enabled: true
    # 🔴 NFR-18, IADR-0628: 購読側は購読の exchange を宣言しない（受動の確かめだけ）。基盤のクラウドのブローカの権限は、購読の exchange の
    #   configure を購読側に与えない形へ絞る（基盤の生成器）。exchange は基盤のブローカの起動の直後の初期化が先に宣言する。
    subscribedExchanges: Passive
  db:
    tls:
      enabled: true
    # 🔴 リポジトリの既定のパスワードを使わない。パスワードは Secret から読み、接続文字列は env の参照で組む（IADR-0608 決定 3）。
    password: ""
    passwordSecret:
      name: ast-db-credentials
      key: password
    # NFR-05, #1560, IADR-0623: 利用者名は基盤が乱数の接尾辞つきで作る（cloud/shared/ast-db の username）。固定の値を描かない。
    usernameSecret:
      name: ast-db-credentials
      key: username
    # 🔴 NFR-18, IADR-0630（基盤の MSP:IADR-0695）: DB を持つ 7 つのサービスは、上の共有の 1 組ではなく、それぞれ自分の資格
    #   （services.<名前>.dbCredentials・Secret ast-db-<サービス>-credentials）を読む。上の共有の 1 組は、基盤が共有の利用者を消す
    #   （最終の段）までの移行の間だけ残す（DB を持つサービスを足したときに dbCredentials を書き忘れると、共有の資格へ戻る。描画の検査が止める）。
  # NFR-18, NFR-05, #1560, IADR-0623: 基盤の CA の写しは ESO が Secret に作る（cloud/shared/platform-infra-ca。公開してよい証明書）。
  infraCa:
    configMap: ""
    secretName: platform-infra-ca
    caKey: ca.crt

# OpenD（SIMULATE）。配布物の tar の sha256 を deploy/opend/opend-tarball.sha256 の記録と照合してからノードでイメージを作る（手順書 §3。IADR-0639）。
# 🔴 取引パスワードはクラスタに置かない（SIMULATE では解錠は要らない）。moomoo-credentials はログインの資格だけを持つ。
opend:
  enabled: true
  authGateway:
    enabled: false
  # NFR, IADR-0631: 外の中継（OpenD）の権限を最小にする。段 1（root のまま。HOME とデバイス信頼の置き場を変えない）に、
  #   seccomp RuntimeDefault と権限昇格なし（seccomp: true）・ケーパビリティは全て落として起動に要る 2 つだけを足す。
  #   - DAC_OVERRIDE: 入口の処理（deploy/opend/entrypoint.sh）が uid 10001 の所有する /opt/opend の OpenD.xml へ書き、OpenD が同じ場所へ
  #     AppData.dat 等を書く（deploy/opend/README の観測）。所有者でない root の書き込みに要る。
  #   - FOWNER: 入口の処理が所有者でない OpenD.xml へ chmod 600 をかける。
  #   実測（2026-11-07。deploy/opend/Dockerfile のまま、OpenD の実行ファイルだけを同じファイル操作をする代わりの物に替えたイメージ）:
  #   ALL を落とすだけ → OpenD.xml の書き込みで拒否／DAC_OVERRIDE だけ → chmod で拒否／FOWNER だけ → 書き込みで拒否／
  #   2 つと権限昇格なし・既定の seccomp → 起動まで通る。NET_RAW（同じノードの通信への細工に使える）は落ちる。
  #   🔴 実 OpenD の実行ファイルそのものでは確かめていない（配布物は取り込みの前に手元に無い）。初回の起動で確かめ、落ちたら手順書の切り戻し
  #   （docs/operations/cloud-network-policy-runbook.md）で上書きを外す。非 root（段 3）を初回に採らない理由は IADR-0631。
  podSecurity:
    stage: 1
    seccomp: true
    capabilities:
      dropAll: true
      add: [DAC_OVERRIDE, FOWNER]
  # NFR, IADR-0631: OpenD の出は名前解決とクラスタの外の公開アドレスの TCP だけ（templates/networkpolicy-opend.yaml の opend-egress）。
  networkPolicy:
    egress:
      enabled: true

broker:
  tier: moomoo-sim

# NFR-05, ADR-0080, #1560, IADR-0623: 秘密は OpenBao から ESO で写す。取り決め（基盤の IADR-0689 決定 6）:
#   - ストアは名前空間の SecretStore openbao（kubernetes 認証・role ast-eso・ServiceAccount ast-eso-reader）。ClusterSecretStore は使えない。
#   - KV v2 のマウントは cloud/。取引ユニットだけの値は cloud/ast/<Secret の名前>、基盤と共有の値は cloud/shared/<名前>。
#   - property の名前は k8s の Secret のキーの名前と 1 対 1。値を入れる順と入れ方は手順書の §5。
externalSecrets:
  enabled: true
  secretStoreRef:
    name: openbao
    kind: SecretStore
  refreshInterval: 1h
  deletionPolicy: Retain
  openbaoStore:
    create: true
    # NFR-05, IADR-0632（基盤の MSP:IADR-0696）: 基盤の OpenBao の受け口は TLS の 8443 だけ。CA は基盤の tls-cert.sh が
    #   この名前空間に置く ConfigMap openbao-ca（キー ca.crt）で検証する。🔴 基盤の併存の段の後に当てる（手順書 §5.4）。
    server: https://openbao.openbao.svc:8443
    caProvider:
      type: ConfigMap
      name: openbao-ca
      key: ca.crt
    path: cloud
    role: ast-eso
    serviceAccountName: ast-eso-reader
  moomooCredentials:
    remoteKey: ast/moomoo-credentials
    loginAccountProperty: login-account
    loginPwdMd5Property: login-pwd-md5
  moomooRsa:
    remoteKey: ast/moomoo-rsa
    property: opend_rsa.pem
  rabbitmqUsers:
    remoteKey: shared/ast-rabbitmq-users
  dbCredentials:
    enabled: true
    targetName: ast-db-credentials
    remoteKey: shared/ast-db
  # NFR-18, IADR-0630: DB のサービスごとの資格（services.<名前>.dbCredentials を持つ 7 つ）。置き場は基盤の cloud/shared/ast-db-<サービス>。
  serviceDbCredentials:
    enabled: true
    remoteKeyPrefix: shared/ast-db-
  ownerTotp:
    enabled: true
    targetName: ast-owner-totp
    remoteKey: ast/ast-owner-totp
  # NFR, FR-10, IADR-0633: メッセージの発行元の鍵（キー＝発行元の識別子）。秘密の鍵と公開の鍵を別々に写す。
  #   作り方は scripts/ast-message-origin-keygen.sh（オーナーが流す。値を表示せず基盤の put-external-secret.sh へ標準入力で渡す。手順書 §5）。
  messageOriginSigningKeys:
    enabled: true
    targetName: ast-message-origin-signing-keys
    remoteKey: ast/ast-message-origin-signing-keys
  messageOriginVerifyKeys:
    enabled: true
    targetName: ast-message-origin-verify-keys
    remoteKey: ast/ast-message-origin-verify-keys
  # 入れ替えの間の前の公開の鍵。global.messageOrigin.previousVerify に発行元を足したときだけ描かれる（手順書 §5.1）。
  messageOriginPreviousVerifyKeys:
    enabled: true
    targetName: ast-message-origin-previous-verify-keys
    remoteKey: ast/ast-message-origin-previous-verify-keys
  infraCa:
    enabled: true
    targetName: platform-infra-ca
    remoteKey: shared/platform-infra-ca
    property: ca.crt
  # 🔴 NFR, NFR-05, IADR-0637: サービス間の認証の資格をサービスごとの Secret ast-service-auth-<名前> へ写す（キー client-id・client-secret）。
  #   置き場は基盤の cloud/shared/ast-client-secrets（キーは clientId。基盤の seed-secrets.sh が OpenBao の中で作る）。
  serviceAuthClients:
    enabled: true
    remoteKey: shared/ast-client-secrets
  appSecrets:
    enabled: true
    targetName: ast-secrets
    # 外から持ち込む値（Discord・情報源）と、OpenBao の中で作る注文の承認の鍵（gen）。キーは Secret のキーと同じ名前。
    remoteKey: ast/ast-secrets
    # クラウドの realm の 3 つの機密クライアント（基盤の realm-for-cloud.js の DECLARED_CLOUD_CLIENTS）。client ID は秘密ではない。
    # 🔴 IADR-0637: service-auth-client-* は旧の共有クライアント。サービスは使わない（上の serviceAuthClients）。戻す道として移行の段だけ残し、
    #   最終の段（手順書の段 3）で外す。
    clientIds:
      service-auth-client-id: ai-stock-trading-svc
      llm-auth-client-id: ai-stock-trading-llm-caller
      discord-owner-auth-client-id: ai-stock-trading-owner
    sharedClientSecrets:
      remoteKey: shared/ast-client-secrets
      properties:
        service-auth-client-secret: ai-stock-trading-svc
        llm-auth-client-secret: ai-stock-trading-llm-caller
        discord-owner-auth-client-secret: ai-stock-trading-owner

reloader:
  enabled: false

# NFR, IADR-0631: 取引ユニットの通信を許可した組だけにする（templates/networkpolicy-services.yaml）。名前空間に入り・出の既定の拒否を置き、
#   下の宣言の組だけを足す。宣言は呼び手の側（env の *__BaseUrl・grpcClients の写し）。写し忘れは scripts/helm-network-policy.test.js が止める。
#   🔴 適用の順序と切り戻しは docs/operations/cloud-network-policy-runbook.md（先に試験の環境で通し、稼働へは OpenD の再起動を伴わない形で入れる）。
#   基盤の側（MSP の deploy/cloud/infra/networkpolicy.yaml）の入りの一覧（Postgres は DB を持つ 7 つ・ブローカと Keycloak は 11 個・
#   LLM ゲートウェイは report と trade-decision）と同じ組である（片側だけ開けても届かない）。
networkPolicy:
  enabled: true
  services:
    audit: {}
    backtest:
      calls: [order-execution]
    configuration: {}
    cost-control:
      calls: [configuration]
    information-collection:
      calls: [cost-control, market-monitor, risk-management]
      externalHttps: true
    market-monitor:
      # NFR-06, IADR-0634: report は入れ替えの適用の結び付きの照会（報告書の台帳）。
      calls: [report, risk-management]
      externalHttps: true
    notification:
      calls: [market-monitor, report, risk-management]
      externalHttps: true
    order-execution:
      calls: [risk-management]
      opend: true
    report:
      calls: [audit, risk-management]
      llmGateway: true
      externalHttps: true
    risk-management:
      externalHttps: true
    trade-decision:
      calls: [cost-control, market-monitor, order-execution, report, risk-management]
      llmGateway: true
      externalHttps: true

# Pod のセキュリティの段（IADR-0609）。🔴 NFR, IADR-0609（2026-11-07 追記）: Worker は**稼働の前から**段 3 で動かす（段 2 のまま root で始めない）。
# 段 3: 非 root（aspnet の app＝1654）・seccomp RuntimeDefault・権限昇格なし・ケーパビリティを全て落とす・fsGroup（発注執行の鍵の mount は 0440）。
# readOnlyRootFilesystem: コンテナのルートを読み取り専用にし、書く場所は /tmp の emptyDir（podSecurity.tmpSizeLimit）だけにする。
#   Worker が書くのは /tmp（.NET の一時ファイル・診断の IPC）だけである（Stage 0 の記録の PVC はクラウドでは無効。/app は読むだけ）。
# PSA の enforce は baseline のまま（OpenD は段 1。restricted は OpenD の段 3 も要る）。メッシュの注入は使わない（貼れる）。
# 戻すときは stage: 2 と readOnlyRootFilesystem: false を一緒に戻して helm を再実行する（手順書 §9）。
podSecurity:
  stage: 3
  readOnlyRootFilesystem: true
  admission:
    enforce: baseline

stage0Recording:
  persistence:
    enabled: false

services:
  audit:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-audit。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-audit-credentials, key: username }
      passwordSecret: { name: ast-db-audit-credentials, key: password }
  configuration:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-configuration。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-configuration-credentials, key: username }
      passwordSecret: { name: ast-db-configuration-credentials, key: password }
  cost-control:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-cost-control。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-cost-control-credentials, key: username }
      passwordSecret: { name: ast-db-cost-control-credentials, key: password }
    serviceAuthClient: { clientId: ai-stock-trading-svc-cost-control }
    # 🔴 IADR-0637: extraEnv は配列で丸ごと置き換わるため、values.yaml の同じサービスの全要素を写す（サービス間の認証の資格だけを替える）。
    extraEnv:
