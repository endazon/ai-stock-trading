      - { name: OrderExecution__BaseUrl, value: "" }
      - name: RiskControls__DelegatedActor__TrustedClientIds
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      - name: Auth__GrpcOwnerClients__0
