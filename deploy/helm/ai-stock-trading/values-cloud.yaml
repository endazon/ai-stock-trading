# ai-stock-trading — 単一ノードのクラウド（Hetzner の k3s）のプロファイル。
# ADR-0006, ADR-0024, NFR, #1525, IADR-0608。手順は docs/operations/cloud-single-node-migration-runbook.md。
#
# ★ 重ね方: `helm upgrade --install ast deploy/helm/ai-stock-trading -f values-cloud.yaml -f <digest のファイル>`
#   - values.yaml に**直接**重ねる。values-local.yaml とは併用しない（経路 B の調整をクラウドへ流さない。IADR-0608 決定 1）。
#   - Helm はリスト（extraEnv）を置き換える。下の各サービスの extraEnv は、そのサービスで使う全要素を持つ。
#
# ★ クラウドに持ち込まないもの（オーナーの決定 2026-11-05）:
#   - ニュースの RAG（MSP の knowledge ユニット）: KB の宛先（KnowledgeBase__*）を書かない＝既定の空＝no-op。
#     取引判断のプロンプトには「この環境では検索を使っていない」の 1 行が出る（IADR-0608 決定 4）。
#   - Web の画面: OpenD の認証サイドカー（画面から検証コードを入れる口）は使わない。初回の SMS 認証は kubectl attach で行う。
#   - Stage 0 の記録: 無効（記録の構成を書かない＝既定の Enabled=false）。
#
# ★ 秘密: 値は secretKeyRef だけで参照し、このファイルにも helm の引数にも書かない。
#   供給方式は externalSecrets.enabled で切り替える（既定 false＝手で作る Secret。基盤の最小構成の決定に合わせて変える）。
#   🔴 移行の条件（手順書の最初の節）を満たすまで、本物の秘密をサーバーへ入れない。
#
# ★ 基盤との接続の暗号化（DB・ブローカ・LLM ゲートウェイ）は #1535 が入れる。このファイルはその値を参照するだけにし、
#   ここで接続の形を独自に決めない（#1535 の後に、同じ値をここへ写す）。
#
# ★ イメージ: ノードでビルドして取り込み、digest で固定する（レジストリを持たない）。
#   digest はノードで書き出したファイル（コミットしない）から重ねる。欠けたら描画で止まる（global.image.requireDigest）。

global:
  image:
    registry: k3d-local
    tag: latest
    # ノードへ取り込んだイメージだけを使う（レジストリから取りに行かない）。
    pullPolicy: Never
    # 自前のイメージに digest が無ければ描画で止める（IADR-0608 決定 2）。
    requireDigest: true
  # 🔴 明示する（chart の既定は空になり、未設定なら描画で止まる）。クラウドの基盤の Keycloak の issuer と同じ値:
  #   基盤の最小構成は KC_HOSTNAME=http://keycloak:8080・realm platform で、AST の名前空間からは ExternalName の keycloak で引く
  #   （infraAliases）。トークンの iss がこの値と一致しないと検証で落ちる。
  authAuthority: http://keycloak:8080/realms/platform
  db:
    # 🔴 リポジトリの既定のパスワードを使わない。パスワードは Secret から読み、接続文字列は env の参照で組む（IADR-0608 決定 3）。
    password: ""
    passwordSecret:
      name: ast-db-credentials
      key: password

# OpenD（SIMULATE）。配布物の tar の sha256 を記録してからノードでイメージを作る（手順書）。
# 🔴 取引パスワードはクラスタに置かない（SIMULATE では解錠は要らない）。moomoo-credentials はログインの資格だけを持つ。
opend:
  enabled: true
  authGateway:
    enabled: false

broker:
  tier: moomoo-sim

externalSecrets:
  enabled: false
  appSecrets:
    enabled: false

reloader:
  enabled: false

# Pod のセキュリティの段（IADR-0609 の推奨の順）。段 2 で始め、起動と取引の 1 日を確かめてから段 3（非 root）へ上げる（手順書）。
# 段 2: root のまま seccomp RuntimeDefault・権限昇格なし・ケーパビリティを全て落とす。PSA の enforce は baseline（段 2 と OpenD の
# 段 1 が満たす）。restricted は段 3 と OpenD の段 3 が要るので、上げるときに一緒に替える。メッシュの注入は使わない（貼れる）。
podSecurity:
  stage: 2
  admission:
    enforce: baseline

stage0Recording:
  persistence:
    enabled: false

