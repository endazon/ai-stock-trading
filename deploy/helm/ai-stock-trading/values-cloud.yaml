# ai-stock-trading — 単一ノードのクラウド（Hetzner の k3s）のプロファイル。
# ADR-0006, ADR-0024, NFR, #1525, IADR-0608。手順は docs/operations/cloud-single-node-migration-runbook.md。
#
# ★ 重ね方: `helm upgrade --install ast deploy/helm/ai-stock-trading -f values-cloud.yaml -f <digest のファイル>`
#   - values.yaml に**直接**重ねる。values-local.yaml とは併用しない（経路 B の調整をクラウドへ流さない。IADR-0608 決定 1）。
#   - Helm はリスト（extraEnv）を置き換える。下の各サービスの extraEnv は、そのサービスで使う全要素を持つ。
#     values.yaml に env を足したら、ここの同じサービスにも写す。写し忘れは helm.yml の「values-cloud drops no env」が止める（#1548）。
#     クラウドで意図して外すものは、同じ段の除外表に理由と一緒に書く。
#
# ★ クラウドに持ち込まないもの（オーナーの決定 2026-11-05）:
#   - ニュースの RAG（MSP の knowledge ユニット）: KB の宛先（KnowledgeBase__*）を書かない＝既定の空＝no-op。
#     取引判断のプロンプトには「この環境では検索を使っていない」の 1 行が出る（IADR-0608 決定 4）。
#   - Web の画面: OpenD の認証サイドカー（画面から検証コードを入れる口）は使わない。初回の SMS 認証は kubectl attach で行う。
#   - Stage 0 の記録: 無効（記録の構成を書かない＝既定の Enabled=false）。
#
# ★ 秘密: 値は secretKeyRef だけで参照し、このファイルにも helm の引数にも書かない。
#   🔴 NFR-05, ADR-0080, #1560, IADR-0623: 秘密はすべて OpenBao から ESO で写す（下の externalSecrets）。k8s の Secret を手で作らない
#   （例外は ast-operator-hold だけ。秘密ではない SSH からの停止の切り替えで、OpenBao の封印のあいだも効く必要がある）。
#   🔴 移行の条件（手順書の最初の節）を満たすまで、本物の秘密をサーバーへ入れない。
#
# ★ 段 2（強制。NFR-06, FR-10, #1560, IADR-0623 決定 3）: 段 1（記録だけ）と段 2 の 2 段で作った守りを、クラウドでは段 2 で始める。
#   注文の承認の印・所有者のトークンの aud / azp・ボットの許可表（global の 3 つ）、危険な操作の第 2 要素（risk-management・report）、
#   kill switch の前提条件（risk-management）。values.yaml（既定）と values-local（経路 B）は段 1 のまま。
#
# ★ 基盤との接続の暗号化（DB・ブローカ・LLM ゲートウェイ。#1535, IADR-0621）: 接続の形は chart（deployment.yaml）が持ち、
#   ここはスイッチを入れるだけにする。DB は VerifyFull＋基盤の CA、ブローカは amqps:5671、LLM ゲートウェイは https
#   （基盤の CA で検証。外部 API は従来のシステムの信頼のまま）。CA は名前空間 ai-stock-trading の ConfigMap
#   platform-infra-ca（キー ca.crt）から読む。無いと Pod は起動しない（平文へ戻らない）。写し方は手順書の §5。
#   認可サーバー（Keycloak）も https:8443 で同じ CA で検証する（global.authTls。IADR-0629）。
#
# ★ イメージ: ノードでビルドして取り込み、digest で固定する（レジストリを持たない）。
#   digest はノードで書き出したファイル（コミットしない）から重ねる。欠けたら描画で止まる（global.image.requireDigest）。

global:
  image:
    registry: k3d-local
    tag: latest
    # ノードへ取り込んだイメージだけを使う（レジストリから取りに行かない）。
    pullPolicy: Never
    # 自前のイメージに digest が無ければ描画で止める（IADR-0608 決定 2）。
    requireDigest: true
  # 🔴 明示する（chart の既定は空になり、未設定なら描画で止まる）。クラウドの基盤の Keycloak の issuer と同じ値:
  #   基盤の最小構成は KC_HOSTNAME=https://keycloak:8443・realm platform で（MSP:IADR-0693。平文の口は持たない）、AST の名前空間からは
  #   ExternalName の keycloak で引く（infraAliases）。トークンの iss がこの値と一致しないと検証で落ちる。
  #   トークンの取得先（ServiceAuth__TokenEndpoint・Discord の OwnerAuth・LLM ゲートウェイの Authority）はこの値から導く（chart）。
  authAuthority: https://keycloak:8443/realms/platform
  # NFR, NFR-05, IADR-0629: 認可サーバーへの通信を TLS で検証する。https でない Authority はアプリが起動で拒み
  #   （Auth__RequireHttpsMetadata=true）、サーバ証明書は基盤の CA（下の infraCa。DB・ブローカと同じ CA）で検証する。
  #   全 11 サービスが CA を持つ（DB・ブローカを使わないサービスも。描画の検査 helm.yml が固定する）。
  #   🔴 Keycloak を呼ぶサービスを足したら、基盤（MSP）の deploy/cloud/infra/networkpolicy.yaml の Keycloak の入りの一覧（label app）にも
  #   足すよう MSP へ依頼する。足さなければ、そのサービスの起動・呼び出しが落ちる（手順書 docs/operations/cloud-keycloak-tls-runbook.md）。
  #   稼働中の構成を移す間だけ、旧の発行元を --set-string global.authValidIssuers=http://keycloak:8080/realms/platform で足す
  #   （ここには書かない。外す時期は手順書の段 6）。
  authTls:
    enabled: true
  # 🔴 段 2（IADR-0610 / 0611 / 0622）。鍵の Secret が無ければ注文の承認の発行元・受け手の Pod は起動しない（Enforce は非 optional）。
  orderApprovalSigning:
    mode: Enforce
  ownerTokenBinding:
    mode: Enforce
  ownerBotScope:
    mode: Enforce
  # 🔴 段 2（IADR-0627）。発行元の鍵（cloud/ast/ast-message-origin-keys）が無ければ、鍵を読むサービスの Pod は起動しない。
  messageOrigin:
    mode: Enforce
  # NFR-18, #1535, IADR-0621: 基盤の DB・ブローカへの接続を TLS にする（経路 B の values-local と同じスイッチ）。
  rabbitmq:
    tls:
      enabled: true
    # 🔴 NFR-18, IADR-0628: 購読側は購読の exchange を宣言しない（受動の確かめだけ）。基盤のクラウドのブローカの権限は、購読の exchange の
    #   configure を購読側に与えない形へ絞る（基盤の生成器）。exchange は基盤のブローカの起動の直後の初期化が先に宣言する。
    subscribedExchanges: Passive
  db:
    tls:
      enabled: true
    # 🔴 リポジトリの既定のパスワードを使わない。パスワードは Secret から読み、接続文字列は env の参照で組む（IADR-0608 決定 3）。
    password: ""
    passwordSecret:
      name: ast-db-credentials
      key: password
    # NFR-05, #1560, IADR-0623: 利用者名は基盤が乱数の接尾辞つきで作る（cloud/shared/ast-db の username）。固定の値を描かない。
    usernameSecret:
      name: ast-db-credentials
      key: username
    # 🔴 NFR-18, IADR-0630（基盤の MSP:IADR-0695）: DB を持つ 7 つのサービスは、上の共有の 1 組ではなく、それぞれ自分の資格
    #   （services.<名前>.dbCredentials・Secret ast-db-<サービス>-credentials）を読む。上の共有の 1 組は、基盤が共有の利用者を消す
    #   （最終の段）までの移行の間だけ残す（DB を持つサービスを足したときに dbCredentials を書き忘れると、共有の資格へ戻る。描画の検査が止める）。
  # NFR-18, NFR-05, #1560, IADR-0623: 基盤の CA の写しは ESO が Secret に作る（cloud/shared/platform-infra-ca。公開してよい証明書）。
  infraCa:
    configMap: ""
    secretName: platform-infra-ca
    caKey: ca.crt

# OpenD（SIMULATE）。配布物の tar の sha256 を記録してからノードでイメージを作る（手順書）。
# 🔴 取引パスワードはクラスタに置かない（SIMULATE では解錠は要らない）。moomoo-credentials はログインの資格だけを持つ。
opend:
  enabled: true
  authGateway:
    enabled: false

broker:
  tier: moomoo-sim

# NFR-05, ADR-0080, #1560, IADR-0623: 秘密は OpenBao から ESO で写す。取り決め（基盤の IADR-0689 決定 6）:
#   - ストアは名前空間の SecretStore openbao（kubernetes 認証・role ast-eso・ServiceAccount ast-eso-reader）。ClusterSecretStore は使えない。
#   - KV v2 のマウントは cloud/。取引ユニットだけの値は cloud/ast/<Secret の名前>、基盤と共有の値は cloud/shared/<名前>。
#   - property の名前は k8s の Secret のキーの名前と 1 対 1。値を入れる順と入れ方は手順書の §5。
externalSecrets:
  enabled: true
  secretStoreRef:
    name: openbao
    kind: SecretStore
  refreshInterval: 1h
  deletionPolicy: Retain
  openbaoStore:
    create: true
    # NFR-05, IADR-0631（基盤の MSP:IADR-0696）: 基盤の OpenBao の受け口は TLS の 8443 だけ。CA は基盤の tls-cert.sh が
    #   この名前空間に置く ConfigMap openbao-ca（キー ca.crt）で検証する。🔴 基盤の併存の段の後に当てる（手順書 §5.4）。
    server: https://openbao.openbao.svc:8443
    caProvider:
      type: ConfigMap
      name: openbao-ca
      key: ca.crt
    path: cloud
    role: ast-eso
    serviceAccountName: ast-eso-reader
  moomooCredentials:
    remoteKey: ast/moomoo-credentials
    loginAccountProperty: login-account
    loginPwdMd5Property: login-pwd-md5
  moomooRsa:
    remoteKey: ast/moomoo-rsa
    property: opend_rsa.pem
  rabbitmqUsers:
    remoteKey: shared/ast-rabbitmq-users
  dbCredentials:
    enabled: true
    targetName: ast-db-credentials
    remoteKey: shared/ast-db
  # NFR-18, IADR-0630: DB のサービスごとの資格（services.<名前>.dbCredentials を持つ 7 つ）。置き場は基盤の cloud/shared/ast-db-<サービス>。
  serviceDbCredentials:
    enabled: true
    remoteKeyPrefix: shared/ast-db-
  ownerTotp:
    enabled: true
    targetName: ast-owner-totp
    remoteKey: ast/ast-owner-totp
  # NFR, FR-10, IADR-0627: メッセージの発行元の鍵（キー＝発行元の識別子）。基盤の seed-secrets.sh の gen で OpenBao の中に作る（手順書 §5）。
  messageOriginKeys:
    enabled: true
    targetName: ast-message-origin-keys
    remoteKey: ast/ast-message-origin-keys
  infraCa:
    enabled: true
    targetName: platform-infra-ca
    remoteKey: shared/platform-infra-ca
    property: ca.crt
  appSecrets:
    enabled: true
    targetName: ast-secrets
    # 外から持ち込む値（Discord・情報源）と、OpenBao の中で作る注文の承認の鍵（gen）。キーは Secret のキーと同じ名前。
    remoteKey: ast/ast-secrets
    # クラウドの realm の 3 つの機密クライアント（基盤の realm-for-cloud.js の CLOUD_CLIENTS）。client ID は秘密ではない。
    clientIds:
      service-auth-client-id: ai-stock-trading-svc
      llm-auth-client-id: ai-stock-trading-llm-caller
      discord-owner-auth-client-id: ai-stock-trading-owner
    sharedClientSecrets:
      remoteKey: shared/ast-client-secrets
      properties:
        service-auth-client-secret: ai-stock-trading-svc
        llm-auth-client-secret: ai-stock-trading-llm-caller
        discord-owner-auth-client-secret: ai-stock-trading-owner

reloader:
  enabled: false

# Pod のセキュリティの段（IADR-0609 の推奨の順）。段 2 で始め、起動と取引の 1 日を確かめてから段 3（非 root）へ上げる（手順書）。
# 段 2: root のまま seccomp RuntimeDefault・権限昇格なし・ケーパビリティを全て落とす。PSA の enforce は baseline（段 2 と OpenD の
# 段 1 が満たす）。restricted は段 3 と OpenD の段 3 が要るので、上げるときに一緒に替える。メッシュの注入は使わない（貼れる）。
podSecurity:
  stage: 2
  admission:
    enforce: baseline

stage0Recording:
  persistence:
    enabled: false

services:
  audit:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-audit。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-audit-credentials, key: username }
      passwordSecret: { name: ast-db-audit-credentials, key: password }
  configuration:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-configuration。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-configuration-credentials, key: username }
      passwordSecret: { name: ast-db-configuration-credentials, key: password }
  cost-control:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-cost-control。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-cost-control-credentials, key: username }
      passwordSecret: { name: ast-db-cost-control-credentials, key: password }
  risk-management:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-risk-management。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-risk-management-credentials, key: username }
      passwordSecret: { name: ast-db-risk-management-credentials, key: password }
    extraEnv:
      - { name: MaintenanceMarginEvaluation__Enabled, value: "true" }
      - { name: MaintenanceMarginEvaluation__IntervalSeconds, value: "300" }
      - { name: Risk__SimulatorProfile__Enabled, value: "true" }
      - { name: MarketData__EnableMarkToMarket, value: "true" }
      - { name: MarketData__Provider, value: "finnhub" }
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      - { name: Finnhub__ProvisionalDailyLimit, value: "" }
      - { name: ObservedDrawdownRefresh__Enabled, value: "true" }
      - { name: WithdrawalEvaluation__Enabled, value: "true" }
      - { name: Fx__Provider, value: "boj" }
      - name: Fx__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }
      - { name: OrderExecution__BaseUrl, value: "" }
      - name: RiskControls__DelegatedActor__TrustedClientIds
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      - name: Auth__GrpcOwnerClients__0
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      # NFR, FR-10, UC-06, #1530, IADR-0613: Discord を経ない停止の保持（values.yaml の同じ行の写し。extraEnv は配列で丸ごと置き換わるため、
      # ここに無いとクラウドの profile では Secret ast-operator-hold を作っても env に載らず、保持が効かない）。
      - name: RiskManagement__OperatorKillSwitchHold__Enabled
        secretKeyRef: { name: ast-operator-hold, key: enabled, optional: true }
      - name: RiskManagement__OperatorKillSwitchHold__Reason
        secretKeyRef: { name: ast-operator-hold, key: reason, optional: true }
      # NFR-06, FR-14, #1542, IADR-0615: 危険な操作の第 2 要素（values.yaml の同じ行の写し。extraEnv は配列で丸ごと置き換わるため、
      # ここに無いとクラウドの profile では段も Secret ast-owner-totp も読まれず、門は Off のままになる）。
      # 🔴 段 2（IADR-0623 決定 3）: 確かめられない危険な操作を 403 で拒む。
      - { name: OwnerSecondFactor__Mode, value: "Enforce" }
      - name: OwnerSecondFactor__Secret
        secretKeyRef: { name: ast-owner-totp, key: secret, optional: true }
      # 🔴 FR-10, FR-14, #1560, IADR-0620, IADR-0623 決定 3: 段 2。版の無い kill switch の解除を 428 で拒む（ボットは版を添える。#1561）。
      - { name: RiskControls__KillSwitch__Precondition, value: "Require" }
  order-execution:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-order-execution。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-order-execution-credentials, key: username }
      passwordSecret: { name: ast-db-order-execution-credentials, key: password }
    extraEnv:
      - { name: Reconciliation__Enabled, value: "true" }
      - { name: Reconciliation__UseBrokerProbe, value: "true" }
      - { name: Reconciliation__ReleaseOnNotPlaced__Simulate, value: "false" }
      - { name: Reconciliation__ReleaseOnNotPlaced__Real, value: "false" }
      - { name: Reconciliation__StallThresholdHours, value: "2" }
      - { name: Reconciliation__IntervalHours, value: "1" }
      - { name: Reconciliation__BatchSize, value: "50" }
      - { name: DecisionCloseUnfilledCancel__Enabled, value: "true" }
      - { name: DecisionEntryUnfilledCancel__Enabled, value: "true" }
      - name: Auth__GrpcOwnerClients__0
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      - { name: RiskManagement__BaseUrl, value: "http://risk-management-service:8080" }
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
  market-monitor:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-market-monitor。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-market-monitor-credentials, key: username }
      passwordSecret: { name: ast-db-market-monitor-credentials, key: password }
    extraEnv:
      - { name: RiskManagement__BaseUrl, value: "http://risk-management-service:8080" }
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      - { name: MarketData__Provider, value: "finnhub" }
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      - { name: MarketData__Finnhub__RequestsPerMinute, value: "12" }
      - { name: Finnhub__ProvisionalDailyLimit, value: "" }
      - { name: Monitor__SeedSymbols__0__Symbol, value: "AAPL" }
      - { name: Monitor__SeedSymbols__0__Market, value: "UnitedStates" }
      - name: Monitor__DelegatedActor__TrustedClientIds
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
      - name: Auth__GrpcOwnerClients__0
        secretKeyRef: { name: ast-secrets, key: discord-owner-auth-client-id, optional: true }
  information-collection:
    extraEnv:
      - { name: Collection__Source__Provider, value: "finnhub,finnhub-news,google-news,sec-edgar,fred" }
      - { name: Collection__PollIntervalSeconds, value: "300" }
      - name: Collection__Source__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: finnhub-api-key, optional: true }
      - { name: MarketMonitor__BaseUrl, value: "http://market-monitor-service:8080" }
      - { name: Collection__Source__Finnhub__Symbols__0, value: "AAPL" }
      - { name: RiskManagement__BaseUrl, value: "http://risk-management-service:8080" }
      - { name: Collection__Source__Finnhub__DailyRequestLimit, value: "" }
      - { name: Finnhub__ProvisionalDailyLimit, value: "" }
      - { name: Collection__Source__GoogleNews__Queries__0, value: "米国株" }
      - name: Collection__Source__SecEdgar__UserAgent
        secretKeyRef: { name: ast-secrets, key: sec-edgar-user-agent, optional: true }
      - { name: Collection__Source__SecEdgar__Ciks__0, value: "" }
      - name: Collection__Source__Edinet__SubscriptionKey
        secretKeyRef: { name: ast-secrets, key: edinet-subscription-key, optional: true }
      - { name: Collection__Source__Boj__Db, value: "" }
      - { name: Collection__Source__Boj__SeriesCodes__0, value: "" }
      - name: Collection__Source__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }
      - { name: Collection__Source__Fred__SeriesIds__0, value: "DEXJPUS" }
      - { name: Collection__Source__Fred__SeriesIds__1, value: "DGS10" }
      - { name: CostControl__BaseUrl, value: "http://cost-control-service:8080" }
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
  report:
    # NFR-18, IADR-0630: 自分の DB の資格だけを読む（基盤の cloud/shared/ast-db-report。基盤の IADR-0695）。
    dbCredentials:
      usernameSecret: { name: ast-db-report-credentials, key: username }
      passwordSecret: { name: ast-db-report-credentials, key: password }
    extraEnv:
      - { name: RiskManagement__BaseUrl, value: "http://risk-management-service:8080" }
      - { name: Audit__BaseUrl, value: "http://audit-service:8080" }
      - { name: MarketData__Provider, value: "finnhub" }
      - name: MarketData__Finnhub__ApiKey
