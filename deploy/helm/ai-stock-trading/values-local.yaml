# ai-stock-trading — local/SIMULATE 有効化プロファイル（経路B・IADR-0100 / #238）。
#
# 目的: 経路B（ローカル k8s / SIMULATE）で ①時価(finnhub) ②実LLM(MSP LlmGateway) ③実KB(MSP DocumentService)
#       ＋ Discord通知 ＋ #236/IADR-0099 の価格文脈(ICurrentPriceProvider) を、臨時 overlay 無しに有効化する。
#       標準手順 `scripts/k8s-local-deploy.sh` が `helm upgrade -f values-local.yaml` で本ファイルを重ねる。
#
# ★ 本番バイト等価（厳守）:
#   - 本ファイルは ArgoCD の描画対象ではない（deploy/argocd/application.yaml は valueFiles 無し＝values.yaml のみ）。
#   - values.yaml・templates・Chart.yaml は不変。`helm template ast <chart>`（既定＝本番）はバイト等価のまま。
#     有効化は本ファイルを `-f` で明示したとき（＝ローカル標準手順）に限る。
#
# ★ 非破壊・安全の前提:
#   - Helm はリスト(extraEnv)を「置換」する。よって各サービスの extraEnv は values.yaml の全要素＋有効化分を写す
#     （欠落=そのキーが消える）。image/db/auth はマップのため merge され保持される（extraEnv のみ置換）。
#   - secret は secretKeyRef のまま（平文の鍵・トークンは置かない）。実値は k8s-local-deploy.sh の ast-secrets
#     作成（env 上書き）／ ESO(Vault) 同期（IADR-0094）に委ねる。
#   - order-execution は含めない → Broker__Provider は template 既定 paper（broker.tier 未指定・IADR-0111）＝実弾 OFF 不変。
#   - notification の OwnerAuth__TokenEndpoint は入れない（template が global.authAuthority から注入・IADR-0098）。
#   - Discord の環境固有値（GuildId/ChannelId/AllowedUserIds/UserMapping）は空既定。未設定時は IADR-0062 の安全既定
#     （空は「全許可」ではなく全拒否）で no-op。値は chart の設定点 discord.bot.*（#245/IADR-0102）から与える
#     （標準手順 = k8s-local-deploy.sh の DISCORD_BOT_* env → --set-string。`kubectl set env` は使わない）。
#
# DNS: 同 ns=短名(<svc>-service)、MSP=<svc>.microservices-platform、keycloak=ExternalName alias(短名可・infraAliases)。

services:

  # ============ ① 時価評価（mark-to-market）============
  # FR-10, #81, #158, IADR-0066/0068: 含み損益・DD の判定入力を実市況にする。true は最大DD 取引ゲートの入力を変える。
  risk-management:
    extraEnv:
      # ============ SIMULATE 限定のリスク上限プロファイル（#257/IADR-0108）============
      # moomoo シミュレータ残高（USD $1M / JPY ¥20M）相当へ統制上限を引き上げ、米国株（AAPL ≒ ¥50,250/株）の
      # 数量算出→発注を成立させる。値は Domain 定数（SimulatorTradingDefaults）で、構成は有効/無効のみ。
      # 本番 values.yaml には設定点自体を置かない＝既定描画はバイト等価。実弾段階（Stage 2/3）の上限は不変。
      - { name: Risk__SimulatorProfile__Enabled, value: "true" }  # ← SIMULATE 限定（既定 false＝本番既定）
      - { name: MarketData__EnableMarkToMarket, value: "true" }   # ← ①（既定 "false"）
      - { name: MarketData__Provider, value: "finnhub" }          # ← ①（既定 ""）
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      # ============ 実DD（観測最大ドローダウン）の供給（#279/IADR-0114・#164/IADR-0103）============
      # ADR-0008 の撤退基準は実DD を入力に取るが、それを書く本番コードがバックテスト射影 1 箇所しか無いため
      # 構造的に発火し得なかった。本ドライバが営業日の定時に建玉台帳の DrawdownRatio をサンプリングし、
      # 段階実績台帳へ単調 latch する（IADR-0103）。上の EnableMarkToMarket=true が前提で、経路B では既に満たす。
      # 台帳依存: 経路B の既定ブローカは paper で擬似約定が台帳へ入るため実効する。moomoo SIMULATE 経路は
      # 約定が台帳へ伝播しないため #270 が入るまで DD は 0 のまま＝不活性（安全側）。
      - { name: ObservedDrawdownRefresh__Enabled, value: "true" }  # ← 実DD 供給（既定 false＝本番既定）
      # ★ 撤退の**実行側**（IADR-0083）。上の実DD 供給とセットで初めて ADR-0008 の撤退基準が評価される。
      #   ⚠️ 条件成立時は**自動で kill switch が起動**し、解除には確認フレーズが要る（IADR-0097）＝
      #      dogfood は人手で解除するまで止まる。利用者承認のうえ有効化している（IADR-0114 決定3）。
      #   ただし自動起動（HaltNewEntries=true）は **Stage 2/3（実弾段階）で実DD ≥ バックテスト最大DD × 倍率**
      #   のときだけ。Stage 1（ペーパー）は降格提案＋通知のみ（HaltNewEntries=false・IADR-0085）、Stage 0 は
      #   Triggered=false。現在は Stage 0 かつ実弾未解禁（LiveTradingReleased=false）＝**自動停止は起きない**。
      #   実利は「Stage 1 到達後の乖離検出」と「将来 Stage 2/3 で最初から効いていること」。
      #   実際に起動したときの解除手順は chart README「撤退評価と自動 kill switch」を参照。
      - { name: WithdrawalEvaluation__Enabled, value: "true" }     # ← 撤退評価（既定 false＝本番既定）

  # ① 損切り検知の時価＋建玉源。FR-10, IADR-0066/0068。
  market-monitor:
    extraEnv:
      - { name: RiskManagement__BaseUrl, value: "http://risk-management-service:8080" }  # 建玉照会(HttpPositionStore)
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      - { name: MarketData__Provider, value: "finnhub" }          # ← ①
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }

  # ============ ③ 実KB保存（収集情報）＋ 収集起動（サイクル配線）============
  # FR-01/08, #9/#18, IADR-0064/0069/0073/0093: 収集を finnhub＋AAPL で起動し（Count>0 で InformationCollected 発行）、
  # 収集情報を MSP DocumentService へ実 KB 保存（Auth は MSP レルムの kb-writer）。
  information-collection:
    extraEnv:
      # 案A+（ADR-0004）の情報源はカンマ区切りで合流する（CompositeInformationSource）。必須構成を欠くソースだけが
      # 警告つきで除外され、他ソースは有効なまま（IADR-0064 決定1＝1 ソースの不備で全体を止めない）。
      # edinet は API キー（EDINET_SUBSCRIPTION_KEY）、boj は統計分類/系列コードの一次確認が要るため列挙しない（#279 残置）。
      - { name: Collection__Source__Provider, value: "finnhub,sec-edgar,fred" }  # ← 収集起動（既定 ""）
      - name: Collection__Source__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: finnhub-api-key, optional: true }
      - { name: Collection__Source__Finnhub__Symbols__0, value: "AAPL" }         # ← watchlist と揃える
      # ============ SEC EDGAR（米国の開示・API キー不要）: #279/IADR-0114 ============
      # SEC 規約は**連絡先（実在のメールアドレス）入り**の User-Agent を必須とする（IADR-0064 決定4 が構成必須化）。
      # これは環境固有の個人情報のため values へ直書きせず ast-secrets 経由で与える（IADR-0114 決定2）。
      # 実値は k8s-local-deploy.sh の SEC_EDGAR_USER_AGENT env から投入する。
      # fail-safe: 未設定/空 → SEC EDGAR **だけ**が収集対象から外れる（finnhub/fred は有効なまま）。
      - name: Collection__Source__SecEdgar__UserAgent
        secretKeyRef: { name: ast-secrets, key: sec-edgar-user-agent, optional: true }
      - { name: Collection__Source__SecEdgar__Ciks__0, value: "0000320193" }     # ← Apple Inc.（収集銘柄 AAPL と揃える）
      - name: Collection__Source__Edinet__SubscriptionKey
        secretKeyRef: { name: ast-secrets, key: edinet-subscription-key, optional: true }
      - { name: Collection__Source__Boj__Db, value: "" }
      - { name: Collection__Source__Boj__SeriesCodes__0, value: "" }
      # ============ FRED（米マクロ・#279/IADR-0114）============
      # 鍵は Fx 換算（#262/IADR-0107）で既に投入済みの fred-api-key を再利用する＝新規の資格情報を要求しない。
      - name: Collection__Source__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }
      - { name: Collection__Source__Fred__SeriesIds__0, value: "DEXJPUS" }       # ← 円/ドル為替（Fx の換算源と同じ系列）
      - { name: Collection__Source__Fred__SeriesIds__1, value: "DGS10" }         # ← 米 10 年国債利回り（定数満期）
      - { name: CostControl__BaseUrl, value: "http://cost-control-service:8080" }
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      - { name: KnowledgeBase__Documents__BaseUrl, value: "http://document-service.microservices-platform:8080" }  # ← ③
      - { name: KnowledgeBase__Search__BaseUrl, value: "" }
      - { name: KnowledgeBase__Auth__Authority, value: "http://keycloak:8080/realms/microservices-platform" }       # ← ③（MSP レルム）
      - name: KnowledgeBase__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-id, optional: true }
      - name: KnowledgeBase__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-secret, optional: true }

  # ============ ①評価損益 ＋ ②実LLM散文 ＋ ③確定報告書の KB保存: report ============
  # FR-06/07/16/08, ADR-0003, IADR-0068/0071/0093。LogPrompts は既定 ""（記録しない・安全側）。
  # プロンプトレベル検証時のみ "true" へ opt-in（README 参照）。
  report:
    extraEnv:
      - { name: MarketData__Provider, value: "finnhub" }          # ← ①（報告書の評価損益）
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      - { name: LlmGateway__BaseUrl, value: "http://llmgateway-service.microservices-platform:8080" }  # ← ②
      - { name: LlmGateway__TimeoutSeconds, value: "" }
      # 安全既定 "" ＝プロンプト/生応答を記録しない（機微を既定でログ基盤へ流さない・IADR-0061 決定1）。
      # プロンプトレベルの検証時のみ "true" へ（README 参照）。恒常設定では既定オフに寄せる。
      - { name: LlmGateway__LogPrompts, value: "" }
      - { name: KnowledgeBase__Documents__BaseUrl, value: "http://document-service.microservices-platform:8080" }  # ← ③
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      - { name: KnowledgeBase__Auth__Authority, value: "http://keycloak:8080/realms/microservices-platform" }       # ← ③（MSP レルム）
      - name: KnowledgeBase__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-id, optional: true }
      - name: KnowledgeBase__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-secret, optional: true }
      - { name: Reports__NoResponseBehavior, value: "" }

  # ============ ②実LLM ＋ 価格文脈(#236/IADR-0099) ＋ サイクル配線: trade-decision ============
  # FR-02/04/11, ADR-0003, IADR-0061/0088/0095/0099。LogPrompts は既定 ""（記録しない・安全側）。
  trade-decision:
    extraEnv:
      - { name: Reports__BaseUrl, value: "http://report-service:8080" }               # G4（確定済み日報方針の照会先）
      - { name: RiskManagement__BaseUrl, value: "http://risk-management-service:8080" }# サイジング文脈(残枠/DD)
      - { name: MarketMonitor__BaseUrl, value: "" }                                    # 空=構成 watchlist(下)を使う(IADR-0095)
      - { name: LlmGateway__BaseUrl, value: "http://llmgateway-service.microservices-platform:8080" }  # ← ②
      - { name: LlmGateway__TimeoutSeconds, value: "" }
      # 安全既定 "" ＝判断の要求/応答を記録しない（機微を既定でログ基盤へ流さない・IADR-0061 決定1）。
      # プロンプトレベルの検証時のみ "true" へ（README 参照）。
      - { name: LlmGateway__LogPrompts, value: "" }
      # ====== LLM 費用の単価（#303/IADR-0121・#279/IADR-0114 決定6・NFR/IADR-0055）======
      # 未設定（既定 0）だと PublishingLlmUsageReporter が毎回 ¥0 を計上し、月次費用上限（¥15,000）が
      # **構造的に発火しない**（台帳は動くが金額が積み上がらない）。経路B では実単価を与えて統制を実効化する。
      #
      # 単位: **円 / 1,000 トークン**（LlmPricing.Compute は「いずれも円」）。
      # 粒度: **モデル別**（IADR-0121 決定1）。用途別モデル割当（計画 ADR-0014 / MSP IADR-0112）で
      #   trade-decision=sonnet-5 / report-monthly=fable-5 / report-weekly=opus-5 / report-daily=sonnet-5 と
      #   モデルが混在するため、global 単一ペアでは実態と乖離する（従来の opus 基準は trade-decision で約 2.5 倍の
      #   過大計上だった）。単価は**応答が名乗った実効モデル**（CompletionApiResponse.Model）で引く。要求側の
      #   希望モデルではない（ゲートウェイは越境ルーティング〈ADR-0010〉で別モデルへ着地し得る）。
      # fail-safe（IADR-0121 決定3・**「安全側 = 0」ではない**）:
      #   表に無いモデル・モデル名なし → **表の最大単価**（現行 fable-5）。0 に倒すと上限が構造的に効かなくなる。
      #   表が空（本番 values.yaml の状態）→ 従来キー LlmPricing__InputPer1kTokens/__OutputPer1kTokens（未設定 0）。
      #
      # 出典・前提（2026-07 時点・**恒久値ではない**）:
      #   Anthropic 公開単価（$/1M トークン・入力/出力）: fable-5 = 10/50、opus-5 / opus-4-8 = 5/25、
      #     sonnet-5 = 2/10、haiku-4-5 = 1/5
      #   USD→JPY 換算 163.71（システムの為替源 FRED DEXJPUS と同一系列・IADR-0107）／小数第 3 位で四捨五入
      #   例: 0.002 × 163.71 = 0.32742 ≒ 0.327、0.010 × 163.71 = 1.6371 ≒ 1.637（sonnet-5）
      #   ⚠️ **sonnet-5 の $2/$10 は 2026-08-31 までの導入価格**。同日以降は必ず再確認する（IADR-0121 決定5）。
      #   ※ 為替・公開単価はいずれも変動する。乖離が出たら本値と #243（実測再ベースライン）を更新する。
      #   ※ 報告書散文（report-service）は計上経路自体が無い（#282）。本表は #282 の解消後に報告書へも効く。
      - { name: LlmPricing__PerModel__claude-fable-5__InputPer1kTokens, value: "1.637" }    # $10/1M（report-monthly）
      - { name: LlmPricing__PerModel__claude-fable-5__OutputPer1kTokens, value: "8.186" }   # $50/1M
      - { name: LlmPricing__PerModel__claude-opus-5__InputPer1kTokens, value: "0.819" }     # $5/1M（report-weekly・既定）
      - { name: LlmPricing__PerModel__claude-opus-5__OutputPer1kTokens, value: "4.093" }    # $25/1M
      - { name: LlmPricing__PerModel__claude-opus-4-8__InputPer1kTokens, value: "0.819" }   # $5/1M（ADR-0011 の固定先）
      - { name: LlmPricing__PerModel__claude-opus-4-8__OutputPer1kTokens, value: "4.093" }  # $25/1M
      - { name: LlmPricing__PerModel__claude-sonnet-5__InputPer1kTokens, value: "0.327" }   # $2/1M（trade-decision・report-daily）
      - { name: LlmPricing__PerModel__claude-sonnet-5__OutputPer1kTokens, value: "1.637" }  # $10/1M ※導入価格〜2026-08-31
      - { name: LlmPricing__PerModel__claude-haiku-4-5__InputPer1kTokens, value: "0.164" }  # $1/1M
      - { name: LlmPricing__PerModel__claude-haiku-4-5__OutputPer1kTokens, value: "0.819" } # $5/1M
      - name: ServiceAuth__ClientId
        secretKeyRef: { name: ast-secrets, key: service-auth-client-id, optional: true }
      - name: ServiceAuth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: service-auth-client-secret, optional: true }
      - { name: KnowledgeBase__Search__BaseUrl, value: "" }       # RAG 読み取りは任意（空=NoOp）
      - { name: KnowledgeBase__Auth__Authority, value: "" }
      - name: KnowledgeBase__Auth__ClientId
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-id, optional: true }
      - name: KnowledgeBase__Auth__ClientSecret
        secretKeyRef: { name: ast-secrets, key: kb-auth-client-secret, optional: true }
      # --- 監視銘柄（構成ベース watchlist・MarketMonitor__BaseUrl 空のため使われる。Market は列挙名）。収集の銘柄と揃える。
      - { name: TradeCycle__Watchlist__0__Symbol, value: "AAPL" }
      - { name: TradeCycle__Watchlist__0__Market, value: "UnitedStates" }
      # --- 価格文脈（#236/IADR-0099）: 判断へ現在値を供給し権威価格でサイジング。MarketData:Provider=finnhub＋鍵で実結線
      #     （ICurrentPriceProvider.IsEnabled が真）。鮮度 MaxQuoteStalenessSeconds 超過・取得不可は現在値なし（fail-safe）。
      - { name: MarketData__Provider, value: "finnhub" }          # ← 価格文脈（既定 ""＝no-op・IsEnabled=false）
      - name: MarketData__Finnhub__ApiKey
        secretKeyRef: { name: ast-secrets, key: marketdata-finnhub-api-key, optional: true }
      - { name: MarketData__MaxQuoteStalenessSeconds, value: "300" }  # 鮮度期限（秒・既定 300）。非正値は既定 300s。
      # --- 通貨換算（#257/IADR-0107）: 統制上限・サイジングは基準通貨（円）で判定する。外貨建て（米国株）は
      #     レートが解決できないと新規建てを見送るため、経路B で米国株を回すには本設定と鍵が要る。
      #     鍵は既存の ast-secrets/fred-api-key（情報収集の FRED と同じ FRED アカウント）を再利用する。
      - { name: Fx__Provider, value: "fred" }                     # ← 換算レート源（既定 ""＝no-op＝外貨は見送り）
      - name: Fx__Fred__ApiKey
        secretKeyRef: { name: ast-secrets, key: fred-api-key, optional: true }

  # ============ Discord notification ============
  # FR-09/14, IADR-0062/0098。Provider/Bot__Enabled は配線恒常化。GuildId/ChannelId/AllowedUserIds/UserMapping は
  # 環境固有＝空既定（ユーザーが与える。未設定は安全既定＝全拒否で no-op）。TokenEndpoint は template 自動注入で入れない。
  # Discord を使わないなら Provider="" と Bot__Enabled="false" に戻す（他は secret 空で送信されない）。
  notification:
    extraEnv:
      - { name: Notifications__Provider, value: "discord-webhook" }        # 配線恒常化（WebhookUrl 空なら送らない）
      - name: Notifications__Discord__WebhookUrl
        secretKeyRef: { name: ast-secrets, key: discord-webhook-url, optional: true }
      - { name: Notifications__Discord__Bot__Enabled, value: "true" }      # 配線恒常化（Token 空なら接続しない）
      - name: Notifications__Discord__Bot__Token
        secretKeyRef: { name: ast-secrets, key: discord-bot-token, optional: true }
      # 環境固有 ID（非機密）。値は chart の設定点 discord.bot.*（空既定）が非空のとき template が上書きする
      # （#245, IADR-0102）。標準手順では k8s-local-deploy.sh の DISCORD_BOT_GUILD_ID / DISCORD_BOT_CHANNEL_ID /
      # DISCORD_BOT_ALLOWED_USER_IDS / DISCORD_BOT_USER_MAPPING を env で与える（→ --set-string）。
      # ⚠️ `kubectl set env` で注入しないこと（次回の helm upgrade が `conflict with "kubectl-set"` で失敗する）。
      - { name: Notifications__Discord__Bot__GuildId, value: "" }          # ← 環境固有（空=全拒否）
