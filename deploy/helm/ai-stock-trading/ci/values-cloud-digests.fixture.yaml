# 描画の検査専用の digest（helm.yml の values-cloud の検査）。🔴 実在するイメージの digest ではない。配備には使わない。
# 配備の digest は、ノードで取り込んだイメージから書き出す（docs/operations/cloud-single-node-migration-runbook.md）。
