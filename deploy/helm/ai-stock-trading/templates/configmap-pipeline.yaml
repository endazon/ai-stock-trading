{{- /* ADR-0001, IADR-0077, #22: 取引パイプラインの宣言的バインディング（files/pipeline.json）を
       ConfigMap としてクラスタへ公開する（構成の正 = GitOps 適用点）。ArgoCD がチャート同期時に適用し、
       Git revert がロールバックになる。自己申告エンドポイント（#22 PR-B）が本 ConfigMap をマウントして
       実効構成（有効な段）を照会する。宣言変更時の購読側ロールアウトは deployment の checksum/pipeline
       アノテーション（#22 PR-B で deployment.yaml に追加）による。
       命名: 本リソースは全 Worker が共有する単一の名前空間スコープ資産のため、Deployment/Service の
       「<サービス名>-service」ではなく「<名前空間名>-pipeline」を用いる（per-service ではないことを明示）。 */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.namespace.name }}-pipeline
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
    app.kubernetes.io/component: pipeline-binding
data:
  pipeline.json: |-
{{ .Files.Get "files/pipeline.json" | indent 4 }}
