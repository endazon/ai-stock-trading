{{- /*
  #132, IADR-0060 決定 4: 秘匿情報（moomoo 資格情報・RSA 鍵）を Vault から同期する **受け口**。
  既定 externalSecrets.enabled=false = fail-safe（本ファイルは何も描画しない）。

  ⚠️ **受け口の用意は Vault 化の充足ではない**。ストア（Vault / External Secrets Operator）は #24 の管掌で
     本リポジトリには無い。CRD（external-secrets.io）が無いクラスタで有効化すると apply が失敗する。
     実際に Vault へシークレットが載り ESO が同期して初めて「Vault 化」は充足する。
     IADR-0056 §3 が実弾解禁の前提に挙げる「秘匿情報の Vault 化」は**未充足のまま**である（docs/operations 参照）。

  同期先の Secret 名は opend.credentialsSecretName / opend.rsaSecretName と一致させる（OpenD がそれを参照する）。
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $o := .Values.opend }}
{{- if not $es.secretStoreRef.name }}
{{- fail "externalSecrets.enabled=true には externalSecrets.secretStoreRef.name（Vault の SecretStore 名）が要ります。ストアの整備は #24。" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: moomoo-credentials
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # OpenD が参照する Secret 名（opend.credentialsSecretName）と一致させる。
    name: {{ $o.credentialsSecretName }}
    creationPolicy: Owner
  data:
    # ⚠️ パスワードは平文で置かない。MD5（小文字 hex）を Vault へ格納する（entrypoint がそれを OpenD.xml に書く）。
    - secretKey: login-account
      remoteRef:
        key: {{ $es.moomooCredentials.remoteKey | quote }}
        property: {{ $es.moomooCredentials.loginAccountProperty | quote }}
    - secretKey: login-pwd-md5
      remoteRef:
        key: {{ $es.moomooCredentials.remoteKey | quote }}
        property: {{ $es.moomooCredentials.loginPwdMd5Property | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: moomoo-rsa
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # OpenD とクライアント（order-execution）の双方が参照する（同一鍵であること）。
    name: {{ $o.rsaSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $o.rsaSecretKey }}
      remoteRef:
        key: {{ $es.moomooRsa.remoteKey | quote }}
        property: {{ $es.moomooRsa.property | quote }}
{{- end }}
{{- /*
  ADR-0006, IADR-0094 (#24): API 鍵群（Secret `ast-secrets`）を Vault から同期する **opt-in** の受け口。
  既定 externalSecrets.appSecrets.enabled=false = fail-safe（何も描画しない＝現行の手動 k8s Secret 直運用を維持）。

  ⚠️ 平文の鍵はここにも values にも置かない。鍵は Vault の単一 KV（appSecrets.remoteKey）に格納し、
     `dataFrom.extract` で全プロパティを吸い上げる。**Vault 側のプロパティ名 = Secret のキー名**
     （finnhub-api-key / service-auth-client-id 等・deployment.yaml の secretKeyRef.key と一致）にすること。
     欠けた鍵は同期されず、消費側は secretKeyRef.optional=true（現行）で許容する（fail-safe）。
     同期先 Secret 名は `ast-secrets`（services.*.extraEnv が参照する名前）と一致させる。
     受け口の用意は Vault 化の充足ではない（ストア/ESO は #24 の MSP 側 stand-up・実運用は Tier 3）。
*/ -}}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.appSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- if not $es.secretStoreRef.name }}
{{- fail "externalSecrets.appSecrets.enabled=true には externalSecrets.secretStoreRef.name（Vault の SecretStore 名）が要ります。ストアの整備は #24（MSP 側）。" }}
{{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ast-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # services.*.extraEnv の secretKeyRef.name（ast-secrets）と一致させる。
    name: {{ $es.appSecrets.targetName }}
    creationPolicy: Owner
  # 単一 Vault KV の全プロパティを Secret へ吸い上げる（鍵名 = プロパティ名）。
  dataFrom:
    - extract:
        key: {{ $es.appSecrets.remoteKey | quote }}
{{- end }}
