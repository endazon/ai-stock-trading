{{- /*
  #132, IADR-0060 決定 4: 秘匿情報（moomoo 資格情報・RSA 鍵）を Vault から同期する **受け口**。
  既定 externalSecrets.enabled=false = fail-safe（本ファイルは何も描画しない）。

  ⚠️ **受け口の用意は Vault 化の充足ではない**。ストア（Vault / External Secrets Operator）は #24 の管掌で
     本リポジトリには無い。CRD（external-secrets.io）が無いクラスタで有効化すると apply が失敗する。
     実際に Vault へシークレットが載り ESO が同期して初めて「Vault 化」は充足する。
     IADR-0056 §3 が実弾解禁の前提に挙げる「秘匿情報の Vault 化」は**未充足のまま**である（docs/operations 参照）。

  同期先の Secret 名は opend.credentialsSecretName / opend.rsaSecretName と一致させる（OpenD がそれを参照する）。
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $o := .Values.opend }}
{{- if not $es.secretStoreRef.name }}
{{- fail "externalSecrets.enabled=true には externalSecrets.secretStoreRef.name（Vault の SecretStore 名）が要ります。ストアの整備は #24。" }}
{{- end }}
# #795, IADR-0341: 基盤の ESO（chart 2.8.0 に pin）は v1beta1 を提供しない（MSP scripts/k8s-local-up.sh）。v1 で書く。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: moomoo-credentials
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # OpenD が参照する Secret 名（opend.credentialsSecretName）と一致させる。
    name: {{ $o.credentialsSecretName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    # ⚠️ パスワードは平文で置かない。MD5（小文字 hex）を Vault へ格納する（entrypoint がそれを OpenD.xml に書く）。
    - secretKey: login-account
      remoteRef:
        key: {{ $es.moomooCredentials.remoteKey | quote }}
        property: {{ $es.moomooCredentials.loginAccountProperty | quote }}
    - secretKey: login-pwd-md5
      remoteRef:
        key: {{ $es.moomooCredentials.remoteKey | quote }}
        property: {{ $es.moomooCredentials.loginPwdMd5Property | quote }}
---
# #795, IADR-0341: 基盤の ESO（chart 2.8.0 に pin）は v1beta1 を提供しない（MSP scripts/k8s-local-up.sh）。v1 で書く。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: moomoo-rsa
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # OpenD とクライアント（order-execution）の双方が参照する（同一鍵であること）。
    name: {{ $o.rsaSecretName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    - secretKey: {{ $o.rsaSecretKey }}
      remoteRef:
        key: {{ $es.moomooRsa.remoteKey | quote }}
        property: {{ $es.moomooRsa.property | quote }}
---
# NFR, IADR-0568（Refs 非公開の指摘（AST））: ブローカのサービスごとのユーザーのパスワード（キー = ユーザー名）。
# 全 Worker が非 optional に読む（無ければ新しい Pod は起動せず、旧 Pod が残る）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.rabbitmq.credentialsSecretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.global.rabbitmq.credentialsSecretName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ $es.rabbitmqUsers.remoteKey | quote }}
{{- /* NFR-05, #1560, IADR-0623 決定 2: 名前空間の SecretStore（OpenBao・kubernetes 認証）と、それが使う ServiceAccount。
       取り決め（基盤の IADR-0689 決定 6）: ストアは名前空間ごと。OpenBao の role は ServiceAccount の名前と名前空間に結んである。 */}}
{{- with $es.openbaoStore }}
{{- if .create }}
{{- if ne $es.secretStoreRef.kind "SecretStore" }}
{{- fail "externalSecrets.openbaoStore.create=true は externalSecrets.secretStoreRef.kind=SecretStore が要ります（名前空間のストア。IADR-0623）。" }}
{{- end }}
{{- /* NFR-05, IADR-0632（基盤の MSP:IADR-0696）: 基盤の OpenBao の受け口は TLS だけ。宛先は https に限り、受け口の CA を
       同じ名前空間の ConfigMap（基盤の tls-cert.sh が置く）で検証する。検証を外す口は持たない。 */}}
{{- if not (hasPrefix "https://" (.server | default "")) }}
{{- fail "externalSecrets.openbaoStore.server は https:// で始めます（基盤の OpenBao の受け口は TLS だけ。IADR-0632）。" }}
{{- end }}
{{- $ca := .caProvider | default dict }}
{{- if or (not $ca.name) (not $ca.key) (not (has $ca.type (list "ConfigMap" "Secret"))) }}
{{- fail "externalSecrets.openbaoStore.caProvider（type: ConfigMap か Secret・name・key）が要ります（受け口の CA で検証する。IADR-0632）。" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "externalSecrets.openbaoStore.serviceAccountName が要ります（IADR-0623）" .serviceAccountName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
# ESO の controller がこの ServiceAccount のトークンを要求する（TokenRequest）。Pod へは載せない。
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $es.secretStoreRef.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  provider:
    vault:
      server: {{ required "externalSecrets.openbaoStore.server が要ります（IADR-0623）" .server | quote }}
      caProvider:
        type: {{ $ca.type | quote }}
        name: {{ $ca.name | quote }}
        key: {{ $ca.key | quote }}
      path: {{ required "externalSecrets.openbaoStore.path が要ります（IADR-0623）" .path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .authMountPath | default "kubernetes" | quote }}
          role: {{ required "externalSecrets.openbaoStore.role が要ります（IADR-0623）" .role | quote }}
          {{- /* ESO が TokenRequest で作るトークンの対象者を秘匿管理（vault）に限る。基盤の role は audience=vault を要求する
                 （基盤の検査 vault-k8s-auth-audience と同じ形。名前空間のストアなので namespace は書かない）。 */}}
          serviceAccountRef:
            name: {{ .serviceAccountName }}
            audiences:
              {{- range (required "externalSecrets.openbaoStore.audiences が要ります（IADR-0623）" .audiences) }}
              - {{ . | quote }}
              {{- end }}
{{- end }}
{{- end }}
{{- /* NFR-05, #1560, IADR-0623 決定 1: DB の利用者名とパスワード（基盤と共有の値。基盤が OpenBao の中で乱数で作る）。
       同期先は global.db.passwordSecret / usernameSecret と同じ Secret にする。 */}}
{{- with $es.dbCredentials }}
{{- if .enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .targetName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .targetName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: password
{{- end }}
{{- end }}
{{- /* NFR-18, NFR-05, IADR-0630（基盤の MSP:IADR-0695 の受け手）: DB のサービスごとの資格。services.<名前>.dbCredentials を持つ
       サービスごとに 1 つ（同期先は dbCredentials の Secret。利用者名とパスワードは同じ Secret に置く）。置き場は <remoteKeyPrefix><サービスの名前>
       （基盤の seed-secrets.sh が OpenBao の中で作る cloud/shared/ast-db-<サービス>）。 */}}
{{- with $es.serviceDbCredentials }}
{{- if .enabled }}
{{- $prefix := required "externalSecrets.serviceDbCredentials.remoteKeyPrefix が要ります（基盤と共有のサービスごとの DB の資格の置き場。IADR-0630）" .remoteKeyPrefix }}
{{- $n := 0 }}
{{- range $name, $svc := $.Values.services }}
{{- with $svc.dbCredentials }}
{{- if or (not .usernameSecret) (not .passwordSecret) }}
{{- fail (printf "services.%s.dbCredentials は usernameSecret と passwordSecret を一緒に与えてください（利用者名とパスワードを別の資格から組まない。IADR-0630）。" $name) }}
{{- end }}
{{- if ne .usernameSecret.name .passwordSecret.name }}
{{- fail (printf "services.%s.dbCredentials の usernameSecret と passwordSecret は同じ Secret にしてください（ESO が 1 つの置き場から写す。IADR-0630）。" $name) }}
{{- end }}
{{- $n = add1 $n }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .passwordSecret.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .passwordSecret.name }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    - secretKey: {{ .usernameSecret.key }}
      remoteRef:
        key: {{ printf "%s%s" $prefix $name | quote }}
        property: username
    - secretKey: {{ .passwordSecret.key }}
      remoteRef:
        key: {{ printf "%s%s" $prefix $name | quote }}
        property: password
{{- end }}
{{- end }}
{{- if eq $n 0 }}
{{- fail "externalSecrets.serviceDbCredentials.enabled=true には、services.<名前>.dbCredentials を持つサービスが要ります（IADR-0630）。" }}
{{- end }}
{{- end }}
{{- end }}
{{- /* 🔴 NFR, NFR-05, IADR-0636（基盤の MSP の realm-for-cloud.js の SERVICE_CLIENTS の受け手）: サービス間の認証の機密クライアントを
       サービスごとに分ける。services.<名前>.serviceAuthClient.clientId を持つサービスごとに 1 つの Secret ast-service-auth-<名前>
       （キー client-id〔秘密ではない。字面〕・client-secret〔基盤の共有の置き場の、その clientId のプロパティだけ〕）。
       同じ clientId を 2 つのサービスへ与えたら描画で止める（身元を分けるのが目的）。 */}}
{{- with $es.serviceAuthClients }}
{{- if .enabled }}
{{- $remote := required "externalSecrets.serviceAuthClients.remoteKey が要ります（基盤と共有の client secret の置き場。IADR-0636）" .remoteKey }}
{{- $seen := dict }}
{{- range $name, $svc := $.Values.services }}
{{- with $svc.serviceAuthClient }}
{{- $clientId := required (printf "services.%s.serviceAuthClient.clientId が要ります（IADR-0636）" $name) .clientId }}
{{- if hasKey $seen $clientId }}
{{- fail (printf "services.%s と services.%s が同じ serviceAuthClient.clientId（%s）です。サービスごとに分けてください（IADR-0636）。" (get $seen $clientId) $name $clientId) }}
{{- end }}
{{- $_ := set $seen $clientId $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "ast-service-auth-%s" $name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ printf "ast-service-auth-%s" $name }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        client-id: {{ $clientId | quote }}
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $remote | quote }}
        property: {{ $clientId | quote }}
{{- end }}
{{- end }}
{{- if eq (len $seen) 0 }}
{{- fail "externalSecrets.serviceAuthClients.enabled=true には、services.<名前>.serviceAuthClient を持つサービスが要ります（IADR-0636）。" }}
{{- end }}
{{- end }}
{{- end }}
{{- /* NFR-06, NFR-05, #1560, IADR-0623 決定 5: 危険な操作の第 2 要素（TOTP）のシークレット。オーナーが登録のスクリプトで OpenBao へ入れる。
       消費側は optional で読む（無ければ段 2 では確かめられない操作を拒む）。 */}}
{{- with $es.ownerTotp }}
{{- if .enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .targetName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .targetName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: secret
{{- end }}
{{- end }}
{{- /* 🔴 NFR, FR-10, IADR-0627 決定 6: メッセージの発行元の鍵。キーは発行元の識別子（global.messageOrigin.services に現れるものすべて）。
       基盤の seed-secrets.sh の gen が OpenBao の中で乱数から作る（オーナーが手元から入れる値ではない）。 */}}
{{- with $es.messageOriginKeys }}
{{- if .enabled }}
{{- $mo := $.Values.global.messageOrigin | default dict }}
{{- if ne .targetName $mo.secretName }}
{{- fail (printf "externalSecrets.messageOriginKeys.targetName（%s）は global.messageOrigin.secretName（%s）と同じにします（IADR-0627）。" .targetName $mo.secretName) }}
{{- end }}
{{- $issuers := list }}
{{- range $svc, $keys := ($mo.services | default dict) }}{{- range $k := $keys }}{{- $issuers = append $issuers $k }}{{- end }}{{- end }}
{{- $issuers = $issuers | uniq | sortAlpha }}
{{- if not $issuers }}
{{- fail "externalSecrets.messageOriginKeys.enabled=true には global.messageOrigin.services（サービス → 鍵）が要ります（IADR-0627）。" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .targetName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .targetName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    {{- range $issuer := $issuers }}
    - secretKey: {{ $issuer }}
      remoteRef:
        key: {{ required "externalSecrets.messageOriginKeys.remoteKey が要ります（IADR-0627）" $.Values.externalSecrets.messageOriginKeys.remoteKey | quote }}
        property: {{ $issuer | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- /* NFR-18, NFR-05, #1560, IADR-0623 決定 2: 基盤の CA の証明書（公開してよい）。global.infraCa.secretName の Secret として写す。 */}}
{{- with $es.infraCa }}
{{- if .enabled }}
{{- if ne .targetName $.Values.global.infraCa.secretName }}
{{- fail "externalSecrets.infraCa.targetName は global.infraCa.secretName と同じ名前にしてください（消費側がその Secret を mount する。IADR-0623）。" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .targetName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .targetName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    - secretKey: {{ $.Values.global.infraCa.caKey }}
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: {{ .property | quote }}
{{- end }}
{{- end }}
{{- if and $o.enabled $o.authGateway.enabled }}
---
# NFR, IADR-0566: 認証サイドカーの呼び出し元検証の共有シークレット。基盤の BFF は同じ Vault のキーを自分の名前空間へ同期する。
# 🔴 Vault に値が無いあいだは Secret が作られず、サイドカーは全口 503（fail-closed）。OpenD の Pod の起動は止めない（volume は optional）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $o.authGateway.callerSecret.secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # opend.authGateway.callerSecret.secretName（サイドカーがマウントする Secret）と一致させる。
    name: {{ $o.authGateway.callerSecret.secretName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
  data:
    - secretKey: {{ $o.authGateway.callerSecret.secretKey }}
      remoteRef:
        key: {{ $es.opendAuthCallerSecret.remoteKey | quote }}
        property: {{ $es.opendAuthCallerSecret.property | quote }}
{{- end }}
{{- end }}
{{- /*
  ADR-0006, IADR-0094 (#24): API 鍵群（Secret `ast-secrets`）を Vault から同期する **opt-in** の受け口。
  既定 externalSecrets.appSecrets.enabled=false = fail-safe（何も描画しない＝現行の手動 k8s Secret 直運用を維持）。

  ⚠️ 平文の鍵はここにも values にも置かない。鍵は Vault の単一 KV（appSecrets.remoteKey）に格納し、
     `dataFrom.extract` で全プロパティを吸い上げる。**Vault 側のプロパティ名 = Secret のキー名**
     （finnhub-api-key / service-auth-client-id 等・deployment.yaml の secretKeyRef.key と一致）にすること。
     欠けた鍵は同期されず、消費側は secretKeyRef.optional=true（現行）で許容する（fail-safe）。
     同期先 Secret 名は `ast-secrets`（services.*.extraEnv が参照する名前）と一致させる。
     受け口の用意は Vault 化の充足ではない（ストア/ESO は #24 の MSP 側 stand-up・実運用は Tier 3）。
*/ -}}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.appSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- if not $es.secretStoreRef.name }}
{{- fail "externalSecrets.appSecrets.enabled=true には externalSecrets.secretStoreRef.name（Vault の SecretStore 名）が要ります。ストアの整備は #24（MSP 側）。" }}
{{- end }}
---
# #795, IADR-0341: 基盤の ESO（chart 2.8.0 に pin）は v1beta1 を提供しない（MSP scripts/k8s-local-up.sh）。v1 で書く。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ast-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    # services.*.extraEnv の secretKeyRef.name（ast-secrets）と一致させる。
    name: {{ $es.appSecrets.targetName }}
    creationPolicy: Owner
    {{- with $es.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- /* NFR-05, #1560, IADR-0623 決定 1: client ID（秘密ではない）は字面で足す。抽出した値とは合わせる（Merge）。 */}}
    {{- with $es.appSecrets.clientIds }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        {{- range $k, $v := . }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    {{- end }}
  {{- /* NFR-05, #1560, IADR-0623 決定 1: 基盤と共有の機密クライアントの secret（キーは clientId）を、取引ユニットのキーの名前で写す。 */}}
  {{- with $es.appSecrets.sharedClientSecrets }}
  {{- $sharedKey := required "externalSecrets.appSecrets.sharedClientSecrets.remoteKey が要ります（基盤と共有の client secret の置き場。IADR-0623）" .remoteKey }}
  data:
    {{- range $secretKey, $clientId := (required "externalSecrets.appSecrets.sharedClientSecrets.properties が要ります（{Secret のキー: clientId}。IADR-0623）" .properties) }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $sharedKey | quote }}
        property: {{ $clientId | quote }}
    {{- end }}
  {{- end }}
  # 単一 Vault KV の全プロパティを Secret へ吸い上げる（鍵名 = プロパティ名）。
  dataFrom:
