{{- /* #121: 取引サイクルの本番スケジューラ（K8s CronJob）骨子。
       既定 disabled = fail-safe（in-process ポーリング IADR-0023 を維持）。有効化には収集の
       run-once トリガ（/internal/collection/run-once・#121 の C# 実装）が前提。休場日ガードは
       run-once 側の市場カレンダー（IADR-0023）で担保する（CronJob は寄り〜引け相当のみ起動）。 */ -}}
{{- if .Values.tradingCycle.cronjob.enabled }}
{{- $c := .Values.tradingCycle.cronjob }}
{{- $g := .Values.global }}
{{- /* NFR, IADR-0609: 段 3 の uid / gid（既定 100:101）は uidVerifiedImage の curl イメージで確かめた値。image だけを替えると
       その番号の利用者がいるとは限らない。uid / gid を直すか、uidVerifiedImage を同じ image に揃える（明示の上書き）まで止める。 */}}
{{- if and (ge (int (include "ast.podSecurity.stage" .)) 3) (ne (toString $c.image) (toString $c.uidVerifiedImage)) (eq (int $c.runAsUser) 100) (eq (int $c.runAsGroup) 101) }}
{{- fail (printf "podSecurity.stage=3 で tradingCycle.cronjob.image（%s）が uid / gid を確かめたイメージ（tradingCycle.cronjob.uidVerifiedImage: %s）と違い、runAsUser / runAsGroup が既定の 100:101 のままです。新しいイメージの /etc/passwd・/etc/group を確かめ、runAsUser / runAsGroup を直すか、同じ番号でよければ uidVerifiedImage を同じ image に揃えてください（IADR-0609）。" $c.image $c.uidVerifiedImage) }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-cycle-trigger
  namespace: {{ .Values.namespace.name }}
  labels:
    app: trading-cycle-trigger
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  schedule: {{ $c.schedule | quote }}
  # 前回が長引いても多重起動しない（サイクルの重複起動を避ける）。
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        {{- /* #627, IADR-0314 決定4: メッシュ参入時、CronJob の Job Pod にもサイドカーが注入される。
               ネイティブサイドカー（k8s 1.29+ の initContainer restartPolicy: Always。ローカル環境は
               k8s 1.35 + Istio 1.30.4 で対応済み・既定 mesh.sidecarInjection.cronJobNativeSidecar=true）
               前提なら、メインコンテナ終了でサイドカーも自動終了し Job は完了する。
               🔴 cronJobNativeSidecar=false（ネイティブサイドカー非対応の環境）の場合、下記 annotation は
               プロキシ起動前に本体がトークン取得へ通信する競合（起動順序の空振り）だけを避けるもので
               あり、**Job 完了自体（サイドカー常駐によるハング）は解決しない**——従来型サイドカーの
               「サイドカー終了」ワークアラウンド（例: 本体コマンド末尾で pilot-agent の quitquitquit を
               叩く）は本設定点の範囲外である（残余リスク。IADR-0314 参照）。 */}}
        {{- if and .Values.mesh.sidecarInjection.enabled (not .Values.mesh.sidecarInjection.cronJobNativeSidecar) }}
        metadata:
          annotations:
            proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
        {{- end }}
        spec:
          restartPolicy: Never
          {{- /* NFR, IADR-0609, #1526: 段 1 は何も足さない（curl イメージは元から非 root の curl_user）。段 2 は seccomp・トークンなし、
                 段 3 は runAsNonRoot と curl_user:curl_group（tradingCycle.cronjob.runAsUser / runAsGroup）。 */}}
          {{- with (include "ast.pod.security" (dict "root" $ "uid" $c.runAsUser "gid" $c.runAsGroup "fsGroup" false "pinRoot" false) | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          containers:
            - name: trigger
              image: {{ $c.image | quote }}
              {{- with (include "ast.container.security" $ | trim) }}
              {{- . | nindent 14 }}
              {{- end }}
              # NFR, #456, IADR-0176 決定2: run-once は OwnerOrService の認可を要する（無認証では 401）。
              # そこで **client_credentials でトークンを取り、Bearer を付けて叩く** 2 段にする。
              #
              # ⚠️ **fail-closed**: `set -eu` ＋ `curl -f` ＋ トークン空判定により、
              #    資格情報が無い・token エンドポイントが落ちている・応答が想定外、のいずれでも
              #    **Job が赤くなる**。**黙って無認証で通る経路は無い。**
              # ⚠️ curlimages/curl に jq は無いため `access_token` は sed で抜く。
              #    抜けなければ空文字列になり、直後の判定で落とす（無言で続行しない）。
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  if [ -z "${SERVICE_AUTH_CLIENT_ID:-}" ] || [ -z "${SERVICE_AUTH_CLIENT_SECRET:-}" ]; then
                    echo "ServiceAuth の資格情報が未設定です（ast-secrets の service-auth-client-id / -secret）。" >&2
                    echo "run-once は認可を要するため、資格情報なしでは起動できません（#456）。" >&2
                    exit 1
                  fi
                  TOKEN=$(curl -fsS -m 20 -X POST "$TOKEN_ENDPOINT" \
                    -d grant_type=client_credentials \
                    --data-urlencode "client_id=$SERVICE_AUTH_CLIENT_ID" \
                    --data-urlencode "client_secret=$SERVICE_AUTH_CLIENT_SECRET" \
                    | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
                  if [ -z "$TOKEN" ]; then
                    echo "access_token を取得できませんでした（token エンドポイント: $TOKEN_ENDPOINT）。" >&2
                    exit 1
                  fi
                  # 休場日・費用停止は収集側でゲートされ no-op で返る（fail-safe）。
                  exec curl -fsS -m 20 -X POST -H "Authorization: Bearer $TOKEN" "$TARGET"
              env:
                - name: TARGET
                  value: {{ $c.target | quote }}
                {{- /* #456: token エンドポイントは **global.authAuthority から導出する**。
                       values にリテラルを置くと authAuthority を --set で変えても追随せず、
                       **他サービスだけレルムを移り、CronJob だけ古い Keycloak を叩き続ける**。
                       その状態では token 取得が必ず失敗し、fail-closed により Job は赤くなる——
                       止まるので危険側ではないが、**「認可を掛けた」という前提は静かに空振りする**。
                       deployment.yaml の Notifications__Discord__OwnerAuth__TokenEndpoint（#226 /
                       IADR-0098）と**同じ導出**に揃える。 */}}
                - name: TOKEN_ENDPOINT
                  value: {{ printf "%s/protocol/openid-connect/token" (trimSuffix "/" $g.authAuthority) | quote }}
                - name: SERVICE_AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $c.serviceAuthSecretName | quote }}
                      key: service-auth-client-id
                - name: SERVICE_AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ $c.serviceAuthSecretName | quote }}
                      key: service-auth-client-secret
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              {{- if include "ast.podSecurity.readOnlyRoot" $ }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ $.Values.podSecurity.tmpSizeLimit | quote }}
              {{- end }}
{{- end }}
