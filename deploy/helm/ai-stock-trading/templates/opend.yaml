{{- /*
  #132, IADR-0060 決定 1 / IADR-0053: 常駐 OpenD（moomoo ゲートウェイ）の本番配備。
  既定 opend.enabled=false = fail-safe（本ファイルは何も描画しない）。dev の現行経路は deploy/opend/k8s の生 manifest。

  既定値での描画は生 manifest（deploy/opend/k8s/{pvc,opend}.yaml）と同等になること（root・HOME=/root・
  単一レプリカ・Recreate・liveness 無し・stdin/tty あり）。仕様書の受け入れ基準 3。

  ⚠️ 実弾は撃たない。OpenD は口座への窓口にすぎず、取引環境は order-execution 側が TrdEnv_Simulate に固定する
     （IADR-0016 / IADR-0056）。本テンプレートは OpenD を立てるだけで、発注経路の有効化は moomoo.enabled が担う。
*/ -}}
{{- if .Values.opend.enabled }}
{{- $o := .Values.opend }}
{{- /* 誤配備を描画時に止める（IADR-0060 §helm 側のゲート）。資格情報が無い OpenD は起動直後に落ちる。 */}}
{{- if not $o.credentialsSecretName }}
{{- fail "opend.enabled=true には opend.credentialsSecretName（moomoo 資格情報の Secret 名）が要ります。deploy/opend/k8s/secret.example.yaml を参照。" }}
{{- end }}
{{- if not $o.rsaSecretName }}
{{- fail "opend.enabled=true には opend.rsaSecretName（RSA 秘密鍵の Secret 名）が要ります。cross-network の trade 接続には暗号化が必須（#13）。" }}
{{- end }}
{{- if and $o.authGateway.enabled (or (not $o.authGateway.callerSecret.secretName) (not $o.authGateway.callerSecret.secretKey)) }}
{{- fail "opend.authGateway.enabled=true には opend.authGateway.callerSecret.secretName / secretKey（呼び出し元の検証に使う共有シークレット）が要ります。IADR-0566。" }}
{{- end }}
{{- if not $o.home }}
{{- fail "opend.home が空です（OpenD はデバイス信頼を $HOME/.com.moomoo.OpenD に書くため必須）。既定は /root。" }}
{{- end }}
{{- /* NFR, IADR-0609, #1526: OpenD の Pod の段（opend.podSecurity.stage。Worker の podSecurity.stage とは別）。
       段の値を組み、受け口 opend.securityContext / opend.podSecurityContext を**上に重ねる**（従来の --set の手順はそのまま効く。
       1（既定）: root のまま。トークンを置かない。認証サイドカー（Worker と同じ .NET のイメージ）は権限昇格なし・ケーパビリティを全て落とす
          （同じ uid の所有者として読み書きするだけ）。**OpenD 本体には何も足さない**（ADR-0024: 再起動を最小にする。root の実 OpenD で
          確かめていない変更を既定にしない。OpenD が落ちると発注経路が止まる）。
          opend.podSecurity.seccomp=true（明示の opt-in。chart README の必須の前提の手順で実機を確かめてから）: Pod に seccomp RuntimeDefault、
          OpenD 本体に権限昇格なし。
          段 1 で付けないもの: OpenD 本体のケーパビリティを落とすこと（root の OpenD は uid 10001 が所有する /opt/opend へ OpenD.xml を書く
          ＝CAP_DAC_OVERRIDE に頼る）・非 root（HOME とデバイス信頼の置き場が変わる）・readOnlyRootFilesystem（/opt/opend へ書く）。
       2: 受け付けない（描画で止める）。
       3: 非 root（opend.runAsUser・fsGroup）・全コンテナでケーパビリティを全て落とす。HOME は /home/opend に限る。 */}}
{{- $ostRaw := ($o.podSecurity | default dict).stage }}
{{- if not (has (toString $ostRaw) (list "1" "3")) }}
{{- fail (printf "opend.podSecurity.stage は 1 / 3 のどちらかです（受け取った値: %v。段 2 の中身は段 1 へ繰り上げた。IADR-0609）" $ostRaw) }}
{{- end }}
{{- $ost := int (toString $ostRaw) }}
{{- $podSc := dict }}
{{- $ctrSc := dict }}
{{- $sideSc := dict }}
{{- if or ($o.podSecurity | default dict).seccomp (ge $ost 3) }}
{{- $_ := set $podSc "seccompProfile" (dict "type" "RuntimeDefault") }}
{{- $_ := set $ctrSc "allowPrivilegeEscalation" false }}
{{- end }}
{{- if ge $ost 3 }}
{{- if ne (toString $o.home) "/home/opend" }}
{{- fail (printf "opend.podSecurity.stage=3（非 root）には opend.home=/home/opend が要ります（受け取った値: %s。deploy/opend/Dockerfile が uid 10001 用に用意した HOME。IADR-0609 / IADR-0060 決定 2）。" $o.home) }}
{{- end }}
{{- $uid := int (default 0 $o.runAsUser) }}
{{- $_ := set $podSc "runAsNonRoot" true }}
{{- $_ := set $podSc "runAsUser" $uid }}
{{- $_ := set $podSc "runAsGroup" $uid }}
{{- $_ := set $podSc "fsGroup" $uid }}
{{- $_ := set $ctrSc "capabilities" (dict "drop" (list "ALL")) }}
{{- end }}
{{- $podSc = mustMergeOverwrite $podSc (deepCopy ($o.podSecurityContext | default dict)) }}
{{- $ctrSc = mustMergeOverwrite $ctrSc (deepCopy ($o.securityContext | default dict)) }}
{{- if ge $ost 3 }}
{{- range $k := list "runAsUser" "runAsGroup" }}
{{- if le (int (default 0 (index $podSc $k))) 0 }}
{{- fail (printf "opend.podSecurity.stage=3 の Pod の %s は 1 以上の整数で与えてください（受け取った値: %v。IADR-0609）" $k (index $podSc $k)) }}
{{- end }}
{{- end }}
{{- if and (hasKey $ctrSc "runAsUser") (le (int $ctrSc.runAsUser) 0) }}
{{- fail (printf "opend.podSecurity.stage=3 で opend.securityContext.runAsUser が %v です（1 以上。IADR-0609）" $ctrSc.runAsUser) }}
{{- end }}
{{- end }}
{{- /* 認証サイドカーは OpenD 本体と同じ uid で動く（共有 emptyDir のファイルは umask 077・FIFO は 600）。サイドカーのイメージは
       Worker と同じ USER $APP_UID なので、Pod にもコンテナにも uid が無ければ root（0）を明示して OpenD 本体に揃える。 */}}
{{- $sideSc = mustMergeOverwrite $sideSc (deepCopy $ctrSc) }}
{{- $_ := set $sideSc "allowPrivilegeEscalation" false }}
{{- $_ := set $sideSc "capabilities" (dict "drop" (list "ALL")) }}
{{- if and (not (hasKey $sideSc "runAsUser")) (not (hasKey $podSc "runAsUser")) }}
{{- $_ := set $sideSc "runAsUser" 0 }}
{{- end }}
{{- $rsaMode := ternary 288 $o.rsaSecretDefaultMode (ge $ost 3) }}
{{- if $o.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opend-persist
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
  annotations:
    # #626, IADR-0283: opend.enabled=false への切り替え（helm upgrade の再描画）や helm uninstall で
    # PVC ごと削除されると、OpenD のデバイス信頼状態（$HOME/.com.moomoo.OpenD）が失われ、次回有効化時に
    # SMS/画像 CAPTCHA の再認証が要る（実測済み）。keep で削除対象から外す。明示的に消す場合は
    # `kubectl delete pvc opend-persist -n <namespace>` を手動実行する（chart README 参照）。
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $o.persistence.storageClassName }}
  storageClassName: {{ $o.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $o.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opend
  namespace: {{ .Values.namespace.name }}
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
  {{- /* #795, IADR-0341 決定4: Reloader を使う描画では OpenD を明示的に対象外にする。reload 注釈を付けないだけだと、
         導入側が --auto-reload-all 等で動いたときに OpenD まで再起動され、SMS 認証済みセッションが切れる。
         ワークロードの除外は reloader.stakater.com/auto: "false"（Reloader v1.4 の README「auto: "false" は
         そのワークロードの再起動を明示的に止める」。reloader.stakater.com/ignore は Secret / ConfigMap 側に付ける注釈で、
         Deployment に付けても効かない）。reloader.enabled=false（本番既定）では描かない。 */}}
  {{- if (.Values.reloader | default dict).enabled }}
  annotations:
    reloader.stakater.com/auto: "false"
  {{- end }}
spec:
  replicas: 1
  {{- /* OpenD は 1 セッション前提。複数レプリカにしない（ロールアウトは Recreate）。 */}}
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: opend }
  template:
    metadata:
      labels: { app: opend }
      {{- /* #627, IADR-0314 決定2: OpenD は独自プロトコル（TCP 11111・常駐 1 セッション）であり、
             HTTP でないためメッシュ mTLS/ルーティングの恩恵が無い。Envoy 傍受で常駐 TCP 接続の
             挙動が変わるリスクの方が上回るため、メッシュ参入時も既定でサイドカー注入対象外にする。
             NFR, IADR-0570（Refs GHSA-j4qv-2w99-xg5p）: 注釈は mesh.sidecarInjection.enabled に依らず excludeOpend だけで描く。
             注入の切り替えで OpenD の Pod テンプレートが変わらない＝作り直されない（認証済みのセッションを保つ）。
             名前空間の注入ラベルを chart の外（起動器・手）で貼っても、OpenD の作り直しでサイドカーが入らない。 */}}
      {{- if .Values.mesh.sidecarInjection.excludeOpend }}
      annotations:
        sidecar.istio.io/inject: "false"
      {{- end }}
    spec:
      {{- /* NFR, IADR-0609: AST は k8s API を使わない。段に依らず、名前空間の default のトークンを置かない。 */}}
      automountServiceAccountToken: false
      {{- with $podSc }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.nodeSelector }}
      {{- /* egress IP の安定＝無人再ログインの成立条件。本番ではノードを固定する（IADR-0060 決定 1）。 */}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: opend
          image: "{{ .Values.global.image.registry }}/{{ $o.image.repository }}:{{ $o.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with $ctrSc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* 初回の対話デバイス検証（kubectl attach）のため stdin/tty を保持する（常駐モデル）。 */}}
          stdin: true
          tty: true
          ports:
            - { containerPort: {{ $o.apiPort }}, name: api }
          env:
            - name: OPEND_API_PORT
              value: {{ $o.apiPort | quote }}
            - name: OPEND_LANG
              value: {{ $o.lang | quote }}
            - name: OPEND_LOG_LEVEL
              value: {{ $o.logLevel | quote }}
            {{- /* #132: HOME を明示する。OpenD はデバイス信頼を $HOME/.com.moomoo.OpenD に書き、PVC もそこへ張る。
                   非 root 化（securityContext）時は /home/opend を指す（Dockerfile が uid 10001 用に用意済み）。 */}}
            - name: HOME
              value: {{ $o.home | quote }}
            {{- /* #13: cross-network（worker→opend）trade は RSA 暗号化必須。OpenD 側も同一鍵を使う。 */}}
            - name: OPEND_RSA_KEY_FILE
              value: {{ printf "%s/%s" $o.rsaMountPath $o.rsaSecretKey | quote }}
            - name: OPEND_LOGIN_ACCOUNT
              valueFrom:
                secretKeyRef: { name: {{ $o.credentialsSecretName }}, key: login-account }
            - name: OPEND_LOGIN_PWD_MD5
              valueFrom:
                secretKeyRef: { name: {{ $o.credentialsSecretName }}, key: login-pwd-md5 }
          {{- /* OpenD は TCP API（HTTP ではない）。TCP 疎通で readiness を判定する。
                 注意: OpenD は**検証前から** listen するため、probe 通過≠ログイン完了。
                 「使える」判定は attach でのログイン成功確認（常駐モデル・IADR-0053）。
                 livenessProbe は意図的に付けない: 再起動の最小化を維持し（ADR-0024 決定3）、
                 SPOF ゆえの発注不可時間を無人で繰り返さないため（決定4）。IADR-0167 決定2。 */}}
          readinessProbe:
            tcpSocket: { port: {{ $o.apiPort }} }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
          volumeMounts:
            {{- if $o.persistence.enabled }}
            - name: persist
              mountPath: {{ printf "%s/.com.moomoo.OpenD" $o.home | quote }}
            {{- end }}
            - name: rsa
              mountPath: {{ $o.rsaMountPath | quote }}
              readOnly: true
            {{- /* #722, IADR-0320: サイドカーと共有する作業領域。標準入力の FIFO（stdin）・
                   コンソールの複製（console.log）・画像 CAPTCHA の写し（captcha.png）だけを置く。
                   authGateway が無効でも常にマウントする —— entrypoint.sh はどちらでもここへ書くので、
                   有効／無効で置き場が変わらないほうが挙動が読みやすい。 */}}
            - name: runtime
              mountPath: {{ $o.authGateway.runtimeDirectory | quote }}
          resources:
            {{- toYaml $o.resources | nindent 12 }}
        {{- if $o.authGateway.enabled }}
        {{- /*
          #722, IADR-0320: 検証コードの投入面（サイドカー）。既定 false = fail-safe。

          🔴 opend-persist（PVC）は**絶対にマウントしない**。PVC にはデバイス信頼の実体（Device.dat）と
             OpenD.xml（ログイン資格情報の MD5）が入っており、画像 1 枚のために口座の信頼状態を晒すことになる。
             サイドカーが読むのは OpenD 本体が emptyDir へ複製した写しだけである。

          🔴 Ingress も Route も TLS も持たない。呼び出し元はクラスタ内の BFF だけで、利用者認証はその手前で
             済んでいる。呼び出し元は共有シークレット（callerSecret）と NetworkPolicy（networkpolicy-opend.yaml）の
             2 段で絞る（IADR-0566）。書ける行は閉じた 3 コマンド（input_phone_verify_code / input_pic_verify_code /
             req_phone_verify_code）に限られる。

          securityContext は OpenD 本体と**同じ uid** を与える（$sideSc。上の段の組み立てを参照）。共有 emptyDir 上のファイルは OpenD 本体が
          umask 077 で作るため、uid がずれると読めなくなる（非 root 化したときに静かに壊れる）。
          NFR, IADR-0609: サイドカーのイメージは USER $APP_UID（1654）なので、uid の指定が無ければ runAsUser: 0 を明示して root の OpenD に揃える。
        */}}
        - name: opend-auth
          image: "{{ .Values.global.image.registry }}/{{ $o.authGateway.image.repository }}:{{ $o.authGateway.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with $sideSc }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { containerPort: {{ $o.authGateway.port }}, name: auth }
          env:
            - name: ASPNETCORE_URLS
              value: {{ printf "http://+:%v" $o.authGateway.port | quote }}
            - name: OpendAuth__RuntimeDirectory
              value: {{ $o.authGateway.runtimeDirectory | quote }}
            - name: OpendAuth__RateLimitMaxSubmissions
              value: {{ $o.authGateway.rateLimitMaxSubmissions | quote }}
            - name: OpendAuth__RateLimitWindowSeconds
              value: {{ $o.authGateway.rateLimitWindowSeconds | quote }}
            - name: OpendAuth__ResendIntervalSeconds
              value: {{ $o.authGateway.resendIntervalSeconds | default 60 | quote }}
            {{- /* NFR, IADR-0566: 呼び出し元の検証。値ではなくファイルの場所を渡す（Secret を回しても Pod を作り直さない）。 */}}
            - name: OpendAuth__CallerSecretFile
              value: {{ printf "%s/%s" $o.authGateway.callerSecret.mountPath $o.authGateway.callerSecret.secretKey | quote }}
          volumeMounts:
            - name: runtime
              mountPath: {{ $o.authGateway.runtimeDirectory | quote }}
            - name: caller-secret
              mountPath: {{ $o.authGateway.callerSecret.mountPath | quote }}
              readOnly: true
          resources:
            {{- toYaml $o.authGateway.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- if $o.persistence.enabled }}
        - name: persist
          persistentVolumeClaim:
            claimName: opend-persist
        {{- end }}
        {{- /* #722: OpenD 本体とサイドカーの共有領域。**PVC ではない**（消えてよいものしか置かない）。 */}}
        - name: runtime
          emptyDir:
            sizeLimit: {{ $o.authGateway.runtimeSizeLimit | quote }}
        {{- if $o.authGateway.enabled }}
        {{- /* NFR, IADR-0566: サイドカーだけがマウントする。optional: true ＝ Secret が無くても Pod は起動する
               （サイドカーは未構成として全口 503 を返す＝fail-closed。OpenD の API と発注経路は止めない）。 */}}
        - name: caller-secret
          secret:
            secretName: {{ $o.authGateway.callerSecret.secretName }}
            optional: true
            defaultMode: {{ $o.authGateway.callerSecret.defaultMode }}
            items:
              - { key: {{ $o.authGateway.callerSecret.secretKey }}, path: {{ $o.authGateway.callerSecret.secretKey }} }
        {{- end }}
        - name: rsa
          secret:
            secretName: {{ $o.rsaSecretName }}
            {{- /* #132, IADR-0060 決定 3: 秘密鍵は所有者のみ読取（0400=10 進 256）。非 root 化時は fsGroup ＋ 0440。
                   NFR, IADR-0609: opend.podSecurity.stage=3 では 0440（10 進 288）を描く。 */}}
            defaultMode: {{ $rsaMode }}
            items:
              - { key: {{ $o.rsaSecretKey }}, path: {{ $o.rsaSecretKey }} }
---
apiVersion: v1
kind: Service
metadata:
  name: opend
  namespace: {{ .Values.namespace.name }}
  labels: { app: opend }
spec:
  selector: { app: opend }
  ports:
    - { name: api, port: {{ $o.apiPort }}, targetPort: {{ $o.apiPort }} }
    {{- if $o.authGateway.enabled }}
    {{- /* #722: 検証コードの投入面。**ClusterIP のみ**＝クラスタ内からしか到達しない。
           Ingress も NodePort も作らない（呼び出すのは BFF だけである）。 */}}
    - { name: auth, port: {{ $o.authGateway.port }}, targetPort: {{ $o.authGateway.port }} }
    {{- end }}
{{- end }}
