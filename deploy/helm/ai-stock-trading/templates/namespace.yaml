{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: ai-stock-trading
    environment: local-dev
    {{- /* #627, IADR-0314: メッシュ参入（Istio サイドカー注入）の設定点。既定 false のため
           このラベルは既定描画に現れない（本番バイト等価）。namespace.create=false（namespace を
           本チャートが所有しない構成）のときはこの Namespace 自体が描画されないため、ラベルも
           付かない——その場合は運用側で対象 namespace へ手動でラベルを付ける。 */}}
    {{- if .Values.mesh.sidecarInjection.enabled }}
    istio-injection: enabled
    {{- end }}
    {{- /* NFR, IADR-0609, #1526: Pod Security Admission。warn / audit はいつも貼る（違反が見える＝段 1 の報告）。
           enforce は選んだときだけ、かつメッシュの注入が無いときだけ貼る（istio-init が baseline を満たさない）。
           値域は templates/_pod-security.tpl の ast.podSecurity.validate が検める。 */}}
    {{- $psa := .Values.podSecurity.admission }}
    {{- if and $psa.enforce (not .Values.mesh.sidecarInjection.enabled) }}
    pod-security.kubernetes.io/enforce: {{ $psa.enforce | quote }}
    {{- end }}
    pod-security.kubernetes.io/warn: {{ $psa.warn | quote }}
    pod-security.kubernetes.io/audit: {{ $psa.audit | quote }}
{{- end }}
