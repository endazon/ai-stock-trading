{{- /* #122: 10 Worker を同型の Deployment としてレンダリングする（全て Web SDK :8080）。 */ -}}
{{- $g := .Values.global -}}
{{- /* FR-05, #267, IADR-0111: ブローカ階層（運用の本番近接順）の単一スイッチ broker.tier を
       provider × environment の 2 軸へ展開する。paper ＜ moomoo-sim ＜ moomoo-live。
       moomoo.enabled は**非推奨エイリアス**で、tier 未指定（""）のときだけ moomoo-sim と解釈する
       ＝既存構成を壊さない。tier を明示しつつ moomoo.enabled=true にした矛盾は描画時に止める。 */ -}}
{{- $tier := ((.Values.broker | default dict).tier) | default "" -}}
{{- if eq $tier "" -}}
{{- $tier = ternary "moomoo-sim" "paper" .Values.moomoo.enabled -}}
{{- else if and .Values.moomoo.enabled (not (hasPrefix "moomoo-" $tier)) -}}
{{- fail (printf "broker.tier=%q と非推奨エイリアス moomoo.enabled=true が矛盾しています。broker.tier に一本化してください（moomoo を使うなら broker.tier=moomoo-sim・moomoo.enabled は省略）。" $tier) -}}
{{- end -}}
{{- /* IADR-0111 外周の閂: 実弾は未解禁。誤設定をクラスタへ届かせない（アプリ側は LiveTradingGate が閂 0 として停止させる）。 */ -}}
{{- if eq $tier "moomoo-live" -}}
{{- fail "broker.tier=moomoo-live（実弾）は受理しません。実弾は未解禁です（IADR-0016 / IADR-0056 / IADR-0111）。解禁には別の実装 ADR と IADR-0056 §3 の前提充足（リスク統制・監査・上限の実弾向け再確認、秘匿情報の Vault 化、発注予約 Reserved 滞留の自動リコンサイル #141、両層の組〔一次スクリーニング claude-haiku-5-5 ＋ 本判断 claude-sonnet-5-5〕での Stage 0 合格・IADR-0498 / IADR-0524）が要ります。シミュレーションには broker.tier=moomoo-sim を使ってください。" -}}
{{- end -}}
{{- $brokerTiers := dict "paper" (dict "provider" "paper" "environment" "sim") "moomoo-sim" (dict "provider" "moomoo" "environment" "sim") -}}
{{- if not (hasKey $brokerTiers $tier) -}}
{{- fail (printf "未知の broker.tier %q。'paper'（内蔵擬似）または 'moomoo-sim'（OpenD 経由 SIMULATE）を指定してください（IADR-0111）。" $tier) -}}
{{- end -}}
{{- $broker := get $brokerTiers $tier -}}
{{- /* NFR, IADR-0568（Refs 非公開の指摘（AST））: ブローカへはサービスごとのユーザー（<usernamePrefix><サービス名>）で接続する。
       旧キー global.rabbitmqConnectionString（全サービス共通の 1 組・資格情報を値に含む）は廃止し、与えられたら止める。 */ -}}
{{- if $g.rabbitmqConnectionString -}}
{{- fail "global.rabbitmqConnectionString は廃止しました。ブローカへはサービスごとのユーザーで接続します（global.rabbitmq.* と Secret global.rabbitmq.credentialsSecretName。IADR-0568）。" -}}
{{- end -}}
{{- $mq := $g.rabbitmq | default dict -}}
{{- if or (not $mq.host) (not $mq.port) (not $mq.credentialsSecretName) (not $mq.usernamePrefix) -}}
{{- fail "global.rabbitmq.host / port / credentialsSecretName / usernamePrefix が要ります（ブローカのサービスごとの資格情報。IADR-0568）。" -}}
{{- end -}}
{{- /* NFR, IADR-0609, #1526: Pod のセキュリティ設定の段と水準の組み合わせを、描画のたびに検める（templates/_pod-security.tpl）。 */ -}}
{{- include "ast.podSecurity.validate" . -}}
{{- $readOnlyRoot := include "ast.podSecurity.readOnlyRoot" . -}}
{{- /* 🔴 NFR, #1529, IADR-0612: 認証のレルムは配備の values で明示する（既定は空。単体実行向けのレルムへ黙って倒さない）。 */ -}}
{{- if not .Values.global.authAuthority }}
{{- fail "global.authAuthority が未設定です。配備のレルム（例 http://keycloak:8080/realms/platform）を values で明示してください（#1529）。" }}
{{- end }}
{{- /* NFR, NFR-18, #1535, IADR-0621: 基盤（DB・ブローカ）への TLS。検証に使う CA（global.infraCa）を /etc/platform-infra-ca へ
       読み取り専用・非 optional でマウントする（ConfigMap が無いクラスタでは Pod が立たない＝黙って平文へ戻らない）。
       有効なのに CA の設定・TLS のポートが無ければ描画で止める。形は基盤の chart と同じ（基盤の IADR-0591 決定 4）。 */ -}}
{{- $dbTls := and $g.db.tls $g.db.tls.enabled -}}
{{- $mqTls := and $mq.tls $mq.tls.enabled -}}
{{- $infraCa := $g.infraCa | default dict -}}
{{- if and (or $dbTls $mqTls) (or (not (or $infraCa.configMap $infraCa.secretName)) (not $infraCa.caKey)) -}}
{{- fail "global.infraCa.configMap（または secretName）/ caKey が要ります（global.db.tls / global.rabbitmq.tls が有効なときはサーバ証明書を基盤の CA で検証する。IADR-0621）。" -}}
{{- end -}}
{{- /* NFR-05, #1560, IADR-0623 決定 2: CA の写しを ESO が Secret に作る形（クラウド）。secretName を与えたら Secret から mount する。 */ -}}
{{- if and $infraCa.configMap $infraCa.secretName -}}
{{- fail "global.infraCa.configMap と secretName は併用できません（どちらから読むか読めない構成を許さない。IADR-0623）。クラウドは secretName だけを与え、configMap を空にしてください。" -}}
{{- end -}}
{{- if and $mqTls (not $mq.tls.port) -}}
{{- fail "global.rabbitmq.tls.port が要ります（amqps の口。IADR-0621）。" -}}
{{- end -}}
{{- /* NFR, NFR-05, IADR-0629（基盤の MSP:IADR-0693 の受け手）: 認可サーバー（Keycloak）への通信を TLS で検証する（global.authTls。opt-in）。
       有効なら Authority は https でなければ描画で止め、全 Worker に基盤の CA（global.infraCa。DB・ブローカと同じ CA）をマウントする
       （DB・ブローカを使わない Worker も。トークンの取得はどの Worker も行う）。CA の設定が無ければ止める（黙って平文へ戻らない）。 */ -}}
{{- $authTls := and $g.authTls $g.authTls.enabled -}}
{{- if $authTls -}}
{{- if not (hasPrefix "https://" ($g.authAuthority | toString)) -}}
{{- fail (printf "global.authTls.enabled のとき global.authAuthority は https:// で始めてください（%s。IADR-0629）。" $g.authAuthority) -}}
{{- end -}}
{{- if or (not (or $infraCa.configMap $infraCa.secretName)) (not $infraCa.caKey) -}}
{{- fail "global.authTls.enabled のときは global.infraCa.configMap（または secretName）/ caKey が要ります（認可サーバーの証明書を基盤の CA で検証する。IADR-0629）。" -}}
{{- end -}}
{{- end -}}
{{- $infraCaMount := or $dbTls $mqTls $authTls -}}
{{- if and $g.db.usernameSecret (not $g.db.passwordSecret) -}}
{{- fail "global.db.usernameSecret は global.db.passwordSecret と一緒に与えてください（接続文字列を Secret の参照で組む形だけが利用者名を Secret から読む。IADR-0623）。" -}}
{{- end -}}
{{- range $name, $svc := .Values.services }}
{{- /* FR-09/14, #245, IADR-0102: Discord Bot の環境固有 ID（非機密）を values（discord.bot.*）から与える設定点。
       env を**追加**せず extraEnv の**値を上書き**する（同名 env の二重定義を作らない）。空既定では 1 つも
       登録しない ＝ 既定描画（本番 values.yaml）・values-local 描画は本設定点の追加前とバイト等価。
       これにより Helm が env を単独所有し、`kubectl set env`（フィールドマネージャ kubectl-set）との
       所有権競合（helm upgrade の `conflict with "kubectl-set"`）が構造的に起きない。 */}}
{{- $envOverrides := dict -}}
{{- /* #795, IADR-0341: ESO 所有（externalSecrets.enabled かつ appSecrets.enabled）では、Discord の環境固有 ID 4 件を
       values ではなく ast-secrets の契約キーから読む（値は基盤の画面から Vault へ書く）。$envSecretRefs は
       env 名 → Secret キー。optional のため未設定は env 無し＝IADR-0062 の安全既定（全拒否）のまま。
       env 名は変えない（DiscordBotOptionsReader は無改修）。 */ -}}
{{- $envSecretRefs := dict -}}
{{- $es := $.Values.externalSecrets | default dict -}}
{{- $appSecretsOn := and $es.enabled (($es.appSecrets | default dict).enabled) -}}
{{- if eq $name "notification" -}}
{{- $bot := (($.Values.discord | default dict).bot) | default dict -}}
{{- if $appSecretsOn -}}
{{- if or $bot.guildId $bot.channelId $bot.allowedUserIds $bot.userMapping -}}
{{- fail "externalSecrets.appSecrets.enabled=true（Discord ID を ast-secrets から読む）と discord.bot.* の非空指定は併用できません。値は ast-secrets（Vault の ai-stock-trading/app-secrets の discord-bot-*）へ入れるか、ESO を使わない経路（k8s-local-deploy.sh の AST_ESO=0）で discord.bot.* を使ってください（#795 / IADR-0341）。" -}}
{{- end -}}
{{- $_ := set $envSecretRefs "Notifications__Discord__Bot__GuildId" "discord-bot-guild-id" -}}
{{- $_ := set $envSecretRefs "Notifications__Discord__Bot__ChannelId" "discord-bot-channel-id" -}}
{{- $_ := set $envSecretRefs "Notifications__Discord__Bot__AllowedUserIds" "discord-bot-allowed-user-ids" -}}
{{- $_ := set $envSecretRefs "Notifications__Discord__Bot__UserMapping" "discord-bot-user-mapping" -}}
{{- else -}}
{{- with $bot.guildId }}{{- $_ := set $envOverrides "Notifications__Discord__Bot__GuildId" . -}}{{- end -}}
{{- with $bot.channelId }}{{- $_ := set $envOverrides "Notifications__Discord__Bot__ChannelId" . -}}{{- end -}}
{{- with $bot.allowedUserIds }}{{- $_ := set $envOverrides "Notifications__Discord__Bot__AllowedUserIds" . -}}{{- end -}}
{{- with $bot.userMapping }}{{- $_ := set $envOverrides "Notifications__Discord__Bot__UserMapping" . -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- /* #781, ADR-0038 決定 2, IADR-0324, IADR-0093 / IADR-0323: 基盤（MSP）の KB / LLM ゲートウェイを叩く s2s の
       Authority も `global.authAuthority` から導出する（inbound の Auth__Authority・ServiceAuth__TokenEndpoint・
       CronJob の TOKEN_ENDPOINT・Discord OwnerAuth と**同一ソース**）。
       🔴 values にレルムのリテラルを置くと `--set global.authAuthority` に追随せず、その経路だけ別レルムを指して
       issuer 不一致の 401 で止まる。同じ壊れ方は #456（CronJob）・#736（s2s 発信者）に続いて 3 回目であり、
       #776 の描画検査が「ずれを赤で捕まえる」ところまでは来ていたが、**ずれを作れない構造**にはなっていなかった
       （IADR-0324 の 2026-09-11 追記が「残った負債」として名指ししたもの）。
       導出するのは**その連携が実際に配線されているとき（対応する BaseUrl が非空）だけ**である。BaseUrl が空＝
       未構成なら Authority も意味を持たない —— 本番既定はまさにその状態なので、既定描画はバイト等価のまま。
       🔴 レルム名を条件にしない（`authAuthority` が MSP レルムのときだけ、という形）。それだと `--set` で
       別レルムを与えたときに env ごと消え、「4 つも追随する」ことを確かめる陰性対照が空振りで緑になる。
       env は**追加せず** $envOverrides で値を上書きする（同名 env の二重定義も並び順の変化も作らない）。 */ -}}
{{- $baseUrls := dict -}}
{{- range $e := $svc.extraEnv }}{{- if $e.value }}{{- $_ := set $baseUrls $e.name $e.value -}}{{- end }}{{- end -}}
{{- if or (index $baseUrls "KnowledgeBase__Documents__BaseUrl") (index $baseUrls "KnowledgeBase__Search__BaseUrl") -}}
{{- $_ := set $envOverrides "KnowledgeBase__Auth__Authority" $g.authAuthority -}}
{{- end -}}
{{- /* #1078, IADR-0485: 検索の読み手（KnowledgeBase__SearchAuth__*）の Authority も同じ源から導出する（検索を配線したときだけ）。
       env を持たないサービスでは上書きの対象が無いので何も描画されない（env は追加しない）。 */ -}}
{{- if index $baseUrls "KnowledgeBase__Search__BaseUrl" -}}
{{- $_ := set $envOverrides "KnowledgeBase__SearchAuth__Authority" $g.authAuthority -}}
{{- end -}}
{{- if index $baseUrls "LlmGateway__BaseUrl" -}}
{{- $_ := set $envOverrides "LlmGateway__Auth__Authority" $g.authAuthority -}}
{{- end -}}
{{- /* #795, IADR-0341: Reloader の注釈に載せる Secret 名を描画時に導出する（手書きの一覧を持たない）。
       env の secretKeyRef ＋ 上の Discord 切り替え分 ＋ moomoo 経路の order-execution がマウントする RSA 鍵。 */ -}}
{{- $reloadSecrets := list -}}
{{- range $e := $svc.extraEnv }}{{- if $e.secretKeyRef }}{{- $reloadSecrets = append $reloadSecrets $e.secretKeyRef.name -}}{{- end }}{{- end -}}
{{- if $envSecretRefs }}{{- $reloadSecrets = append $reloadSecrets $es.appSecrets.targetName -}}{{- end -}}
{{- if and (eq $name "order-execution") (eq $broker.provider "moomoo") }}{{- $reloadSecrets = append $reloadSecrets $.Values.moomoo.opend.rsaSecretName -}}{{- end }}
{{- /* IADR-0568: ブローカの資格情報を回したら（基盤の reconcile-users.sh が合わせた後に ESO が同期）、作り直して新しい値で接続する。 */ -}}
{{- $reloadSecrets = append $reloadSecrets $mq.credentialsSecretName -}}
{{- /* #1527, IADR-0610: 承認の印の鍵を入れ替えたら作り直して新しい鍵を読む。 */ -}}
{{- $oasReload := $.Values.global.orderApprovalSigning | default dict -}}
{{- if has $name ($oasReload.services | default list) }}{{- $reloadSecrets = append $reloadSecrets $oasReload.secretName -}}{{- end }}
{{- /* IADR-0633: メッセージの発行元の鍵を入れ替えたら作り直して新しい鍵を読む。 */ -}}
{{- $moReload := $.Values.global.messageOrigin | default dict -}}
{{- if has $name ($moReload.signers | default list) }}{{- $reloadSecrets = append $reloadSecrets $moReload.signingSecretName -}}{{- end }}
{{- if hasKey ($moReload.verifiers | default dict) $name }}{{- $reloadSecrets = append $reloadSecrets $moReload.verifySecretName -}}{{- end }}
{{- range $issuer := (index ($moReload.verifiers | default dict) $name | default list) }}{{- if has $issuer ($moReload.previousVerify | default list) }}{{- $reloadSecrets = append $reloadSecrets $moReload.previousVerifySecretName -}}{{- end }}{{- end }}
{{- /* FR-15, NFR（費用）, ADR-0033 決定5, #1342, IADR-0537 決定5: Stage 0 の記録器の永続ボリューム（trade-decision だけ）。
       有効なら PVC（templates/pvc-stage0-recording.yaml）を mount し、状態の置き場 Stage0Recording__StateDirectory を
       <mountPath>/state として注入し、更新方式を Recreate にする。既定（無効）では何も描かない＝既定描画はバイト等価。
       🔴 状態の置き場は描画が単独で持つ（extraEnv に書けば止める。/tmp などの揮発領域へ向けられる抜け道を作らない）。
       🔴 書き出し先（extraEnv の Stage0Recording__OutputPath）が mount の外なら止める（記録が再起動で消える）。 */ -}}
{{- $s0 := (($.Values.stage0Recording | default dict).persistence) | default dict -}}
{{- $stage0Persist := and (eq $name "trade-decision") $s0.enabled -}}
{{- range $e := $svc.extraEnv }}
{{- if eq ($e.name | toString) "Stage0Recording__StateDirectory" }}
{{- fail (printf "services.%s の extraEnv に Stage0Recording__StateDirectory は書けません。状態の置き場は stage0Recording.persistence.enabled=true で描画が注入します（永続ボリュームの外へ向けない。#1342 / IADR-0537）。" $name) }}
{{- end }}
{{- end }}
{{- if $stage0Persist }}
{{- if not (hasPrefix "/" ($s0.mountPath | default "" | toString)) }}
{{- fail "stage0Recording.persistence.mountPath は絶対パスで指定してください（#1342 / IADR-0537）。" }}
{{- end }}
{{- with (index $baseUrls "Stage0Recording__OutputPath") }}
{{- if not (hasPrefix (printf "%s/" (trimSuffix "/" $s0.mountPath)) .) }}
{{- fail (printf "services.trade-decision の Stage0Recording__OutputPath=%q は stage0Recording.persistence.mountPath（%s）の外です。記録が Pod の再起動で消えるため、mount の下を指してください（#1342 / IADR-0537）。" . $s0.mountPath) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: {{ $name }}-service
    app.kubernetes.io/part-of: ai-stock-trading
  {{- if and (($.Values.reloader | default dict).enabled) $reloadSecrets }}
  {{- /* #795, IADR-0341: Secret の変更（画面からの書き込み→ESO force-sync）で Reloader がこの Deployment を再起動する。
         本 template は Worker だけを描く＝OpenD（templates/opend.yaml）には付かない。 */}}
  annotations:
    secret.reloader.stakater.com/reload: {{ $reloadSecrets | uniq | sortAlpha | join "," | quote }}
  {{- end }}
spec:
  replicas: 1
  {{- if $stage0Persist }}
  {{- /* #1342, IADR-0537: 入れ替えで旧 Pod と新 Pod の記録器が同じ状態を同時に進めない（ReadWriteOnce の PVC も Recreate が要る）。 */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
      annotations:
        {{- /* ADR-0001, IADR-0077/0078, #22: 宣言（pipeline.json）変更時に Pod をロールアウトして
               自己申告（有効な段）を更新する。全 Worker が同一 ConfigMap をマウントするため共通の checksum。 */}}
        checksum/pipeline: {{ $.Files.Get "files/pipeline.json" | sha256sum }}
    spec:
      {{- /* NFR, IADR-0609, #1526: 段 1 は root を明示（イメージは USER $APP_UID）、段 2 は root のまま権限を絞る、段 3 は非 root。 */}}
      {{- with (include "ast.pod.security" (dict "root" $ "uid" $.Values.podSecurity.dotnetRunAsUser "gid" $.Values.podSecurity.dotnetRunAsUser "fsGroup" true "pinRoot" true) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          {{- /* ADR-0006, #1525, IADR-0608 決定2: digest があれば固定（requireDigest のとき無ければ止める）。無い既定の描画は不変。 */}}
          image: "{{ include "ast.imageRef" (dict "registry" $g.image.registry "repository" $svc.image "tag" ($svc.tag | default $g.image.tag) "digest" $svc.digest "require" $g.image.requireDigest "what" (printf "services.%s" $name)) }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          {{- with (include "ast.container.security" $ | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - containerPort: 8080
            {{- if $svc.grpcPort }}
              {{- /* NFR, IADR-0284 決定5（段0）, IADR-0328, #584: 複数ポートになるので名前を付ける
                     （grpcPort 未宣言のサービスは追加前とバイト等価）。 */}}
              name: http
            - containerPort: {{ $svc.grpcPort }}
              name: grpc
            {{- end }}
          env:
            {{- /* NFR-06, NFR-05, IADR-0496, #1192: 環境名は values から与える（サービス単位 aspnetcoreEnvironment ＞ global ＞ Production）。
                   🔴 従来は全サービスに Development を固定値で描いており、例外時に ASP.NET Core の開発者向けページが
                   スタックと全要求ヘッダー（Authorization: Bearer）を応答へ載せた（PoC でトークンが漏れた）。
                   Development は**どのプロファイルでも描画で止める**（配備では開発者向けの挙動を取らない）。
                   Development だけが読んでいた appsettings.Development.json の値で経路B が要るもの（Serilog の Debug・
                   情報収集の巡回 300 秒）は values の明示の設定へ移した（下の Serilog__MinimumLevel__Default と
                   services.information-collection の Collection__PollIntervalSeconds。棚卸しは IADR-0496）。 */}}
            {{- $aspEnv := $svc.aspnetcoreEnvironment | default $g.aspnetcoreEnvironment | default "Production" }}
            {{- if eq (lower $aspEnv) "development" }}
            {{- fail (printf "services.%s の ASPNETCORE_ENVIRONMENT=%q は受理しません。配備では開発者向け例外ページ（要求ヘッダー・スタックを応答へ載せる）を開かないため、Development は使えません（IADR-0496 / #1192）。Development でしか読まれない設定は values の env で明示してください。" $name $aspEnv) }}
            {{- end }}
            {{- /* NFR-06, IADR-0496（#1205 監査の追記）, #1192: 環境名を extraEnv で与える抜け道を塞ぐ。Kubernetes は同名 env の**後ろ**を採るため、
                   extraEnv の ASPNETCORE_ENVIRONMENT（または既定の読み元 DOTNET_ENVIRONMENT）は上の検査を素通りして Development へ戻せた。
                   環境名は aspnetcoreEnvironment（サービス単位／global）でだけ与える（名前は大小無視で比べる）。 */}}
            {{- range $e := $svc.extraEnv }}
            {{- if has (upper ($e.name | toString)) (list "ASPNETCORE_ENVIRONMENT" "DOTNET_ENVIRONMENT") }}
            {{- fail (printf "services.%s の extraEnv に %s は書けません。環境名は services.%s.aspnetcoreEnvironment か global.aspnetcoreEnvironment で与えてください（Development は受理しない。IADR-0496 / #1192）。" $name $e.name $name) }}
            {{- end }}
            {{- end }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $aspEnv | quote }}
            {{- with $g.serilogMinimumLevel }}
            {{- /* IADR-0496, #1192: 空（本番既定）なら描かない＝appsettings.json の Information。経路B は Debug を明示する
                   （Production では appsettings.Development.json の Debug が読まれなくなるため）。 */}}
            - name: Serilog__MinimumLevel__Default
              value: {{ . | quote }}
            {{- end }}
            - name: ASPNETCORE_URLS
              value: http://+:8080
            {{- /* NFR, IADR-0644 決定 1・2: 外への HTTPS を基盤の外向きの中継へ寄せる（networkPolicy.egressProxy.mode が Off でなく、
                   networkPolicy.services.<名前>.externalHttps: true のサービスだけ）。.NET の HttpClient（IHttpClientFactory・SocketsHttpHandler）は
                   HTTPS_PROXY・NO_PROXY を読む（http:// の宛先には効かない。HTTP_PROXY・ALL_PROXY は渡さない）。Discord.Net は
                   既定で読まないので、通知サービスが明示で読ませる（DiscordNetBotGateway.CreateSocketConfig）。
                   NO_PROXY はクラスタの中の名前だけ（ast.egressProxy.noProxy）。extraEnv で与える抜け道は塞ぐ。 */}}
            {{- range $e := $svc.extraEnv }}
            {{- if has (upper ($e.name | toString)) (list "HTTPS_PROXY" "HTTP_PROXY" "ALL_PROXY" "NO_PROXY") }}
            {{- fail (printf "services.%s の extraEnv に %s は書けません。中継は networkPolicy.egressProxy.mode で与えます（IADR-0644）。" $name $e.name) }}
            {{- end }}
            {{- end }}
            {{- if include "ast.egressProxy.applies" (dict "root" $ "name" $name) }}
            - name: HTTPS_PROXY
              value: {{ $.Values.networkPolicy.egressProxy.url | quote }}
            - name: NO_PROXY
              value: {{ include "ast.egressProxy.noProxy" $ | quote }}
            {{- end }}
            {{- /* NFR, ADR-0006, #778: 512Mi の小容器で ASP.NET Core 既定の Server GC は、ヒープ上限（limit の 75%）に
                   達する前にネイティブ分を含む RSS が limit を超えて OOMKilled になる（audit-service が 3h で 5 回・
                   risk-management も 1 回実測）。Workstation GC ＋ GCConserveMemory で RSS を抑える。全 .NET サービス共通。 */}}
            - name: DOTNET_gcServer
              value: "0"
            - name: DOTNET_GCConserveMemory
              value: "5"
            {{- /* NFR, ADR-0006, #782: Workstation GC ＋ GCConserveMemory だけでは RSS が limit（512Mi）へ戻る
                   （audit-service が 11 分で 437Mi、risk-management は開場中の Buy 判断の処理中に OOMKilled を実測）。
                   ヒープ上限を limit の 60%（≈307Mi）に固定し、ネイティブ分を含めて 512Mi の内側で止める
                   （#778 の暫定適用で RSS 472Mi 頭打ちを実測）。全 .NET サービス共通・本番既定にも入れる。
                   opend.yaml の opend-auth-gateway は対象外（ログイン済み OpenD Pod を再起動させない。別途）。
                   ［2026-09-17 追記 / #811］上の「512Mi の内側で止める」「472Mi 頭打ち」の読みは #808 で誤りと判明した。
                   保持されていたのは GC ヒープの外（Wolverine の実行時 Roslyn コンパイルの作業メモリ）で、新しい型の
                   メッセージが来なくなって止まって見えただけである（GC ヒープ側は audit で ≈64Mi）。是正は #811（PR #814。
                   codegen write＋TypeLoadMode.Static）。本 env は GC ヒープの上限として無害なので据え置く。
                   ［2026-10-14 追記 / #1348］上の「ヒープ上限を limit の 60%（≈307Mi）に固定し」は #782 から本追記まで
                   事実でなかった。値を "60" と書いていたため 0x60＝96%（≈491Mi）として効いていた。本追記で "0x3C" に直した。 */}}
            {{- /* NFR, ADR-0006, #1348: .NET は GC 設定の環境変数の値を**16 進数として読む**（"0x3C" も "3C" も 0x3C）。
                   出典: Microsoft Learn「Garbage collector config settings」の「Ways to specify the configuration」の表
                   （https://learn.microsoft.com/en-us/dotnet/core/runtime-config/garbage-collector。GCHeapHardLimitPercent は
                   hexadecimal value・例は 30% → 0x1E）。60% は "0x3C"。10 進数で "60" と書くと 96% になる。
                   10 以上の値は必ず 0x を付けて書く（helm.yml の fail-safe 検査が 16 進数で読んで 60 であることを固定する）。 */}}
            - name: DOTNET_GCHeapHardLimitPercent
              value: "0x3C"
            {{- /* NFR-01, ADR-0006, IADR-0129 決定 6 追記, #808: 3 つの GC 設定を入れても audit-service は 10 分で RSS 476Mi
                   → OOMKilled（実測）。伸びているのは GC ヒープ（実測 ≈64Mi）ではなく glibc malloc の per-thread アリーナで、
                   Wolverine がメッセージ型ごとに 1 通目の受信時に Roslyn でハンドラをコンパイルするたび（別スレッド＝別
                   アリーナ）に ≈53Mi ずつ積まれる（audit は 45 型を購読。/proc/1/smaps の 64MiB 整列 rw-p が 6 回で 337Mi）。
                   アリーナ数を 2 に固定し、作業メモリをスレッド間で同じアリーナに再利用させる狙い（MALLOC_ARENA_MAX は
                   アリーナの「数」の上限であってサイズの上限ではない。非 main アリーナは 64MiB の heap を複数連ねられるので
                   「上限 ≈2×64MiB」にはならない）。全 .NET サービス共通・本番既定にも入れる。opend.yaml は #782 と同じく対象外。
                   引き金（実行時コンパイル）を無くす恒久策は codegen 事前生成＋TypeLoadMode.Static（#811）。
                   ［2026-09-17 追記 / #811］配備後の実測では伸びは止まらなかった（下の #812 コメントの追記を参照）。 */}}
            - name: MALLOC_ARENA_MAX
              value: "2"
            {{- /* NFR-01, ADR-0006, IADR-0129 決定 6 追記, #812: MALLOC_ARENA_MAX=2 の配備後も audit-service は起動 9 秒で
                   OOMKilled（起動直後の 6 型同時コンパイル）し、再起動後も 6 コンパイルで RSS 459Mi（実測 2026-09-16 15:26Z）。
                   /proc/1/smaps では積み上がる先が per-thread アリーナから main arena の [heap]（brk。audit 214,624 kB・
                   risk 111,056 kB）へ移っただけで、[heap]＋アリーナ heap ≈ 52MB × コンパイル回数の傾きは #808 と同じ。
                   glibc の既定は動的閾値（mallopt(3)）: 128KiB 超の mmap チャンクを free するたび M_MMAP_THRESHOLD が
                   その大きさ（最大 32MiB）へ、M_TRIM_THRESHOLD がその 2 倍（最大 64MiB）へ上がり、以後の割り当ては heap へ
                   積まれて top の空きが 64MiB に届くまで trim されない。閾値を 128KiB に固定すると動的調整が無効化され、
                   128KiB 超は mmap（free で即 munmap）・heap top の空き 128KiB 超は free のたびに trim される
                   （main arena は brk 縮小、非 main アリーナは heap_trim）。末尾の "_" は glibc の env 名の規約。
                   限界: 解放されていない割り当てや top より下に断片化して残る空きは返らない（その場合は #811 だけが直す）。
                   #811（codegen write＋TypeLoadMode.Static）までの暫定。全 .NET サービス共通・本番既定にも入れる。
                   opend.yaml は #782 / #808 と同じく対象外。
                   ［2026-09-17 追記 / #811］実測の結果、MALLOC_ARENA_MAX・MALLOC_MMAP_THRESHOLD_・MALLOC_TRIM_THRESHOLD_ の
                   いずれも保持されるメモリの総量を減らさなかった。保持先がアリーナ → [heap]（#810 後）→ mmap 領域（#813 後。
                   2026-09-16 16:00Z: audit の総量 ≈360MB・risk ≈270MB は適用前と同じ）へ移っただけで、作業メモリは解放されて
                   いなかった（#812 のコメント）。伸びを止めたのは #811（PR #814。実行時コンパイル 0 件で audit [heap] 12MB・
                   11 サービスとも再起動 0）。3 つの env は無害なので据え置き、実行時コンパイルが無くなった今、要否を再評価する。 */}}
            - name: MALLOC_MMAP_THRESHOLD_
              value: "131072"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
            {{- /* NFR, MSP:ADR-0029 / MSP:ADR-0075, IADR-0328, #584: east-west gRPC の h2c リスナ
                   （TLS 無し HTTP/2 専用ポート）。未設定ならアプリはリスナを立てない。
                   readiness は HTTP 側（8080 の /health/ready）のまま —— 1 プロセスが両ポートを
                   起動時に bind するので、8080 が ready なら h2c も bind 済みである。 */}}
            {{- if $svc.grpcPort }}
            - name: Grpc__Port
              value: {{ $svc.grpcPort | quote }}
            {{- end }}
            {{- /* NFR, IADR-0568（Refs 非公開の指摘（AST））: サービスごとのユーザーで接続する。パスワードは Secret（キー = ユーザー名）から
                   RABBITMQ_PASSWORD として入れ、接続文字列は k8s の $(VAR) 補間で組む（env の値に平文を描かない。基盤の chart と同じ形）。
                   🔴 optional にしない: 値が無いまま既定のユーザーへ戻る経路を作らない（新しい Pod が起動せず、旧 Pod が残る）。 */}}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mq.credentialsSecretName }}
                  key: {{ printf "%s%s" $mq.usernamePrefix $name }}
            {{- if $mqTls }}
            {{- /* NFR, NFR-18, #1535, IADR-0621 決定2: amqps（TLS）。名前の照合は UseAiStockTradingRabbitMq が外さない（決定 4）。
                   🔴 IADR-0639: サーバ証明書は基盤の CA（下の PlatformInfraCa__CertificatePath）で、ブローカの接続だけが検証する。 */}}
            - name: RabbitMq__ConnectionString
              value: {{ printf "amqps://%s%s:$(RABBITMQ_PASSWORD)@%s:%v" $mq.usernamePrefix $name $mq.host $mq.tls.port | quote }}
            {{- else }}
            - name: RabbitMq__ConnectionString
              value: {{ printf "amqp://%s%s:$(RABBITMQ_PASSWORD)@%s:%v" $mq.usernamePrefix $name $mq.host $mq.port | quote }}
            {{- end }}
            {{- if and (or $mqTls $authTls) $infraCa.addToSystemTrust }}
            {{- /* 🔴 NFR, IADR-0639: 基盤の CA をシステムの信頼ストアへ足すのは**切り戻しの時だけ**（global.infraCa.addToSystemTrust。既定 false）。
                   足すと外部 API（Discord・Finnhub ほか）の TLS でも基盤の CA を信頼する。基盤の宛先（ブローカ・認可サーバー・LLM ゲートウェイ）は
                   アプリが CA の場所（PlatformInfraCa__CertificatePath）から宛先ごとに検証するので、通常は要らない。 */}}
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/platform-infra-ca"
            {{- end }}
            {{- /* NFR-18, IADR-0628: 購読する exchange の宣言の仕方（UseAiStockTradingRabbitMq が読む）。Passive のときだけ描く（既定・ローカルの描画は変えない）。 */}}
            {{- $subEx := $mq.subscribedExchanges | default "Declare" }}
            {{- if not (has $subEx (list "Declare" "Passive")) }}
            {{- fail (printf "global.rabbitmq.subscribedExchanges は Declare か Passive です（値: %v）。" $subEx) }}
            {{- end }}
            {{- if eq $subEx "Passive" }}
            - name: WOLVERINE_SUBSCRIBED_EXCHANGES
              value: "Passive"
            {{- end }}
            {{- if $infraCaMount }}
            {{- /* NFR, NFR-18, #1535, IADR-0621 決定5, IADR-0639: 基盤の宛先だけが信頼する基盤の CA の場所（LLM ゲートウェイの HttpClient・
                   認可サーバーのメタデータとトークンの取得・ブローカの amqps）。DB は接続文字列の Root Certificate で同じ CA を使う。 */}}
            - name: PlatformInfraCa__CertificatePath
              value: {{ printf "/etc/platform-infra-ca/%s" $infraCa.caKey | quote }}
            {{- end }}
            - name: Otlp__Endpoint
              value: {{ $g.otlpEndpoint | quote }}
            {{- /* ADR-0001, IADR-0077, #22: 宣言的バインディング（pipeline.json）のマウント先。
                   自己申告エンドポイント（GET /internal/introspection）が有効な段を導出する。 */}}
            - name: Pipeline__ConfigPath
              value: /etc/ai-stock-trading/pipeline.json
            {{- /* #22 受け入れ基準③: 実効構成バージョン（GitOps 注入）。空なら自己申告は null（fail-safe）。 */}}
            {{- with $g.configVersion }}
            - name: Introspection__ConfigVersion
              value: {{ . | quote }}
            {{- end }}
            {{- /* 🔴 NFR, FR-10, #1527, IADR-0610: 注文の承認の発行元の印。発行元（risk-management）と受け手（order-execution）だけに描く。
                   鍵は Secret（既定 ast-secrets の order-approval-signing-key）から読み、values に値を置かない。
                   段 1（Report・既定）は鍵が無くても起動する（optional）。段 2（Enforce）は鍵の Secret を必須にする（無ければ Pod が起動しない）。 */}}
            {{- $oas := $g.orderApprovalSigning | default dict }}
            {{- if has $name ($oas.services | default list) }}
            {{- if not (has $oas.mode (list "Report" "Enforce")) }}
            {{- fail (printf "global.orderApprovalSigning.mode は Report か Enforce です（値: %v）。" $oas.mode) }}
            {{- end }}
            - name: OrderApprovalSigning__Mode
              value: {{ $oas.mode | quote }}
            - name: OrderApprovalSigning__Key
              valueFrom:
                secretKeyRef:
                  name: {{ $oas.secretName }}
                  key: {{ $oas.secretKey }}
                  {{- if eq $oas.mode "Report" }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- /* 🔴 NFR, FR-10, IADR-0633: 統制の入力になるメッセージの発行元の署名。signers のサービスにだけ自分の秘密の鍵を、
                   verifiers の受け手にだけ確かめる発行元の公開の鍵を描く（他の発行元の秘密の鍵を持たせない）。鍵は Secret から読み、values に値を置かない。
                   段 1（Report・既定）は optional（鍵が無くても起動する）。段 2（Enforce）は必須（無ければ Pod が起動しない）。
                   legacyHmac（旧い共有の鍵の HMAC。IADR-0627）は段 1 でだけ描ける（段 2 と併用すると止める）。 */}}
            {{- $mo := $g.messageOrigin | default dict }}
            {{- $moSigns := has $name ($mo.signers | default list) }}
            {{- $moVerifies := index ($mo.verifiers | default dict) $name | default list }}
            {{- if or $moSigns $moVerifies }}
            {{- if not (has $mo.mode (list "Report" "Enforce")) }}
            {{- fail (printf "global.messageOrigin.mode は Report か Enforce です（値: %v）。" $mo.mode) }}
            {{- end }}
            {{- $moLegacy := $mo.legacyHmac | default dict }}
            {{- if and $moLegacy.enabled (eq $mo.mode "Enforce") }}
            {{- fail "global.messageOrigin.legacyHmac.enabled は段 1（Report）でだけ使えます（段 2 では旧い共有の鍵を受け手に持たせない。IADR-0633）。" }}
            {{- end }}
            {{- /* 🔴 NFR, FR-09, IADR-0638 決定 3: 受け手を新しく足すときの段の下げ（modeOverrides の <サービス>: Report）。鍵の optional は global の段のまま
                   （下げても鍵の在る無いを隠さない）。値は Report か Enforce だけ。 */}}
            {{- $moMode := index ($mo.modeOverrides | default dict) $name | default $mo.mode }}
            {{- if not (has $moMode (list "Report" "Enforce")) }}
            {{- fail (printf "global.messageOrigin.modeOverrides.%s は Report か Enforce です（値: %v）。" $name $moMode) }}
            {{- end }}
            - name: MessageOrigin__Mode
              value: {{ $moMode | quote }}
            {{- if $moSigns }}
            - name: MessageOrigin__SigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ $mo.signingSecretName }}
                  key: {{ $name }}
                  {{- if eq $mo.mode "Report" }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- range $issuer := $moVerifies }}
            {{- /* env の名前はシェルの識別子に限る（#817）。発行元の識別子の - は _ で書き、アプリが - に戻して読む。 */}}
            - name: MessageOrigin__VerifyKeys__{{ $issuer | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ $mo.verifySecretName }}
                  key: {{ $issuer }}
                  {{- if eq $mo.mode "Report" }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- /* 鍵の入れ替えの間だけ、前の公開の鍵を渡す（previousVerify に載った発行元のうち、このサービスが確かめるもの）。段に依らず optional。 */}}
            {{- range $issuer := $moVerifies }}
            {{- if has $issuer ($mo.previousVerify | default list) }}
            - name: MessageOrigin__PreviousVerifyKeys__{{ $issuer | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ $mo.previousVerifySecretName }}
                  key: {{ $issuer }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- /* 記録だけの受け手（audit）には旧い共有の鍵を渡さない（共有の鍵を持てば、その Pod から全発行元を名乗れる）。 */}}
            {{- if and $moLegacy.enabled (not (has $name ($moLegacy.skipServices | default list))) }}
            {{- $legacyKeys := $moVerifies }}
            {{- if $moSigns }}{{- $legacyKeys = append $legacyKeys $name }}{{- end }}
            {{- range $issuer := ($legacyKeys | uniq | sortAlpha) }}
            - name: MessageOrigin__Keys__{{ $issuer | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ $moLegacy.secretName }}
                  key: {{ $issuer }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* NFR-18, NFR-05, IADR-0630（基盤の MSP:IADR-0695 の受け手）: DB の資格はサービスごとに上書きできる
                   （services.<名前>.dbCredentials.usernameSecret / passwordSecret。2 つを一緒に与える）。与えなければ global.db の値（既定・ローカルは変わらない）。 */}}
            {{- $svcDbc := $svc.dbCredentials | default dict }}
            {{- if and $svcDbc (not $svc.db) }}
            {{- fail (printf "services.%s.dbCredentials は DB を持つサービス（services.%s.db）にだけ与えてください（IADR-0630）。" $name $name) }}
            {{- end }}
            {{- if and $svcDbc (or (not $svcDbc.usernameSecret) (not $svcDbc.passwordSecret)) }}
            {{- fail (printf "services.%s.dbCredentials は usernameSecret と passwordSecret を一緒に与えてください（利用者名とパスワードを別の資格から組まない。IADR-0630）。" $name) }}
            {{- end }}
            {{- if and $svcDbc (ne (toString $svcDbc.usernameSecret.name) (toString $svcDbc.passwordSecret.name)) }}
            {{- fail (printf "services.%s.dbCredentials の usernameSecret と passwordSecret は同じ Secret にしてください（1 つのサービスの資格を 1 つの Secret に置く。IADR-0630）。" $name) }}
            {{- end }}
            {{- $dbPasswordSecret := $svcDbc.passwordSecret | default $g.db.passwordSecret }}
            {{- $dbUsernameSecret := $svcDbc.usernameSecret | default $g.db.usernameSecret }}
            {{- if $svc.db }}
            # ADR-0001(DB per service): 共有 Postgres 上の専有 DB（user=ai, MSP infra init が作成）。
            {{- with $dbPasswordSecret }}
            {{- /* NFR, ADR-0006, #1525, IADR-0608 決定3: パスワードは Secret から読み、接続文字列は env の参照で組む（値をチャートに書かない）。
                   与えないとき（既定・経路 B）は従来どおり global.db.password を描く。 */}}
            {{- /* NFR-05, #1560, IADR-0623 決定 2: 利用者名も Secret から読める（クラウドの利用者名は基盤が乱数の接尾辞つきで作る）。 */}}
            {{- $dbUser := $g.db.username }}
            {{- with $dbUsernameSecret }}
            {{- $dbUser = "$(DB_USERNAME)" }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.db.usernameSecret.name が要ります（IADR-0623）" .name | quote }}
                  key: {{ required "global.db.usernameSecret.key が要ります（IADR-0623）" .key | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.db.passwordSecret.name が要ります（IADR-0608）" .name | quote }}
                  key: {{ required "global.db.passwordSecret.key が要ります（IADR-0608）" .key | quote }}
            - name: ConnectionStrings__DefaultConnection
              value: "Host={{ $g.db.host }};Port={{ $g.db.port }};Database={{ $svc.db }};Username={{ $dbUser }};Password=$(DB_PASSWORD){{ if $dbTls }};SSL Mode=VerifyFull;Root Certificate=/etc/platform-infra-ca/{{ $infraCa.caKey }}{{ end }}"
            {{- else }}
            - name: ConnectionStrings__DefaultConnection
              {{- /* NFR, NFR-18, #1535, IADR-0621 決定2: TLS は VerifyFull（CA の検証と host の名前の照合）。CA は global.infraCa だけを信頼する。
                     検証を緩める値（Require・Prefer・Trust Server Certificate）を与える口は持たない。 */}}
              value: "Host={{ $g.db.host }};Port={{ $g.db.port }};Database={{ $svc.db }};Username={{ $g.db.username }};Password={{ $g.db.password }}{{ if $dbTls }};SSL Mode=VerifyFull;Root Certificate=/etc/platform-infra-ca/{{ $infraCa.caKey }}{{ end }}"
            {{- end }}
            {{- end }}
            {{- if $svc.auth }}
            - name: Auth__Authority
              value: {{ $g.authAuthority | quote }}
            {{- if $authTls }}
            {{- /* NFR, IADR-0629: https でない Authority をアプリが起動で拒む（AuthExtensions.ResolveRequireHttpsMetadata）。 */}}
            - name: Auth__RequireHttpsMetadata
              value: "true"
            {{- end }}
            {{- with $g.authValidIssuers }}
            {{- /* NFR, IADR-0629: 移行の間だけ受ける旧の発行元（既定は空＝描かない）。外す時期は手順書 cloud-keycloak-tls-runbook の段 6。 */}}
            - name: Auth__ValidIssuers
              value: {{ . | quote }}
            {{- end }}
            {{- /* 🔴 NFR, #1529, IADR-0612: Production では単体実行向けのレルム（ai-stock-trading）を指す Authority で起動しない。
                   意図して使うときだけ global.allowStandaloneRealm=true で明示する（既定 false＝描かない）。 */}}
            {{- if $g.allowStandaloneRealm }}
            - name: Auth__AllowStandaloneRealm
              value: "true"
            {{- end }}
            {{- end }}
            {{- /* #736, IADR-0324: s2s 発信者（extraEnv に ServiceAuth__ClientId を持つ）へ token エンドポイントを
                   global.authAuthority から導出して注入する。auth:true なら ServiceAuthExtensions が Auth:Authority
                   から同じ値を導くが、auth:true でない発信者（trade-decision）はコード既定の AST レルムに倒れ、
                   MSP レルムへ寄せた受け手（report / market-monitor）で issuer 不一致 → 401 になる。
                   cronjob.yaml の TOKEN_ENDPOINT（#456）・Notifications OwnerAuth（#226）と同じ導出。 */}}
            {{- $hasServiceAuth := false }}
            {{- range $e := $svc.extraEnv }}{{- if eq $e.name "ServiceAuth__ClientId" }}{{- $hasServiceAuth = true }}{{- end }}{{- end }}
            {{- if $hasServiceAuth }}
            - name: ServiceAuth__TokenEndpoint
              value: {{ printf "%s/protocol/openid-connect/token" (trimSuffix "/" $g.authAuthority) | quote }}
            {{- end }}
            {{- if $svc.auth }}
            {{- /* 🔴 NFR, FR-10, #1528, IADR-0611: REST の所有者の判定で aud / azp を確かめる段（Report＝記録だけ・Enforce＝拒否）。 */}}
            {{- $otb := $g.ownerTokenBinding | default dict }}
            {{- if not (has ($otb.mode | default "Report") (list "Report" "Enforce")) }}
            {{- fail (printf "global.ownerTokenBinding.mode は Report か Enforce です（値: %v）。" $otb.mode) }}
            {{- end }}
            - name: Auth__OwnerToken__Mode
              value: {{ $otb.mode | default "Report" | quote }}
            {{- /* 🔴 NFR, FR-10, IADR-0638 決定 4: 所有者のトークンの発行先のクライアント（azp）の許可集合を明示する（空＝描かない＝コードの既定）。
                   クラウドは Discord ボットのクライアントだけ（コードの既定に残る中継のクライアント名を、基盤の realm に足されても通さない）。 */}}
            {{- range $i, $c := ($otb.clients | default list) }}
            {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]*$" $c) }}
            {{- fail (printf "global.ownerTokenBinding.clients の値がクライアントの名前の形ではありません（%v）。" $c) }}
            {{- end }}
            - name: {{ printf "Auth__OwnerToken__Clients__%d" $i }}
              value: {{ $c | quote }}
            {{- end }}
            {{- /* 🔴 NFR-06, #1554, IADR-0622: ボットの許可表の段（Report＝許可表の外を記録だけ・Enforce＝拒否）。aud / azp の段とは別。 */}}
            {{- $obs := $g.ownerBotScope | default dict }}
            {{- if not (has ($obs.mode | default "Report") (list "Report" "Enforce")) }}
            {{- fail (printf "global.ownerBotScope.mode は Report か Enforce です（値: %v）。" $obs.mode) }}
            {{- end }}
            - name: Auth__OwnerBot__Mode
              value: {{ $obs.mode | default "Report" | quote }}
            {{- /* 🔴 NFR, NFR-05, IADR-0637: サービスのトークンの身元（azp）と宛先（aud）を確かめ、口ごとに呼び手を限る段。
                   空（既定）は描かない＝コードの既定 Off（従前どおり）。legacyClients は移行の段だけ受ける旧の共有クライアント。 */}}
            {{- $stb := $g.serviceTokenBinding | default dict }}
            {{- with $stb.mode }}
            {{- if not (has . (list "Off" "Report" "Enforce")) }}
            {{- fail (printf "global.serviceTokenBinding.mode は Off・Report・Enforce のどれかです（値: %v。IADR-0637）。" .) }}
            {{- end }}
            - name: Auth__ServiceToken__Mode
              value: {{ . | quote }}
            {{- end }}
            {{- range $i, $c := ($stb.legacyClients | default list) }}
            - name: {{ printf "Auth__ServiceToken__LegacyClients__%d" $i }}
              value: {{ $c | quote }}
            {{- end }}
            {{- end }}
            {{- range $e := $svc.extraEnv }}
            - name: {{ $e.name }}
              {{- $refKey := index $envSecretRefs $e.name }}
              {{- if $refKey }}
              {{- /* #795, IADR-0341: ESO 所有では Discord ID を ast-secrets の契約キーから読む（上の $envSecretRefs）。 */}}
              valueFrom:
                secretKeyRef:
                  name: {{ $es.appSecrets.targetName }}
                  key: {{ $refKey }}
                  optional: true
              {{- else if $e.secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ $e.secretKeyRef.name }}
                  key: {{ $e.secretKeyRef.key }}
                  {{- if $e.secretKeyRef.optional }}
                  optional: true
                  {{- end }}
              {{- else }}
              {{- /* #245, IADR-0102: 上記 $envOverrides に同名の非空値があればそれを使う（無ければ values の値）。 */}}
              value: {{ index $envOverrides $e.name | default $e.value | quote }}
              {{- end }}
            {{- end }}
            {{- /* NFR, IADR-0284 決定 5（段 1〜5）, IADR-0489, IADR-0559（#1391: 発注執行を足した）, #753: east-west gRPC の呼び出し側の宣言（`<提供側>__Grpc`）。
                   services.<name>.grpcClients.<提供側> を true にしたときだけ描く。宛先は**呼び先の grpcPort から導出する**
                   （http://<呼び先>-service:<grpcPort>）。未宣言・false・null は何も描かない＝既定描画・values-local 描画は追加前とバイト等価。
                   🔴 extraEnv（配列）へ足させないのは、2 つ目の values や --set で配列を重ねると**配列ごと置き換わり**、
                      既存の env（ServiceAuth__* など）が黙って消えるためである（マップのキーは深くマージされる）。
                   🔴 呼び先の grpcPort が無い・未知の提供側・extraEnv と同名の二重定義は描画時に止める
                      （片方だけの宣言は「切り替えたつもりで常に安全側既定へ倒れる」を作る）。
                   提供側の名前は各サービスの輸送が読む構成キー（`<提供側>:Grpc`）の節名と同じ。基盤の LlmGateway（chart の外）は対象外。 */}}
            {{- $grpcCallees := dict "Configuration" "configuration" "RiskManagement" "risk-management" "Audit" "audit" "Reports" "report" "MarketMonitor" "market-monitor" "CostControl" "cost-control" "OrderExecution" "order-execution" }}
            {{- $extraEnvNames := dict }}
            {{- range $e := $svc.extraEnv }}{{- $_ := set $extraEnvNames $e.name true }}{{- end }}
            {{- range $provider, $on := ($svc.grpcClients | default dict) }}
            {{- if not (or (kindIs "invalid" $on) (kindIs "bool" $on)) }}
            {{- fail (printf "services.%s.grpcClients.%s は true / false で指定してください（実際の値: %v）。" $name $provider $on) }}
            {{- end }}
            {{- if $on }}
            {{- $callee := index $grpcCallees $provider }}
            {{- if not $callee }}
            {{- fail (printf "services.%s.grpcClients.%s は未知の提供側です（既知: %s）。" $name $provider (keys $grpcCallees | sortAlpha | join ", ")) }}
            {{- end }}
            {{- $calleeSvc := index $.Values.services $callee | default dict }}
            {{- if not $calleeSvc.grpcPort }}
            {{- fail (printf "services.%s.grpcClients.%s=true には呼び先 services.%s.grpcPort の宣言が要ります（片方だけでは gRPC の面が開かず、常に安全側既定へ倒れます）。" $name $provider $callee) }}
            {{- end }}
            {{- $envName := printf "%s__Grpc" $provider }}
            {{- if hasKey $extraEnvNames $envName }}
            {{- fail (printf "services.%s は extraEnv の %s と grpcClients.%s を併用できません（同名 env の二重定義）。grpcClients に一本化してください。" $name $envName $provider) }}
            {{- end }}
            - name: {{ $envName }}
              value: {{ printf "http://%s-service:%v" $callee $calleeSvc.grpcPort | quote }}
            {{- end }}
            {{- end }}
            {{- /* #226, IADR-0098: Discord Bot 制御コマンドの owner トークンの token エンドポイント。
                   notification は auth:true を持たず Auth__Authority が注入されないため、ここで
                   global.authAuthority から算出して注入する。空だと OwnerAuth.IsEnabled が false に倒れ 401。
                   values にリテラルを置くと authAuthority を --set で変えても追随しないため、テンプレート側で
                   Auth__Authority と同一ソース（$g.authAuthority）から導出する。 */}}
            {{- if eq $name "notification" }}
            - name: Notifications__Discord__OwnerAuth__TokenEndpoint
              value: {{ printf "%s/protocol/openid-connect/token" (trimSuffix "/" $g.authAuthority) | quote }}
            {{- end }}
            {{- /* #121: CronJob スケジューラ有効時、情報収集は External（in-process 巡回を停止し run-once 起動）へ切替える。
                   これを入れないと in-process ポーリングと CronJob が二重起動する。既定（cronjob 無効）は InProcess。 */}}
            {{- if and (eq $name "information-collection") $.Values.tradingCycle.cronjob.enabled }}
            - name: Collection__Trigger
              value: "External"
            {{- end }}
            {{- if $stage0Persist }}
            {{- /* #1342, IADR-0537: 記録器の状態の置き場（完了の印・途中の記録・費用の累計・ロック）。永続ボリュームの下。 */}}
            - name: Stage0Recording__StateDirectory
              value: {{ printf "%s/state" (trimSuffix "/" $s0.mountPath) | quote }}
            {{- end }}
            {{- /* #13, IADR-0111: 発注先。既定 paper（fail-safe・実弾なし）。broker.tier=moomoo-sim で OpenD 経由
                   SIMULATE 発注へ。cross-network trade は RSA 必須のため RsaPrivateKeyPath（マウント鍵）を注入する。 */}}
            {{- if eq $name "order-execution" }}
            - name: Broker__Provider
              value: {{ $broker.provider | quote }}
            {{- /* IADR-0111: 取引環境。アプリ既定と同じ sim の paper 階層では注入しない
                   ＝既定描画（本番 values.yaml）は本設定点の追加前とバイト等価。 */}}
            {{- if ne $broker.provider "paper" }}
            - name: Broker__Environment
              value: {{ $broker.environment | quote }}
            {{- end }}
            {{- if eq $broker.provider "moomoo" }}
            {{- /* #132, IADR-0060: 誤配備は描画時に止める。host / RSA 鍵を欠いた moomoo 有効化は
                   「接続はするが trade だけ落ちる」形になりやすい（起動時 preflight でも落ちる）。 */}}
            {{- if not $.Values.moomoo.opend.host }}
            {{- fail "broker.tier=moomoo-sim には moomoo.opend.host（常駐 OpenD のホスト。in-cluster では Service 名 'opend'）が要ります。" }}
            {{- end }}
            {{- if not $.Values.moomoo.opend.rsaSecretName }}
            {{- fail "broker.tier=moomoo-sim には moomoo.opend.rsaSecretName（OpenD と同一の RSA 鍵 Secret）が要ります。cross-network の trade 接続には暗号化が必須（#13）。" }}
            {{- end }}
            - name: Broker__Moomoo__OpenD__Host
              value: {{ $.Values.moomoo.opend.host | quote }}
            - name: Broker__Moomoo__OpenD__Port
              value: {{ $.Values.moomoo.opend.port | quote }}
            - name: Broker__Moomoo__OpenD__RsaPrivateKeyPath
              value: {{ printf "%s/%s" $.Values.moomoo.opend.rsaMountPath $.Values.moomoo.opend.rsaSecretKey | quote }}
            {{- /* #842: 以下の moomoo 調整値は「空（""）・未設定（null）＝アダプタ既定＝env を注入しない」。
                   `with` は数値の 0（や false）を空と同じに扱い、既定へ黙って倒していた（`--set …=0` で env 0 件を実測）。
                   0 を含むそれ以外は値として注入し、検証はアプリの起動時に任せる（範囲外・未知の値は停止）。 */}}
            {{- /* #132: OpenD 応答待ち（秒）。空=アダプタ既定（15 秒）。 */}}
            {{- $replyTimeout := $.Values.moomoo.opend.replyTimeoutSeconds }}
            {{- if not (or (kindIs "invalid" $replyTimeout) (eq (toString $replyTimeout) "")) }}
            - name: Broker__Moomoo__OpenD__ReplyTimeoutSeconds
              value: {{ $replyTimeout | quote }}
            {{- end }}
            {{- /* #821: S3（代替注文種別）の設定。空=アダプタ既定（stoplimit / 1%）。 */}}
            {{- $altStopType := $.Values.moomoo.alternativeStopOrderType }}
            {{- if not (or (kindIs "invalid" $altStopType) (eq (toString $altStopType) "")) }}
            - name: Broker__Moomoo__AlternativeStopOrderType
              value: {{ $altStopType | quote }}
            {{- end }}
            {{- $stopLimitOffset := $.Values.moomoo.stopLimitOffsetRatio }}
            {{- if not (or (kindIs "invalid" $stopLimitOffset) (eq (toString $stopLimitOffset) "")) }}
            - name: Broker__Moomoo__StopLimitOffsetRatio
              value: {{ $stopLimitOffset | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- /* NFR, IADR-0468, #1137: 値は values.yaml の probes.readiness が単一情報源。timeoutSeconds は
                 アプリの DB 疎通チェックの打ち切り（3 秒）より厳密に長く保つ（未指定＝既定 1 秒が先に切っていた）。 */}}
          {{- $ready := $.Values.probes.readiness }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: {{ $ready.initialDelaySeconds }}
            periodSeconds: {{ $ready.periodSeconds }}
            timeoutSeconds: {{ $ready.timeoutSeconds }}
            failureThreshold: {{ $ready.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            {{- /* ADR-0001, IADR-0077, #22: 宣言的バインディング（pipeline.json）を read-only でマウント。全 Worker 共通。 */}}
            - name: pipeline-config
              mountPath: /etc/ai-stock-trading
              readOnly: true
            {{- /* #13: OpenD 暗号化通信用 RSA 秘密鍵（moomoo-rsa Secret）を read-only でマウント。 */}}
            {{- if and (eq $name "order-execution") (eq $broker.provider "moomoo") }}
            - name: moomoo-rsa
              mountPath: {{ $.Values.moomoo.opend.rsaMountPath }}
              readOnly: true
            {{- end }}
            {{- if $stage0Persist }}
            {{- /* #1342, IADR-0537: Stage 0 の記録の書き出し先と実行の状態（PVC trade-decision-stage0）。 */}}
            - name: stage0-recording
              mountPath: {{ $s0.mountPath }}
            {{- end }}
            {{- if $readOnlyRoot }}
            {{- /* NFR, IADR-0609: ルートを読み取り専用にしたときの一時ファイルの置き場（.NET の一時ファイル・診断の IPC）。 */}}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if $infraCaMount }}
            {{- /* NFR, NFR-18, #1535, IADR-0621: 基盤の CA（公開してよい証明書だけ）。 */}}
            - name: platform-infra-ca
              mountPath: /etc/platform-infra-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- /* ADR-0001, IADR-0077, #22: 宣言的バインディングの ConfigMap（configmap-pipeline.yaml）。全 Worker 共通。 */}}
        - name: pipeline-config
          configMap:
            name: {{ $.Values.namespace.name }}-pipeline
        {{- if and (eq $name "order-execution") (eq $broker.provider "moomoo") }}
        - name: moomoo-rsa
          secret:
            secretName: {{ $.Values.moomoo.opend.rsaSecretName }}
            {{- /* #132, IADR-0060 決定 3: 秘密鍵は所有者のみ読取（0400=10 進 256）。
                   ⚠️ 本コンテナの実行 uid と一致していること（podSecurity.stage が 1・2 の Worker は root で動く）。
                   NFR, IADR-0609: podSecurity.stage=3（非 root）では fsGroup ＋ 0440（10 進 288）を描く。 */}}
            defaultMode: {{ include "ast.podSecurity.secretMode" (dict "root" $ "mode" $.Values.moomoo.opend.rsaSecretDefaultMode) }}
            items:
              - key: {{ $.Values.moomoo.opend.rsaSecretKey }}
                path: {{ $.Values.moomoo.opend.rsaSecretKey }}
      {{- end }}
      {{- if $stage0Persist }}
        - name: stage0-recording
          persistentVolumeClaim:
            claimName: trade-decision-stage0
      {{- end }}
      {{- if $infraCaMount }}
        {{- /* NFR, NFR-18, #1535, IADR-0621: 非 optional（ConfigMap が無ければ Pod が立たない＝平文へ戻らない）。 */}}
        - name: platform-infra-ca
          {{- if $infraCa.secretName }}
          secret:
            secretName: {{ $infraCa.secretName }}
          {{- else }}
          configMap:
            name: {{ $infraCa.configMap }}
          {{- end }}
            items:
              - key: {{ $infraCa.caKey }}
                path: {{ $infraCa.caKey }}
      {{- end }}
      {{- if $readOnlyRoot }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $.Values.podSecurity.tmpSizeLimit | quote }}
      {{- end }}
{{- end }}
