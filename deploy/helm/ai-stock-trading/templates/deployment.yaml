{{- /* #122: 10 Worker を同型の Deployment としてレンダリングする（全て Web SDK :8080）。 */ -}}
{{- $g := .Values.global -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: {{ $name }}-service
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      containers:
        - name: {{ $name }}-service
          image: "{{ $g.image.registry }}/{{ $svc.image }}:{{ $svc.tag | default $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: RabbitMq__ConnectionString
              value: {{ $g.rabbitmqConnectionString | quote }}
            - name: Otlp__Endpoint
              value: {{ $g.otlpEndpoint | quote }}
            {{- if $svc.db }}
            # ADR-0001(DB per service): 共有 Postgres 上の専有 DB（user=ai, MSP infra init が作成）。
            - name: ConnectionStrings__DefaultConnection
              value: "Host={{ $g.db.host }};Port={{ $g.db.port }};Database={{ $svc.db }};Username={{ $g.db.username }};Password={{ $g.db.password }}"
            {{- end }}
            {{- if $svc.auth }}
            - name: Auth__Authority
              value: {{ $g.authAuthority | quote }}
            {{- end }}
            {{- range $e := $svc.extraEnv }}
            - name: {{ $e.name }}
              {{- if $e.secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ $e.secretKeyRef.name }}
                  key: {{ $e.secretKeyRef.key }}
                  {{- if $e.secretKeyRef.optional }}
                  optional: true
                  {{- end }}
              {{- else }}
              value: {{ $e.value | quote }}
              {{- end }}
            {{- end }}
            {{- /* #121: CronJob スケジューラ有効時、情報収集は External（in-process 巡回を停止し run-once 起動）へ切替える。
                   これを入れないと in-process ポーリングと CronJob が二重起動する。既定（cronjob 無効）は InProcess。 */}}
            {{- if and (eq $name "information-collection") $.Values.tradingCycle.cronjob.enabled }}
            - name: Collection__Trigger
              value: "External"
            {{- end }}
            {{- /* #13: 発注先。既定 paper（fail-safe・実弾なし）。moomoo.enabled で OpenD 経由 SIMULATE 発注へ。
                   cross-network trade は RSA 必須のため RsaPrivateKeyPath（マウント鍵）を注入する。 */}}
            {{- if eq $name "order-execution" }}
            - name: Broker__Provider
              value: {{ ternary "moomoo" "paper" $.Values.moomoo.enabled | quote }}
            {{- if $.Values.moomoo.enabled }}
            {{- /* #132, IADR-0061: 誤配備は描画時に止める。host / RSA 鍵を欠いた moomoo 有効化は
                   「接続はするが trade だけ落ちる」形になりやすい（起動時 preflight でも落ちる）。 */}}
            {{- if not $.Values.moomoo.opend.host }}
            {{- fail "moomoo.enabled=true には moomoo.opend.host（常駐 OpenD のホスト。in-cluster では Service 名 'opend'）が要ります。" }}
            {{- end }}
            {{- if not $.Values.moomoo.opend.rsaSecretName }}
            {{- fail "moomoo.enabled=true には moomoo.opend.rsaSecretName（OpenD と同一の RSA 鍵 Secret）が要ります。cross-network の trade 接続には暗号化が必須（#13）。" }}
            {{- end }}
            - name: Broker__Moomoo__OpenD__Host
              value: {{ $.Values.moomoo.opend.host | quote }}
            - name: Broker__Moomoo__OpenD__Port
              value: {{ $.Values.moomoo.opend.port | quote }}
            - name: Broker__Moomoo__OpenD__RsaPrivateKeyPath
              value: {{ printf "%s/%s" $.Values.moomoo.opend.rsaMountPath $.Values.moomoo.opend.rsaSecretKey | quote }}
            {{- /* #132: OpenD 応答待ち（秒）。空=アダプタ既定（15 秒）＝env を注入しない。 */}}
            {{- with $.Values.moomoo.opend.replyTimeoutSeconds }}
            - name: Broker__Moomoo__OpenD__ReplyTimeoutSeconds
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- /* #13: OpenD 暗号化通信用 RSA 秘密鍵（moomoo-rsa Secret）を read-only でマウント。 */}}
          {{- if and (eq $name "order-execution") $.Values.moomoo.enabled }}
          volumeMounts:
            - name: moomoo-rsa
              mountPath: {{ $.Values.moomoo.opend.rsaMountPath }}
              readOnly: true
          {{- end }}
      {{- if and (eq $name "order-execution") $.Values.moomoo.enabled }}
      volumes:
        - name: moomoo-rsa
          secret:
            secretName: {{ $.Values.moomoo.opend.rsaSecretName }}
            {{- /* #132, IADR-0061 決定 3: 秘密鍵は所有者のみ読取（0400=10 進 256）。
                   ⚠️ 本コンテナの実行 uid と一致していること（現行の Worker イメージは root 実行）。
                   非 root 実行へ移す場合は fsGroup ＋ 0440 が要る（chart README 参照）。 */}}
            defaultMode: {{ $.Values.moomoo.opend.rsaSecretDefaultMode }}
            items:
              - key: {{ $.Values.moomoo.opend.rsaSecretKey }}
                path: {{ $.Values.moomoo.opend.rsaSecretKey }}
      {{- end }}
{{- end }}
