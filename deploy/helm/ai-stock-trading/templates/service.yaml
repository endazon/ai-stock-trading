{{- /* #122: 各 Worker の ClusterIP Service（:8080）。サービス間同期照会・CronJob トリガ・
       BFF/introspection の到達点。ホストへは公開しない（port-forward で個別到達）。 */ -}}
{{- /* NFR, NFR-05, IADR-0646: TLS の段（global.serviceTls.mode）。Off は従来どおり 8080 だけ（既定の描画は不変）。 */ -}}
{{- $svcTlsMode := include "ast.serviceTls.mode" . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: {{ $name }}-service
spec:
  selector:
    app: {{ $name }}-service
  ports:
    {{- if ne $svcTlsMode "Off" }}
    {{- if ne $svcTlsMode "Enforce" }}
    - port: 8080
      targetPort: 8080
      name: http
      appProtocol: http
    {{- end }}
    {{- /* NFR, NFR-05, IADR-0646: TLS の受け口（Listen・Call は平文の 8080 と併存。Enforce はこれだけ）。 */}}
    - port: {{ $.Values.global.serviceTls.port }}
      targetPort: {{ $.Values.global.serviceTls.port }}
      name: https
      appProtocol: https
    {{- else }}
    - port: 8080
      targetPort: 8080
    {{- if $svc.grpcPort }}
      {{- /* NFR, IADR-0284 決定5（段0）, IADR-0328, #584: 複数ポートになるので名前を付ける
             （grpcPort 未宣言のサービスは追加前とバイト等価）。 */}}
      name: http
      appProtocol: http
    {{- /* NFR, MSP:ADR-0029 / MSP:ADR-0075, IADR-0328, #584: east-west gRPC（h2c）。
           appProtocol: grpc でサイドカーのプロトコル推定に頼らない。mTLS はサイドカーが終端する。 */}}
    - port: {{ $svc.grpcPort }}
      targetPort: {{ $svc.grpcPort }}
      name: grpc
      appProtocol: grpc
    {{- end }}
    {{- end }}
{{- end }}
