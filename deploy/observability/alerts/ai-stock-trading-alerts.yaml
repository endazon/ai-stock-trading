# AST アラートルール（#891 / IADR-0374）
#
# 🔴 **本リポジトリで最初のアラートルールである。** これまで deploy/observability/ には
# ダッシュボードしか無く、**人が見ているときにしか働かなかった**。
#
# 置き場所・種別・命名・重大度の規約は IADR-0374 決定 4 が定める（前例がゼロ件だったため本件で決めた）。
#   - 種別: monitoring.coreos.com/v1 の PrometheusRule（kube-prometheus-stack が拾う形）
#   - group 名: ai-stock-trading.<領域>
#   - alert 名: PascalCase の英語（Prometheus のアラート名は識別子であり日本語を入れない）
#   - severity: warning から始める（実測が無いまま critical を置くと最初の 1 件で狼少年になる）
#   - summary / description は日本語。runbook_url は置かない（対応手順がまだ 1 件も無い）
#
# 🔴 **実 stand-up は MSP 側の共有 overlay である**（ダッシュボードと同じ扱い）。本リポジトリは
# 資産を置くところまでを持ち、Prometheus / Alertmanager 自体はここでは立てない。
# 投入手順は ../README.md を参照。
#
# 🔴 **系列名はコード側のレジストリ（BusinessMetricNames）と一致していなければならない。**
# ずれたアラートはエラーを出さず、**ただ永久に鳴らない**（空のグラフと同じ失敗の形である）。
# node scripts/check-observability-assets.js が CI で本ファイルの expr を突き合わせる。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-stock-trading-alerts
  labels:
    app.kubernetes.io/name: ai-stock-trading
    app.kubernetes.io/component: observability
    # kube-prometheus-stack の ruleSelector が拾うためのラベル（MSP 側 overlay の既定に合わせる）。
    release: kube-prometheus-stack
spec:
  groups:
    - name: ai-stock-trading.trade-cycle
      rules:
        # 🔴 保有状況の照会が壊れていると、**新規建てだけが静かに止まり続ける**。
        # 手仕舞いは通るため「取引が全部止まった」形にはならず、WARN ログを読みに行かない限り誰も気付かない
        # （#891 の起点そのもの）。原因は RiskManagement:BaseUrl の誤設定や
        # GET /risk-controls/open-positions の恒久的な失敗である。
        #
        # 🔴 **この閾値は実測を要しない。** HoldingsUnknownOpen は照会先が実結線のときにしか立たず
        # （未結線の既定構成では IHeldPositionProvider.IsEnabled が false でこの見送りは発生しない）、
        # **平常時の期待値が 0 件**だからである。「N 分間に M 件」という実測が要る形の閾値ではない。
        # for: 30m は一過性の照会失敗（再試行で回復するもの）を鳴らさないための猶予であり、
        # 30 分続くのは「恒久的に新規建てが止まっている」側の事象である。
        #
        # #934 / IADR-0390 決定5: 未約定の新規建て注文（GET /risk-controls/working-entry-orders）が不明なときの
        # 見送り WorkingEntriesUnknownOpen も同じ形（実結線でしか立たず平常時 0 件・手仕舞いは通る）のため、同じルールで見る。
        - alert: AstEntriesBlockedByUnknownHoldings
          expr: sum(increase(ast_trade_cycle_decision_skips_total{reason=~"HoldingsUnknownOpen|WorkingEntriesUnknownOpen"}[15m])) > 0
          for: 30m
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 保有状況が不明なため新規建てが 30 分以上見送られ続けている
            description: >-
              取引判断が「保有状況の照会先は結線済みだが保有が不明」を理由に新規建てを見送り続けている。
              手仕舞いは通るため取引が完全に止まる形にはならず、気付きにくい。
              最初に見る場所: 取引判断サービスの WARN ログ（「保有状況が不明なため新規建てを見送る」／
              「未約定の新規建て注文が不明なため新規建てを見送る」）と、リスク管理サービスの
              GET /risk-controls/open-positions ・ GET /risk-controls/working-entry-orders の応答。
              設定では RiskManagement:BaseUrl を疑う。

    - name: ai-stock-trading.stop-loss
      rules:
        # 🔴 #957 / IADR-0399: 市場監視がリスク管理の保有照会（GET /risk-controls/open-positions）の応答を
        # **行ごとに**読み、そのまま損切り判定へ渡せなかった行（識別項目の欠落・損切りラインの欠落・本文が読めない）。
        # 巡回そのものは止めない（他の行の評価は続く）ため、Critical ログを読みに行かない限り見えない。
        #
        # 🔴 **この閾値も実測を要しない。** 送り手は識別項目と損切りラインを常に載せる（送り手の応答型は非 nullable で、ラインの記録が無ければ
        # 送り手自身が近似する）ため、**平常時の期待値が 0 件**である。出ているのは送り手と受け手の契約の
        # 食い違い（片方だけ先に配備した等）か送り手の値の異常の印であり、一過性の事象ではないので for は置かない。
        # 重大度は規約（IADR-0374 決定4: 実測なしに critical を置かない）に従い warning から始める。
        - alert: AstStopLossPositionRowsDegraded
          expr: sum(increase(ast_market_monitor_position_rows_degraded_total[15m])) > 0
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 市場監視が保有照会の応答の一部の行をそのまま損切り判定へ渡せていない
            description: >-
              市場監視が GET /risk-controls/open-positions の応答に、識別項目（銘柄・市場・方向・数量）や損切りラインの
              欠けた行、または一覧として読めない本文を受け取っている。identity-missing / stop-line-unknown の行の建玉は
              損切り（S1）の到達を検知していない。stop-line-approximated の行は平均取得単価から見積もった近似のラインで
              評価している。最初に見る場所: 市場監視サービスの CRITICAL ログ（「保有照会（GET /risk-controls/open-positions）の
              応答に、そのまま損切り判定へ渡せない行があります」）の内訳と、リスク管理サービス・市場監視サービスの
              配備中のイメージの版（片方だけ先に入れ替えていないか）。

    - name: ai-stock-trading.order-execution
      rules:
        # 🔴 #942 / IADR-0395: 乖離の取り込み（利用者が承認した PositionDriftAdopted）に保護を追随させる直前の
        # 建玉照会が不明・失敗のまま、再試行（2s/10s/30s）を使い切った。メッセージは
        # ai-stock-trading.order-execution-service.PositionDriftAdopted_error に残り、**取り込みで消えたはずの建玉の
        # 売りの逆指値がブローカーに残る**（建玉が本当に無ければ、発火で意図しないショートが建つ）。
        # それまで見えたのは Critical ログと _error キューの滞留だけで、Discord にも何も届かなかった。
        #
        # 🔴 **この閾値は実測を要しない。** 数えるのは「最後の配送」の打ち切りだけであり（途中の配送は数えない＝
        # 再試行で回復した一過性の照会失敗では増えない）、**平常時の期待値は 0 件**である。
        # 系列は発注執行の起動完了時に 0 で作られる（最初の打ち切りを increase() が取りこぼさないため）。
        # 取引時間に依らない（利用者の承認で起きる事象であり、市場の開閉で 0 へ戻る型の式ではない）。
        # 系列が無い（サービス停止・送出の断）ときは sum() が空になり**鳴らない**（無データを異常とは読まない）。
        #
        # for: 1m は一過性を待つ猶予ではない（事象は既に終端＝再試行を使い切った後である）。評価 1 回の揺れで
        # 発火させないための最小値であり、15 分窓より十分短いので 1 件の打ち切りでも必ず発火する。
        # 🔴 **解消（resolved）は「_error が空になった」を意味しない。** 1 件の打ち切りは 15 分窓を抜けると解消に
        # なるが、メッセージは再投入するまで _error に残る。対応手順は運用仕様書の障害対応表の該当行。
        - alert: AstDriftAdoptionFollowUpAbandoned
          expr: sum(increase(ast_order_drift_adoption_followup_abandoned_total[15m])) > 0
          for: 1m
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 乖離の取り込みの追随が建玉照会の不明で打ち切られ、保護逆指値がブローカーに残っている
            description: >-
              利用者が承認した乖離の取り込みに保護を追随させる直前の建玉照会が、不明または失敗のまま再試行を使い切った。
              メッセージは発注執行の PositionDriftAdopted_error キューに残り、保護記録もブローカー側の保護逆指値も取り込み前のまま。
              建玉が本当に無いなら、残った売りの逆指値が発火して意図しないショートが建ち得る。
              最初に見る場所: 証券会社の画面の建玉と未約定の逆指値、発注執行サービスの Critical ログ
              （「再試行を使い切ったため、このメッセージは _error キューへ送られます」。取り込み ID・銘柄が載る）。
              照会（OpenD）の回復を確かめてから _error のメッセージを元のキューへ戻す（再投入は何度でも安全）。
              reason ラベルで照会が不明（positions-unknown）か例外（positions-query-failed）かを読み分けられる。

        # 🔴 NFR, FR-05, FR-10, #1442, IADR-0573 決定3: **約定が台帳へ届かないまま残っている。**
        # 約定追跡は記録を更新した約定に「発行待ち」の印を立て、発行の後に倒す。巡回の末尾で印が残った件数を計器に出す。
        # 印が残る約定はリスク管理の台帳（建玉数・日次実現損益）と S1 の評価対象がまだ知らない——建ての約定なら保護の評価に載らない建玉、
        # 決済の約定なら建玉数の過大（新規建てが止まる側）になる。
        #
        # 🔴 **この閾値は実測を要しない。** 平常は巡回の末尾で 0 である（発行は同じ巡回の中で済む。再発行が 1 回で通れば次の巡回で 0 へ戻る）。
        # for: 10m は、巡回（既定 30 秒）で約 20 回、再発行が続けて失敗したことを意味する（耐久アウトボックスへの書き込みの失敗が続いている）。
        # 系列が無い（約定追跡が無効・paper の構成・送出の断）ときは max() が空になり**鳴らない**。
        - alert: AstOrderExecutedPublishPending
          expr: max(ast_order_executed_publish_pending) > 0
          for: 10m
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 発行し終えていない約定が残り、リスク管理の台帳へ届いていない
            description: >-
              約定追跡が記録した約定の OrderExecuted を、10 分以上発行し終えられていない（再発行が失敗し続けている）。
              台帳の建玉・日次実現損益と S1 の評価対象がその約定を知らない。
              最初に見る場所: 発注執行のログの WRN「発行し終えていなかった約定の再発行に失敗しました」（DecisionId・OrderId が載る）と、
              order_execution_svc の executed_orders で "OrderExecutedPublishPending" が true の行、wolverine スキーマの表（DB の書き込みの失敗を疑う）。
              証券会社の画面で該当の建玉を確かめる。対応手順は運用仕様書「発注執行の送信は保存してから送る」。
        # 🔴 NFR, FR-10, IADR-0627 決定 4: 統制の入力になるメッセージの発行元を、受け手が段 2 で拒んだ。
        # 🔴 **この閾値は実測を要しない。** 正規の発行元は必ず印を付けるので、平常は 0 件である。
        # 1 件でも出れば、鍵の配り漏れ（reason=missing / unverifiable）か、ブローカへ書ける主体による偽装・改竄・再送を疑う。
        # for は置かない（1 件で知らせる。拒んだメッセージは処理されないので、続くのを待つ理由が無い）。
        # 🔴 系列は最初の拒否の計上で生まれる（起動時に 0 で作らない）。increase() は 15 分前に系列が無いと最初の 1 件を
        # 増分として数えないので、「15 分前に無かった系列が今ある」（unless … offset 15m）を左の枝で拾い、2 件目以降は
        # 右の枝の increase() で拾う。PromQL では > が unless・or より強く結び付くので、> 0 は右の枝だけに掛かる
        # （左の枝の値は累積の件数で、在れば 1 以上）。
        - alert: AstMessageOriginRejected
          expr: >-
            (sum by (type, reason) (ast_messaging_origin_failures_total{outcome="rejected"})
              unless sum by (type, reason) (ast_messaging_origin_failures_total{outcome="rejected"} offset 15m))
            or sum by (type, reason) (increase(ast_messaging_origin_failures_total{outcome="rejected"}[15m])) > 0
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 受け手が発行元を確かめられないメッセージを処理せずに捨てた
            description: >-
              統制の入力になるメッセージ（型は type）を、受け手が段 2 で処理しなかった（理由は reason）。
              最初に見る場所: 受け手のサービスのログの WRN「メッセージの発行元を確かめられないため処理しません」（EventId 16260。型・名乗った発行元・メッセージ ID が載る）。
              missing / unverifiable なら鍵の Secret（ast-message-origin-signing-keys・ast-message-origin-verify-keys）と ESO の同期を、
              legacy なら旧い共有の鍵の印だけを付ける発行元（移行の取り残し）を、forbidden_issuer / mismatch / replayed ならブローカの利用者と Pod の侵害を疑う。
        # 🔴 NFR, FR-10, IADR-0645 決定 1: 記録だけの受け手（監査）・段 1 の受け手（Report。通知を足した間など）が、発行元を確かめられない
        # メッセージを記録して処理した。拒まないので処理は続くが、偽の事象が証跡・オーナーへの通知に入った疑いがある。
        # 🔴 この閾値は実測を要しない。正規の発行元は必ず印を付けるので平常は 0 件である。
        # 🔴 IADR-0645: reason=unrecorded は数えない。再送の記録の置き場が無い段 1 の受け手（通知）は、Pod を作り直すたびに起動より 5 分を超えて
        # 前に発行された正当なメッセージをこの理由で記録して通すので、作り直しのたびに鳴ってしまう（段 2 の受け手が処理しなかった unrecorded は
        # AstMessageOriginRejected が引く）。
        # for は置かない（1 件で知らせる。AstMessageOriginRejected と同じ形。左の枝は最初の 1 件、右の枝は 2 件目以降）。
        - alert: AstMessageOriginUnverifiedAdmitted
          expr: >-
            (sum by (type, reason) (ast_messaging_origin_failures_total{outcome="admitted",reason!="unrecorded"})
              unless sum by (type, reason) (ast_messaging_origin_failures_total{outcome="admitted",reason!="unrecorded"} offset 15m))
            or sum by (type, reason) (increase(ast_messaging_origin_failures_total{outcome="admitted",reason!="unrecorded"}[15m])) > 0
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 発行元を確かめられないメッセージを、記録だけで処理した（監査・段 1 の受け手）
            description: >-
              統制の入力になるメッセージ（型は type）を、記録だけの受け手（監査）か段 1 の受け手（通知など）が、発行元を確かめられないまま処理した（理由は reason）。
              最初に見る場所: 受け手のサービスのログの WRN「メッセージの発行元を確かめられませんでした」（EventId 16261。型・名乗った発行元・メッセージ ID が載る）。
              missing / unverifiable なら鍵の Secret と ESO の同期を、
              forbidden_issuer / mismatch / replayed ならブローカの利用者と Pod の侵害を疑い、同じ時刻の通知・証跡を信じない。
        # 🔴 NFR, FR-10, IADR-0645 決定 2: 発行元の確かめの再送の記録の置き場（受け手の DB）を読み書きできなかった。
        # lookup の失敗はそのメッセージを処理せず再試行する（続けばエラーキューへ）。record の失敗は処理は終えたが、再起動の後にその ID の再送を拒めない。
        # 🔴 平常は 0 件（DB の障害の印）。for は置かない（1 件で知らせる。左の枝は最初の 1 件、右の枝は 2 件目以降）。
        - alert: AstMessageOriginReplayStoreFailing
          expr: >-
            (sum by (operation) (ast_messaging_origin_replay_store_failures_total)
              unless sum by (operation) (ast_messaging_origin_replay_store_failures_total offset 15m))
            or sum by (operation) (increase(ast_messaging_origin_replay_store_failures_total[15m])) > 0
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 発行元の確かめの再送の記録の置き場（受け手の DB）を読み書きできない
            description: >-
              受け手が、処理し終えたメッセージ ID の記録（表 message_origin_handled）を読めない（operation=lookup）か書けない（operation=record）。
              lookup ならメッセージは処理されずに再試行され、続けば受け手のエラーキューへ移る。record なら再起動の後にその ID の再送を拒めない。
              最初に見る場所: 受け手のサービスのログの ERR（EventId 16262）と、そのサービスの DB への接続（readiness の DB 疎通）。
    - name: ai-stock-trading.access
      rules:
        # 🔴 NFR, NFR-05, IADR-0637, IADR-0645 決定 1: 移行の段の旧の共有クライアントのトークンを、口の一覧を見ずに通した。
        # 全サービスが自分の機密クライアントで動いていれば平常は 0 件である（values-cloud はすべて自分のクライアントを読む）。
        # 1 件でも出れば、旧の共有の資格で動いている呼び手が残っている（段の取り残し）か、旧の資格の持ち出しを疑う。
        # for は置かない（1 件で知らせる。左の枝は最初の 1 件、右の枝は 2 件目以降）。
        - alert: AstLegacyServiceClientUsed
          expr: >-
            (sum by (endpoint) (ast_auth_legacy_service_client_uses_total)
              unless sum by (endpoint) (ast_auth_legacy_service_client_uses_total offset 15m))
            or sum by (endpoint) (increase(ast_auth_legacy_service_client_uses_total[15m])) > 0
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: 旧の共有クライアントのトークンで取引ユニットの口が呼ばれた
            description: >-
              移行の段の旧の共有クライアント（Auth:ServiceToken:LegacyClients）のトークンを、口（endpoint）の呼び手の一覧を見ずに通した。
              最初に見る場所: 呼ばれたサービスのログの WRN「移行の段の共有クライアントのトークンを通します」（口・azp が載る）。
              全サービスが自分のクライアントで動いていることを確かめ、手順書 docs/operations/cloud-s2s-per-service-clients-runbook.md の段 3 で
              legacyClients と旧の資格を外す。呼び手に心当たりが無ければ旧の資格の持ち出しを疑い、資格を作り直す。
        # 🔴 NFR, FR-14, IADR-0062, IADR-0645 決定 3: Discord ボットが有効なのに設定が欠けて接続しない（misconfigured）か、切断が続く（disconnected）。
        # どちらも、オーナーが Discord から kill switch・一時停止を入れられない（帯域外の停止の手順書 docs/operations/out-of-band-trading-stop-runbook.md はある）。
        # for: 10m は Discord 側の一過性の切断と再接続を鳴らさないための猶予。設定の欠けは配備の直後から続くので 10 分で鳴る。
        # 系列は通知サービスの起動で作られる（無効〔disabled〕のときは鳴らさない＝明示の選択）。
        - alert: AstDiscordBotUnavailable
          expr: max by (state) (ast_notification_discord_bot_status{state=~"misconfigured|disconnected"}) > 0
          for: 10m
          labels:
            severity: warning
            service: ai-stock-trading
          annotations:
            summary: Discord ボットに繋がっておらず、オーナーの帯域内の停止の経路が無い
            description: >-
              通知サービスの Discord ボットが、設定の欠け（state=misconfigured）か切断（state=disconnected）のまま 10 分続いている。
              この間、Discord から kill switch・一時停止を入れられない。止める必要があれば帯域外の停止（docs/operations/out-of-band-trading-stop-runbook.md）を使う。
              最初に見る場所: 通知サービスの起動ログの WRN「Discord Bot の多層認証の設定が不足しているため Gateway に接続しません（不足: …）」か
              「Token が未設定のため」、ESO の同期（Secret ast-secrets の discord-bot-* のキー）と、配備で与える GuildId・ChannelId・許可ユーザーの値。
