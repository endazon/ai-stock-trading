# #124 / IADR-0053: moomoo OpenD 常駐（k8s・オプトイン・常駐モデル）。**dev 経路**。
# 既定では適用しない（この manifest を明示適用したときのみ opend が立つ）＝fail-safe。
# 発注執行（#13）は IBrokerAdapter 経由で opend:11111 へ接続する（SIMULATE 前提・実弾なし）。
# 前提: イメージをローカルビルド＆import 済み（deploy/opend/README.md）、Secret moomoo-credentials 作成済み。
#
# ⚠️ 本番配備は **chart 側**（`opend.enabled=true`・deploy/helm/ai-stock-trading）を使う（#132 / IADR-0060 決定 1）。
#    本ファイルは dev の現行経路（#124 / #13 の PoC が通った構成）として残す。
#
# ⚠️ 常駐モデル（IADR-0053）: OpenD は**初回に有人**のデバイス検証（画像 CAPTCHA / SMS）が要る。
#    運用: 起動後に `kubectl -n ai-stock-trading attach -it deploy/opend` で 1 回検証（input_pic_verify_code /
#    input_phone_verify_code）。
#    以降は「**デバイス信頼の永続化（PVC）＋ egress IP の安定**」が保てれば**無人再ログインが成立**する
#    （2026-07-15 追検証。Recreate で 3 リビジョン連続の無人再ログインを確認。feedback/20260715_adr0002-* 参照。
#    初回 PoC の「永続化しても毎回再検証が要る＝完全無人不可」は Pod IP と egress IP の取り違えで、撤回済み）。
#    → egress IP はノードの NAT 後 IP。**ノードが変わると再検証が要る**見込み（マルチノード/クラウドでの実測は #132 で未了）。
#    それでも再起動は最小化する（rolling 不使用・Recreate・単一レプリカ・liveness 無し）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opend
  namespace: ai-stock-trading
  labels:
    app: opend
    app.kubernetes.io/part-of: ai-stock-trading
spec:
  replicas: 1
  # OpenD は 1 セッション前提。複数レプリカにしない（ロールアウトは Recreate）。
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: opend }
  template:
    metadata:
      labels: { app: opend }
    spec:
      containers:
        - name: opend
          image: "k3d-local/ai-stock-trading/opend:latest"
          imagePullPolicy: IfNotPresent
          # 起動時の対話デバイス検証（kubectl attach）のため stdin/tty を保持する（常駐モデル）。
          stdin: true
          tty: true
          ports:
            - { containerPort: 11111, name: api }
          env:
            - name: OPEND_API_PORT
              value: "11111"
            # #13: cross-network（worker→opend）trade は RSA 暗号化必須。鍵は Secret moomoo-rsa をマウントし参照する。
            - name: OPEND_RSA_KEY_FILE
              value: "/opt/opend/rsa/opend_rsa.pem"
            - name: OPEND_LOGIN_ACCOUNT
              valueFrom:
                secretKeyRef: { name: moomoo-credentials, key: login-account }
            - name: OPEND_LOGIN_PWD_MD5
              valueFrom:
                secretKeyRef: { name: moomoo-credentials, key: login-pwd-md5 }
          # OpenD は TCP API（HTTP ではない）。TCP 疎通で readiness を判定する。
          # 注意: OpenD は**検証前から** 11111 を listen するため、probe 通過≠ログイン完了。
          # 実運用の「使える」判定は attach でのログイン成功確認（常駐モデル）。
          # livenessProbe は意図的に付けない: 自動再起動は対話再検証待ちで停止を招く（常駐モデル・README 参照）。
          readinessProbe:
            tcpSocket: { port: 11111 }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
          # デバイス信頼・ログ/状態の保存先（$HOME/.com.moomoo.OpenD＝root 実行なので /root 配下）。
          # ここを永続化することが**無人再ログインの成立条件のひとつ**（もうひとつは egress IP の安定）。
          # 初回 PoC は「永続化しても無駄」と結論したが、追検証で覆っている（冒頭の注記参照）。
          volumeMounts:
            - name: persist
              mountPath: /root/.com.moomoo.OpenD
            # #13: RSA 秘密鍵（暗号化通信用）を read-only でマウント。クライアントと同一鍵を用いる。
            - name: rsa
              mountPath: /opt/opend/rsa
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: persist
          persistentVolumeClaim:
            claimName: opend-persist
        - name: rsa
          secret:
            secretName: moomoo-rsa
            # #132 / IADR-0060 決定 3: 秘密鍵は所有者のみ読取（0400）。本 Pod は root 実行＝root が所有者なので読める。
            defaultMode: 0400
            items:
              - { key: opend_rsa.pem, path: opend_rsa.pem }
---
apiVersion: v1
kind: Service
metadata:
  name: opend
  namespace: ai-stock-trading
  labels: { app: opend }
spec:
  selector: { app: opend }
  ports:
    - { name: api, port: 11111, targetPort: 11111 }
