# #13 / #124: OpenD 暗号化通信（cross-network trade）用の RSA 秘密鍵 Secret（例）。
# 実鍵はコミットしない。下記コマンドで PKCS#1 PEM を生成し Secret を作る（キー名 opend_rsa.pem）。
#
#   openssl genrsa -out opend_rsa_pkcs8.pem 1024
#   openssl rsa -in opend_rsa_pkcs8.pem -traditional -out opend_rsa.pem   # PKCS#1（BEGIN RSA PRIVATE KEY）
#   kubectl create secret generic moomoo-rsa -n ai-stock-trading --from-file=opend_rsa.pem=opend_rsa.pem
#
# OpenD 側: opend.yaml が本 Secret を /opt/opend/rsa/opend_rsa.pem にマウントし、
#           OPEND_RSA_KEY_FILE で参照する（entrypoint が <rsa_private_key> を OpenD.xml に追加）。
# クライアント側（#13 発注執行）: 同一鍵を Broker:Moomoo:OpenD:RsaPrivateKeyPath で指す
#           （MMApiMoomooTradeClient が SetRSAPrivateKey＋InitConnect(encrypt:true)）。
#
# ⚠️ この鍵は OpenD↔クライアント間の通信暗号化用（moomoo 口座資格情報ではない）。それでも秘密として扱う。
apiVersion: v1
kind: Secret
metadata:
  name: moomoo-rsa
  namespace: ai-stock-trading
type: Opaque
stringData:
  opend_rsa.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    <ここに PKCS#1 の RSA 秘密鍵を貼る。実鍵はコミットしないこと。>
    -----END RSA PRIVATE KEY-----
