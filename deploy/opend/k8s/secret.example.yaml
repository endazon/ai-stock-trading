# #124 / IADR-0053: moomoo 資格情報 Secret（テンプレート）。
# ⚠️ 実値をコミットしないこと。運用者が実値で作成する（Git には載せない）。
#
#   # 平文パスワードは扱わない。MD5（小文字 hex）を渡す:
#   PWD_MD5=$(printf '%s' "<あなたのログインパスワード>" | md5sum | cut -d' ' -f1)
#   kubectl create secret generic moomoo-credentials -n ai-stock-trading \
#     --from-literal=login-account="<moomoo account>" \
#     --from-literal=login-pwd-md5="$PWD_MD5"
#
# 恒久フェーズでは Vault / External Secrets を用いる（平文/MD5 の Secret 直置きは暫定）。
apiVersion: v1
kind: Secret
metadata:
  name: moomoo-credentials
  namespace: ai-stock-trading
type: Opaque
stringData:
  login-account: CHANGE_ME
  login-pwd-md5: CHANGE_ME
