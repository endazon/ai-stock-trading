# =============================================================================
# ai-stock-trading ローカル実行環境（dev） — issue #107 / IADR-0048
# -----------------------------------------------------------------------------
# 使い方（詳細は docs/how-to/local-run.md）:
#   cp .env.example .env      # 資格情報・有効化ポイントを編集（機密は空既定=fail-safe）
#   docker compose up -d      # infra + 10 サービスを起動
#   docker compose up -d postgres rabbitmq keycloak otel-collector   # infra だけ起動
#
# 相対パス（context: . / ボリューム ./infra:）で構成し、単独リポでも submodule 配置
# （src/ai-stock-trading/）でも、compose を置いたディレクトリ基準で解決される（IADR-0048 決定 3/4）。
#
# fail-safe: 実 LLM・実市場データ・実発注・外部送信は既定 no-op。実接続の有効化は .env の
# 明示設定時のみ（#13/#79/#81/#15/#76）。実基盤を起動しての疎通・E2E は #82。
# =============================================================================
name: ai-stock-trading

x-app-common: &app-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  networks: [ast]
  # 全 Worker 共通の healthcheck（Web SDK・:8080 の /health/ready）。DB サービスは "ready" タグの
  # Npgsql チェックを含み、DB 疎通まで unhealthy。stateless は起動後すぐ healthy（IADR-0049 決定 3）。
  # runtime イメージへ curl を追加済み（backend/Dockerfile）。start_period で起動時 EF Migration を待つ。
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

# 全 Worker 共通の設定点（環境変数は appsettings より優先。`__` は構成の階層区切り）。
x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  RabbitMq__ConnectionString: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
  Otlp__Endpoint: ${OTLP_ENDPOINT:-http://otel-collector:4317}

x-depends-infra: &depends-infra
  rabbitmq:
    condition: service_healthy
  otel-collector:
    condition: service_started

services:
  # --------------------------------------------------------------------------
  # インフラ（dev 既定）
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai}
      # 既定 DB。サービス専有 DB は init スクリプトで作成する（ADR-0001 = Database per Service）。
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ast]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理 UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [ast]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      # 管理ポート :9000 に /health/* を出す（healthcheck 用・IADR-0049 決定 3）。
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"    # 管理コンソール / トークンエンドポイント
    # Keycloak イメージは curl/wget を持たないため bash の /dev/tcp で :9000 の /health/ready を確認する。
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks: [ast]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks: [ast]

  # --------------------------------------------------------------------------
  # AST サービス（11 Worker）。全て Web SDK（:8080）。ホストへはポート公開しない
  # （compose ネットワーク内で相互通信）。#82 が必要に応じて公開・疎通を足す。
  # --------------------------------------------------------------------------
  audit-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/AuditService/AuditService.csproj
        SERVICE_DLL: AuditService.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=audit_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # FR-15, #208, IADR-0105: バックテスト（Stage 0 検証）。DB もメッセージバスも持たない。
  # 実過去データ源は既定 no-op（Backtest__BarData__Provider 空＝外部へ 1 リクエストも出さない）。
  # "stooq" を指定すると Stooq（登録不要・鍵なし）から実過去データを取得する。
  backtest-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/BacktestService/BacktestService.csproj
        SERVICE_DLL: BacktestService.dll
    environment:
      <<: *app-env
      Backtest__BarData__Provider: ${BACKTEST_BAR_DATA_PROVIDER:-}
    depends_on:
      <<: *depends-infra

  configuration-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/ConfigurationService/ConfigurationService.csproj
        SERVICE_DLL: ConfigurationService.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=configuration_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  cost-control-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/CostControlService/CostControlService.csproj
        SERVICE_DLL: CostControlService.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cost_control_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
      # FR-17, IADR-0065 (#139): 月次費用上限の取得元（設定サービスの GET /assumptions）。
      # 空=前提条件の既定値（20,000/15,000）で判定する＝従来挙動。設定すると利用者の上限変更が 80%/100% 判定へ反映される。
      Configuration__BaseUrl: ${CONFIGURATION_BASEURL:-}
      # IADR-0051: /assumptions（OwnerOrService）への s2s トークン。空 secret=無効（認証なし→401→既定値へ縮退）。
      ServiceAuth__ClientId: ${SERVICEAUTH_CLIENTID:-}
      ServiceAuth__ClientSecret: ${SERVICEAUTH_CLIENTSECRET:-}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  information-collection-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/InformationCollectionService/InformationCollectionService.csproj
        SERVICE_DLL: InformationCollectionService.dll
    environment:
      <<: *app-env
      # fail-safe: 空=NoOp（外部接続しない）。案A+（ADR-0004）の複数ソースはカンマ区切りで列挙する
      # （例: finnhub,finnhub-news,google-news,sec-edgar,edinet,boj,fred）。列挙しても必須設定が空のソースは無効に倒れる（IADR-0064）。
      Collection__Source__Provider: ${COLLECTION_SOURCE_PROVIDER:-}
      Collection__Source__Finnhub__ApiKey: ${COLLECTION_FINNHUB_API_KEY:-}
      Collection__Source__Finnhub__Symbols__0: ${COLLECTION_FINNHUB_SYMBOLS_0:-}
      # ADR-0020 §結果 / IADR-0224: 日次上限は空=未実測（銘柄数上限を逆算しない）。
      Collection__Source__Finnhub__DailyRequestLimit: ${COLLECTION_FINNHUB_DAILY_REQUEST_LIMIT:-}
      # Google News RSS（ニュース系の代替・キー不要。ADR-0020 決定2）。
      Collection__Source__GoogleNews__Queries__0: ${COLLECTION_GOOGLENEWS_QUERIES_0:-}
      # SEC EDGAR（米国の開示）: 連絡先入り User-Agent は SEC 規約で必須（空=本ソース無効）。
      Collection__Source__SecEdgar__UserAgent: ${COLLECTION_SECEDGAR_USERAGENT:-}
      Collection__Source__SecEdgar__Ciks__0: ${COLLECTION_SECEDGAR_CIKS_0:-}
      # EDINET API v2（日本の開示）。
      Collection__Source__Edinet__SubscriptionKey: ${COLLECTION_EDINET_SUBSCRIPTION_KEY:-}
      # 日銀 時系列統計データ API（キー不要・クレジット表記必須）。
      Collection__Source__Boj__Db: ${COLLECTION_BOJ_DB:-}
      Collection__Source__Boj__SeriesCodes__0: ${COLLECTION_BOJ_SERIESCODES_0:-}
      # FRED（米マクロ）。
      Collection__Source__Fred__ApiKey: ${COLLECTION_FRED_API_KEY:-}
      Collection__Source__Fred__SeriesIds__0: ${COLLECTION_FRED_SERIESIDS_0:-}
      # NFR(費用), IADR-0031 (#79): 費用統制の照会先。空=プレースホルダ（Normal＝間隔延長/停止しない）。
      # 設定すると GET /costs/state を s2s で照会し Throttled=間隔延長・Halted=巡回停止を適用する。
      CostControl__BaseUrl: ${COST_CONTROL_BASEURL:-}
      # IADR-0051: /costs/state（OwnerOrService）への s2s トークン導出元＋資格情報。空=認証なし→401→Normal。
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
      ServiceAuth__ClientId: ${SERVICEAUTH_CLIENTID:-}
      ServiceAuth__ClientSecret: ${SERVICEAUTH_CLIENTSECRET:-}
      # FR-08, #9, IADR-0069/0073: 収集情報の実 KB 保存の opt-in。空=NoOp（LoggingKnowledgeBaseSink＝保存しない）＝安全既定。
      # Documents:BaseUrl を platform DocumentService（POST /documents）へ向けると実 KB 保存へ切り替わる（KnowledgeBaseWriterSink）。
      KnowledgeBase__Documents__BaseUrl: ${KNOWLEDGEBASE_DOCUMENTS_BASEURL:-}
      KnowledgeBase__Search__BaseUrl: ${KNOWLEDGEBASE_SEARCH_BASEURL:-}
      # FR-08, #18, IADR-0093: KB 書き込み/検索の s2s は上の ServiceAuth__*（AST レルム）ではなく、
      # MSP `microservices-platform` レルムの専用クライアント（ai-stock-trading-kb-writer／platform-operator）で認証する。
      # AST レルムのトークンは issuer 不一致で 401・role 不一致で 403 になるため（IADR-0093）。空=トークン無し→401→未保存へ fail-safe。
      # 実運用は MSP realm へ ai-stock-trading-kb-writer を反映（MSP 側 PR）した上で ClientSecret を投入する。Authority は MSP レルムを指す。
      KnowledgeBase__Auth__Authority: ${KNOWLEDGEBASE_AUTH_AUTHORITY:-}
      KnowledgeBase__Auth__ClientId: ${KNOWLEDGEBASE_AUTH_CLIENTID:-}
      KnowledgeBase__Auth__ClientSecret: ${KNOWLEDGEBASE_AUTH_CLIENTSECRET:-}
    depends_on:
      <<: *depends-infra

  market-monitor-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/MarketMonitorService/MarketMonitorService.csproj
        SERVICE_DLL: MarketMonitorService.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=market_monitor_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
      # fail-safe: 空=プレースホルダ（保有なし）。#76 で有効化。
      RiskManagement__BaseUrl: ${RISK_MANAGEMENT_BASEURL:-}
      # IADR-0051: s2s サービストークン（client_credentials）。空 secret=無効（認証なし→401→空列の安全既定）。#76。
      ServiceAuth__ClientId: ${SERVICEAUTH_CLIENTID:-}
      ServiceAuth__ClientSecret: ${SERVICEAUTH_CLIENTSECRET:-}
      # FR-10, #158, IADR-0066/0068: 損切り検知の現在値。空/none=no-op（実接続しない＝損切り検知対象なし＝安全既定）。
      # finnhub＋MARKETDATA_FINNHUB_API_KEY で opt-in（手動 live 検証・CI 対象外）。前回値フォールバックはかけない。
      MarketData__Provider: ${MARKETDATA_PROVIDER:-none}
      MarketData__Finnhub__ApiKey: ${MARKETDATA_FINNHUB_API_KEY:-}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notification-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/NotificationService/NotificationService.csproj
        SERVICE_DLL: NotificationService.dll
    environment:
      <<: *app-env
      # fail-safe: 空=NoOp（外部送信しない）。実 Discord は #15 で有効化。
      Notifications__Provider: ${NOTIFICATIONS_PROVIDER:-}
      Notifications__Discord__WebhookUrl: ${NOTIFICATIONS_DISCORD_WEBHOOK_URL:-}
      # FR-14, IADR-0062: Discord Bot（双方向）。既定 false=Gateway に接続しない。
      # 多層認証の設定が1つでも欠ければ接続しない。各 ID が空なら着信は全拒否（空＝全許可にしない）。
      Notifications__Discord__Bot__Enabled: ${DISCORD_BOT_ENABLED:-false}
      Notifications__Discord__Bot__Token: ${DISCORD_BOT_TOKEN:-}
      Notifications__Discord__Bot__GuildId: ${DISCORD_BOT_GUILD_ID:-}
      Notifications__Discord__Bot__ChannelId: ${DISCORD_BOT_CHANNEL_ID:-}
      Notifications__Discord__Bot__AllowedUserIds: ${DISCORD_BOT_ALLOWED_USER_IDS:-}
      # Discord ユーザーID -> Keycloak 利用者名（"id:利用者名" のカンマ区切り）。対応が無いユーザーは操作できない。
      Notifications__Discord__Bot__UserMapping: ${DISCORD_BOT_USER_MAPPING:-}
      # 空=kill switch を起動できない（誤爆防止の閂を設定漏れで外さない）。
      Notifications__Discord__Bot__KillSwitchConfirmationPhrase: ${DISCORD_BOT_KILLSWITCH_PHRASE:-}
      # kill switch は Risk の OwnerOnly。trading-owner をマップした専用クライアントで呼ぶ（IADR-0062 決定4）。
      # #226, IADR-0098: dev 既定は realm-export.json の owner クライアント（ai-stock-trading-owner /
      # dev-only-owner-secret）と一致。SERVICEAUTH_*（trading-service）では 403。上書きは環境変数で。
      Notifications__Discord__OwnerAuth__ClientId: ${DISCORD_OWNERAUTH_CLIENTID:-ai-stock-trading-owner}
      Notifications__Discord__OwnerAuth__ClientSecret: ${DISCORD_OWNERAUTH_CLIENTSECRET:-dev-only-owner-secret}
      # owner トークンの token エンドポイント（AST レルム）。空だと OwnerAuth.IsEnabled が false に倒れ 401。
      # KEYCLOAK_REALM に追随させる（Auth__Authority と同一ソース）。Bot は Enabled=false 既定のため opt-in 維持。
      Notifications__Discord__OwnerAuth__TokenEndpoint: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}/protocol/openid-connect/token
      # kill switch の呼び先。空=BaseAddress 未設定＝呼び出し失敗（Succeeded=false）。
      RiskManagement__BaseUrl: ${RISK_MANAGEMENT_BASEURL:-}
    depends_on:
      <<: *depends-infra

  order-execution-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/OrderExecutionService/OrderExecutionService.csproj
        SERVICE_DLL: OrderExecutionService.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=order_execution_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      # fail-safe: 既定 paper / sim（実発注しない・IADR-0016 / IADR-0111）。
      # 階層は provider × environment の 2 軸: paper ＜ moomoo-sim ＜ moomoo-live（実弾）。
      # ⚠️ Broker__Environment=live は**未解禁**であり、指定すると起動時に停止する（LiveTradingGate＝閂 0）。
      Broker__Provider: ${BROKER_PROVIDER:-paper}
      Broker__Environment: ${BROKER_ENVIRONMENT:-sim}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy

  report-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/ReportService/ReportService.csproj
        SERVICE_DLL: ReportService.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=report_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
      # FR-16, #158, IADR-0068: 評価損益の現在値。空/none=no-op（評価損益 0）。finnhub＋MARKETDATA_FINNHUB_API_KEY で
      # opt-in（報告書はゲート無し＝差し替えがそのまま有効化）。手動 live 検証・CI 対象外。
      MarketData__Provider: ${MARKETDATA_PROVIDER:-none}
      MarketData__Finnhub__ApiKey: ${MARKETDATA_FINNHUB_API_KEY:-}
      # FR-06/16, ADR-0010, IADR-0071 決定1: 報告書散文の実 LLM ドラフト。空=Placeholder（定型散文＝既定オフ）。設定時のみ実照会。
      LlmGateway__BaseUrl: ${LLM_GATEWAY_BASEURL:-}
      LlmGateway__TimeoutSeconds: ${LLM_GATEWAY_TIMEOUTSECONDS:-}
      LlmGateway__LogPrompts: ${LLM_GATEWAY_LOGPROMPTS:-}
      # FR-08, IADR-0069/0071 決定3: 確定報告書の KB 保存。空=no-op（保存しない）。設定時のみ opt-in。
      KnowledgeBase__Documents__BaseUrl: ${KNOWLEDGE_BASE_DOCUMENTS_BASEURL:-}
      # FR-08, IADR-0051: 自身の API・s2s の Authority 導出元（AST レルム）。
      ServiceAuth__ClientId: ${SERVICEAUTH_CLIENTID:-}
      ServiceAuth__ClientSecret: ${SERVICEAUTH_CLIENTSECRET:-}
      # FR-08, #18, IADR-0093: KB 保存の s2s は MSP レルムの専用クライアント（ai-stock-trading-kb-writer／platform-operator）で認証する
      # （AST レルムの ServiceAuth では 401/403）。空=トークン無し→401→未保存へ fail-safe。Authority は MSP レルムを指す。
      KnowledgeBase__Auth__Authority: ${KNOWLEDGEBASE_AUTH_AUTHORITY:-}
      KnowledgeBase__Auth__ClientId: ${KNOWLEDGEBASE_AUTH_CLIENTID:-}
      KnowledgeBase__Auth__ClientSecret: ${KNOWLEDGEBASE_AUTH_CLIENTSECRET:-}
      # FR-07, IADR-0071 決定2: 無応答時の既定動作。空/不正=ContinueLastConfirmed（直近確定を継続＝安全既定）。
      Reports__NoResponseBehavior: ${REPORTS_NORESPONSE_BEHAVIOR:-}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  risk-management-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/RiskManagementService/src/RiskManagementService.Api/RiskManagementService.Api.csproj
        SERVICE_DLL: RiskManagementService.Api.dll
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=risk_management_svc;Username=${POSTGRES_USER:-ai};Password=${POSTGRES_PASSWORD:-ai}
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
      # FR-10, #81, #158, IADR-0066/0068: 時価評価（含み損益・DD）。EnableMarkToMarket=true は最大DD の取引ゲート
      # （IADR-0008）の判定入力を変えるため、実市況の live 検証を経てから人手で切り替える（既定 false）。
      # Provider 空/none=no-op（実接続しない）。finnhub＋MARKETDATA_FINNHUB_API_KEY で実市況を opt-in する。
      MarketData__EnableMarkToMarket: ${MARKETDATA_ENABLEMARKTOMARKET:-false}
      MarketData__Provider: ${MARKETDATA_PROVIDER:-none}
      MarketData__Finnhub__ApiKey: ${MARKETDATA_FINNHUB_API_KEY:-}
    depends_on:
      <<: *depends-infra
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  trade-decision-service:
    <<: *app-common
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/TradeDecisionService/TradeDecisionService.csproj
        SERVICE_DLL: TradeDecisionService.dll
    environment:
      <<: *app-env
      # fail-safe: 空=プレースホルダ（取引しない）。#76 で有効化。
      Reports__BaseUrl: ${REPORTS_BASEURL:-}
      RiskManagement__BaseUrl: ${RISK_MANAGEMENT_BASEURL:-}
      # IADR-0051: s2s サービストークン（client_credentials）。Authority から token エンドポイントを導出する。
      # 空 secret=無効（認証なし→401→取引しない安全既定）。#76。
      Auth__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ai-stock-trading}
      ServiceAuth__ClientId: ${SERVICEAUTH_CLIENTID:-}
      ServiceAuth__ClientSecret: ${SERVICEAUTH_CLIENTSECRET:-}
      # FR-04, ADR-0010, IADR-0061: 実 LLM は platform LLM ゲートウェイ（POST /complete）へ委譲する。
      # fail-safe: 空=Placeholder（実 LLM を呼ばない＝常に Hold）。設定時のみ実照会する。
      LlmGateway__BaseUrl: ${LLM_GATEWAY_BASEURL:-}
      # 空・不正・非正値=既定 30 秒（IADR-0061 決定2）。
      LlmGateway__TimeoutSeconds: ${LLM_GATEWAY_TIMEOUTSECONDS:-}
      # FR-11: プロンプト・生出力の全量ログ。空=残さない（機微を既定でログ基盤へ流さない・IADR-0061 決定1）。
      LlmGateway__LogPrompts: ${LLM_GATEWAY_LOGPROMPTS:-}
      # LLM プロバイダ鍵は注入しない。鍵は MSP の LlmGateway 側が保持し AST は鍵を持たない（ADR-0010 / IADR-0061 決定6）。
      # FR-08, IADR-0069/0072: RAG 取得（収集情報・判断根拠を KB から本判断プロンプトへ注入）。
      # fail-safe: 空=NoOp 検索（参考情報なし＝現行動作）。設定時のみ platform RetrievalService（POST /search）へ s2s 照会する。
      KnowledgeBase__Search__BaseUrl: ${KNOWLEDGEBASE_SEARCH_BASEURL:-}
      # FR-08, #18, IADR-0093: RAG 検索の s2s も MSP レルムの専用クライアントで認証する（AST レルムの ServiceAuth ではない）。
      # 空=トークン無し（現行の NoOp 検索/参考情報なしを保持）。Authority は MSP レルムを指す。
      KnowledgeBase__Auth__Authority: ${KNOWLEDGEBASE_AUTH_AUTHORITY:-}
      KnowledgeBase__Auth__ClientId: ${KNOWLEDGEBASE_AUTH_CLIENTID:-}
      KnowledgeBase__Auth__ClientSecret: ${KNOWLEDGEBASE_AUTH_CLIENTSECRET:-}
      # 取得件数（TopK）。空・不正・非正値=既定 5。
      Retrieval__TopK: ${RETRIEVAL_TOPK:-}
    depends_on:
      <<: *depends-infra

networks:
  ast:
    driver: bridge

volumes:
  postgres-data:
